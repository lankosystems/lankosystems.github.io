<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanko Iris Shipping &amp; Receiving 26.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=Big+Shoulders+Text:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Shared Lanko tokens. Iris runs on the yard tablet like Kairos: big
     targets, one job per screen, nothing Roger has to configure. */
  :root{
    --oxblood:#6D1708; --oxblood-dark:#4E1005; --oxblood-deep:#320A03;
    --gold:#DEA509; --gold-light:#E9C45F; --gold-dim:#AD8007;
    --ink:#241811; --paper:#F4EEE1; --paper-dim:#E6DCC5; --card:#FBF7EC;
    --olive:#5B6B3F; --olive-dim:#EEF1E4; --rust:#A23B1E; --rust-dim:#F7E6DE;
    --steel:#3B5169; --steel-dim:#E4E9EF; --line:#D8CCB2;
    --display:"Big Shoulders",sans-serif; --display-text:"Big Shoulders Text",sans-serif;
    --body:"IBM Plex Sans",sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); font-size:16px; }
  .wrap{ max-width:860px; margin:0 auto; padding:0 14px; }

  .topbar{ background:var(--oxblood-deep); color:#EBDFC6; padding:12px 16px;
    display:flex; align-items:center; gap:14px; }
  .wordmark{ display:flex; align-items:center; gap:12px; }
  .wordmark .logo-img{ height:30px; width:auto; display:block; }
  .wordmark .appname{ font-family:var(--display); font-weight:800; font-size:22px;
    letter-spacing:1.6px; text-transform:uppercase; color:var(--gold-light); }
  .wordmark .ver{ font-family:var(--mono); font-size:10.5px; color:#9c8f77; }
  .spacer{ flex:1; }
  #lamp{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; color:#9c8f77; }
  #lamp .dot{ width:10px; height:10px; border-radius:50%; background:#666; }
  #lamp.on .dot{ background:#7DB25A; } #lamp.saving .dot{ background:var(--gold); }
  #lamp.off .dot{ background:var(--rust); }

  /* Iris's one flourish: a slim four-colour band under the bar - the goddess's
     bridge between the vendors' world and the shop floor. Everything below it
     is plain shop steel. */
  .irisband{ height:4px; display:flex; }
  .irisband span{ flex:1; }
  .irisband .b1{ background:var(--oxblood); } .irisband .b2{ background:var(--gold); }
  .irisband .b3{ background:var(--olive); }  .irisband .b4{ background:var(--steel); }

  nav.tabs{ display:flex; gap:8px; padding:14px 0 4px; }
  nav.tabs button{ flex:1; font-family:var(--display-text); font-weight:700; font-size:16px;
    letter-spacing:1px; text-transform:uppercase; padding:14px 8px; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:#7a6f5c; cursor:pointer; }
  nav.tabs button.on{ background:var(--oxblood); color:var(--gold-light); border-color:var(--oxblood-dark); }

  main{ padding:12px 0 80px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:14px; }
  .hint{ font-size:13px; color:#9a8f78; }
  h2.day{ font-family:var(--display-text); font-weight:700; font-size:13px;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--oxblood); margin:18px 0 8px; }

  /* big tap rows */
  .row{ background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer; display:flex; gap:14px; align-items:center; }
  .row:active{ background:#F3ECD9; }
  .row .job{ font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:0.8px;
    color:var(--oxblood); min-width:78px; }
  .row .mid{ flex:1; min-width:0; }
  .row .desc{ font-size:16px; font-weight:600; line-height:1.35; }
  .row .meta{ font-family:var(--mono); font-size:12px; color:#7a6f5c; margin-top:3px; }
  .row .eta{ font-family:var(--mono); font-size:13px; padding:5px 10px; border-radius:16px;
    background:var(--steel-dim); color:var(--steel); white-space:nowrap; }
  .row .eta.late{ background:var(--rust-dim); color:var(--rust); }
  .row .eta.today{ background:var(--olive-dim); color:var(--olive); }
  .row .part{ font-family:var(--mono); font-size:11.5px; color:var(--gold-dim); }

  .pill{ display:inline-block; font-family:var(--display-text); font-weight:700; font-size:11px;
    letter-spacing:0.8px; text-transform:uppercase; padding:4px 10px; border-radius:20px; }
  .pill.ok{ background:var(--olive-dim); color:var(--olive); }
  .pill.flag{ background:var(--rust-dim); color:var(--rust); }

  /* confirm panel */
  .panel label{ display:block; font-family:var(--display-text); font-weight:700; font-size:12.5px;
    letter-spacing:1px; text-transform:uppercase; color:#7a6f5c; margin:14px 0 6px; }
  .panel input[type=text], .panel input[type=number], .panel textarea{
    width:100%; font-family:var(--body); font-size:18px; padding:13px 14px;
    border:1px solid var(--line); border-radius:8px; background:#fff; }
  .panel input.mono{ font-family:var(--mono); }
  .panel textarea{ min-height:70px; }
  .flagrow{ display:flex; gap:10px; margin-top:6px; }
  .flagrow button{ flex:1; font-family:var(--display-text); font-weight:700; font-size:15px;
    letter-spacing:0.8px; text-transform:uppercase; padding:15px 8px; border-radius:8px;
    border:1px solid var(--line); background:#fff; color:#7a6f5c; cursor:pointer; }
  .flagrow button.okon{ background:var(--olive); color:#fff; border-color:var(--olive); }
  .flagrow button.flagon{ background:var(--rust); color:#fff; border-color:var(--rust); }

  .btn{ font-family:var(--display-text); font-weight:700; font-size:15px; letter-spacing:1px;
    text-transform:uppercase; padding:15px 20px; border-radius:8px; border:1px solid var(--gold-dim);
    background:var(--gold); color:var(--oxblood-deep); cursor:pointer; width:100%; margin-top:16px; }
  .btn.ghost{ background:none; color:var(--oxblood); border-color:var(--line); width:auto; padding:11px 16px; margin-top:0; }
  .btn.dark{ background:var(--oxblood); color:var(--gold-light); border-color:var(--oxblood-dark); }
  .btn[disabled]{ opacity:0.5; }

  .mtr{ margin-top:14px; border:1.5px dashed var(--gold-dim); border-radius:8px; padding:14px;
    background:#FFFDF6; }
  .mtr .t{ font-family:var(--display-text); font-weight:700; font-size:12.5px; letter-spacing:1px;
    text-transform:uppercase; color:var(--gold-dim); margin-bottom:8px; }
  .mtr .got{ font-family:var(--mono); font-size:12.5px; color:var(--olive); margin-top:8px; }
  .mtr input[type=file]{ display:none; }
  .mtr .snap{ display:inline-block; font-family:var(--display-text); font-weight:700; font-size:14px;
    letter-spacing:0.8px; text-transform:uppercase; padding:13px 18px; border-radius:8px;
    background:var(--oxblood); color:var(--gold-light); cursor:pointer; }

  .hist{ font-family:var(--mono); font-size:13px; line-height:1.5; padding:10px 0;
    border-bottom:1px solid rgba(36,24,17,0.08); }
  .hist b{ color:var(--oxblood); }

  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--oxblood-deep); color:#EBDFC6; font-size:15px; padding:12px 20px;
    border-radius:8px; border:1px solid var(--gold-dim); display:none; z-index:999; max-width:86vw; }
  .empty{ text-align:center; color:#9a8f78; padding:34px 10px; font-size:15px; }
  .empty b{ display:block; font-family:var(--display-text); font-size:17px; letter-spacing:0.8px;
    text-transform:uppercase; color:#7a6f5c; margin-bottom:6px; }
</style>

<script>
(function(){
  'use strict';

  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAJ4bTrYJKD0cEXu2JkiQbtsrCbiMYu8zg",
    authDomain: "lanko-kairos-cbbcd.firebaseapp.com",
    projectId: "lanko-kairos-cbbcd",
    storageBucket: "lanko-kairos-cbbcd.firebasestorage.app",
    messagingSenderId: "40770664322",
    appId: "1:40770664322:web:71b865076a1f8b6f15419b"
  };
  firebase.initializeApp(FIREBASE_CONFIG);
  var db = firebase.firestore();

  var state = { projects:[], vendors:[], settings:null, receipts:[] };
  var view = { tab:'in', open:null, form:null };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(v){ var n = parseFloat(v); return isNaN(n)?0:n; }
  function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function toast(msg, isErr){
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display='block';
    t.style.borderColor = isErr ? 'var(--rust)' : 'var(--gold-dim)';
    clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display='none'; }, 4200);
  }
  function lamp(cls, txt){
    document.getElementById('lamp').className = cls;
    document.getElementById('lampTxt').textContent = txt;
  }

  /* ---------------- data ---------------- */
  function listen(){
    db.collection('odin_state').doc('projects').onSnapshot(function(snap){
      var v = snap.exists ? snap.data().value : null;
      state.projects = Array.isArray(v) ? v : [];
      lamp('on','Synced'); render();
    }, function(e){ console.error(e); lamp('off','Cannot read Odin'); render(); });
    db.collection('odin_state').doc('vendors').onSnapshot(function(snap){
      var v = snap.exists ? snap.data().value : null;
      state.vendors = Array.isArray(v) ? v : []; render();
    }, function(e){ console.error(e); });
    db.collection('odin_state').doc('settings').onSnapshot(function(snap){
      state.settings = snap.exists ? snap.data().value : null;
    }, function(e){ console.error(e); });
    db.collection('iris_state').doc('receipts').onSnapshot(function(snap){
      var v = snap.exists ? snap.data().value : null;
      state.receipts = Array.isArray(v) ? v : []; render();
    }, function(e){ console.error(e); });
  }
  function saveReceipt(rec){
    lamp('saving','Saving');
    var ref = db.collection('iris_state').doc('receipts');
    return ref.get().then(function(snap){
      var list = (snap.exists && Array.isArray(snap.data().value)) ? snap.data().value : [];
      list.push(rec);
      return ref.set({ value:list, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }).then(function(){ lamp('on','Synced'); return true; })
    .catch(function(e){
      console.error('receipt save failed', e); lamp('off','Not saved');
      toast('Could not save. Check the connection and try again.', true);
      return false;
    });
  }

  function vendName(id){
    var v = state.vendors.filter(function(x){ return x.id===id; })[0];
    return v ? v.name : '';
  }
  function receivedQty(lineId){
    return state.receipts.filter(function(r){ return r.kind!=='ship' && r.lineId===lineId; })
      .reduce(function(a,r){ return a + num(r.qty); }, 0);
  }

  /* Expected = ordered or confirmed procurement lines not yet fully received. */
  function expectedLines(){
    var out = [];
    state.projects.forEach(function(p){
      if(p.status==='closed' || p.status==='shipped') return;
      (p.procurement||[]).forEach(function(l){
        if(l.status!=='ordered' && l.status!=='confirmed') return;
        var got = receivedQty(l.id);
        if(l.status==='received' || got >= num(l.qty||1)) return;
        out.push({ p:p, l:l, got:got, remain: num(l.qty||1) - got });
      });
    });
    out.sort(function(a,b){ return String(a.l.eta||'9999') < String(b.l.eta||'9999') ? -1 : 1; });
    return out;
  }
  function shipReady(){
    return state.projects.filter(function(p){ return p.status==='ship'; });
  }

  /* ---------------- MTR upload ---------------- */
  function uploadMTR(file, job, cb){
    var s = state.settings || {};
    if(!s.mtrUrl){
      toast('MTR filing is not set up yet. Keep the paper copy for the office.', true);
      cb(null); return;
    }
    var rd = new FileReader();
    rd.onload = function(){
      var b64 = String(rd.result).split(',')[1];
      lamp('saving','Filing MTR');
      fetch(s.mtrUrl, {
        method:'POST',
        /* text/plain keeps Apps Script happy without a CORS preflight */
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: s.mtrToken||'', job: job,
          filename: file.name || ('mtr_'+Date.now()+'.jpg'),
          mime: file.type || 'image/jpeg', data: b64 })
      }).then(function(r){ return r.json(); })
      .then(function(res){
        lamp('on','Synced');
        if(res && res.ok){ cb(res); }
        else { toast('The MTR bridge refused the file: '+((res&&res.error)||'unknown'), true); cb(null); }
      }).catch(function(e){
        console.error(e); lamp('off','MTR failed');
        toast('Could not reach the MTR bridge. Keep the paper copy.', true); cb(null);
      });
    };
    rd.readAsDataURL(file);
  }

  /* ---------------- tabs ---------------- */
  var TABS = [['in','Receiving'],['out','Shipping'],['hist','History']];
  function renderTabs(){
    document.getElementById('tabs').innerHTML = TABS.map(function(t){
      return '<button data-tab="'+t[0]+'" class="'+(view.tab===t[0]?'on':'')+'">'+t[1]+'</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function(b){
      b.onclick = function(){ view = { tab:b.getAttribute('data-tab'), open:null, form:null }; render(); };
    });
  }

  /* ---------------- receiving ---------------- */
  function etaClass(eta){
    if(!eta) return '';
    if(eta < today()) return ' late';
    if(eta === today()) return ' today';
    return '';
  }
  function renderIn(){
    var exp = expectedLines();
    if(view.open){
      var hit = exp.filter(function(x){ return x.l.id===view.open; })[0];
      if(hit) return renderConfirm(hit);
      view.open = null;
    }
    if(!exp.length) return '<div class="empty"><b>Nothing on the way</b>' +
      'When the office orders material or parts, they show up here for you to check in.</div>';
    var h = '';
    exp.forEach(function(x){
      h += '<div class="row" data-line="'+x.l.id+'">' +
        '<div class="job">'+esc(x.p.jobRef||x.p.quoteNum||'')+'</div>' +
        '<div class="mid"><div class="desc">'+esc(x.l.desc||'(no description)')+'</div>' +
          '<div class="meta">'+esc(vendName(x.l.vendorId)||'vendor not named')+
          (x.got ? ' &middot; '+x.got+' of '+esc(x.l.qty||1)+' already in' : '')+'</div></div>' +
        '<div class="eta'+etaClass(x.l.eta)+'">'+(x.l.eta ? esc(x.l.eta) : 'no ETA')+'</div></div>';
    });
    return h;
  }
  function renderConfirm(x){
    var f = view.form || (view.form = { qty: x.remain, slip:'', heat:'', flag:false, note:'', mtr:null });
    var isRaw = x.l.type === 'raw';
    var h = '<div class="card panel">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<div class="job" style="font-family:var(--display);font-weight:800;font-size:22px;color:var(--oxblood)">' +
          esc(x.p.jobRef||x.p.quoteNum||'')+'</div>' +
        '<button class="btn ghost" id="cBack">Back</button></div>' +
      '<div style="font-size:17px;font-weight:600;margin-top:6px">'+esc(x.l.desc||'')+'</div>' +
      '<div class="hint">'+esc(vendName(x.l.vendorId)||'')+' &middot; expecting '+esc(x.remain)+' more</div>' +

      '<label>How many arrived</label>' +
      '<input type="number" inputmode="decimal" id="fQty" value="'+esc(f.qty)+'">' +
      '<label>Packing slip number</label>' +
      '<input type="text" class="mono" id="fSlip" value="'+esc(f.slip)+'" placeholder="Off the paperwork in the truck">' +
      (isRaw ? '<label>Heat number</label>' +
        '<input type="text" class="mono" id="fHeat" value="'+esc(f.heat)+'" placeholder="Stamped on the material / on the cert">' : '') +

      '<label>Condition</label>' +
      '<div class="flagrow">' +
        '<button id="fOk" class="'+(!f.flag?'okon':'')+'">Looks good</button>' +
        '<button id="fFlag" class="'+(f.flag?'flagon':'')+'">Problem</button></div>' +
      (f.flag ? '<label>What is wrong</label><textarea id="fNote" placeholder="Short count, damage, wrong item...">'+esc(f.note)+'</textarea>' : '') +

      (isRaw ?
        '<div class="mtr"><div class="t">Mill cert (MTR)</div>' +
        '<label class="snap" for="fMtr">&#128247; Scan the cert</label>' +
        '<input type="file" id="fMtr" accept="image/*,.pdf" capture="environment">' +
        (f.mtr ? '<div class="got">&#10003; Filed in Drive: '+esc(f.mtr.name||'MTR')+'</div>' :
          '<div class="hint" style="margin-top:8px">Take a photo of the cert. It files itself under MTR / this job in Drive.</div>') +
        '</div>' : '') +

      '<button class="btn dark" id="fSave">Confirm received</button>' +
      '</div>';
    return h;
  }
  function wireConfirm(x){
    var f = view.form;
    document.getElementById('cBack').onclick = function(){ view.open=null; view.form=null; render(); };
    document.getElementById('fQty').oninput = function(){ f.qty = this.value; };
    document.getElementById('fSlip').oninput = function(){ f.slip = this.value; };
    var fh = document.getElementById('fHeat');
    if(fh) fh.oninput = function(){ f.heat = this.value; };
    document.getElementById('fOk').onclick = function(){ f.flag=false; render(); };
    document.getElementById('fFlag').onclick = function(){ f.flag=true; render(); };
    var fn = document.getElementById('fNote');
    if(fn) fn.oninput = function(){ f.note = this.value; };
    var fm = document.getElementById('fMtr');
    if(fm) fm.onchange = function(){
      var file = fm.files && fm.files[0];
      if(!file) return;
      uploadMTR(file, (x.p.jobRef||x.p.quoteNum||'no-job'), function(res){
        if(res){ f.mtr = { id:res.id, url:res.url, name:res.name }; toast('Cert filed in Drive.'); render(); }
      });
    };
    document.getElementById('fSave').onclick = function(){
      var q = num(f.qty);
      if(q <= 0){ toast('Put in how many arrived.', true); return; }
      var rec = {
        id: uid('rc'), kind:'receive',
        lineId: x.l.id, projectId: x.p.id,
        jobNo: x.p.jobRef || x.p.quoteNum || '',
        desc: x.l.desc || '', vendor: vendName(x.l.vendorId),
        qty: q, qtyExpected: num(x.l.qty||1), partial: q < x.remain,
        slipNo: f.slip || '', heat: f.heat || '',
        flag: !!f.flag, note: f.flag ? (f.note||'') : '',
        mtrFileId: f.mtr ? f.mtr.id : '', mtrUrl: f.mtr ? f.mtr.url : '',
        at: Date.now(), by:'yard'
      };
      saveReceipt(rec).then(function(ok){
        if(ok){
          toast(rec.flag ? 'Saved with a problem flag - the office will see it.' : 'Checked in. Thanks Roger.');
          view.open=null; view.form=null; render();
        }
      });
    };
  }

  /* ---------------- shipping ---------------- */
  function renderOut(){
    var ready = shipReady();
    if(view.open){
      var p = ready.filter(function(x){ return x.id===view.open; })[0];
      if(p) return renderShipConfirm(p);
      view.open = null;
    }
    if(!ready.length) return '<div class="empty"><b>Nothing ready to ship</b>' +
      'When the office marks a job Ready to ship, it shows up here.</div>';
    var h = '';
    ready.forEach(function(p){
      h += '<div class="row" data-ship="'+p.id+'">' +
        '<div class="job">'+esc(p.jobRef||p.quoteNum||'')+'</div>' +
        '<div class="mid"><div class="desc">'+esc(p.title||p.customerName||'')+'</div>' +
        '<div class="meta">'+esc(p.customerName||'')+(p.dueDate?' &middot; due '+esc(p.dueDate):'')+'</div></div>' +
        '<div class="eta today">ready</div></div>';
    });
    return h;
  }
  function renderShipConfirm(p){
    var f = view.form || (view.form = { carrier:'', waybill:'', pieces:'' });
    return '<div class="card panel">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<div style="font-family:var(--display);font-weight:800;font-size:22px;color:var(--oxblood)">' +
          esc(p.jobRef||p.quoteNum||'')+'</div>' +
        '<button class="btn ghost" id="cBack">Back</button></div>' +
      '<div style="font-size:17px;font-weight:600;margin-top:6px">'+esc(p.title||'')+'</div>' +
      '<div class="hint">'+esc(p.customerName||'')+'</div>' +
      '<label>Carrier</label><input type="text" id="sCar" value="'+esc(f.carrier)+'" placeholder="Who is hauling it">' +
      '<label>Waybill / pro number</label><input type="text" class="mono" id="sWay" value="'+esc(f.waybill)+'">' +
      '<label>Pieces / skids</label><input type="number" inputmode="numeric" id="sPcs" value="'+esc(f.pieces)+'">' +
      '<button class="btn dark" id="sSave">Confirm it shipped</button></div>';
  }
  function wireShipConfirm(p){
    var f = view.form;
    document.getElementById('cBack').onclick = function(){ view.open=null; view.form=null; render(); };
    document.getElementById('sCar').oninput = function(){ f.carrier=this.value; };
    document.getElementById('sWay').oninput = function(){ f.waybill=this.value; };
    document.getElementById('sPcs').oninput = function(){ f.pieces=this.value; };
    document.getElementById('sSave').onclick = function(){
      var rec = { id:uid('rc'), kind:'ship', projectId:p.id,
        jobNo:p.jobRef||p.quoteNum||'', carrier:f.carrier||'', waybill:f.waybill||'',
        pieces:f.pieces||'', at:Date.now(), by:'yard' };
      saveReceipt(rec).then(function(ok){
        if(ok){ toast('Marked as shipped. The office confirms it in Odin.'); view.open=null; view.form=null; render(); }
      });
    };
  }

  /* ---------------- history ---------------- */
  function renderHist(){
    var rows = state.receipts.slice().sort(function(a,b){ return (b.at||0)-(a.at||0); }).slice(0,40);
    if(!rows.length) return '<div class="empty"><b>Nothing yet</b>Check-ins and shipments land here.</div>';
    return '<div class="card">' + rows.map(function(r){
      var when = new Date(r.at).toLocaleString();
      if(r.kind==='ship'){
        return '<div class="hist">&#8599; <b>'+esc(r.jobNo)+'</b> shipped &middot; '+esc(r.carrier||'')+
          (r.waybill?' &middot; '+esc(r.waybill):'')+' &middot; '+esc(when)+'</div>';
      }
      return '<div class="hist">&#8600; <b>'+esc(r.jobNo)+'</b> '+esc(r.desc||'')+' &middot; '+esc(r.qty)+
        ' in'+(r.heat?' &middot; heat '+esc(r.heat):'')+(r.flag?' &middot; <span class="pill flag">problem</span>':'')+
        (r.mtrUrl?' &middot; MTR filed':'')+' &middot; '+esc(when)+'</div>';
    }).join('') + '</div>';
  }

  /* ---------------- render root ---------------- */
  function render(){
    renderTabs();
    var el = document.getElementById('view');
    if(view.tab==='in'){
      el.innerHTML = renderIn();
      if(view.open){
        var hit = expectedLines().filter(function(x){ return x.l.id===view.open; })[0];
        if(hit) wireConfirm(hit);
      } else {
        Array.prototype.forEach.call(document.querySelectorAll('[data-line]'), function(r){
          r.onclick = function(){ view.open = r.getAttribute('data-line'); view.form=null; render(); };
        });
      }
    } else if(view.tab==='out'){
      el.innerHTML = renderOut();
      if(view.open){
        var p = shipReady().filter(function(x){ return x.id===view.open; })[0];
        if(p) wireShipConfirm(p);
      } else {
        Array.prototype.forEach.call(document.querySelectorAll('[data-ship]'), function(r){
          r.onclick = function(){ view.open = r.getAttribute('data-ship'); view.form=null; render(); };
        });
      }
    } else {
      el.innerHTML = renderHist();
    }
  }

  /* ---------------- auth: anonymous, like the Kairos tablets ---------------- */
  firebase.auth().onAuthStateChanged(function(u){
    if(u){ listen(); }
    else firebase.auth().signInAnonymously().catch(function(e){
      console.error(e); lamp('off','Sign-in failed');
    });
  });

  render();
})();
</script>
</body>
</html>
