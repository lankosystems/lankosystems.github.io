<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lanko Aengus Dashboard 26.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=Big+Shoulders+Text:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Jura:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Design tokens are the same set Kairos, Minerva and Kubera use, so the whole
     suite reads as one system. Nothing new is invented here on purpose. */
  :root{
    --oxblood:      #6E1809;
    --oxblood-dark: #430F04;
    --oxblood-deep: #2C0A03;
    --gold:         #DDA508;
    --gold-light:   #F0C550;
    --gold-dim:     #B58A1F;
    --gold-muted:   #C7A15E;
    --ink:          #F7F3E9;
    --ink-soft:     #A79E89;
    --paper:        #292524;
    --paper-dim:    #1C1918;
    --card:         #332E2C;
    --olive:        #7CAB55;
    --olive-dim:    rgba(124,171,85,0.16);
    --rust:         #DB7F58;
    --rust-dim:     rgba(219,127,88,0.16);
    --steel:        #7AA3C8;
    --steel-dim:    rgba(122,163,200,0.16);
    --line: rgba(247,243,233,0.14);

    --display: "Jura", sans-serif;
    --display-text: "Jura", sans-serif;
    --body: "IBM Plex Sans", sans-serif;
    --mono: "IBM Plex Mono", monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    background: var(--paper);
    font-family: var(--body);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; }
  a{ color:inherit; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  header.topbar{
    background: var(--oxblood);
    background-image: linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-dark) 100%);
    border-bottom:3px solid var(--gold-dim);
    padding:10px 18px; display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:20;
  }
  .wordmark{ display:flex; align-items:center; gap:12px; min-width:0; }
  .wordmark img.logo-img{ height:34px; width:auto; display:block; }
  .wordmark .divider{ width:1px; height:26px; background:rgba(222,165,9,0.45); }
  .wordmark small{
    font-family:var(--display); font-weight:700; font-size:22.8px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--gold-light); white-space:nowrap;
  }
  .topbar-right{ display:flex; align-items:center; gap:16px; }
  .headclock{ text-align:right; line-height:1.05; }
  .headclock .time{
    font-family:var(--display); font-weight:800; font-size:26px; color:var(--gold-light);
    letter-spacing:0.02em;
  }
  .headclock .date{
    font-family:var(--mono); font-size:11px; color:var(--gold-muted);
    text-transform:uppercase; letter-spacing:0.09em;
  }
  .synclamp{
    display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--gold-muted);
    border:1px solid rgba(222,165,9,0.35); border-radius:999px; padding:5px 11px;
  }
  .synclamp .bulb{
    width:8px; height:8px; border-radius:50%; background:var(--gold-light);
    box-shadow:0 0 0 3px rgba(233,196,95,0.22); flex:none;
  }
  .synclamp.saving .bulb{ background:var(--gold-dim); }
  .synclamp.off .bulb{ background:var(--rust); box-shadow:0 0 0 3px rgba(219,127,88,0.25); }

  /* ---------- layout ---------- */
  main{ flex:1; padding:20px 18px 40px; max-width:1240px; width:100%; margin:0 auto; }
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-soft); margin:0 0 9px;
    display:flex; align-items:baseline; gap:10px;
  }
  .eyebrow .rule{ flex:1; height:1px; background:var(--line); }
  .eyebrow .tally{ font-family:var(--display); font-size:15px; color:var(--ink); letter-spacing:0.04em; }
  section{ margin-bottom:26px; }

  /* ---------- on the clock ---------- */
  .floor{
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--olive);
    border-radius:3px; padding:14px 16px;
  }
  .floor.quiet{ border-left-color:var(--paper-dim); }
  .floor-head{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .headcount{ display:flex; align-items:baseline; gap:6px; }
  .headcount b{
    font-family:var(--display); font-weight:800; font-size:46px; line-height:0.85;
    color:var(--olive); letter-spacing:-0.01em;
  }
  .floor.quiet .headcount b{ color:var(--ink-soft); }
  .headcount span{
    font-family:var(--display-text); font-weight:600; font-size:14px; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.07em;
  }
  .floor-hours{
    margin-left:auto; text-align:right; font-family:var(--mono); font-size:12px; color:var(--ink-soft);
  }
  .floor-hours b{ font-family:var(--display); font-size:22px; color:var(--ink); display:block; line-height:1; }
  .crew{ display:flex; flex-wrap:wrap; gap:8px; }
  .tick{
    background:var(--paper); border:1px solid var(--line); border-radius:2px;
    padding:7px 11px 7px 9px; display:flex; align-items:center; gap:9px; min-width:0;
  }
  .tick .dot{
    width:8px; height:8px; border-radius:50%; background:var(--olive);
    box-shadow:0 0 0 3px var(--olive-dim); flex:none;
  }
  .tick .who{ font-family:var(--display-text); font-weight:700; font-size:15px; white-space:nowrap; }
  .tick .job{
    font-family:var(--mono); font-size:11px; color:var(--steel);
    background:var(--steel-dim); border-radius:2px; padding:2px 6px;
    max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tick .since{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); white-space:nowrap; }

  /* ---------- app rack ---------- */
  .rack{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .plate{
    display:flex; flex-direction:column; text-decoration:none;
    background:var(--card); border:1px solid var(--line); border-top:4px solid var(--oxblood);
    border-radius:3px; padding:15px 16px 13px; min-height:186px;
    transition:transform 120ms ease, box-shadow 120ms ease;
  }
  .plate:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(36,24,17,0.11); }
  .plate .deity{
    font-family:var(--display); font-weight:800; font-size:30px; line-height:0.92;
    letter-spacing:0.01em; text-transform:uppercase;
  }
  .plate .role{
    font-family:var(--display-text); font-weight:600; font-size:12.5px; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.09em; margin-top:3px;
  }
  .plate .vitals{
    margin-top:auto; padding-top:12px; border-top:1px dashed var(--line);
    display:flex; flex-direction:column; gap:5px;
  }
  .vital{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .vital span{ font-family:var(--body); font-size:12.5px; color:var(--ink-soft); }
  .vital b{ font-family:var(--mono); font-weight:600; font-size:13.5px; color:var(--ink); }
  .plate .goto{
    margin-top:12px; font-family:var(--display-text); font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.09em; color:var(--gold);
    display:flex; align-items:center; gap:6px;
  }
  .plate .ver{ font-family:var(--mono); font-size:10.5px; color:var(--gold-dim); letter-spacing:0.06em; }
  .plate.kairos{ border-top-color:var(--olive); }
  .plate.kairos .deity{ color:var(--olive); }
  .plate.minerva{ border-top-color:var(--steel); }
  .plate.minerva .deity{ color:var(--steel); }
  .plate.kubera{ border-top-color:var(--gold-dim); }
  .plate.kubera .deity{ color:var(--gold-dim); }
  .plate.odin{ border-top-color:#CB5F35; }
  .plate.odin .deity{ color:#CB5F35; }
  .plate.iris{ border-top-color:var(--rust); }
  .plate.iris .deity{ color:var(--rust); }

  /* ---------- ledgers ---------- */
  .ledgers{ display:grid; grid-template-columns:1.15fr 1fr; gap:14px; align-items:start; }
  .ledger{
    background:var(--card); border:1px solid var(--line); border-radius:3px;
    padding:14px 16px 12px;
  }
  table.rows{ width:100%; border-collapse:collapse; }
  table.rows th{
    text-align:left; font-family:var(--mono); font-size:10px; font-weight:600;
    letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-soft);
    padding:0 8px 6px 0; border-bottom:1px solid var(--line);
  }
  table.rows td{
    padding:7px 8px 7px 0; border-bottom:1px solid rgba(247,243,233,0.08);
    font-size:13.5px; vertical-align:baseline;
  }
  table.rows tr:last-child td{ border-bottom:none; }
  table.rows td.name{ font-family:var(--display-text); font-weight:700; white-space:nowrap; }
  table.rows td.mono{ font-family:var(--mono); font-size:12.5px; }
  table.rows td.right{ text-align:right; font-family:var(--mono); font-size:13px; }
  .pill{
    display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em;
    text-transform:uppercase; border-radius:2px; padding:2px 6px;
  }
  .pill.draft{ background:var(--paper-dim); color:#B8AF98; }
  .pill.sent{ background:var(--steel-dim); color:var(--steel); }
  .pill.won{ background:var(--olive-dim); color:var(--olive); }
  .pill.lost{ background:var(--rust-dim); color:var(--rust); }
  .stale{ font-family:var(--mono); font-size:10.5px; color:var(--rust); letter-spacing:0.05em; }
  .empty{
    font-size:13.5px; color:var(--ink-soft); padding:16px 2px; line-height:1.5;
  }
  .empty b{ display:block; font-family:var(--display-text); font-size:15px; color:var(--ink); margin-bottom:3px; }
  .foot{
    font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); letter-spacing:0.05em;
    text-align:center; padding-top:6px; line-height:1.9;
  }

  @media (max-width:900px){
    .rack{ grid-template-columns:1fr; }
    .ledgers{ grid-template-columns:1fr; }
  }
  @media (max-width:560px){
    header.topbar{ padding:9px 12px; }
    .headclock .time{ font-size:21px; }
    main{ padding:16px 12px 32px; }
    .headcount b{ font-size:38px; }
    .tick .job{ max-width:120px; }
  }
</style>
</head>

<!-- ============================================================================
     FIREBASE - the same shop project the other three apps use. Client config
     values aren't secret; access is governed by Firestore rules and auth.

     AENGUS IS READ-ONLY BY DESIGN. It opens listeners on the other apps'
     collections and never writes a single document. Keep it that way: if the
     dashboard could write, a stray click here could clobber a payroll entry or a
     live quote, and there'd be no way to tell which app did it. Anything that
     needs to change data belongs in Kairos, Minerva or Kubera.
     ============================================================================ -->
<style>
  /* ---------- office sign-in gate ----------
     Full-cover overlay rather than an inline form, so no part of the app renders
     before there is a real account behind it. Uses the same tokens as everything
     else. Hidden from print. */
  #authgate{ position:fixed; inset:0; z-index:9999; background:var(--oxblood-deep);
    display:flex; align-items:center; justify-content:center; padding:24px; }
  #authgate[hidden]{ display:none; }
  #authgate .box{ background:var(--card); border:1px solid var(--gold-dim); border-radius:6px;
    padding:26px 28px 22px; width:100%; max-width:390px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.6); }
  #authgate .eyebrow{ font-family:var(--mono); font-size:10px; font-weight:600;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px; }
  #authgate h1{ font-family:var(--display); font-weight:800; font-size:27px; line-height:1;
    margin:0 0 6px; text-transform:uppercase; letter-spacing:0.01em; color:var(--gold); }
  #authgate p.sub{ font-family:var(--body); font-size:13px; color:#B8AF98;
    margin:0 0 18px; line-height:1.5; }
  #authgate label{ display:block; font-family:var(--display-text); font-weight:700; font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.07em; color:#B8AF98; margin:0 0 5px; }
  #authgate input{ width:100%; font-family:var(--body); font-size:15px; padding:10px 12px;
    border:1.5px solid var(--line); border-radius:4px; background:var(--paper);
    color:var(--ink); margin-bottom:14px; }
  #authgate input:focus{ outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold-dim); }
  #authgate button.go{ width:100%; font-family:var(--display-text); font-weight:700; font-size:15px;
    text-transform:uppercase; letter-spacing:0.06em; padding:12px; border:none; border-radius:4px;
    background:var(--oxblood); color:var(--gold-light); cursor:pointer; }
  #authgate button.go:disabled{ opacity:0.6; cursor:default; }
  #authgate .err{ font-family:var(--body); font-size:13px; color:var(--rust);
    background:var(--rust-dim); border-radius:4px; padding:9px 11px; margin-bottom:12px;
    line-height:1.45; }
  #authgate .err[hidden]{ display:none; }

  /* who is signed in, plus the way out. Free-standing because Minerva rebuilds its
     header markup on every render. */
  #whoami{ position:fixed; left:12px; bottom:12px; z-index:900;
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.04em;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; color:#B8AF98; display:flex; gap:9px; align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.3); }
  #whoami[hidden]{ display:none; }
  #whoami button{ font-family:var(--display-text); font-weight:700; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.06em; background:none; border:none;
    color:var(--gold); cursor:pointer; padding:0; }
  #whoami button:hover{ text-decoration:underline; }
  @media print{ #whoami, #authgate{ display:none !important; } }
</style>

  /* ---------- office sign-in ----------
     These apps are static files on a public URL, so the only real boundary around
     the shop's data is the Firestore rules, and those rules distinguish a real
     account from an anonymous session. This is where that account is obtained.

     Kairos is deliberately NOT gated: shop tablets have no keyboard, and the
     rules keep kairos_state open to anonymous sessions for exactly that reason. */
  function authFriendlyError(code){
    switch(code){
      case 'auth/invalid-email':        return 'That does not look like an email address.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':   return 'Email or password not recognised.';
      case 'auth/user-disabled':        return 'That account has been disabled in Firebase.';
      case 'auth/too-many-requests':    return 'Too many attempts. Wait a few minutes and try again.';
      case 'auth/network-request-failed': return 'No connection. Check the internet and try again.';
      case 'auth/operation-not-allowed': return 'Email sign-in is not switched on for this Firebase project yet.';
      default: return 'Could not sign in (' + code + ').';
    }
  }

  function buildAuthGate(appName, subtitle){
    var g = document.createElement('div');
    g.id = 'authgate';
    g.hidden = true;
    g.innerHTML =
      '<div class="box">' +
        '<div class="eyebrow">Lanko</div>' +
        '<h1>' + appName + '</h1>' +
        '<p class="sub">' + subtitle + '</p>' +
        '<div class="err" id="agErr" hidden></div>' +
        '<label for="agEmail">Email</label>' +
        '<input type="email" id="agEmail" autocomplete="username" autocapitalize="off" spellcheck="false">' +
        '<label for="agPass">Password</label>' +
        '<input type="password" id="agPass" autocomplete="current-password">' +
        '<button class="go" id="agGo">Sign in</button>' +
      '</div>';
    document.body.appendChild(g);

    var err = g.querySelector('#agErr');
    var email = g.querySelector('#agEmail');
    var pass = g.querySelector('#agPass');
    var go = g.querySelector('#agGo');

    function fail(msg){
      err.textContent = msg; err.hidden = false;
      go.disabled = false; go.textContent = 'Sign in';
    }
    function submit(){
      var e = email.value.trim(), p = pass.value;
      if(!e || !p){ fail('Enter both an email and a password.'); return; }
      err.hidden = true;
      go.disabled = true; go.textContent = 'Signing in...';
      firebase.auth().signInWithEmailAndPassword(e, p).catch(function(ex){
        fail(authFriendlyError(ex.code || 'unknown'));
        pass.value = '';
        pass.focus();
      });
    }
    go.onclick = submit;
    [email, pass].forEach(function(el){
      el.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') submit(); });
    });
    return g;
  }

  function buildWhoami(){
    var w = document.createElement('div');
    w.id = 'whoami';
    w.hidden = true;
    w.innerHTML = '<span id="waWho"></span><button id="waOut">Sign out</button>';
    document.body.appendChild(w);
    w.querySelector('#waOut').onclick = function(){
      firebase.auth().signOut();
    };
    return w;
  }

  var firebaseAuthReady = (function(){
    var resolveReady, resolved = false;
    var ready = new Promise(function(res){ resolveReady = res; });

    var gate = buildAuthGate('Aengus', 'Sign in to include the quote pipeline. ' +
      'The timeclock and planner panels do not need it.');
    var who = buildWhoami();
    var whoEl, outEl;

    function paintChip(user){
      if(!whoEl){ whoEl = who.querySelector('#waWho'); outEl = who.querySelector('#waOut'); }
      who.hidden = false;
      if(user && !user.isAnonymous){
        whoEl.textContent = user.email || 'signed in';
        outEl.textContent = 'Sign out';
        outEl.onclick = function(){ firebase.auth().signOut(); };
      } else {
        whoEl.textContent = 'quotes hidden';
        outEl.textContent = 'Sign in';
        outEl.onclick = function(){
          gate.hidden = false;
          var f = gate.querySelector('#agEmail');
          if(f) f.focus();
        };
      }
    }

    // Escape hatch: the dashboard is useful without signing in, so the overlay must
    // be dismissable here, unlike in Minerva and Kubera.
    gate.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') gate.hidden = true; });
    gate.addEventListener('click', function(ev){ if(ev.target === gate) gate.hidden = true; });

    firebase.auth().onAuthStateChanged(function(user){
      if(!user){
        firebase.auth().signInAnonymously().catch(function(e){
          console.error('anonymous sign-in failed', e);
        });
        return;
      }
      gate.hidden = true;
      paintChip(user);
      if(!resolved){
        resolved = true;
        resolveReady(user);
      } else if(typeof window.__lankoReattach === 'function'){
        // Signing in or out changes what mercury_state will allow, and a Firestore
        // listener that has already failed with permission-denied is dead for good.
        // Re-attach rather than leaving the quote panel stuck on its error.
        window.__lankoReattach();
      }
    });
    return ready;
  })();

</script>

<script>
(function(){
  'use strict';

  /* ============================================================================
     LANKO AENGUS - the dashboard for the whole suite.

     VERSION RULE (applies to every Lanko app, not just this one):
       Two-digit year, dot, then a counter that starts at 0 and increments once
       per released iteration. The counter resets when the year rolls over.
         2026: 26.0, 26.1, 26.2 ...
         2027: 27.0, 27.1, 27.2 ...
       The version lives here in APP_VERSION and nowhere else in this file - the
       <title> and the header wordmark are both built from it. Filenames never
       carry a version or a date (that's how "Lanko_Mercury_26_7.html" ended up
       looking like version 26.7 when it was really the 26th of July).

     NAMING STANDARD:
       Product name   Lanko <Deity> <Function>   e.g. Lanko Kairos Timeclock
       Header chip    <Deity> <version>          e.g. Kairos 26.5
       Filename       <deity>.html               e.g. kairos.html
       Collection     <deity>_state              e.g. kairos_state
                      (Kubera is the documented exception: its collection is
                       still mercury_state so existing quotes stay reachable.)
     ============================================================================ */
  var APP_VERSION = '26.4';

  /* Each app owns one collection; Aengus reads from all three. Doc keys are the
     ones those apps already write, copied verbatim - if a key changes there, it
     has to change here too, and the affected panel will just show "not published
     yet" in the meantime rather than breaking. */
  var SOURCES = {
    kairos: { collection:'kairos_state',  employees:'lanko_employees', entries:'lanko_entries' },
    minerva:{ collection:'minerva_state', schedule:'lb_published_schedule' },
    kubera: { collection:'mercury_state', quotes:'mc_quotes' },
    odin:   { collection:'odin_state',    projects:'projects' },
    iris:   { collection:'iris_state',    receipts:'receipts' }
  };

  var APPS = [
    { id:'kairos',  deity:'Kairos',  role:'Timeclock',       href:'kairos.html',  version:'26.9' },
    { id:'minerva', deity:'Minerva', role:'Planner',         href:'minerva.html', version:'26.4' },
    { id:'kubera',  deity:'Kubera',  role:'Quote Builder',   href:'kubera.html',  version:'26.6' },
    { id:'odin',    deity:'Odin',    role:'Projects',        href:'odin.html',    version:'26.2' },
    { id:'iris',    deity:'Iris',    role:'Ship &amp; Receive', href:'iris.html', version:'26.1' }
  ];

  /* Each field has three meaningful states, and the panels below rely on the
     difference: null = not read yet, false/[] = read fine but there is nothing
     there, populated = real data. A failed read is recorded separately in err so
     "we could not look" never gets rendered as "there is nothing there". */
  var DATA = {
    employees:null, entries:null, schedule:null, quotes:null,
    projects:null, receipts:null,
    err:{}
  };
  var live = 0, failed = 0;

  /* ---------------- helpers ---------------- */
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  /* Minerva publishes canonical op codes since 26.4; older published weeks
     still carry the 7 lowercase skills. Label both. */
  function opLabel(sk){
    var canon = { DRAFT:'Drafting', ORDER:'Ordering', ADMIN:'Admin', PLASMA:'Plasma',
      BANDSAW:'Bandsaw', DRILL:'Drilling', LINEBORE:'Linebore', MACHINE:'Machining',
      FIT:'Fitting', WELD:'Welding', REPAIR:'Repair', CHECK:'Checking', PAINT:'Painting',
      ASSEM:'Assembly', PACK:'Packaging', TRANSP:'Transport', OTHER:'Other' };
    var oldSkills = { drafting:'Drafting', ordering:'Ordering', cutting:'Plasma',
      fitting:'Fitting', welding:'Welding', lineboring:'Linebore', assembly:'Assembly' };
    var k = String(sk||'').trim();
    return canon[k.toUpperCase()] || oldSkills[k.toLowerCase()] || k;
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtTime(iso){
    var d = new Date(iso);
    if(isNaN(d)) return '--:--';
    var h = d.getHours(), m = pad(d.getMinutes()), ap = h<12 ? 'a' : 'p';
    h = h%12; if(h===0) h = 12;
    return h+':'+m+ap;
  }
  function hoursBetween(a, b){ return Math.max(0, (new Date(b) - new Date(a)) / 3600000); }
  function fmtHours(h){ return (Math.round(h*10)/10).toFixed(1)+'h'; }
  function money(n, cur){
    var s = Math.round(num(n)).toLocaleString('en-CA');
    return (cur==='USD' ? 'US$' : '$') + s;
  }
  function fmtDayShort(iso){
    var p = String(iso).split('-');
    if(p.length!==3) return iso;
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString('en-CA', { weekday:'short', month:'short', day:'numeric' });
  }
  function daysAgo(iso){
    var d = new Date(iso);
    if(isNaN(d)) return null;
    return Math.floor((Date.now() - d) / 86400000);
  }

  /* Kubera lets a qty or price hold a small calculation, so a cell can be a
     string like "=12*4". Read the plain numbers and evaluate only expressions
     made purely of digits and arithmetic - anything else counts as zero, which
     keeps the roll-up honest without pulling Kubera's whole formula engine in.
     Kubera remains the source of truth for what a quote is actually worth. */
  function cellNum(v){
    if(typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v==null?'':v).trim();
    if(!s) return 0;
    if(s.charAt(0) === '='){
      var expr = s.slice(1);
      if(!/^[0-9+\-*/(). ]+$/.test(expr)) return 0;
      try { var r = Function('"use strict";return ('+expr+')')(); return isFinite(r) ? r : 0; }
      catch(e){ return 0; }
    }
    return num(s);
  }
  function quoteTotal(q){
    var sub = 0;
    (q.items||[]).forEach(function(it){
      if(it && !it.noCharge) sub += cellNum(it.qty) * cellNum(it.unitPrice);
    });
    var freight = num(q.freight);
    return sub + freight + (sub + freight) * num(q.taxRate) / 100;
  }

  /* ---------------- header ---------------- */
  function lamp(kind, text){
    var el = document.getElementById('synclamp');
    el.className = 'synclamp' + (kind==='on' ? '' : kind==='saving' ? ' saving' : ' off');
    document.getElementById('synctext').textContent = text;
  }
  function tickClock(){
    var d = new Date();
    var h = d.getHours(), ap = h<12 ? 'AM' : 'PM';
    h = h%12; if(h===0) h = 12;
    document.getElementById('hcTime').textContent = h+':'+pad(d.getMinutes());
    document.getElementById('hcDate').textContent =
      d.toLocaleDateString('en-CA', { weekday:'short', month:'short', day:'numeric' }) + ' ' + ap;
  }

  /* ---------------- derived views ---------------- */
  // Open entries are the ones with no clockOut yet. Kairos writes clockIn/clockOut
  // as ISO strings, so "on the clock" is just the absence of an out-stamp.
  function openEntries(){
    if(!DATA.entries) return [];
    return DATA.entries.filter(function(en){ return en && en.clockIn && !en.clockOut; })
      .sort(function(a,b){ return new Date(a.clockIn) - new Date(b.clockIn); });
  }
  function todaysEntries(){
    if(!DATA.entries) return [];
    var today = dateKey(new Date());
    return DATA.entries.filter(function(en){
      return en && en.clockIn && dateKey(new Date(en.clockIn)) === today;
    });
  }
  function hoursToday(){
    var now = new Date().toISOString();
    return todaysEntries().reduce(function(t, en){
      return t + hoursBetween(en.clockIn, en.clockOut || now);
    }, 0);
  }
  function activeEmployeeCount(){
    if(!DATA.employees) return null;
    return DATA.employees.filter(function(e){ return e && e.active; }).length;
  }
  // Minerva publishes { weekStart, updatedAt, byName:{ name:{ 'YYYY-MM-DD':[entry] } } }
  function planForToday(){
    var s = DATA.schedule;
    if(!s || !s.byName) return [];
    var today = dateKey(new Date());
    var out = [];
    Object.keys(s.byName).forEach(function(name){
      (s.byName[name][today] || []).forEach(function(en){
        out.push({ name:name, jobNum:en.jobNum, jobDesc:en.jobDesc, skill:en.skill, hours:en.hours });
      });
    });
    return out.sort(function(a,b){ return a.name.localeCompare(b.name); });
  }
  function planAssignmentCount(){
    var s = DATA.schedule;
    if(!s || !s.byName) return 0;
    var n = 0;
    Object.keys(s.byName).forEach(function(name){
      Object.keys(s.byName[name]).forEach(function(d){ n += (s.byName[name][d]||[]).length; });
    });
    return n;
  }
  function pipeline(){
    var buckets = { draft:{n:0,v:0}, sent:{n:0,v:0}, won:{n:0,v:0}, lost:{n:0,v:0} };
    (DATA.quotes||[]).forEach(function(q){
      if(!q) return;
      var st = buckets[q.status] ? q.status : 'draft';
      buckets[st].n++; buckets[st].v += quoteTotal(q);
    });
    return buckets;
  }

  /* ---------------- render ---------------- */
  function render(){
    document.title = 'Lanko Aengus Dashboard ' + APP_VERSION;
    document.getElementById('wordmarkVer').textContent = 'Aengus ' + APP_VERSION;
    document.getElementById('stage').innerHTML =
      renderFloor() + renderRack() + renderLedgers() + renderFoot();
  }

  function renderFloor(){
    if(DATA.err.timeclock || DATA.entries === null){
      var msg = DATA.err.timeclock
        ? '<b>Timeclock unavailable</b>Aengus could not read kairos_state. Kairos itself is unaffected &mdash; open it directly to check.'
        : 'Reading the timeclock&hellip;';
      return '<section><div class="eyebrow">On the clock<span class="rule"></span></div>' +
        '<div class="floor quiet"><div class="empty">' + msg + '</div></div></section>';
    }
    var open = openEntries();
    var total = activeEmployeeCount();
    var h = '<section><div class="eyebrow">On the clock<span class="rule"></span>' +
      '<span class="tally">' + fmtHours(hoursToday()) + ' logged today</span></div>' +
      '<div class="floor' + (open.length ? '' : ' quiet') + '">' +
      '<div class="floor-head">' +
        '<div class="headcount"><b>' + open.length + '</b><span>' +
          (total ? 'of ' + total + ' on the floor' : (open.length===1 ? 'person clocked in' : 'people clocked in')) +
        '</span></div>' +
        '<div class="floor-hours"><b>' + todaysEntries().length + '</b>entries today</div>' +
      '</div>';

    if(!open.length){
      h += '<div class="empty"><b>Nobody is clocked in</b>' +
        'That is expected outside shop hours. Kairos will show people here the moment they clock in.</div>';
    } else {
      h += '<div class="crew">' + open.map(function(en){
        return '<div class="tick"><span class="dot"></span>' +
          '<span class="who">' + esc(en.employeeName || 'Unnamed') + '</span>' +
          '<span class="job">' + esc(en.jobName || 'no job') + '</span>' +
          '<span class="since">' + fmtTime(en.clockIn) + ' &middot; ' +
            fmtHours(hoursBetween(en.clockIn, new Date().toISOString())) + '</span>' +
        '</div>';
      }).join('') + '</div>';
    }
    return h + '</div></section>';
  }

  function renderRack(){
    var vitals = appVitals();
    var h = '<section><div class="eyebrow">The apps<span class="rule"></span></div><div class="rack">';
    APPS.forEach(function(a){
      h += '<a class="plate ' + a.id + '" href="' + a.href + '">' +
        '<div class="deity">' + esc(a.deity) + '</div>' +
        '<div class="role">' + esc(a.role) + '</div>' +
        '<div class="vitals">' + vitals[a.id].map(function(v){
          return '<div class="vital"><span>' + esc(v[0]) + '</span><b>' + esc(v[1]) + '</b></div>';
        }).join('') + '</div>' +
        '<div class="goto">Open <span class="ver">' + esc(a.version) + '</span></div>' +
      '</a>';
    });
    return h + '</div></section>';
  }

  function appVitals(){
    var open = openEntries();
    var pipe = pipeline();
    var sched = DATA.schedule;
    var pubAge = sched && sched.updatedAt ? daysAgo(sched.updatedAt) : null;
    // A vital shows "n/a" when the read failed and "--" while it is still loading,
    // so a broken rule never masquerades as a real zero.
    function vit(bad, loading, value){ return bad ? 'n/a' : loading ? '--' : value; }
    var eBad = !!DATA.err.timeclock, rBad = !!DATA.err.roster;
    var mBad = !!DATA.err.planner,   qBad = !!DATA.err.quotes;
    var pBad = !!DATA.err.projects,  yBad = !!DATA.err.receiving;
    return {
      kairos: [
        ['On the clock',  vit(eBad, DATA.entries===null, String(open.length))],
        ['Hours today',   vit(eBad, DATA.entries===null, fmtHours(hoursToday()))],
        ['On the roster', vit(rBad, activeEmployeeCount()==null, String(activeEmployeeCount()))]
      ],
      minerva: [
        ['Week published', vit(mBad, DATA.schedule===null, sched && sched.weekStart ? fmtDayShort(sched.weekStart) : 'not yet')],
        ['Assignments',    vit(mBad, DATA.schedule===null, sched ? String(planAssignmentCount()) : '0')],
        ['Published',      vit(mBad, DATA.schedule===null, pubAge==null ? 'not yet' : (pubAge===0 ? 'today' : pubAge+'d ago'))]
      ],
      kubera: [
        ['Out for decision', vit(qBad, DATA.quotes===null, String(pipe.sent.n))],
        ['Value out',        vit(qBad, DATA.quotes===null, money(pipe.sent.v))],
        [qBad ? 'Sign in for these' : 'Drafts open',
                             vit(qBad, DATA.quotes===null, String(pipe.draft.n))]
      ],
      odin: [
        ['Open projects', vit(pBad, DATA.projects===null, String(openProjects().length))],
        ['Ops blocked',   vit(pBad, DATA.projects===null, String(openProjects().reduce(function(a,p){ return a + projBlockedOps(p).length; }, 0)))],
        ['Ready to ship', vit(pBad, DATA.projects===null, String((DATA.projects||[]).filter(function(p){ return p.status==='ship'; }).length))]
      ],
      iris: [
        ['Expected in',   vit(pBad || yBad, DATA.projects===null || DATA.receipts===null, String(inboundLines().length))],
        ['Problem flags', vit(yBad, DATA.receipts===null, String(flaggedReceipts(14).length))],
        ['Received, 7d',  vit(yBad, DATA.receipts===null, String((DATA.receipts||[]).filter(function(r){ return r.kind!=='ship' && num(r.at) >= Date.now()-7*86400000; }).length))]
      ]
    };
  }

  /* ---------------- Odin + Iris roll-ups ----------------
     Same discipline as the quote pipeline: read the documents those apps
     write and never invent state. An operation counts as blocked while any
     procurement line naming it is not fully received - the receipts from
     iris_state settle that, exactly the way Odin computes it. */
  function openProjects(){
    return (DATA.projects || []).filter(function(p){
      return p.status !== 'closed' && p.status !== 'shipped';
    });
  }
  function yardReceivedQty(lineId){
    return (DATA.receipts || []).filter(function(r){ return r.kind !== 'ship' && r.lineId === lineId; })
      .reduce(function(a, r){ return a + num(r.qty); }, 0);
  }
  function lineOutstanding(l){
    if(l.status === 'received') return false;
    return yardReceivedQty(l.id) < num(l.qty || 1);
  }
  function projBlockedOps(p){
    var b = {};
    (p.procurement || []).forEach(function(l){
      if(lineOutstanding(l)) (l.blocks || []).forEach(function(op){ b[op] = true; });
    });
    return Object.keys(b);
  }
  var STAGE_LABEL = { awaiting:'Awaiting', initiated:'Initiated', procurement:'Procurement',
    ready:'Ready', production:'Production', ship:'To ship', shipped:'Shipped', closed:'Closed' };
  var STAGE_PILL = { awaiting:'lost', initiated:'sent', procurement:'sent',
    ready:'won', production:'won', ship:'draft', shipped:'draft', closed:'draft' };
  function inboundLines(){
    var out = [];
    openProjects().forEach(function(p){
      (p.procurement || []).forEach(function(l){
        if(l.status !== 'ordered' && l.status !== 'confirmed') return;
        if(!lineOutstanding(l)) return;
        out.push({ job: p.jobRef || p.quoteNum || '', desc: l.desc || '', eta: l.eta || '' });
      });
    });
    out.sort(function(a, b){ return (a.eta || '9999') < (b.eta || '9999') ? -1 : 1; });
    return out;
  }
  function flaggedReceipts(days){
    var cutoff = Date.now() - days * 86400000;
    return (DATA.receipts || []).filter(function(r){
      return r.kind !== 'ship' && r.flag && num(r.at) >= cutoff;
    });
  }

  function renderJobs(){
    var h = '<div class="ledger"><div class="eyebrow">Jobs in motion &middot; Odin<span class="rule"></span></div>';
    if(DATA.err.projects){
      h += '<div class="empty"><b>Projects unavailable</b>Aengus could not read odin_state. ' +
        'Open Odin directly to check.</div>';
      return h + '</div>';
    }
    if(DATA.projects === null){ return h + '<div class="empty">Reading the projects&hellip;</div></div>'; }
    var open = openProjects();
    if(!open.length){
      h += '<div class="empty"><b>No jobs in motion</b>' +
        'Mark a quote Won in Kubera and award it to Odin; it shows up here.</div>';
      return h + '</div>';
    }
    open.sort(function(a, b){ return (a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : 1; });
    h += '<table class="rows"><thead><tr><th>Job</th><th>Customer</th><th>Stage</th>' +
      '<th>Due</th><th style="text-align:right">Blocked</th></tr></thead><tbody>';
    open.slice(0, 8).forEach(function(p){
      var blocked = projBlockedOps(p);
      h += '<tr><td class="mono">' + esc(p.jobRef || p.quoteNum || '') + '</td>' +
        '<td class="name">' + esc(p.customerName || '') + '</td>' +
        '<td><span class="pill ' + (STAGE_PILL[p.status] || 'draft') + '">' +
          esc(STAGE_LABEL[p.status] || p.status) + '</span></td>' +
        '<td class="mono">' + esc(p.dueDate || '') + '</td>' +
        '<td class="right">' + (blocked.length ?
          '<span class="stale" title="' + esc(blocked.join(', ')) + '">' + blocked.length + ' ops</span>' :
          '&mdash;') + '</td></tr>';
    });
    h += '</tbody></table>';
    if(open.length > 8) h += '<div class="foot">' + (open.length - 8) + ' more in Odin.</div>';
    return h + '</div>';
  }

  function renderYard(){
    var h = '<div class="ledger"><div class="eyebrow">The yard &middot; Iris<span class="rule"></span></div>';
    if(DATA.err.projects || DATA.err.receiving){
      h += '<div class="empty"><b>Receiving unavailable</b>Aengus could not read what the yard is expecting.</div>';
      return h + '</div>';
    }
    if(DATA.projects === null || DATA.receipts === null){
      return h + '<div class="empty">Reading the yard&hellip;</div></div>';
    }
    var inbound = inboundLines();
    var flags = flaggedReceipts(14);
    if(!inbound.length && !flags.length){
      h += '<div class="empty"><b>Nothing inbound</b>' +
        'When Odin marks a purchase Ordered, the yard sees it in Iris and it shows here.</div>';
      return h + '</div>';
    }
    var today = dateKey(new Date());
    if(inbound.length){
      h += '<table class="rows"><thead><tr><th>Job</th><th>Arriving</th>' +
        '<th style="text-align:right">ETA</th></tr></thead><tbody>';
      inbound.slice(0, 6).forEach(function(l){
        var late = l.eta && l.eta < today;
        h += '<tr><td class="mono">' + esc(l.job) + '</td>' +
          '<td class="name">' + esc(l.desc) + '</td>' +
          '<td class="right mono">' + (l.eta ?
            (late ? '<span class="stale">' + esc(l.eta) + '</span>' : esc(l.eta)) :
            '&mdash;') + '</td></tr>';
      });
      h += '</tbody></table>';
      if(inbound.length > 6) h += '<div class="foot">' + (inbound.length - 6) + ' more expected.</div>';
    }
    if(flags.length){
      h += '<div class="foot"><span class="stale">&#9888; ' + flags.length +
        ' receipt' + (flags.length > 1 ? 's' : '') + ' flagged with a problem in the last two weeks' +
        ' &mdash; details in Iris history.</span></div>';
    }
    return h + '</div>';
  }

  function renderLedgers(){
    return '<section><div class="ledgers">' + renderPlan() + renderPipeline() + '</div></section>' +
           '<section><div class="ledgers">' + renderJobs() + renderYard() + '</div></section>';
  }

  function renderPlan(){
    var h = '<div class="ledger"><div class="eyebrow">Today&rsquo;s plan &middot; Minerva<span class="rule"></span></div>';
    if(DATA.err.planner){
      h += '<div class="empty"><b>Planner unavailable</b>Aengus could not read minerva_state. ' +
        'Open Minerva directly to check the week.</div>';
      return h + '</div>';
    }
    if(DATA.schedule === null){
      h += '<div class="empty">Reading the planner&hellip;</div>';
      return h + '</div>';
    }
    if(!DATA.schedule){
      h += '<div class="empty"><b>No schedule published</b>' +
        'Minerva only sends a week over when you publish it from its Sync &amp; Output screen. ' +
        'Publish there and the plan shows up here.</div>';
      return h + '</div>';
    }
    var rows = planForToday();
    var age = daysAgo(DATA.schedule.updatedAt);
    if(!rows.length){
      h += '<div class="empty"><b>Nothing planned for today</b>' +
        'The published week is ' + esc(fmtDayShort(DATA.schedule.weekStart)) +
        ' and it has no entries dated today.' +
        (age!=null && age>7 ? ' <span class="stale">Published ' + age + ' days ago.</span>' : '') +
        '</div>';
      return h + '</div>';
    }
    h += '<table class="rows"><thead><tr><th>Who</th><th>Job</th><th>Task</th>' +
      '<th style="text-align:right">Hours</th></tr></thead><tbody>';
    rows.forEach(function(r){
      h += '<tr><td class="name">' + esc(r.name) + '</td>' +
        '<td class="mono">' + esc(r.jobNum || '') + '</td>' +
        '<td>' + esc(opLabel(r.skill)) + '</td>' +
        '<td class="right">' + (r.hours ? num(r.hours) : '') + '</td></tr>';
    });
    h += '</tbody></table>';
    if(age!=null && age>7){
      h += '<div class="foot"><span class="stale">Published ' + age + ' days ago &mdash; check it is still current.</span></div>';
    }
    return h + '</div>';
  }

  function renderPipeline(){
    var h = '<div class="ledger"><div class="eyebrow">Quote pipeline &middot; Kubera<span class="rule"></span></div>';
    if(DATA.err.quotes){
      var u = firebase.auth().currentUser;
      h += (!u || u.isAnonymous)
        ? '<div class="empty"><b>Sign in to see the pipeline</b>' +
          'Quote values stay hidden until someone signs in. Use the button at the ' +
          'bottom left. The timeclock and planner panels above do not need it.</div>'
        : '<div class="empty"><b>Quote builder unavailable</b>Signed in, but this account ' +
          'still could not read mercury_state. Check the Firestore rules.</div>';
      return h + '</div>';
    }
    if(DATA.quotes === null){
      h += '<div class="empty">Reading the quote builder&hellip;</div>';
      return h + '</div>';
    }
    if(!DATA.quotes.length){
      h += '<div class="empty"><b>No quotes yet</b>Raise one in Kubera and the pipeline appears here.</div>';
      return h + '</div>';
    }
    var pipe = pipeline();
    var order = [['draft','Draft'],['sent','Sent'],['won','Won'],['lost','Lost']];
    h += '<table class="rows"><thead><tr><th>Stage</th><th style="text-align:right">Quotes</th>' +
      '<th style="text-align:right">Value</th></tr></thead><tbody>';
    order.forEach(function(o){
      var b = pipe[o[0]];
      h += '<tr><td><span class="pill ' + o[0] + '">' + o[1] + '</span></td>' +
        '<td class="right">' + b.n + '</td>' +
        '<td class="right">' + (b.v ? money(b.v) : '&mdash;') + '</td></tr>';
    });
    h += '</tbody></table>' +
      '<div class="foot">Totals are a roll-up. Kubera is the source of truth for any single quote.</div>';
    return h + '</div>';
  }

  function renderFoot(){
    // A denied quotes read is the normal state for an anonymous viewer, not a
    // misconfiguration, so it must not be reported as one -- otherwise the footer
    // sends someone auditing rules that are working exactly as intended.
    var u = firebase.auth().currentUser;
    var anon = !u || u.isAnonymous;
    var bad = Object.keys(DATA.err).filter(function(k){
      return !(k === 'quotes' && anon);
    });
    var h = '<div class="foot">Read-only. Aengus never writes &mdash; changes belong in Kairos, Minerva or Kubera.';
    if(bad.length){
      h += '<br><span class="stale">Could not read: ' + esc(bad.join(', ')) +
        '. Check the Firestore rules allow reads on those collections.</span>';
    }
    return h + '</div>';
  }

  /* ---------------- listeners ----------------
     One listener per document. A listener that errors marks its panel as
     unavailable rather than taking the whole dashboard down, so a rules change on
     one collection can't blank the other two. */
  function watch(source, docKey, label, onValue){
    return firebaseDb.collection(SOURCES[source].collection).doc(docKey)
      .onSnapshot(function(snap){
        var v = (snap.exists && snap.data().value !== undefined) ? snap.data().value : null;
        delete DATA.err[label];
        live++;
        onValue(v);
        lamp(Object.keys(DATA.err).length ? 'saving' : 'on',
             Object.keys(DATA.err).length ? 'Partly live' : 'Live');
        render();
      }, function(e){
        // Leave the data field untouched. onValue is deliberately NOT called: an
        // error means we do not know, which is different from knowing it is empty.
        console.error('read failed', source, docKey, e);
        DATA.err[label] = true;
        failed++;
        lamp(live ? 'saving' : 'off', live ? 'Partly live' : 'No connection');
        render();
      });
  }

  /* Listeners are re-attachable because signing in or out changes what
     mercury_state will allow, and a Firestore listener that has already failed
     with permission-denied stays dead. Dropping and re-opening them is the only
     way the quote panel can recover without a page reload. */
  var unsubs = [];
  function attachAll(){
    unsubs.forEach(function(u){ try { u(); } catch(e){} });
    unsubs = [];
    DATA.err = {};
    lamp('saving', 'Loading');
    var S = SOURCES;
    unsubs.push(watch('kairos',  S.kairos.employees, 'roster',   function(v){ DATA.employees = v || []; }));
    unsubs.push(watch('kairos',  S.kairos.entries,   'timeclock',function(v){ DATA.entries   = v || []; }));
    unsubs.push(watch('minerva', S.minerva.schedule, 'planner',  function(v){ DATA.schedule  = v || false; }));
    unsubs.push(watch('kubera',  S.kubera.quotes,    'quotes',   function(v){ DATA.quotes    = v || []; }));
    unsubs.push(watch('odin',    S.odin.projects,    'projects', function(v){ DATA.projects  = v || []; }));
    unsubs.push(watch('iris',    S.iris.receipts,    'receiving',function(v){ DATA.receipts  = v || []; }));
  }
  // The sign-in overlay calls this when the account changes.
  window.__lankoReattach = attachAll;

  function boot(){
    tickClock();
    setInterval(tickClock, 20000);
    // Elapsed times on the floor tick over on their own so a wall monitor stays
    // honest without anyone touching it.
    setInterval(function(){ if(DATA.entries) render(); }, 60000);
    render();
    firebaseAuthReady.then(attachAll);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
