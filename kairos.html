}
function renderCalendarTab(){
  var monthStr = STATE.calendarMonth || monthStrFromDate(new Date());
  var parts = monthStr.split('-'); var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
  var monthLabel = new Date(y,m,1).toLocaleDateString([], {month:'long', year:'numeric'});

  var pending = STATE.timeOffRequests.filter(function(r){ return r.status==='pending'; })
    .sort(function(a,b){ return new Date(a.requestedAt)-new Date(b.requestedAt); });
  var pendingHtml = '';
  if(pending.length){
    pendingHtml = '<div style="background:var(--olive-dim);border:1px solid var(--olive);border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
      '<div style="font-weight:700;color:var(--olive);margin-bottom:8px;">&#128197; '+pending.length+' time-off request'+(pending.length===1?'':'s')+' awaiting approval</div>'+
      pending.map(function(r){
        var range = r.from===r.to ? fmtDateShort(r.from) : (fmtDateShort(r.from)+' \u2013 '+fmtDateShort(r.to));
        return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--olive);">'+
          '<div style="font-size:13px;"><b>'+esc(r.employeeName)+'</b> &mdash; '+esc(range)+(r.partial?' &middot; partial day':'')+
          (r.note?'<div style="color:#8a7f68;margin-top:2px;">'+esc(r.note)+'</div>':'')+'</div>'+
          '<div style="white-space:nowrap;"><button class="iconbtn" data-action="timeoff-approve" data-id="'+r.id+'">Approve</button>'+
          '<button class="iconbtn" data-action="timeoff-deny" data-id="'+r.id+'">Deny</button></div></div>';
      }).join('')+
      '</div>';
  }

  var approved = STATE.timeOffRequests.filter(function(r){ return r.status==='approved'; });
  var byDay = {};
  approved.forEach(function(r){
    dateRangeDays(r.from, r.to).forEach(function(dk){ (byDay[dk] = byDay[dk]||[]).push(r); });
  });

  var firstOfMonth = new Date(y,m,1);
  var startOffset = firstOfMonth.getDay();
  var gridStart = new Date(y,m,1-startOffset);
  var todayKey = todayStr();
  var cells = '';
  for(var i=0;i<42;i++){
    var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
    var dk = dateKeyLocal(d);
    var inMonth = d.getMonth()===m;
    var dayEntries = byDay[dk] || [];
    var chips = dayEntries.map(function(r){
      var color = colorForEmployeeName(r.employeeName);
      var label = r.employeeName + (r.partial ? ' (partial day)' : '');
      return '<span class="cal-chip" style="background:'+color+';" title="'+esc(label)+'">'+esc(r.employeeName)+(r.partial?' &frac12;':'')+'</span>';
    }).join('');
    cells += '<div class="cal-cell'+(inMonth?'':' other-month')+(dk===todayKey?' today':'')+'"><div class="cal-daynum">'+d.getDate()+'</div>'+chips+'</div>';
  }
  var dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(l){ return '<div class="cal-dow">'+l+'</div>'; }).join('');

  return '<div>'+pendingHtml+
    '<div class="cal-toolbar"><h2>'+esc(monthLabel)+'</h2>'+
    '<div class="cal-nav">'+
    '<button class="iconbtn" data-action="calendar-prev-month">&larr; Prev</button>'+
    '<button class="iconbtn" data-action="calendar-today">Today</button>'+
    '<button class="iconbtn" data-action="calendar-next-month">Next &rarr;</button>'+
    '</div></div>'+
    '<div class="cal-grid">'+dow+cells+'</div>'+
    '</div>';
}
/* ---------------- Google Sheet sync (jobs + employees) ---------------- */
  function parseCSV(text){
    var rows = [], row = [], field = '', inQuotes = false;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\r'){ /* skip */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else { field += c; }
      }
    }
    if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    return rows;
  }
  // Extracts rows keyed by field name from CSV given a column-index map, e.g.
  // {name:0, description:2} (0-based, null/undefined = field not provided). Dedupes by
  // the 'name' field (case-insensitive, first occurrence wins) and skips blank names.
  // Turns already-split rows (array of arrays of strings) into named records per colMap,
  // e.g. {name:0, description:2} -> [{name, description}, ...]. Shared by both the JSONP
  // path (rows come from Google's visualization table) and the CSV path (rows come from
  // parseCSV). Dedupes by name (case-insensitive, first occurrence wins) and skips blanks.
  function rowsToRecords(rows, colMap, hasHeader){
    if(hasHeader) rows = rows.slice(1);
    var seen = {}, out = [];
    rows.forEach(function(r){
      var name = (r[colMap.name]||'').trim();
      if(!name) return;
      var key = name.toLowerCase();
      if(seen[key]) return;
      seen[key] = true;
      var item = { name: name };
      if(colMap.description!=null) item.description = (r[colMap.description]||'').trim();
      if(colMap.quote!=null) item.quote = /^(y|yes|true|1)$/i.test((r[colMap.quote]||'').trim());
      if(colMap.pin!=null){
        var rawPin = (r[colMap.pin]||'').trim();
        item.pin = /^\d{4}$/.test(rawPin) ? rawPin : null;
      }
      out.push(item);
    });
    return out;
  }
  function parseSheetInput(input){
    input = (input||'').trim();
    if(/output=csv/.test(input) || /\.csv(\?|$)/.test(input)){ return { directUrl: input }; }
    var idMatch = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    var gidMatch = input.match(/gid=(\d+)/);
    if(!idMatch) return null;
    return { sheetId: idMatch[1], gid: gidMatch ? gidMatch[1] : '0', directUrl:null };
  }
  function maybeRenderAfterBackgroundSync(manualTrigger){
    if(manualTrigger){ render(); return; }
    if(STATE.view==='admin' || STATE.view==='tasks' || STATE.view==='manualentry' || STATE.view==='myhistory') return; // don't clobber an open form, an in-progress task selection, a manual time-entry form, or someone reviewing/flagging their history
    render();
  }
  var jsonpSeq = 0;
  // Loads the sheet via Google's own visualization-query JSONP mechanism: a <script> tag
  // whose src points at the gviz endpoint with a responseHandler callback name. Google
  // wraps the response as `callbackName({...})` and executes it once loaded. This is the
  // same technique Google Charts itself uses to pull spreadsheet data cross-origin, and
  // because it's a script load (not fetch/XHR) it isn't subject to CORS at all - which is
  // what was silently blocking the plain fetch() approach.
  function fetchGvizJSONP(sheetId, gid){
    return new Promise(function(resolve, reject){
      var cbName = '__lankoJSONP_' + (jsonpSeq++) + '_' + Date.now();
      var settled = false;
      var scriptEl = null;
      var timeoutId = setTimeout(function(){ finish(false, new Error('timeout')); }, 12000);
      function cleanup(){
        try{ window[cbName] = undefined; delete window[cbName]; } catch(e){}
        if(scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
      }
      function finish(success, value){
        if(settled) return;
        settled = true;
        clearTimeout(timeoutId);
        cleanup();
        if(success) resolve(value); else reject(value);
      }
      window[cbName] = function(data){ finish(true, data); };
      scriptEl = document.createElement('script');
      /* headers=0 is NOT optional: without it Google silently promotes what it
         guesses is a header row into column labels and removes it from the rows,
         and our own hasHeader strip then eats the first real data row. Job 99001
         has now been the casualty of this twice. Never remove this parameter. */
      scriptEl.src = 'https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?gid='+(gid||'0')+
        '&headers=0&tqx=responseHandler:'+cbName+'&_ts='+Date.now();
      scriptEl.onerror = function(){ finish(false, new Error('script load error')); };
      document.head.appendChild(scriptEl);
    });
  }
  function visualizationTableToRows(data){
    if(!data || !data.table || !Array.isArray(data.table.rows)) return [];
    return data.table.rows.map(function(r){
      return (r.c||[]).map(function(cell){
        if(cell==null) return '';
        var v = (cell.f!=null) ? cell.f : cell.v;
        return (v==null) ? '' : String(v);
      });
    });
  }
  // Generic fetch-and-parse step shared by both job and employee sync. Resolves with
  // {rows} on success, or {error} on any failure - never rejects, so callers don't need
  // try/catch on top of their own reconcile logic. Uses JSONP for normal sheet links
  // (the default and recommended setup); falls back to a plain fetch() only for a
  // directly-supplied CSV/"Publish to web" URL, since that path has no JSONP equivalent.
  function fetchSheetRows(src, colMap){
    if(src.directUrl){
      if(typeof fetch === 'undefined'){
        return Promise.resolve({ error: "This tablet's browser doesn't support fetching sheets." });
      }
      var url = src.directUrl + (src.directUrl.indexOf('?')===-1 ? '?' : '&') + '_ts=' + Date.now();
      return fetch(url, { cache:'no-store' })
        .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); })
        .then(function(text){
          var rows = rowsToRecords(parseCSV(text), colMap, src.hasHeader!==false);
          if(rows.length===0) return { error: 'The sheet returned no rows. Check the column number(s) and header setting.' };
          return { rows: rows };
        })
        .catch(function(){
          return { error: 'Could not reach that CSV link. Double check it\u2019s still valid and publicly accessible.' };
        });
    }
    return fetchGvizJSONP(src.sheetId, src.gid)
      .then(function(data){
        if(!data || data.status !== 'ok'){
          return { error: 'Google reported an error reading this sheet/tab. Double-check the link and that sharing is set to \u201cAnyone with the link can view.\u201d' };
        }
        var rows = rowsToRecords(visualizationTableToRows(data), colMap, src.hasHeader!==false);
        if(rows.length===0) return { error: 'The sheet returned no rows. Check the column number(s) and header setting.' };
        return { rows: rows };
      })
      .catch(function(){
        return { error: 'Could not reach the sheet. Make sure it\u2019s shared as \u201cAnyone with the link can view,\u201d and that this tablet has internet access.' };
      });
  }

  // Reconciles jobs pulled from a sheet against the current list, scoped to one audience
  // ('shop' or 'office') so the shop and office sync pipelines never interfere with each
  // other even though both write into the same STATE.jobs list. Matches existing
  // sheet-sourced jobs of that audience by name (case-insensitive) to keep their id
  // stable for reporting, adds any new names, updates description/quote when those
  // columns are configured, and deactivates sheet-sourced jobs of that audience no
  // longer present. Manually added jobs (source !== 'sheet') are never touched by this.
  // Legacy jobs synced before the shop/office split have no audience field - they're
  // treated as 'shop' so existing shop sync behavior is unaffected.
  function reconcileJobsFromSheet(list, rows, audience){
    var out = list.map(function(j){ return Object.assign({}, j); });
    var outByName = {};
    out.forEach(function(j){ if((j.audience||'shop')===audience) outByName[j.name.toLowerCase()] = j; });
    var seen = {};
    rows.forEach(function(r){
      var key = r.name.toLowerCase();
      seen[key] = true;
      var existing = outByName[key];
      if(existing){
        existing.active = true; existing.source = 'sheet'; existing.audience = audience;
        if(r.description!=null) existing.description = r.description;
        if(r.quote!=null) existing.isQuote = r.quote;
      } else {
        var job = {id:uid('job'), name:r.name, active:true, source:'sheet', audience:audience,
          description:r.description||'', isQuote: r.quote||false};
        out.push(job); outByName[key]=job;
      }
    });
    out.forEach(function(j){
      if(j.source==='sheet' && (j.audience||'shop')===audience && !seen[j.name.toLowerCase()]) j.active = false;
    });
    return out;
  }
  function syncJobsFromSheet(manualTrigger){
    if(!STATE.jobSource) return Promise.resolve();
    var js = STATE.jobSource;
    if(!js.directUrl && !js.sheetId) return Promise.resolve();
    STATE.jobSyncStatus = 'syncing';
    if(manualTrigger) render();
    var colMap = { name: Math.max(0,(js.columnIndex||1)-1) };
    if(js.descColumnIndex>0) colMap.description = js.descColumnIndex-1;
    return fetchSheetRows(js, colMap).then(function(result){
      if(result.error){
        STATE.jobSyncStatus='error'; STATE.jobSyncError=result.error;
        maybeRenderAfterBackgroundSync(manualTrigger);
        return;
      }
      return mutateLocal(K.jobs, STATE.jobs, function(list){ return reconcileJobsFromSheet(list, result.rows, 'shop'); })
        .then(function(updated){
          STATE.jobs = updated;
          STATE.jobSyncStatus = 'ok'; STATE.jobSyncError = null;
          STATE.jobSource = Object.assign({}, STATE.jobSource, {lastSyncAt: new Date().toISOString()});
          return safeSetJSON(K.jobSource, STATE.jobSource);
        })
        .then(function(){ maybeRenderAfterBackgroundSync(manualTrigger); });
    });
  }
  function syncOfficeJobsFromSheet(manualTrigger){
    if(!STATE.officeJobSource) return Promise.resolve();
    var js = STATE.officeJobSource;
    if(!js.directUrl && !js.sheetId) return Promise.resolve();
    STATE.officeJobSyncStatus = 'syncing';
    if(manualTrigger) render();
    var colMap = { name: Math.max(0,(js.columnIndex||1)-1) };
    if(js.descColumnIndex>0) colMap.description = js.descColumnIndex-1;
    if(js.quoteColumnIndex>0) colMap.quote = js.quoteColumnIndex-1;
    return fetchSheetRows(js, colMap).then(function(result){
      if(result.error){
        STATE.officeJobSyncStatus='error'; STATE.officeJobSyncError=result.error;
        maybeRenderAfterBackgroundSync(manualTrigger);
        return;
      }
      return mutateLocal(K.jobs, STATE.jobs, function(list){ return reconcileJobsFromSheet(list, result.rows, 'office'); })
        .then(function(updated){
          STATE.jobs = updated;
          STATE.officeJobSyncStatus = 'ok'; STATE.officeJobSyncError = null;
          STATE.officeJobSource = Object.assign({}, STATE.officeJobSource, {lastSyncAt: new Date().toISOString()});
          return safeSetJSON(K.officeJobSource, STATE.officeJobSource);
        })
        .then(function(){ maybeRenderAfterBackgroundSync(manualTrigger); });
    });
  }

  // Same idea for employees. If the sheet provides a pin column and it's a valid 4-digit
  // value, it's used; otherwise new employees get the shared DEFAULT_EMPLOYEE_PIN and are
  // flagged needsPinSetup so they're walked through choosing their own PIN the first time
  // they successfully log in with the default. Existing employees' PINs are only
  // overwritten when the sheet explicitly supplies a valid, non-conflicting one - never
  // silently blanked or reset on re-sync.
  function reconcileEmployeesFromSheet(list, rows){
    var out = list.map(function(e){ return Object.assign({}, e); });
    var outByName = {};
    out.forEach(function(e){ outByName[e.name.toLowerCase()] = e; });
    var usedPins = {};
    out.forEach(function(e){ if(e.active && e.pin!==DEFAULT_EMPLOYEE_PIN) usedPins[e.pin] = true; });
    var seen = {};
    rows.forEach(function(r){
      var key = r.name.toLowerCase();
      seen[key] = true;
      var existing = outByName[key];
      if(existing){
        existing.active = true; existing.source = 'sheet';
        if(r.pin && r.pin !== existing.pin && !usedPins[r.pin]){
          delete usedPins[existing.pin];
          existing.pin = r.pin; existing.needsPinSetup = false;
          usedPins[r.pin] = true;
        }
      } else {
        var needsPinSetup = !r.pin;
        var pin = r.pin || DEFAULT_EMPLOYEE_PIN;
        if(r.pin) usedPins[pin] = true;
        var emp = {id:uid('emp'), name:r.name, pin:pin, active:true, source:'sheet', needsPinSetup:needsPinSetup};
        out.push(emp); outByName[key]=emp;
      }
    });
    out.forEach(function(e){
      if(e.source==='sheet' && !seen[e.name.toLowerCase()]) e.active = false;
    });
    return out;
  }
  function syncEmployeesFromSheet(manualTrigger){
    if(!STATE.employeeSource) return Promise.resolve();
    var es = STATE.employeeSource;
    if(!es.directUrl && !es.sheetId) return Promise.resolve();
    STATE.empSyncStatus = 'syncing';
    if(manualTrigger) render();
    var colMap = { name: Math.max(0,(es.nameColumnIndex||1)-1) };
    if(es.pinColumnIndex>0) colMap.pin = es.pinColumnIndex-1;
    return fetchSheetRows(es, colMap).then(function(result){
      if(result.error){
        STATE.empSyncStatus='error'; STATE.empSyncError=result.error;
        maybeRenderAfterBackgroundSync(manualTrigger);
        return;
      }
      return mutateLocal(K.employees, STATE.employees, function(list){ return reconcileEmployeesFromSheet(list, result.rows); })
        .then(function(updated){
          STATE.employees = updated;
          STATE.empSyncStatus = 'ok'; STATE.empSyncError = null;
          STATE.employeeSource = Object.assign({}, STATE.employeeSource, {lastSyncAt: new Date().toISOString()});
          return safeSetJSON(K.employeeSource, STATE.employeeSource);
        })
        .then(function(){ maybeRenderAfterBackgroundSync(manualTrigger); });
    });
  }

  // Tasks are simpler than jobs/employees - just a list of names, no extra columns.
  // Reconciles the same way: matches existing sheet-sourced tasks by name to keep ids
  // stable, adds new ones, deactivates sheet-sourced tasks no longer present. Manually
  // added tasks (source !== 'sheet') are never touched by this.
  function reconcileTasksFromSheet(list, rows){
    var out = list.map(function(t){ return Object.assign({}, t); });
    var outByName = {};
    out.forEach(function(t){ outByName[t.name.toLowerCase()] = t; });
    var seen = {};
    rows.forEach(function(r){
      var key = r.name.toLowerCase();
      seen[key] = true;
      var existing = outByName[key];
      if(existing){
        existing.active = true; existing.source = 'sheet';
      } else {
        var task = {id:uid('task'), name:r.name, active:true, source:'sheet'};
        out.push(task); outByName[key]=task;
      }
    });
    out.forEach(function(t){
      if(t.source==='sheet' && !seen[t.name.toLowerCase()]) t.active = false;
    });
    return out;
  }
  function syncTasksFromSheet(manualTrigger){
    if(!STATE.taskSource) return Promise.resolve();
    var ts = STATE.taskSource;
    if(!ts.directUrl && !ts.sheetId) return Promise.resolve();
    STATE.taskSyncStatus = 'syncing';
    if(manualTrigger) render();
    var colMap = { name: Math.max(0,(ts.columnIndex||1)-1) };
    return fetchSheetRows(ts, colMap).then(function(result){
      if(result.error){
        STATE.taskSyncStatus='error'; STATE.taskSyncError=result.error;
        maybeRenderAfterBackgroundSync(manualTrigger);
        return;
      }
      return mutateLocal(K.tasks, STATE.tasks, function(list){ return reconcileTasksFromSheet(list, result.rows); })
        .then(function(updated){
          STATE.tasks = updated;
          STATE.taskSyncStatus = 'ok'; STATE.taskSyncError = null;
          STATE.taskSource = Object.assign({}, STATE.taskSource, {lastSyncAt: new Date().toISOString()});
          return safeSetJSON(K.taskSource, STATE.taskSource);
        })
        .then(function(){ maybeRenderAfterBackgroundSync(manualTrigger); });
    });
  }

  function loadAll(){
    return Promise.all([
      safeGetJSON(K.employees, []),
      safeGetJSON(K.jobs, []),
      safeGetJSON(K.entries, []),
      safeGetJSON(K.adminPin, null),
      safeGetJSON(K.jobSource, DEFAULT_JOB_SOURCE),
      safeGetJSON(K.employeeSource, DEFAULT_EMPLOYEE_SOURCE),
      safeGetJSON(K.tasks, []),
      safeGetJSON(K.sheetWrite, null),
      safeGetJSON(K.taskSource, DEFAULT_TASK_SOURCE),

  /* ---------------- rack ---------------- */
  /* ---------------- festive friday (one-day fun mode) ----------------
     PREVIEW_FESTIVE forces it on for local testing. Set this back to false
     before publishing -- isFestiveFriday() then only fires for real on the
     one calendar date below, and reverts on its own the next day. */
  var PREVIEW_FESTIVE = false;
  function isFestiveFriday(){
    if(PREVIEW_FESTIVE) return true;
    var d = new Date();
    return d.getFullYear()===2026 && d.getMonth()===7 && d.getDate()===7;
  }
  function playFestiveChime(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var now = ctx.currentTime;
      [523.25, 659.25, 784.0, 1046.5].forEach(function(freq, i){
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.value = freq;
        var start = now + i*0.09;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.18, start+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start+0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(start); osc.stop(start+0.4);
      });
      setTimeout(function(){ ctx.close(); }, 900);
    }catch(e){ console.warn('festive chime failed', e); }
  }

    var activeCount = activeEmployees.filter(function(e){ return e.presenceOnly ? e.officeStatus==='in' : openByEmp[e.id]; }).length;

    if(activeEmployees.length===0){
      return '<main class="rack"><div class="empty-state" style="margin-top:60px;"><b>No employees yet</b>Tap the gear icon above to add your team and job list.</div></main>';
    }

    var festive = isFestiveFriday();
    var wireHtml = festive ? '<span class="wirewrap wirewrap-top"></span><span class="wirewrap wirewrap-bottom"></span>' : '';
    var cards = activeEmployees.map(function(emp, i){
      var delayAttr = festive ? ' style="animation-delay:'+(i*45)+'ms"' : '';
      if(emp.presenceOnly){
        var inOffice = emp.officeStatus==='in';

        return '<div class="'+cls+'" tabindex="0" data-action="open-employee" data-id="'+emp.id+'"'+delayAttr+'>'+wireHtml+
          '<div class="sub"><span class="dot"></span>'+sub+'</div>'+

      return '<div class="'+cls+'" tabindex="0" data-action="open-employee" data-id="'+emp.id+'"'+delayAttr+'>'+tag+wireHtml+

    return '<main class="rack'+(festive?' festive-mode':'')+'">'+festiveBanner+'<div class="rack-heading"><h1>'+heading+'</h1>'+

  function checkPin(){

      STATE.pinBuffer=''; STATE.pinError=false; STATE.pinAttempts=0;

        STATE.newPinBuffer=''; STATE.newPinStage='enter'; STATE.newPin1=null; STATE.newPinError=false;

  /* ---------------- office presence (salaried, no time tracking) ----------------

  function onQuickToggleOfficeStatus(){

    }).then(function(updated){

      showStamp(newStatus, newStatus==='in'?'In Office':'Out of Office', null);

  function onManualEntrySave(){
    var empSel = document.getElementById('manualEntryEmpSelect');
    var jobSel = document.getElementById('manualEntryJobSelect');
    var inVal = document.getElementById('manualEntryInInput').value;
    var outVal = document.getElementById('manualEntryOutInput').value;
    var emp = STATE.employees.find(function(e){ return e.id===(empSel?empSel.value:null); });
    var job = STATE.jobs.find(function(j){ return j.id===(jobSel?jobSel.value:null); });
    var loggedBy = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ STATE.manualEntryError='Pick an employee.'; render(); return; }
    if(!job){ STATE.manualEntryError='Pick a job.'; render(); return; }
    if(!inVal){ STATE.manualEntryError='Clock-in time is required.'; render(); return; }
    var clockIn = new Date(inVal).toISOString();
    var clockOut = outVal ? new Date(outVal).toISOString() : null;
    if(clockOut && new Date(clockOut) <= new Date(clockIn)){ STATE.manualEntryError='Clock-out must be after clock-in.'; render(); return; }
    var entry = { id:uid('ent'), employeeId:emp.id, employeeName:emp.name, jobId:job.id, jobName:job.name,
      clockIn:clockIn, clockOut:clockOut, completedTasks:[], enteredBy: loggedBy ? loggedBy.name : null };
    mutateEntries(function(list){ return list.concat([entry]); }).then(function(updated){
      STATE.entries = updated; STATE.manualEntryError=null; STATE.manualEntrySavedName=emp.name; render();
    });
  }

  /* ---------------- mileage request (employee self-service) ----------------
     Lets any employee log kilometres travelled against a job, independent of clock
     status - driving to a job site isn't tied to being currently clocked into it, so this
     is reachable any time from the action screen (like "View my history"), not gated by
     an open punch. Writes straight to Firestore via mutateMileage, same transaction
     safety as mutateEntries/mutatePrintRequests. No approval gate at submission time and
     no $/km rate here - records are self-reported like a manual entry; an admin can edit
     or delete before sending, and "Send mileage to Sheet" is itself the approval step
     (see onSendMileageToSheet). Stays on this screen after a successful save (clearing
     the form) so someone logging several jobs in one sitting doesn't have to re-open it
     each time - same reasoning as onManualEntrySave. */
  function renderMileageRequest(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ STATE.view='rack'; return renderRack(); }
    var empAudience = (emp.employeeType==='office') ? 'office' : 'shop';
    var jobs = STATE.jobs.filter(function(j){ return j.active && (j.audience||'shop')===empAudience && !isClosedInOdin(j); })
      .concat(empAudience==='office' ? kuberaQuoteJobsSelectable() : [])
      .sort(jobNumericCompare);
    var savedBanner = STATE.mileageSavedInfo ? '<div class="formerr" style="color:var(--olive);font-weight:600;">&#10003; Saved &mdash; '+esc(STATE.mileageSavedInfo)+'.</div>' : '';
    var dateVal = STATE.mileageDraftDate || todayStr();
    var hasKm = !!STATE.mileageKmBuffer;
    var kmDisplay = hasKm ? (STATE.mileageKmBuffer+' km') : 'Tap to enter';
    var kmBtnStyle = 'font-family:var(--body);font-size:14px;padding:9px 11px;border-radius:7px;'+
      'border:1px solid var(--line);background:#fff;min-width:150px;text-align:left;cursor:pointer;'+
      'color:'+(hasKm?'var(--ink)':'#a89a7a')+';';
    return '<div class="action-view"><span class="backlink" data-action="mileage-back">&larr; Back</span>'+
      '<div class="action-view-scroll">'+
      '<div class="status-hero"><p class="greetname">Request mileage</p><p class="statusline">Log kilometres travelled for a job</p></div>'+
      savedBanner+
      '<div class="inlineform" style="max-width:560px;width:100%;">'+
      '<div class="field" style="flex:1;min-width:180px;"><label>Job</label><select id="mileageJobSelect">'+
        (jobs.length===0?'<option value="">No jobs set up</option>':'')+
        jobs.map(function(j){ return '<option value="'+j.id+'" '+(j.id===STATE.mileageDraftJobId?'selected':'')+'>'+esc(j.name)+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="field"><label>Date</label><input id="mileageDateInput" type="date" value="'+esc(dateVal)+'"></div>'+
      '<div class="field"><label>Kilometres</label><button type="button" data-action="mileage-km-open" style="'+kmBtnStyle+'">'+kmDisplay+'</button></div>'+
      '<div class="field" style="flex:1 1 100%;"><label>Notes (optional)</label><input id="mileageNoteInput" type="text" value="'+esc(STATE.mileageDraftNote||'')+'" placeholder="e.g. delivery run, site visit"></div>'+

  // Stashes the Job/Date/Notes fields into STATE right before navigating to the km-entry
  // screen, since switching STATE.view tears down and rebuilds the form's DOM - without
  // this, whatever the employee already picked would be lost on the way back.
  function captureMileageDraft(){
    var jobSel = document.getElementById('mileageJobSelect');
    var dateInp = document.getElementById('mileageDateInput');
    var noteInp = document.getElementById('mileageNoteInput');
    STATE.mileageDraftJobId = jobSel ? jobSel.value : null;
    STATE.mileageDraftDate = dateInp ? dateInp.value : null;
    STATE.mileageDraftNote = noteInp ? noteInp.value : '';
  }
  /* ---------------- mileage kilometres entry (tablet-friendly number pad) ----------------
     Whole kilometres only - no decimal point on this keypad, matching the "to the
     kilometre" precision the shop actually wants. Reuses the same center-stage/authcard/
     keypad markup as the PIN screens (renderPin/renderAdminPin) for a consistent
     full-screen "focused entry" feel, since the browser's native number keyboard is
     fiddly to hit accurately on a shop-floor tablet. */
  function renderMileageKmEntry(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ STATE.view='rack'; return renderRack(); }
    var buf = STATE.mileageKmBuffer || '';
    return '<div class="center-stage"><div class="authcard">'+
      '<span class="backlink" data-action="mileage-km-cancel">&larr; Back</span>'+
      '<h2>Kilometres</h2><p class="sub">Whole kilometres travelled for this job</p>'+
      '<div style="font-family:var(--shop-display);font-size:48px;font-weight:700;color:var(--shop-gold);margin:0 0 22px;">'+
        (buf?esc(buf):'<span style="color:var(--shop-gray);">0</span>')+' <span style="font-size:20px;color:var(--shop-gray);">km</span>'+
      '</div>'+
      '<div class="keypad">'+
        [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-action="mileage-km-digit" data-id="'+n+'">'+n+'</button>'; }).join('')+
        '<button class="wide" data-action="mileage-km-back">&#9003;</button>'+
        '<button class="zero" data-action="mileage-km-digit" data-id="0">0</button>'+
        '<button style="background:var(--shop-gold-deep);color:var(--shop-bg-deep);" data-action="mileage-km-confirm">&#10003;</button>'+
      '</div></div></div>';
  }
  // Cap at 5 digits (99999 km) - a generous sanity ceiling for a single job's travel, not
  // a realistic value anyone should ever hit. Leading zero is replaced rather than
  // appended to (typing "5" after a bare "0" gives "5", not "05").
  function onMileageKmDigit(d){
    var buf = STATE.mileageKmBuffer || '';
    if(buf.length >= 5) { render(); return; }
    buf = (buf === '0') ? String(d) : buf + String(d);
    STATE.mileageKmBuffer = buf;
    render();
  }
  function onMileageRequestSave(){
    var jobSel = document.getElementById('mileageJobSelect');
    var dateVal = document.getElementById('mileageDateInput').value;
    var noteEl = document.getElementById('mileageNoteInput');
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    var job = jobsWithKuberaQuotes().find(function(j){ return j.id===(jobSel?jobSel.value:null); });
    if(!emp){ STATE.view='rack'; render(); return; }
    if(!job){ STATE.mileageError='Pick a job.'; render(); return; }
    if(!dateVal){ STATE.mileageError='Pick a date.'; render(); return; }
    var km = parseInt(STATE.mileageKmBuffer||'', 10);
    if(!km || km<=0){ STATE.mileageError='Enter the kilometres travelled.'; render(); return; }
    var req = {
      id: uid('mlg'), employeeId: emp.id, employeeName: emp.name,
      jobId: job.id, jobName: job.name,
      date: dateVal, km: km, note: noteEl ? noteEl.value.trim() : '',
      requestedAt: new Date().toISOString()
    };
    STATE.mileageError = null;
    mutateMileage(function(list){ return (list||[]).concat([req]); }).then(function(updated){
      STATE.mileage = updated;
      STATE.mileageSavedInfo = km + ' km logged for ' + job.name;
      STATE.mileageKmBuffer = ''; STATE.mileageDraftJobId = null; STATE.mileageDraftDate = null; STATE.mileageDraftNote = '';
      render();
    }).catch(function(){
      STATE.mileageError = 'Could not reach the shop system. Try again in a minute.';
      render();
    });
  }

  /* ---------------- admin: log time for crew ----------------
     Same underlying entry shape as the employee-side manual entry above, but reachable
     from the Admin screen (admin PIN) instead of a specific employee's own PIN session --
     needed once an employee is presenceOnly and no longer has a personal action screen to
     reach "Log time for a crew member" from. A "Logged by" dropdown (anyone with
     canManualEntry) replaces STATE.selectedEmployeeId as the audit-trail source. Offers two
     entry styles: the original clock-in/out picker, and a simpler date+job+hours form that
     synthesizes a clockIn/clockOut window under the hood so nothing downstream (Payroll,
     Time by Job, the sheet bridge) needs to know the difference. */
  function renderLogTimeTab(){
    var crewOptions = STATE.employees.filter(function(e){ return e.active && !e.presenceOnly; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    var loggers = STATE.employees.filter(function(e){ return e.canManualEntry; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    var shopJobs = STATE.jobs.filter(function(j){ return j.active && (j.audience||'shop')==='shop'; }).sort(jobNumericCompare);
    var mode = STATE.adminLogTimeMode || 'clock';
    var nowVal = toLocalInputVal(new Date().toISOString());
    var todayVal = new Date().toISOString().slice(0,10);

    var loggedByField = '<div class="field" style="flex:1;min-width:180px;"><label>Logged by</label><select id="adminLogTimeBySelect">'+
      (loggers.length===0?'<option value="">No one has manual-entry access</option>':'')+
      loggers.map(function(e){ return '<option value="'+e.id+'">'+esc(e.name)+'</option>'; }).join('')+
    '</select></div>';

    var modeToggle = '<div class="admin-tabs" style="margin:16px 0;">'+
      '<button class="'+(mode==='clock'?'active':'')+'" data-action="logtime-mode" data-id="clock">Clock In / Out</button>'+
      '<button class="'+(mode==='simple'?'active':'')+'" data-action="logtime-mode" data-id="simple">Simple (Date + Hours)</button>'+
    '</div>';

    var savedMsg = STATE.adminLogTimeSavedName ? '<div class="formerr" style="color:var(--olive);font-weight:600;">&#10003; Saved for '+esc(STATE.adminLogTimeSavedName)+'.</div>' : '';
    var errMsg = STATE.adminLogTimeError ? '<div class="formerr">'+esc(STATE.adminLogTimeError)+'</div>' : '';

    var empField = '<div class="field" style="flex:1;min-width:180px;"><label>Employee</label><select id="adminLogTimeEmpSelect">'+
      (crewOptions.length===0?'<option value="">No employees</option>':'')+
      crewOptions.map(function(e){ return '<option value="'+e.id+'">'+esc(e.name)+'</option>'; }).join('')+
    '</select></div>';
    var jobField = '<div class="field" style="flex:1;min-width:180px;"><label>Job</label><select id="adminLogTimeJobSelect">'+
      (shopJobs.length===0?'<option value="">No shop jobs</option>':'')+
      shopJobs.map(function(j){ return '<option value="'+j.id+'">'+esc(j.name)+'</option>'; }).join('')+
    '</select></div>';

    var formBody;
    if(mode==='simple'){
      formBody = empField + jobField +
        '<div class="field"><label>Date</label><input id="adminLogTimeDateInput" type="date" value="'+todayVal+'"></div>'+
        '<div class="field"><label>Hours worked</label><input id="adminLogTimeHoursInput" type="number" min="0.25" step="0.25" placeholder="e.g. 7.5"></div>'+
        errMsg+
        '<div class="formbtns"><button class="save" data-action="admin-logtime-simple-save">Save entry</button></div>';
    } else {
      formBody = empField + jobField +
        '<div class="field"><label>Clock in</label><input id="adminLogTimeInInput" type="datetime-local" value="'+nowVal+'"></div>'+
        '<div class="field"><label>Clock out (optional)</label><input id="adminLogTimeOutInput" type="datetime-local" value=""></div>'+
        errMsg+
        '<div class="formbtns"><button class="save" data-action="admin-logtime-clock-save">Save entry</button></div>';
    }

    return '<div><h2 style="margin-top:0;">Log Time for Crew</h2>'+
      '<p class="sub" style="margin-bottom:0;">For crew who can\u2019t sign in themselves, or to backfill a missed entry.</p>'+
      savedMsg+
      '<div class="inlineform" style="max-width:640px;margin-top:16px;">'+loggedByField+'</div>'+
      modeToggle+
      '<div class="inlineform" style="max-width:640px;">'+formBody+'</div>'+

  function onAdminLogTimeClockSave(){
    var empSel = document.getElementById('adminLogTimeEmpSelect');
    var jobSel = document.getElementById('adminLogTimeJobSelect');
    var inVal = document.getElementById('adminLogTimeInInput').value;
    var outVal = document.getElementById('adminLogTimeOutInput').value;
    var loggedBySel = document.getElementById('adminLogTimeBySelect');
    var emp = STATE.employees.find(function(e){ return e.id===(empSel?empSel.value:null); });
    var job = STATE.jobs.find(function(j){ return j.id===(jobSel?jobSel.value:null); });
    var loggedBy = STATE.employees.find(function(e){ return e.id===(loggedBySel?loggedBySel.value:null); });
    if(!emp){ STATE.adminLogTimeError='Pick an employee.'; render(); return; }
    if(!job){ STATE.adminLogTimeError='Pick a job.'; render(); return; }
    if(!inVal){ STATE.adminLogTimeError='Clock-in time is required.'; render(); return; }
    var clockIn = new Date(inVal).toISOString();
    var clockOut = outVal ? new Date(outVal).toISOString() : null;
    if(clockOut && new Date(clockOut) <= new Date(clockIn)){ STATE.adminLogTimeError='Clock-out must be after clock-in.'; render(); return; }
    var entry = { id:uid('ent'), employeeId:emp.id, employeeName:emp.name, jobId:job.id, jobName:job.name,
      clockIn:clockIn, clockOut:clockOut, completedTasks:[], enteredBy: loggedBy ? loggedBy.name : null };
    mutateEntries(function(list){ return list.concat([entry]); }).then(function(updated){
      STATE.entries = updated; STATE.adminLogTimeError=null; STATE.adminLogTimeSavedName=emp.name; render();
    });
  }
  function onAdminLogTimeSimpleSave(){
    var empSel = document.getElementById('adminLogTimeEmpSelect');
    var jobSel = document.getElementById('adminLogTimeJobSelect');
    var dateVal = document.getElementById('adminLogTimeDateInput').value;
    var hoursVal = parseFloat(document.getElementById('adminLogTimeHoursInput').value);
    var loggedBySel = document.getElementById('adminLogTimeBySelect');
    var emp = STATE.employees.find(function(e){ return e.id===(empSel?empSel.value:null); });
    var job = STATE.jobs.find(function(j){ return j.id===(jobSel?jobSel.value:null); });
    var loggedBy = STATE.employees.find(function(e){ return e.id===(loggedBySel?loggedBySel.value:null); });
    if(!emp){ STATE.adminLogTimeError='Pick an employee.'; render(); return; }
    if(!job){ STATE.adminLogTimeError='Pick a job.'; render(); return; }
    if(!dateVal){ STATE.adminLogTimeError='Pick a date.'; render(); return; }
    if(!hoursVal || hoursVal<=0){ STATE.adminLogTimeError='Enter hours worked (greater than 0).'; render(); return; }
    var clockInDate = new Date(dateVal+'T07:00:00');

    var clockOut = new Date(clockInDate.getTime() + hoursVal*3600000).toISOString();
    var entry = { id:uid('ent'), employeeId:emp.id, employeeName:emp.name, jobId:job.id, jobName:job.name,
      clockIn:clockIn, clockOut:clockOut, completedTasks:[], enteredBy: loggedBy ? loggedBy.name : null };
    mutateEntries(function(list){ return list.concat([entry]); }).then(function(updated){
      STATE.entries = updated; STATE.adminLogTimeError=null; STATE.adminLogTimeSavedName=emp.name; render();
    });
  }

  /* ---------------- employee self-service: my history + flag an issue ----------------
     Lets any employee view their own recent clock history (never anyone else's), report
     a problem with a specific entry for the admin to review, and - if the Apps Script
     sheet-write URL is configured - email a copy of their history to themselves. */
  function getMyEntriesInRange(empId, from, to){
    var fromTime = new Date(from+'T00:00:00').getTime();
    var toTime = new Date(to+'T23:59:59').getTime();
    return STATE.entries.filter(function(en){
      var t = new Date(en.clockIn).getTime();
      return en.employeeId===empId && t>=fromTime && t<=toTime;
    }).sort(function(a,b){ return new Date(b.clockIn)-new Date(a.clockIn); });
  }
  function renderMyHistory(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ STATE.view='rack'; return renderRack(); }
    if(!STATE.historyFrom) STATE.historyFrom = daysAgoStr(13);
    if(!STATE.historyTo) STATE.historyTo = todayStr();
    var payable = computePayableMap();
    var myEntries = getMyEntriesInRange(emp.id, STATE.historyFrom, STATE.historyTo);

    var quickBtns = [7,14,30].map(function(d){
      var qFrom = daysAgoStr(d-1), qTo = todayStr();
      var isActive = STATE.historyFrom===qFrom && STATE.historyTo===qTo;
      return '<button class="iconbtn" style="'+(isActive?'background:var(--oxblood);color:#fff;':'')+'" data-action="history-range" data-id="'+d+'">'+d+' days</button>';
    }).join('');

    var totalMs = roundedTotalHoursMs(myEntries, payable);
    var tableRows = myEntries.map(function(en){
      var p = payable[en.id] || {hoursMs:0, quoteMs:0};
      var hoursStr = en.clockOut ? fmtDuration(p.hoursMs) : 'Active';
      var rowStyle = en.flagged ? ' style="background:#fff8ec;"' : '';
      var statusCell = en.flagged ?
        '<span style="color:var(--rust);font-weight:600;">&#9873; Flagged</span> <button class="iconbtn" data-action="history-flag-withdraw" data-id="'+en.id+'">Withdraw</button>' :
        '<button class="iconbtn" data-action="history-flag-open" data-id="'+en.id+'">Report a problem</button>';
      var mainRow = '<tr'+rowStyle+'>'+
        '<td>'+fmtDateShort(en.clockIn)+'</td>'+
        '<td>'+esc(en.jobName)+'</td>'+
        '<td>'+fmtTime(en.clockIn)+'</td>'+
        '<td>'+(en.clockOut?fmtTime(en.clockOut):'&mdash;')+'</td>'+
        '<td>'+hoursStr+'</td>'+
        '<td style="white-space:nowrap;">'+statusCell+'</td>'+
        '</tr>';
      var extraRow = '';
      if(en.flagged && en.flagNote){
        extraRow += '<tr'+rowStyle+'><td colspan="6" style="padding-top:0;font-size:12px;color:#8a7f68;">&#8220;'+esc(en.flagNote)+'&#8221;</td></tr>';
      }
      if(STATE.historyFlagOpenId===en.id){
        extraRow += '<tr><td colspan="6">'+
          '<textarea id="historyFlagNoteInput" rows="2" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;padding:8px;border-radius:8px;border:1px solid var(--line);" placeholder="What looks wrong?"></textarea>'+
          (STATE.historyFlagError?'<div class="formerr">'+esc(STATE.historyFlagError)+'</div>':'')+
          '<div class="formbtns"><button class="save" data-action="history-flag-submit" data-id="'+en.id+'">Submit</button>'+
          '<button class="cancel" data-action="history-flag-cancel">Cancel</button></div></td></tr>';
      }
      return mainRow+extraRow;
    }).join('');

    var printStatusText = STATE.historyPrintStatus==='sending' ? 'Sending request&hellip;' :
      STATE.historyPrintStatus==='ok' ? '&#10003; Request sent \u2014 ask your admin to print this out.' :
      STATE.historyPrintStatus==='error' ? ('&#9888; '+esc(STATE.historyPrintError||'')) : '';

    return '<div class="action-view"><span class="backlink" data-action="action-cancel">&larr; Back</span>'+
      '<div class="action-view-scroll">'+
      '<div class="status-hero"><p class="greetname">'+esc(emp.name)+'\u2019s history</p>'+
      '<p class="statusline">'+esc(STATE.historyFrom)+' to '+esc(STATE.historyTo)+' &middot; '+msToHoursStr(totalMs)+'h total</p></div>'+
      '<div class="history-panel">'+
      '<div class="logfilters">'+
      '<div class="field"><label>From</label><input id="historyFromInput" type="date" value="'+STATE.historyFrom+'"></div>'+
      '<div class="field"><label>To</label><input id="historyToInput" type="date" value="'+STATE.historyTo+'"></div>'+
      '<button class="addbtn" data-action="history-apply-range">Update</button>'+
      quickBtns+
      '</div>'+
      (tableRows ?
        '<table class="datatable"><thead><tr><th>Date</th><th>Job</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th></tr></thead><tbody>'+tableRows+'</tbody></table>' :
        '<div class="empty-state">No clocked time in this range.</div>')+
      '</div>'+
      '<div class="actionbtns" style="margin-top:14px;">'+
      '<button class="bigbtn secondary" data-action="history-print-request">Request admin printout</button></div>'+
      (printStatusText?'<div style="font-size:13px;margin-top:8px;color:var(--shop-cream);">'+printStatusText+'</div>':'')+
      '</div></div>';
  }
  function onHistoryFlagSubmit(entryId){
    var noteEl = document.getElementById('historyFlagNoteInput');
    var note = noteEl ? noteEl.value.trim() : '';
    if(!note){ STATE.historyFlagError='Say a little about what looks wrong.'; render(); return; }
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    mutateEntries(function(list){
      return list.map(function(en){ return en.id===entryId ? Object.assign({}, en, {flagged:true, flagNote:note, flaggedAt:new Date().toISOString(), flaggedBy: emp?emp.name:null}) : en; });
    }).then(function(updated){
      STATE.entries = updated; STATE.historyFlagOpenId=null; STATE.historyFlagError=null; render();
    });
  }
  function onHistoryFlagWithdraw(entryId){
    mutateEntries(function(list){
      return list.map(function(en){ return en.id===entryId ? Object.assign({}, en, {flagged:false, flagNote:null, flaggedAt:null, flaggedBy:null}) : en; });
    }).then(function(updated){ STATE.entries = updated; render(); });
  }
  // Employee-facing "print this for me" request. Writes straight to Firestore (no Apps
  // Script / email dependency) so it works even on shops that never configured the
  // sheet-write bridge. Surfaces in the admin Daily Log tab until an admin resolves it.
  function requestAdminPrintout(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp) return;
    var from = STATE.historyFrom || daysAgoStr(13);
    var to = STATE.historyTo || todayStr();
    var req = {
      id: 'pr_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
      employeeId: emp.id, employeeName: emp.name,
      from: from, to: to,
      requestedAt: new Date().toISOString()
    };
    STATE.historyPrintStatus = 'sending'; STATE.historyPrintError = null; render();
    mutatePrintRequests(function(list){ return (list||[]).concat([req]); }).then(function(updated){
      STATE.printRequests = updated; STATE.historyPrintStatus = 'ok'; render();
    }).catch(function(){
      STATE.historyPrintStatus = 'error';
      STATE.historyPrintError = 'Could not reach the shop system. Try again in a minute.';
      render();
    });
  }
  function resolvePrintRequest(id){
    mutatePrintRequests(function(list){ return (list||[]).filter(function(r){ return r.id!==id; }); })
      .then(function(updated){ STATE.printRequests = updated; render(); });
  }
  function printReportHTML(employeeName, from, to, entries, payable){
    var totalMs = roundedTotalHoursMs(entries, payable);
    var rows = entries.map(function(en){
      var p = payable[en.id] || {hoursMs:0};
      var hrs = en.clockOut ? fmtDuration(p.hoursMs) : 'Active';
      return '<tr><td>'+fmtDateShort(en.clockIn)+'</td><td>'+esc(en.jobName)+'</td><td>'+fmtTime(en.clockIn)+'</td><td>'+
        (en.clockOut?fmtTime(en.clockOut):'\u2014')+'</td><td>'+hrs+'</td></tr>';
    }).join('');
    return '<h1>'+esc(employeeName)+' \u2014 Time Clock History</h1>'+
      '<div class="meta">'+esc(from)+' to '+esc(to)+' &middot; Printed '+fmtDateShort(new Date().toISOString())+' at '+fmtTime(new Date().toISOString())+'</div>'+
      '<table><thead><tr><th>Date</th><th>Job</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>'+
      (rows || '<tr><td colspan="5">No clocked time in this range.</td></tr>')+
      '</tbody><tfoot><tr><td colspan="4">Total</td><td>'+msToHoursStr(totalMs)+'h</td></tr></tfoot></table>';
  }
  // Fulfils an employee's "Request admin printout" - builds their timesheet for the
  // requested range and opens the browser print dialog. Deliberately separate from
  // resolvePrintRequest so printing doesn't itself dismiss the request; the admin
  // clicks "Mark printed" once the physical printout is actually in hand.
  function printRequestFulfill(id){
    var req = (STATE.printRequests||[]).find(function(r){ return r.id===id; });
    if(!req) return;
    var payable = computePayableMap();
    var entries = getMyEntriesInRange(req.employeeId, req.from, req.to);
    var area = document.getElementById('printArea');
    if(!area){
      area = document.createElement('div');
      area.id = 'printArea';
      document.body.appendChild(area);
    }
    area.innerHTML = printReportHTML(req.employeeName, req.from, req.to, entries, payable);
    window.print();
  }

  /* ---------------- task selection (on clock-out / transfer) ---------------- */
  function openTaskSelect(pendingAction){
    STATE.pendingAction = pendingAction;
    STATE.selectedTasks = [];
    STATE.view = 'tasks';
    render();
  }
  function renderTaskSelect(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    var open = emp ? STATE.entries.find(function(en){ return en.employeeId===emp.id && !en.clockOut; }) : null;
    var activeTasks = STATE.tasks.filter(function(t){ return t.active; });
    var pool = emp ? minervaPoolFor(emp.name) : null;
    if(pool !== 'draftorder'){
      activeTasks = activeTasks.filter(function(t){ return !isOfficeTask(t.name); });
    }
    var jobLabel = open ? open.jobName : '';

    if(activeTasks.length===0){
      return '<div class="action-view"><span class="backlink" data-action="tasks-cancel">&larr; Cancel</span>'+
        '<div class="action-view-scroll"><div class="empty-state"><b>No tasks set up yet</b>Ask an admin to add tasks in the Tasks tab. You can continue without selecting any for now.</div></div>'+
        '<div class="actionbtns"><button class="bigbtn primary" data-action="tasks-confirm">Continue</button></div></div>';
    }

    var tiles = activeTasks.map(function(t){

    var action = STATE.pendingAction;
    STATE.selectedTasks = [];

  function doClockIn(jobId){
    if(STATE.busy) return; STATE.busy=true;
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    var job = jobsWithKuberaQuotes().find(function(j){ return j.id===jobId; });
    if(!emp||!job){ STATE.busy=false; return; }
    var entry = { id:uid('ent'), employeeId:emp.id, employeeName:emp.name, jobId:job.id, jobName:job.name, clockIn:new Date().toISOString(), clockOut:null, completedTasks:[] };
    mutateEntries(function(list){ return list.concat([entry]); }).then(function(updated){
      STATE.entries = updated; STATE.busy=false; showStamp('in', 'Clocked in', job.name);
      if(isFestiveFriday()) playFestiveChime();
    });
  }
  function doTransfer(newJobId, completedTasks){
    if(STATE.busy) return; STATE.busy=true;
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    var job = jobsWithKuberaQuotes().find(function(j){ return j.id===newJobId; });
    if(!emp||!job){ STATE.busy=false; return; }
    var now = new Date().toISOString();
    mutateEntries(function(list){
      var updated = list.map(function(en){
        return (en.employeeId===emp.id && !en.clockOut) ? Object.assign({}, en, {clockOut:now, completedTasks: completedTasks||[]}) : en;
      });
      updated.push({ id:uid('ent'), employeeId:emp.id, employeeName:emp.name, jobId:job.id, jobName:job.name, clockIn:now, clockOut:null, completedTasks:[] });
      return updated;
    }).then(function(updated){
      STATE.entries = updated; STATE.busy=false; showStamp('transfer', 'Transferred', job.name);
    });
  }
  function doClockOut(completedTasks){
    if(STATE.busy) return; STATE.busy=true;
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ STATE.busy=false; return; }
    var now = new Date().toISOString();
    mutateEntries(function(list){
      return list.map(function(en){
        return (en.employeeId===emp.id && !en.clockOut) ? Object.assign({}, en, {clockOut:now, completedTasks: completedTasks||[]}) : en;
      });
    }).then(function(updated){
      STATE.entries = updated; STATE.busy=false; showStamp('out', 'Clocked out', null);
    });
  }

  function getFilteredEntries(){
    var from = STATE.logFrom || todayStr();
    var to = STATE.logTo || todayStr();
    var fromTime = new Date(from+'T00:00:00').getTime();
    var toTime = new Date(to+'T23:59:59').getTime();
    return STATE.entries.filter(function(en){
      var t = new Date(en.clockIn).getTime();
      return t>=fromTime && t<=toTime;
    }).sort(function(a,b){ return new Date(b.clockIn)-new Date(a.clockIn); });
  }

  // Mileage requests in the currently selected Daily Log date range (same STATE.logFrom/
  // logTo filter as time entries), keyed off the request's own `date` field. Unlike
  // getFilteredEntries this is a plain filter (no payable-map math involved) since mileage
  // carries no hours/after-hours logic of its own.
  function getFilteredMileage(){
    return (STATE.mileage||[]).filter(function(m){ return m.date>=STATE.logFrom && m.date<=STATE.logTo; });
  }
  // Row shape mirrors buildSheetSyncRows: [id, date, employee, job, km, note, requestedAt].
  // The bridge's upsertMileage() appends a Synced-At timestamp server-side, same as
  // upsertEntries does for time entries - not included here.
  function buildMileageSyncRows(){
    return getFilteredMileage().map(function(m){
      return [m.id, m.date, m.employeeName, m.jobName, m.km, m.note||'', m.requestedAt||''];
    });
  }
  function renderMileageLogSection(){
    var mileageRows = getFilteredMileage().slice().sort(function(a,b){ return b.date.localeCompare(a.date); });

    mileageRows.forEach(function(m){ totalsByEmpKm[m.employeeName] = (totalsByEmpKm[m.employeeName]||0) + (Number(m.km)||0); });
    var totalsHtml = Object.keys(totalsByEmpKm).sort().map(function(name){
      return '<div class="summary-card"><div class="n">'+Math.round(totalsByEmpKm[name])+' km</div><div class="l">'+esc(name)+'</div></div>';
    }).join('') || '<div class="empty-state" style="padding:14px;">No mileage requests in this range.</div>';

    var tableRows = mileageRows.map(function(m){

          '</select></div>'+
          '<div class="field"><label>Date</label><input id="logMileageDateInput" type="date" value="'+esc(m.date)+'"></div>'+
          '<div class="field"><label>Kilometres</label><input id="logMileageKmInput" type="number" inputmode="numeric" step="1" min="0" value="'+m.km+'"></div>'+
          '<div class="field" style="flex:1 1 100%;"><label>Notes</label><input id="logMileageNoteInput" type="text" value="'+esc(m.note||'')+'"></div>'+
          (STATE.logMileageEditError?'<div class="formerr">'+esc(STATE.logMileageEditError)+'</div>':'')+
          '<div class="formbtns"><button class="save" data-action="log-mileage-save-edit" data-id="'+m.id+'">Save</button>'+
          '<button class="cancel" data-action="log-mileage-cancel-edit">Cancel</button></div></div></td></tr>';
      }
      return '<tr><td>'+fmtDateOnlyShort(m.date)+'</td><td>'+esc(m.employeeName)+'</td><td>'+esc(m.jobName)+'</td>'+
        '<td>'+Math.round(Number(m.km))+'</td>'+
        '<td style="max-width:220px;">'+(m.note?esc(m.note):'<span style="color:#c4bba5;">—</span>')+'</td>'+
        '<td><button class="iconbtn" data-action="log-mileage-edit" data-id="'+m.id+'">Edit</button>'+
        '<button class="iconbtn danger" data-action="log-mileage-delete" data-id="'+m.id+'">Delete</button></td></tr>';
    }).join('');

    var sendStatusText = STATE.mileageSheetWriteStatus==='sending' ? 'Sending&hellip;' :
      STATE.mileageSheetWriteStatus==='error' ? ('&#9888; '+esc(STATE.mileageSheetWriteError||'Send error')) :
      (STATE.mileageSheetWriteLastSentAt ? ('&#10003; Last sent '+fmtTime(STATE.mileageSheetWriteLastSentAt)+' on '+fmtDateShort(STATE.mileageSheetWriteLastSentAt)) : 'Not sent yet');
    var sendBtn = STATE.sheetWriteUrl ?
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;">'+
      '<button class="addbtn" style="background:var(--card);color:var(--oxblood);border:1px solid var(--line);" data-action="mileage-sheetwrite-send">Send mileage to Sheet</button>'+
      '<div style="font-size:12px;color:'+(STATE.mileageSheetWriteStatus==='error'?'var(--rust)':'#8a7f68')+';">'+sendStatusText+'</div></div>' : '';

    return '<div class="subhead" style="margin-top:24px;">Mileage requests &mdash; pending approval; sending to Sheet approves and clears them</div>'+
      '<div class="summary-cards">'+totalsHtml+'</div>'+
      (mileageRows.length===0?'':
        '<table class="datatable"><thead><tr><th>Date</th><th>Employee</th><th>Job</th><th>Km</th><th>Notes</th><th>Actions</th></tr></thead><tbody>'+tableRows+'</tbody></table>')+

  function renderLogTab(){
    if(!STATE.logFrom) STATE.logFrom = todayStr();
    if(!STATE.logTo) STATE.logTo = todayStr();
    var rows = getFilteredEntries();
    var payable = computePayableMap();

    // Flagged entries matter regardless of whatever date range happens to be selected, so
    // this scans the full entry list (not just `rows`) and always surfaces every open flag.
    var flaggedEntries = STATE.entries.filter(function(en){ return en.flagged; })
      .sort(function(a,b){ return new Date(b.flaggedAt||0)-new Date(a.flaggedAt||0); });
    var flaggedBanner = '';
    if(flaggedEntries.length){
      flaggedBanner = '<div style="background:#fff3e0;border:1px solid #f0c987;border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
        '<div style="font-weight:700;color:var(--rust);margin-bottom:8px;">&#9873; '+flaggedEntries.length+' entr'+(flaggedEntries.length===1?'y':'ies')+' flagged for review</div>'+
        flaggedEntries.map(function(en){
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #f0c987;">'+
            '<div style="font-size:13px;"><b>'+esc(en.employeeName)+'</b> — '+fmtDateShort(en.clockIn)+', '+esc(en.jobName)+
            '<div style="color:#8a7f68;margin-top:2px;">"'+esc(en.flagNote||'')+'"</div></div>'+
            '<div style="white-space:nowrap;"><button class="iconbtn" data-action="log-edit" data-id="'+en.id+'">Edit entry</button>'+
            '<button class="iconbtn" data-action="log-resolve-flag" data-id="'+en.id+'">Resolve</button></div></div>';
        }).join('')+
        '</div>';
    }

    // Same reasoning as the flagged banner above - pending after-hours time matters no
    // matter what date range happens to be showing, so this scans every entry rather than
    // just `rows`.
    var pendingEntries = STATE.entries.filter(function(en){ return (payable[en.id]||{}).pendingMs > 0; })
      .sort(function(a,b){ return new Date(b.clockIn)-new Date(a.clockIn); });
    var pendingBanner = '';
    if(pendingEntries.length){
      pendingBanner = '<div style="background:var(--olive-dim);border:1px solid var(--olive);border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
        '<div style="font-weight:700;color:var(--olive);margin-bottom:8px;">&#9203; '+pendingEntries.length+' entr'+(pendingEntries.length===1?'y':'ies')+' with time outside the 7am\u20135:30/3:30 window awaiting approval</div>'+
        pendingEntries.map(function(en){
          var p = payable[en.id];
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--olive);">'+
            '<div style="font-size:13px;"><b>'+esc(en.employeeName)+'</b> — '+fmtDateShort(en.clockIn)+', '+esc(en.jobName)+' — '+
            fmtTime(en.clockIn)+'\u2013'+(en.clockOut?fmtTime(en.clockOut):'active')+
            '<div style="color:#8a7f68;margin-top:2px;">'+msToHoursStr(p.pendingMs)+'h outside the window</div></div>'+
            '<div style="white-space:nowrap;"><button class="iconbtn" data-action="log-edit" data-id="'+en.id+'">Edit entry</button>'+
            '<button class="iconbtn" data-action="log-approve-afterhours" data-id="'+en.id+'">Approve</button>'+
            '<button class="iconbtn" data-action="log-ignore-afterhours" data-id="'+en.id+'">Ignore</button></div></div>';
        }).join('')+
        '</div>';
    }

    // Employees' "Request admin printout" taps land here regardless of date range, same
    // reasoning as the banners above.
    var printRequests = (STATE.printRequests||[]).slice()
      .sort(function(a,b){ return new Date(b.requestedAt||0)-new Date(a.requestedAt||0); });
    var printBanner = '';
    if(printRequests.length){
      printBanner = '<div style="background:#e9edf2;border:1px solid var(--steel);border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
        '<div style="font-weight:700;color:var(--steel);margin-bottom:8px;">&#128424; '+printRequests.length+' printout request'+(printRequests.length===1?'':'s')+'</div>'+
        printRequests.map(function(r){
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--steel);">'+
            '<div style="font-size:13px;"><b>'+esc(r.employeeName)+'</b> — '+esc(r.from)+' to '+esc(r.to)+
            '<div style="color:#8a7f68;margin-top:2px;">Requested '+fmtTime(r.requestedAt)+' on '+fmtDateShort(r.requestedAt)+'</div></div>'+
            '<button class="iconbtn" data-action="printreq-print" data-id="'+esc(r.id)+'">Print</button>'+
            '<button class="iconbtn" data-action="printreq-resolve" data-id="'+esc(r.id)+'">Mark printed</button></div>';
        }).join('')+
        '</div>';
    }

    var totalsByEmp = {};
    rows.forEach(function(en){
      var p = payable[en.id] || {hoursMs:0, quoteMs:0, pendingMs:0};
      var t = totalsByEmp[en.employeeName] = totalsByEmp[en.employeeName] || {hoursMs:0, quoteMs:0, pendingMs:0};
      t.quoteMs += (p.quoteMs||0); t.pendingMs += (p.pendingMs||0);
    });
    // hoursMs is rounded per employee-day (not per entry, not over the whole range) so
    // it lines up with how the Payroll tab's MROUND(SUMIFS(...),0.25) rounds each day -
    // see roundedTotalHoursMs.
    Object.keys(totalsByEmp).forEach(function(name){
      var empRows = rows.filter(function(en){ return en.employeeName===name; });
      totalsByEmp[name].hoursMs = roundedTotalHoursMs(empRows, payable);
    });

    var totalsHtml = Object.keys(totalsByEmp).sort().map(function(name){
      var t = totalsByEmp[name];
      var qt = t.quoteMs>0 ? ' <span style="font-size:12px;color:var(--gold-dim);font-weight:600;">('+msToHoursStr(t.quoteMs)+'h quotes)</span>' : '';
      var pd = t.pendingMs>0 ? ' <span style="font-size:12px;color:var(--olive);font-weight:600;">(+'+msToHoursStr(t.pendingMs)+'h pending)</span>' : '';
      var selected = STATE.logEmpFilter===name;
      return '<div class="summary-card clickable'+(selected?' selected':'')+'" data-action="log-emp-filter" data-id="'+esc(name)+'"><div class="n">'+msToHoursStr(t.hoursMs)+'h'+qt+pd+'</div><div class="l">'+esc(name)+'</div></div>';
    }).join('') || '<div class="empty-state" style="padding:14px;">No entries in this range.</div>';

    // Clicking a summary card above drills the table below down to just that
    // employee's entries for the selected date range; STATE.logEmpFilter never
    // touches getFilteredEntries() itself, so the summary cards always keep
    // showing every employee (with the active one highlighted) and it's a
    // one-click toggle to get back to everyone.
    var displayRows = STATE.logEmpFilter ? rows.filter(function(en){ return en.employeeName===STATE.logEmpFilter; }) : rows;
    var tableRows = displayRows.map(function(en){
      if(STATE.editingEntryId===en.id){
        return '<tr><td colspan="8"><div class="inlineform" style="margin:0;">'+
          '<div class="field"><label>Job</label><select id="logJobSelect">'+

  // Quick-resolve for the "forgot to clock out for lunch" case. If the entry fully
  // brackets the shop's noon-12:30 lunch window (lunchWindowForDate), it's split into two
  // entries - one ending at noon, one starting at 12:30 - so the gap reads exactly like a
  // real lunch clock-out/in would have. Otherwise (a shorter entry that doesn't cleanly
  // span the window) it just trims 30 minutes off the end instead, same as the manual fix
  // Ivan would otherwise make by hand. Either way this only touches clockIn/clockOut - job,
  // tasks, and every other field carry over unchanged onto the split-off second entry.
  function onLogAddLunch(id){
    var LUNCH_MS = 30*MIN_MS;
    var en = STATE.entries.find(function(e){ return e.id===id; });
    if(!en || !en.clockOut) return;
    var clockIn = new Date(en.clockIn), clockOut = new Date(en.clockOut);
    var lunch = lunchWindowForDate(clockIn);
    var spansLunch = clockIn <= lunch.start && clockOut >= lunch.end;
    if(!spansLunch && (clockOut - clockIn) < LUNCH_MS){
      alert('This entry is too short to remove a 30-minute lunch from.');
      return;
    }
    var msg = spansLunch ?
      'Split this entry into a morning and afternoon shift, removing the 12:00–12:30 lunch window?' :
      'Remove a 30-minute lunch break from the end of this entry?';
    if(!confirm(msg)) return;
    mutateEntries(function(list){
      var idx = list.findIndex(function(e){ return e.id===id; });
      if(idx===-1) return list;
      var e = list[idx];
      if(!e.clockOut) return list;
      var cIn = new Date(e.clockIn), cOut = new Date(e.clockOut);
      var lw = lunchWindowForDate(cIn);
      var result = list.slice();
      if(cIn <= lw.start && cOut >= lw.end){
        var first = Object.assign({}, e, { clockOut: lw.start.toISOString() });
        var second = Object.assign({}, e, { id: uid('ent'), clockIn: lw.end.toISOString(), clockOut: e.clockOut });
        result.splice(idx, 1, first, second);
      } else if((cOut - cIn) >= LUNCH_MS){
        result[idx] = Object.assign({}, e, { clockOut: new Date(cOut.getTime()-LUNCH_MS).toISOString() });
      }
      return result;
    }).then(function(updated){ STATE.entries = updated; render(); });
  }

  // Same fetch pattern and no-cors/opaque-response tradeoff as onSendToSheet - see the
  // comment there for why this can't tell success from failure beyond "didn't throw".
  // Reuses the same STATE.sheetWriteUrl (one bridge, dispatched by msg.type server-side)
  // rather than asking for a second Apps Script URL. "Send mileage to Sheet" is treated as
  // the approval step - once a batch goes out, those records are removed from Kairos
  // (see the mutateMileage call below), so approved requests disappear from the admin
  // Daily Log and the Sheet becomes their permanent record from that point on. Same
  // opaque-response caveat as above applies: a request that actually failed server-side
  // would still be removed from Kairos here, since no-cors can't tell the difference -
  // acceptable given this is exactly the approve-and-clear behavior asked for.
  function onSendMileageToSheet(){
    if(!STATE.sheetWriteUrl) return;
    var rows = buildMileageSyncRows();
    if(rows.length===0){ alert('No mileage requests in the selected date range to send.'); return; }
    if(typeof fetch === 'undefined'){
      STATE.mileageSheetWriteStatus='error'; STATE.mileageSheetWriteError="This tablet's browser doesn't support sending data."; render(); return;
    }
    var sentIds = rows.map(function(r){ return r[0]; });
    STATE.mileageSheetWriteStatus = 'sending'; STATE.mileageSheetWriteError = null; render();
    fetch(STATE.sheetWriteUrl, {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'include',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type: 'syncMileage', from: STATE.logFrom, to: STATE.logTo, rows: rows })
    }).then(function(){
      return mutateMileage(function(list){
        return (list||[]).filter(function(m){ return sentIds.indexOf(m.id)===-1; });
      });
    }).then(function(updated){
      STATE.mileage = updated;
      STATE.mileageSheetWriteStatus = 'ok'; STATE.mileageSheetWriteError = null;
      STATE.mileageSheetWriteLastSentAt = new Date().toISOString();
      return safeSetJSON(K.sheetWrite, {url: STATE.sheetWriteUrl, lastSentAt: STATE.sheetWriteLastSentAt, mileageLastSentAt: STATE.mileageSheetWriteLastSentAt});
    }).then(function(){ render(); })
    .catch(function(){

  // Toggle, not one-way - Ivan can un-approve a click made in error just as easily.

  // immediately moves the entry's outside-window time from pendingMs into hoursMs (or
  // back) without touching clockIn/clockOut at all. (onLogIgnoreAfterHours below also
  // touches this flag, to keep Approved/Ignored mutually exclusive.)
  function onLogApproveAfterHours(id){
    mutateEntries(function(list){
      return list.map(function(en){ return en.id===id ? Object.assign({}, en, {afterHoursApproved: !en.afterHoursApproved}) : en; });
    }).then(function(updated){ STATE.entries = updated; render(); });

  // approve (as opposed to Approve, which pays it). Also a toggle, mirroring Approve/

  // pending. Only ever shown alongside Approve (both require pendingMs>0), so
  // afterHoursApproved is already false whenever this fires; clearing it here is just a
  // safety net in case that assumption ever changes.
  function onLogIgnoreAfterHours(id){

  var EXPORT_HEADER = ['Date','Employee','Job','Clock In','Clock Out','Hours','Quote Hours','Entered By','Tasks Completed'];
  function buildExportRows(){
    var payable = computePayableMap();

      var p = payable[en.id] || {hoursMs:0, quoteMs:0};
      return [fmtDateShort(en.clockIn), en.employeeName, en.jobName, fmtTime(en.clockIn), en.clockOut?fmtTime(en.clockOut):'active',
        en.clockOut ? msToHoursStr(p.hoursMs) : '',
        p.quoteMs>0?msToHoursStr(p.quoteMs):'0.00', en.enteredBy||'', (en.completedTasks||[]).join('; ')];
    });

  // Row shape for the lanko-sheet-bridge Apps Script (not the human-readable CSV
  // export): [entryId, clockInISO, employee, job, inTime, outTime, regHrs, ahHrs,
  // quoteHrs, enteredBy, tasks, flagged]. This 12-column shape (and the meaning of each
  // position) is kept EXACTLY as before, even though the regular/after-hours split was
  // retired in the app - the TimeEntries sheet, Payroll tab, and Time by Job tab all
  // still read column G as "hours" and column H positionally, and Payroll's formulas
  // sum G+H per day. ahHrs is hardcoded to 0 here on purpose so those sheet formulas
  // keep working untouched - regHrs alone now carries the full worked (rounded) hours.
  // Dates must stay real ISO strings - the script's toDate() keys off the
  // 'YYYY-MM-DD' prefix - rather than the display-formatted strings buildExportRows
  // produces for the CSV.
  function buildSheetSyncRows(){
    var payable = computePayableMap();
    return getFilteredEntries().map(function(en){
      var p = payable[en.id] || {hoursMs:0, quoteMs:0};
      return [en.id, en.clockIn, en.employeeName, en.jobName, fmtTime(en.clockIn), en.clockOut?fmtTime(en.clockOut):'',
        en.clockOut ? (p.hoursMs/3600000) : 0, 0, p.quoteMs/3600000,
        en.enteredBy||'', (en.completedTasks||[]).join('; '), !!en.flagged];
    });
  }
  function onLogExport(){
    var csvRows = buildExportRows();
    function csvEscape(v){ var s=String(v); return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
    var csv = [EXPORT_HEADER].concat(csvRows).map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);

    a.href = url; a.download = 'lanko-timeclock_'+STATE.logFrom+'_to_'+STATE.logTo+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

  function onSendToSheet(){
    if(!STATE.sheetWriteUrl) return;
    var rows = buildSheetSyncRows();
    if(rows.length===0){ alert('No entries in the selected date range to send.'); return; }
    if(typeof fetch === 'undefined'){
      STATE.sheetWriteStatus='error'; STATE.sheetWriteError="This tablet's browser doesn't support sending data."; render(); return;
    }
    STATE.sheetWriteStatus = 'sending'; STATE.sheetWriteError = null; render();
    // Two things matter here, worked out by testing directly against a Workspace-restricted
    // Apps Script deployment (script.google.com won't offer a plain "Anyone" access level on
    // a Workspace domain - only "Only myself" / "Anyone within the domain" / "Anyone with a
    // Google account"):
    //  - credentials:'include' is required so the tablet's signed-in Google Workspace session
    //    (cookies for script.google.com) rides along on this cross-origin request - without it
    //    the request never authenticates and silently never reaches doPost.
    //  - mode:'no-cors' is required because script.google.com doesn't return the
    //    Access-Control-Allow-* headers a normal cross-origin fetch needs to let us read the
    //    response - without it the browser throws "Failed to fetch" even though the request
    //    (and the sheet write) already succeeded server-side.
    // The tradeoff: a no-cors response is always "opaque" (status 0, ok:false) by browser
    // design, so we can't tell success from failure from the response itself - only whether the
    // request round-tripped without a network-level throw. Since the server-side write happens
    // before the browser ever blocks reading the response, treating "didn't throw" as success
    // is accurate in practice.
    fetch(STATE.sheetWriteUrl, {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'include',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type: 'syncEntries', from: STATE.logFrom, to: STATE.logTo, rows: rows })
    }).then(function(){
      STATE.sheetWriteStatus = 'ok'; STATE.sheetWriteError = null;
      STATE.sheetWriteLastSentAt = new Date().toISOString();
      return safeSetJSON(K.sheetWrite, {url: STATE.sheetWriteUrl, lastSentAt: STATE.sheetWriteLastSentAt, mileageLastSentAt: STATE.mileageSheetWriteLastSentAt});
    }).then(function(){ render(); })
    .catch(function(){
      STATE.sheetWriteStatus = 'error';
      STATE.sheetWriteError = 'Could not reach the script at all. Double-check the Web App URL, and that this tablet is signed into a lankosystems.com Google account.';
      render();
    });
  }

  var currentPageETag = null;
  var pendingVersionUpdate = false;
  function captureCurrentETag(){
    fetch('kairos.html', {method:'HEAD', cache:'no-store'}).then(function(res){
      currentPageETag = res.headers.get('etag') || res.headers.get('last-modified');
    }).catch(function(){});
  }
  function checkForUpdate(){
    if(!currentPageETag) return;
    fetch('kairos.html', {method:'HEAD', cache:'no-store'}).then(function(res){
      var tag = res.headers.get('etag') || res.headers.get('last-modified');
      if(tag && tag!==currentPageETag) pendingVersionUpdate = true;
    }).catch(function(){});
  }
  function startAutoUpdateWatch(){
    captureCurrentETag();
    setInterval(checkForUpdate, 3*60*1000); // every 3 minutes -- cheap HEAD request, no body
  }
  function startIdleWatch(){
    setInterval(function(){
      if(pendingVersionUpdate && STATE.view==='rack'){ window.location.href = window.location.pathname + '?v=' + Date.now(); return; }
      var idleMs = Date.now() - (STATE.lastInteractionAt||Date.now());
      if((STATE.view==='pin' || STATE.view==='action' || STATE.view==='adminpin' || STATE.view==='newpin') && idleMs>60000){ resetToRack(); }
      else if(STATE.view==='tasks' && idleMs>90000){ resetToRack(); }
      else if(STATE.view==='manualentry' && idleMs>180000){ resetToRack(); }
      else if(STATE.view==='myhistory' && idleMs>150000){ resetToRack(); }
      else if(STATE.view==='admin' && idleMs>300000){ resetToRack(); }
      if(!STATE.screensaverActive && STATE.view==='rack' && idleMs>SCREENSAVER_IDLE_MS) activateScreensaver();
    }, 4000);
  }

    }, 300000);
  }
  function startTaskSourceSync(){
    setInterval(function(){
      if(STATE.taskSource) syncTasksFromSheet(false);
    }, 300000);
  }

  // Alberta/Canada vote-day theme window - auto on/off by date, no manual revert needed.
  // Ends 1:00 AM Wednesday Oct 21, 2026 (local/tablet time).
  function updateVoteDayTheme(){
    var end = new Date(2026, 9, 21, 1, 0, 0);
    var active = new Date() < end;
    document.documentElement.classList.toggle('lanko-voteday-theme', active);
    return active;
  }

  function boot(){
    updateVoteDayTheme();
    setInterval(updateVoteDayTheme, 60000);
    STATE.lastInteractionAt = Date.now();
    document.body.addEventListener('click', onBodyClick);
    document.body.addEventListener('pointerdown', function(){ STATE.lastInteractionAt=Date.now(); });
    document.body.addEventListener('input', function(){ STATE.lastInteractionAt=Date.now(); });
    document.body.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){
        var el = document.activeElement;
        if(el && el.dataset && el.dataset.action){ e.preventDefault(); el.click(); }
      }
    });
    startClock();
    render();
    firebaseAuthReady.then(function(){
      return loadAll();
    }).then(function(){
      STATE.view = STATE.adminPin ? 'rack' : 'setup';
      render();
      startSharedDataListeners();
      startMinervaScheduleListener();
      startKuberaQuoteListener();
      startOdinConstraintsListener();
      startIdleWatch();
      startAutoUpdateWatch();
      startJobSourceSync();
      startOfficeJobSourceSync();
      startEmployeeSourceSync();
      startTaskSourceSync();
      if(STATE.jobSource) syncJobsFromSheet(false);
      if(STATE.officeJobSource) syncOfficeJobsFromSheet(false);
      if(STATE.employeeSource) syncEmployeesFromSheet(false);
      if(STATE.taskSource) syncTasksFromSheet(false);
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
