        counterBlock = '<div style="margin-top:6px;font-size:13px;color:#797979;">'+esc(r.adminNote)+'</div>';
      }
      return '<div style="padding:12px 0;border-top:1px solid var(--line);">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">'+
          '<div><b>'+esc(fmtYmdRange(r.from,r.to))+'</b> &middot; '+esc(timeOffTypeLabel(r.type))+
          ' <span style="color:#797979;">('+ymdNights(r.from,r.to)+' day'+(ymdNights(r.from,r.to)===1?'':'s')+')</span></div>'+
          timeOffStatusBadge(r)+
        '</div>'+
        (r.note?'<div style="margin-top:4px;color:#797979;font-size:13px;">'+esc(r.note)+'</div>':'')+

    return '<div class="action-view"><span class="backlink" data-action="timeoff-cancel">&larr; Back</span>'+
      '<div class="action-view-scroll">'+
      '<div class="status-hero"><p class="greetname">Request time off</p><p class="statusline">'+esc(emp.name)+'</p></div>'+
      (STATE.timeOffSavedMsg?'<div class="formerr" style="color:var(--olive);font-weight:600;">&#10003; '+esc(STATE.timeOffSavedMsg)+'</div>':'')+
      formHtml+
      '<div class="admin-section-head" style="margin-top:24px;"><h2>Your requests</h2></div>'+

  function renderMyHistory(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ STATE.view='rack'; return renderRack(); }
    var days = STATE.historyRangeDays || 14;
    var payable = computePayableMap();
    var myEntries = getMyRecentEntries(emp.id, days);

    var rangeBtns = [7,14,30].map(function(d){
      return '<button class="iconbtn" style="'+(days===d?'background:var(--oxblood);color:#fff;':'')+'" data-action="history-range" data-id="'+d+'">'+d+' days</button>';
    }).join('');

    var totalMs = 0;
    var rows = myEntries.map(function(en){
      var p = payable[en.id] || {regularMs:0, afterHoursMs:0, quoteMs:0};
      totalMs += p.regularMs + p.afterHoursMs;
      var hoursStr = en.clockOut ? fmtDuration(p.regularMs) : 'active';
      if(p.afterHoursMs>0) hoursStr += ' <span style="color:var(--rust);">+'+fmtDuration(p.afterHoursMs)+' AH</span>';
      var flagRow;
      if(en.flagged){
        flagRow = '<div style="margin-top:8px;padding:8px 10px;background:#fff3e0;border-radius:8px;font-size:12px;color:var(--rust);">'+
          '&#9873; Reported: '+esc(en.flagNote||'')+
          ' <button class="iconbtn" data-action="history-flag-withdraw" data-id="'+en.id+'" style="margin-left:8px;">Withdraw</button></div>';
      } else if(STATE.historyFlagOpenId===en.id){
        flagRow = '<div style="margin-top:8px;">'+
          '<textarea id="historyFlagNoteInput" rows="2" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;padding:8px;border-radius:8px;border:1px solid var(--line);" placeholder="What looks wrong?"></textarea>'+
          (STATE.historyFlagError?'<div class="formerr">'+esc(STATE.historyFlagError)+'</div>':'')+
          '<div class="formbtns"><button class="save" data-action="history-flag-submit" data-id="'+en.id+'">Submit</button>'+
          '<button class="cancel" data-action="history-flag-cancel">Cancel</button></div></div>';
      } else {
        flagRow = '<button class="iconbtn" data-action="history-flag-open" data-id="'+en.id+'" style="margin-top:8px;">Report a problem</button>';
      }
      return '<div style="padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;font-weight:600;">'+
        '<span>'+fmtDateShort(en.clockIn)+' — '+esc(en.jobName)+'</span><span style="white-space:nowrap;">'+hoursStr+'</span></div>'+
        '<div style="font-size:13px;color:#797979;margin-top:2px;">'+fmtTime(en.clockIn)+' – '+(en.clockOut?fmtTime(en.clockOut):'active')+'</div>'+
        flagRow+
        '</div>';
    }).join('');

    var emailSection = '';
    if(STATE.sheetWriteUrl){
      if(STATE.historyEmailFormOpen){
        emailSection = '<div class="inlineform" style="margin-top:14px;">'+
          '<div class="field" style="flex:1;min-width:200px;"><label>Email address</label>'+
          '<input id="historyEmailInput" type="email" value="'+esc(emp.email||'')+'" placeholder="you@example.com"></div>'+
          (STATE.historyEmailError?'<div class="formerr">'+esc(STATE.historyEmailError)+'</div>':'')+
          '<div class="formbtns"><button class="save" data-action="history-email-send">Send</button>'+
          '<button class="cancel" data-action="history-email-cancel">Cancel</button></div></div>';
      } else {
        var statusText = STATE.historyEmailStatus==='sending' ? 'Sending&hellip;' :
          STATE.historyEmailStatus==='ok' ? '&#10003; Sent! Check your inbox in a minute.' :
          STATE.historyEmailStatus==='error' ? ('&#9888; '+esc(STATE.historyEmailError||'')) : '';
        emailSection = '<div class="actionbtns" style="margin-top:6px;">'+
          '<button class="bigbtn secondary" data-action="history-email-open">Email me this</button></div>'+
          (statusText?'<div style="font-size:13px;margin-top:8px;">'+statusText+'</div>':'');
      }
    }

    return '<div class="action-view"><span class="backlink" data-action="action-cancel">&larr; Back</span>'+
      '<div class="action-view-scroll">'+
      '<div class="status-hero"><p class="greetname">'+esc(emp.name)+'\u2019s history</p>'+
      '<p class="statusline">Last '+days+' days &middot; '+msToHoursStr(totalMs)+'h total</p></div>'+
      '<div style="display:flex;gap:8px;margin-bottom:14px;">'+rangeBtns+'</div>'+
      (rows || '<div class="empty-state">No clocked time in this range.</div>')+
      emailSection+
      '</div></div>';
  }
  function onTimeOffSubmit(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ return; }
    var from = document.getElementById('timeOffFromInput').value;
    var to = document.getElementById('timeOffToInput').value;
    var type = document.getElementById('timeOffTypeInput').value;
    var note = document.getElementById('timeOffNoteInput').value;
    if(!from || !to){ STATE.timeOffFormError='Pick both a start and end date.'; render(); return; }
    if(to < from){ STATE.timeOffFormError='End date can\u2019t be before the start date.'; render(); return; }
    STATE.timeOffFormError=null;
    submitTimeOffRequest(emp, from, to, type, note).then(function(){
      STATE.timeOffSavedMsg = 'Request sent. You\u2019ll see a decision here once an admin reviews it.';
      render();
    });
  }
  function onHistoryFlagSubmit(entryId){
    var noteEl = document.getElementById('historyFlagNoteInput');
    var note = noteEl ? noteEl.value.trim() : '';
    if(!note){ STATE.historyFlagError='Say a little about what looks wrong.'; render(); return; }
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    mutateEntries(function(list){
      return list.map(function(en){ return en.id===entryId ? Object.assign({}, en, {flagged:true, flagNote:note, flaggedAt:new Date().toISOString(), flaggedBy: emp?emp.name:null}) : en; });
    }).then(function(updated){
      STATE.entries = updated; STATE.historyFlagOpenId=null; STATE.historyFlagError=null; render();
    });
  }
  function onHistoryFlagWithdraw(entryId){
    mutateEntries(function(list){
      return list.map(function(en){ return en.id===entryId ? Object.assign({}, en, {flagged:false, flagNote:null, flaggedAt:null, flaggedBy:null}) : en; });
    }).then(function(updated){ STATE.entries = updated; render(); });
  }
  function onEmailHistory(){
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp || !STATE.sheetWriteUrl) return;
    var emailInput = document.getElementById('historyEmailInput');
    var email = (emailInput ? emailInput.value.trim() : (emp.email||''));
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ STATE.historyEmailError='Enter a valid email address.'; render(); return; }

    var days = STATE.historyRangeDays || 14;
    var myEntries = getMyRecentEntries(emp.id, days);
    var payable = computePayableMap();
    var totalMs = 0;
    var lines = myEntries.map(function(en){
      var p = payable[en.id] || {regularMs:0, afterHoursMs:0};
      totalMs += p.regularMs + p.afterHoursMs;
      var hrs = en.clockOut ? msToHoursStr(p.regularMs) : 'active';
      var ah = p.afterHoursMs>0 ? ' (+'+msToHoursStr(p.afterHoursMs)+'h after-hours)' : '';
      return fmtDateShort(en.clockIn)+'  '+en.jobName+'  '+fmtTime(en.clockIn)+'-'+(en.clockOut?fmtTime(en.clockOut):'active')+'  '+hrs+'h'+ah;
    });
    var body = 'Time clock history for '+emp.name+' (last '+days+' days)\n\n'+
      (lines.length?lines.join('\n'):'No clocked time in this range.')+'\n\nTotal: '+msToHoursStr(totalMs)+'h';

    STATE.historyEmailStatus = 'sending'; STATE.historyEmailError = null; render();
    var saveEmailPromise = (email !== (emp.email||'')) ?
      mutateLocal(K.employees, STATE.employees, function(list){
        return list.map(function(e){ return e.id===emp.id ? Object.assign({}, e, {email:email}) : e; });
      }).then(function(updated){ STATE.employees = updated; }) : Promise.resolve();

    saveEmailPromise.then(function(){
      return fetch(STATE.sheetWriteUrl, {
        method: 'POST',
        mode: 'no-cors',
        credentials: 'include',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type:'sendEmail', to: email, subject: 'Your Kairos time clock history', body: body })
      });
    }).then(function(){
      STATE.historyEmailStatus = 'ok'; STATE.historyEmailError = null; STATE.historyEmailFormOpen = false;
      render();
    }).catch(function(){
      STATE.historyEmailStatus = 'error';
      STATE.historyEmailError = 'Could not reach the script. Ask your admin to check the Google Sheet setup.';
      render();
    });
  }

  function onTasksConfirm(){
    var names = STATE.tasks.filter(function(t){ return STATE.selectedTasks.indexOf(t.id)!==-1; }).map(function(t){ return t.name; });
    var action = STATE.pendingAction;
    STATE.selectedTasks = [];
    STATE.pendingAction = null;
    if(!action){ resetToRack(); return; }
    if(action.type==='clockout'){
      doClockOut(names);
    } else if(action.type==='transfer'){
      STATE.pendingTaskNames = names;
      STATE.actionMode = 'transfer';
      STATE.view = 'action';
      render();
    }
  }

  function resetToRack(){
    STATE.view='rack'; STATE.selectedEmployeeId=null; STATE.actionMode=null; STATE.pinBuffer=''; STATE.pinError=false;

  function doClockIn(jobId){
    if(STATE.busy) return; STATE.busy=true;
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    var job = STATE.jobs.find(function(j){ return j.id===jobId; });
    if(!emp||!job){ STATE.busy=false; return; }
    var nowIso = new Date().toISOString();
    var entry = { id:uid('ent'), employeeId:emp.id, employeeName:emp.name, jobId:job.id, jobName:job.name, clockIn:nowIso, clockOut:null, completedTasks:[] };
    // Checked against the list as it stands right now, before this entry joins it - otherwise
    // the new entry would always match itself and "first entry today" would mean nothing.
    var flagLate = STATE.lateAlertEnabled && isFirstEntryToday(emp.id, nowIso) && isLateArrival(nowIso);
    mutateEntries(function(list){ return list.concat([entry]); }).then(function(updated){
      STATE.entries = updated; STATE.busy=false;
      if(flagLate) showLateAlert(emp, nowIso); else showStamp('in', 'Clocked in', job.name);
    });
  }
  function doTransfer(newJobId, completedTasks){
    if(STATE.busy) return; STATE.busy=true;
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    var job = STATE.jobs.find(function(j){ return j.id===newJobId; });
    if(!emp||!job){ STATE.busy=false; return; }
    var now = new Date().toISOString();
    mutateEntries(function(list){
      var updated = list.map(function(en){
        return (en.employeeId===emp.id && !en.clockOut) ? Object.assign({}, en, {clockOut:now, completedTasks: completedTasks||[]}) : en;
      });
      updated.push({ id:uid('ent'), employeeId:emp.id, employeeName:emp.name, jobId:job.id, jobName:job.name, clockIn:now, clockOut:null, completedTasks:[] });
      return updated;
    }).then(function(updated){
      STATE.entries = updated; STATE.busy=false; showStamp('transfer', 'Transferred', job.name);
      pushDayForEmployee(emp.id, now);
    });
  }
  function doClockOut(completedTasks){
    if(STATE.busy) return; STATE.busy=true;
    var emp = STATE.employees.find(function(e){ return e.id===STATE.selectedEmployeeId; });
    if(!emp){ STATE.busy=false; return; }
    var now = new Date().toISOString();
    mutateEntries(function(list){
      return list.map(function(en){
        return (en.employeeId===emp.id && !en.clockOut) ? Object.assign({}, en, {clockOut:now, completedTasks: completedTasks||[]}) : en;
      });
    }).then(function(updated){
      STATE.entries = updated; STATE.busy=false; showStamp('out', 'Clocked out', null);
      pushDayForEmployee(emp.id, now);
    });
  }

  function getFilteredEntries(){
    var from = STATE.logFrom || todayStr();
    var to = STATE.logTo || todayStr();
    var fromTime = new Date(from+'T00:00:00').getTime();
    var toTime = new Date(to+'T23:59:59').getTime();
    return STATE.entries.filter(function(en){
      var t = new Date(en.clockIn).getTime();
      return t>=fromTime && t<=toTime;
    }).sort(function(a,b){ return new Date(b.clockIn)-new Date(a.clockIn); });
  }

  var TIME_OFF_TYPE_COLOR = {vacation:'var(--olive)', sick:'var(--rust)', personal:'var(--gold-dim)', other:'#8b8d8f'};

  function renderTimeOffActorPicker(){
    return '<div style="margin-bottom:16px;">'+
      '<span style="font-family:var(--display-text);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#797979;margin-right:10px;">Acting as</span>'+

  function renderTimeOffCalendar(){
    var monthDate = timeOffCalMonthDate();
    var year = monthDate.getFullYear(), month0 = monthDate.getMonth();
    var approved = approvedTimeOffCoveringMonth(year, month0);
    var firstWeekday = new Date(year, month0, 1).getDay();
    var daysInMonth = new Date(year, month0+1, 0).getDate();
    var cells = [];
    for(var i=0;i<firstWeekday;i++) cells.push('<div class="timeoff-cal-cell empty"></div>');
    for(var d=1; d<=daysInMonth; d++){
      var ymd = dateKeyLocal(new Date(year, month0, d));
      var chips = approved.filter(function(r){ return r.from<=ymd && r.to>=ymd; })
        .map(function(r){
          var first = r.employeeName.split(' ')[0];
          return '<div class="timeoff-chip" style="background:'+(TIME_OFF_TYPE_COLOR[r.type]||'#8b8d8f')+';" title="'+esc(r.employeeName+' - '+timeOffTypeLabel(r.type))+'">'+esc(first)+'</div>';
        }).join('');
      cells.push('<div class="timeoff-cal-cell"><div class="timeoff-cal-daynum">'+d+'</div>'+chips+'</div>');
    }
    var weekHead = ['S','M','T','W','T','F','S'].map(function(w){ return '<div class="timeoff-cal-cell head">'+w+'</div>'; }).join('');
    return '<div class="timeoff-cal">'+
      '<div class="timeoff-cal-nav">'+
        '<button class="iconbtn" data-action="timeoff-cal-prev">&larr;</button>'+
        '<b>'+esc(monthDate.toLocaleDateString([], {month:'long', year:'numeric'}))+'</b>'+
        '<button class="iconbtn" data-action="timeoff-cal-next">Next &rarr;</button>'+
      '</div>'+
      '<div class="timeoff-cal-grid">'+weekHead+cells.join('')+'</div>'+
      (approved.length===0?'<p class="settingsnote" style="margin-top:10px;">No approved time off on the calendar this month.</p>':'')+
      '</div>';
  }
  function renderTimeOffCounterForm(r){

      '<div class="field"><label>New from</label><input id="timeOffCounterFrom_'+r.id+'" type="date" value="'+esc(r.from)+'"></div>'+

  function renderLogTab(){
    if(!STATE.logFrom) STATE.logFrom = todayStr();
    if(!STATE.logTo) STATE.logTo = todayStr();
    var rows = getFilteredEntries();
    var payable = computePayableMap();

    // Flagged entries matter regardless of whatever date range happens to be selected, so
    // this scans the full entry list (not just `rows`) and always surfaces every open flag.
    var flaggedEntries = STATE.entries.filter(function(en){ return en.flagged; })
      .sort(function(a,b){ return new Date(b.flaggedAt||0)-new Date(a.flaggedAt||0); });
    var flaggedBanner = '';
    if(flaggedEntries.length){
      flaggedBanner = '<div style="background:#fff3e0;border:1px solid #f0c987;border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
        '<div style="font-weight:700;color:var(--rust);margin-bottom:8px;">&#9873; '+flaggedEntries.length+' entr'+(flaggedEntries.length===1?'y':'ies')+' flagged for review</div>'+
        flaggedEntries.map(function(en){
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #f0c987;">'+
            '<div style="font-size:13px;"><b>'+esc(en.employeeName)+'</b> — '+fmtDateShort(en.clockIn)+', '+esc(en.jobName)+
            '<div style="color:#797979;margin-top:2px;">"'+esc(en.flagNote||'')+'"</div></div>'+
            '<div style="white-space:nowrap;"><button class="iconbtn" data-action="log-edit" data-id="'+en.id+'">Edit entry</button>'+
            '<button class="iconbtn" data-action="log-resolve-flag" data-id="'+en.id+'">Resolve</button></div></div>';
        }).join('')+
        '</div>';
    }

    var totalsByEmp = {};
    rows.forEach(function(en){
      var p = payable[en.id] || {regularMs:0, afterHoursMs:0, quoteMs:0};
      var t = totalsByEmp[en.employeeName] = totalsByEmp[en.employeeName] || {regularMs:0, afterHoursMs:0, quoteMs:0};
      t.regularMs += p.regularMs; t.afterHoursMs += p.afterHoursMs; t.quoteMs += (p.quoteMs||0);
    });
    var totalsHtml = Object.keys(totalsByEmp).sort().map(function(name){
      var t = totalsByEmp[name];
      var ah = t.afterHoursMs>0 ? ' <span style="font-size:12px;color:var(--rust);font-weight:600;">+'+msToHoursStr(t.afterHoursMs)+'h AH</span>' : '';
      var qt = t.quoteMs>0 ? ' <span style="font-size:12px;color:var(--gold-dim);font-weight:600;">('+msToHoursStr(t.quoteMs)+'h quotes)</span>' : '';
      return '<div class="summary-card"><div class="n">'+msToHoursStr(t.regularMs)+'h'+ah+qt+'</div><div class="l">'+esc(name)+'</div></div>';
    }).join('') || '<div class="empty-state" style="padding:14px;">No entries in this range.</div>';

    var tableRows = rows.map(function(en){
      if(STATE.editingEntryId===en.id){
        return '<tr><td colspan="9"><div class="inlineform" style="margin:0;">'+
          '<div class="field"><label>Job</label><select id="logJobSelect">'+
          STATE.jobs.map(function(j){ return '<option value="'+j.id+'" '+(j.id===en.jobId?'selected':'')+'>'+esc(j.name)+'</option>'; }).join('')+
          '</select></div>'+
          '<div class="field"><label>Clock in</label><input id="logInInput" type="datetime-local" value="'+toLocalInputVal(en.clockIn)+'"></div>'+
          '<div class="field"><label>Clock out</label><input id="logOutInput" type="datetime-local" value="'+(en.clockOut?toLocalInputVal(en.clockOut):'')+'"></div>'+
          (STATE.logEditError?'<div class="formerr">'+esc(STATE.logEditError)+'</div>':'')+
          '<div class="formbtns"><button class="save" data-action="log-save-edit" data-id="'+en.id+'">Save</button>'+
          '<button class="cancel" data-action="log-cancel-edit">Cancel</button></div></div></td></tr>';
      }
      var p = payable[en.id] || {regularMs:0, afterHoursMs:0, quoteMs:0};
      var regStr = en.clockOut ? fmtDuration(p.regularMs) : 'active';
      if(p.quoteMs>0) regStr += ' <span style="color:var(--gold-dim);font-weight:600;">(quote)</span>';
      var ahStr = p.afterHoursMs>0 ? fmtDuration(p.afterHoursMs) : '—';
      var taskStr = (en.completedTasks && en.completedTasks.length) ? esc(en.completedTasks.join(', ')) : '<span style="color:#c4bba5;">—</span>';
      var enteredByStr = en.enteredBy ? '<div style="font-size:11px;color:#797979;margin-top:2px;">via '+esc(en.enteredBy)+'</div>' : '';
      var flagStr = en.flagged ? '<div style="font-size:11px;color:var(--rust);font-weight:600;margin-top:2px;">&#9873; '+esc(en.flagNote||'Flagged')+'</div>' : '';
      return '<tr'+(en.flagged?' style="background:#fff8ec;"':'')+'><td>'+fmtDateShort(en.clockIn)+'</td><td>'+esc(en.employeeName)+enteredByStr+'</td><td>'+esc(en.jobName)+'</td>'+
        '<td>'+fmtTime(en.clockIn)+'</td><td>'+(en.clockOut?fmtTime(en.clockOut):'— active')+'</td><td>'+regStr+'</td><td>'+ahStr+'</td>'+
        '<td style="max-width:220px;">'+taskStr+flagStr+'</td>'+
        '<td><button class="iconbtn" data-action="log-edit" data-id="'+en.id+'">Edit</button>'+
        (en.flagged?'<button class="iconbtn" data-action="log-resolve-flag" data-id="'+en.id+'">Resolve</button>':'')+
        '<button class="iconbtn danger" data-action="log-delete" data-id="'+en.id+'">Delete</button></td></tr>';
    }).join('');

    return '<div class="admin-section-head"><h2>Daily Log</h2></div>'+
      flaggedBanner+
      '<div class="logfilters">'+
      '<div class="field"><label>From</label><input id="logFromInput" type="date" value="'+STATE.logFrom+'"></div>'+
      '<div class="field"><label>To</label><input id="logToInput" type="date" value="'+STATE.logTo+'"></div>'+
      '<button class="addbtn" data-action="log-run">Update</button>'+
      '<button class="addbtn" style="background:var(--card);color:var(--oxblood);border:1px solid var(--line);" data-action="log-export">Export CSV</button>'+
      '</div>'+
      renderSheetWritePanel()+
      '<div class="subhead">Hours by employee (regular, + after-hours where worked)</div>'+
      '<div class="summary-cards">'+totalsHtml+'</div>'+
      '<div class="subhead">Entries — times shown as clocked; hours are rounded to 15-min increments per the shift/lunch/quitting-time rules</div>'+
      (rows.length===0?'<div class="empty-state">No time entries in this range.</div>':
        '<table class="datatable"><thead><tr><th>Date</th><th>Employee</th><th>Job</th><th>In</th><th>Out</th><th>Regular</th><th>After-hrs</th><th>Tasks completed</th><th>Actions</th></tr></thead><tbody>'+tableRows+'</tbody></table>');
  }

  var EXPORT_HEADER = ['Date','Employee','Job','Clock In','Clock Out','Regular Hours','After-Hours','Quote Hours','Entered By','Tasks Completed'];

  /* ---------------- Google Sheet push ----------------
     The workbook is the payroll and job-costing side of the house; Firestore stays the
     system of record. Three things shape this code and none of them are obvious:

     1. mode:'no-cors' means the tablet can NEVER read the response, so it cannot know
        whether a push landed. Rather than pretend otherwise, every row carries its entry
        id and the Apps Script upserts on it - so resending is free and harmless. Pushing
        on clock-out gives freshness; the periodic sweep below gives correctness, and is
        what repairs a push that shop wifi swallowed.
     2. computePayableMap rounds the LAST clock-out of a day and subtracts the lunch
        window, so one entry's hours change when a later entry the same day appears.
        Pushing a single entry would therefore write numbers that later go stale, so we
        always push that person's whole day and let the upsert correct the earlier rows.
     3. Still-open entries are skipped entirely. A half-finished shift in a payroll tab is
        worse than a missing one; it gets written when it closes. */
  var SHEET_HEADER = ['Entry ID','Date','Employee','Job','Clock In','Clock Out',
    'Regular Hours','After-Hours','Quote Hours','Entered By','Tasks Completed','Flagged'];
  var SWEEP_DAYS = 14;
  var SWEEP_INTERVAL_MS = 15*60*1000;

  function buildSheetRows(entries){
    var payable = computePayableMap();
    return entries.filter(function(en){ return !!en.clockOut; }).map(function(en){
      var p = payable[en.id] || {regularMs:0, afterHoursMs:0, quoteMs:0};
      return [en.id, dateKeyLocal(new Date(en.clockIn)), en.employeeName, en.jobName,
        fmtTime(en.clockIn), fmtTime(en.clockOut),
        msToHoursStr(p.regularMs), msToHoursStr(p.afterHoursMs), msToHoursStr(p.quoteMs),
        en.enteredBy||'', (en.completedTasks||[]).join('; '), en.flagged?1:0];
    });
  }
  // Fire-and-forget by design - see note 1 above. Never rejects, so a dead sheet link can
  // never block or break a clock-out; the shop floor keeps working regardless.
  function pushToSheet(payload){
    if(!STATE.sheetWriteUrl || typeof fetch === 'undefined') return Promise.resolve(false);
    return fetch(STATE.sheetWriteUrl, {
      method: 'POST', mode: 'no-cors', credentials: 'include',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(){ return true; })
      .catch(function(err){ console.error('sheet push failed', err); return false; });
  }
  function pushDayForEmployee(empId, whenISO){
    if(!STATE.sheetWriteUrl) return Promise.resolve(false);
    var key = dateKeyLocal(new Date(whenISO));
    var rows = buildSheetRows(STATE.entries.filter(function(en){
      return en.employeeId===empId && dateKeyLocal(new Date(en.clockIn))===key;
    }));
    if(!rows.length) return Promise.resolve(false);
    return pushToSheet({ type:'upsertEntries', rows: rows });
  }
  /* Reconcile the trailing window: the script deletes any in-window sheet row whose id is
     absent from this payload, which is how an entry deleted or re-dated in the Daily Log
     stops being paid. That deletion is exactly why the empty guard below matters - sweeping
     before Firestore has loaded would send zero rows and wipe two weeks of payroll. */
  function sweepToSheet(){
    if(!STATE.sheetWriteUrl) return Promise.resolve(false);
    if(!STATE.entries || !STATE.entries.length) return Promise.resolve(false);
    var now = new Date();
    var fromKey = dateKeyLocal(new Date(now.getTime() - SWEEP_DAYS*86400000));
    var toKey = dateKeyLocal(now);
    // YYYY-MM-DD sorts lexicographically, so plain string compares are safe here.
    var rows = buildSheetRows(STATE.entries.filter(function(en){
      var k = dateKeyLocal(new Date(en.clockIn));
      return k >= fromKey && k <= toKey;
    }));
    return pushToSheet({ type:'syncEntries', from: fromKey, to: toKey, rows: rows })
      .then(function(ok){
        if(ok){
          STATE.sheetWriteLastSentAt = new Date().toISOString();
          safeSetJSON(K.sheetWrite, {url: STATE.sheetWriteUrl, lastSentAt: STATE.sheetWriteLastSentAt});
        }
        return ok;
      });
  }
  function buildExportRows(){
    var payable = computePayableMap();
    return getFilteredEntries().map(function(en){
      var p = payable[en.id] || {regularMs:0, afterHoursMs:0, quoteMs:0};
      return [fmtDateShort(en.clockIn), en.employeeName, en.jobName, fmtTime(en.clockIn), en.clockOut?fmtTime(en.clockOut):'active',
        en.clockOut ? msToHoursStr(p.regularMs) : '', p.afterHoursMs>0?msToHoursStr(p.afterHoursMs):'0.00',
        p.quoteMs>0?msToHoursStr(p.quoteMs):'0.00', en.enteredBy||'', (en.completedTasks||[]).join('; ')];
    });
  }

    var csv = [EXPORT_HEADER].concat(csvRows).map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');

  function onSendToSheet(){
    if(!STATE.sheetWriteUrl) return;
    // Sends the Daily Log's own date range as a reconcile, so the button now means
    // "make the sheet match Kairos for these dates" rather than "append these rows
    // again" - pressing it twice is a no-op instead of a duplicate payroll week.
    var rows = buildSheetRows(getFilteredEntries());
    if(rows.length===0){ alert('No completed entries in the selected date range to send.'); return; }
    // Mirror getFilteredEntries' own fallback exactly. The window tells the script which
    // rows it may delete, so a window wider than the rows actually sent would quietly
    // delete real shifts.
    var sendFrom = STATE.logFrom || todayStr(), sendTo = STATE.logTo || todayStr();
    if(typeof fetch === 'undefined'){
      STATE.sheetWriteStatus='error'; STATE.sheetWriteError="This tablet's browser doesn't support sending data."; render(); return;
    }
    STATE.sheetWriteStatus = 'sending'; STATE.sheetWriteError = null; render();
    // Two things matter here, worked out by testing directly against a Workspace-restricted
    // Apps Script deployment (script.google.com won't offer a plain "Anyone" access level on
    // a Workspace domain - only "Only myself" / "Anyone within the domain" / "Anyone with a
    // Google account"):
    //  - credentials:'include' is required so the tablet's signed-in Google Workspace session
    //    (cookies for script.google.com) rides along on this cross-origin request - without it
    //    the request never authenticates and silently never reaches doPost.
    //  - mode:'no-cors' is required because script.google.com doesn't return the
    //    Access-Control-Allow-* headers a normal cross-origin fetch needs to let us read the
    //    response - without it the browser throws "Failed to fetch" even though the request
    //    (and the sheet write) already succeeded server-side.
    // The tradeoff: a no-cors response is always "opaque" (status 0, ok:false) by browser
    // design, so we can't tell success from failure from the response itself - only whether the
    // request round-tripped without a network-level throw. Since the server-side write happens
    // before the browser ever blocks reading the response, treating "didn't throw" as success
    // is accurate in practice.
    fetch(STATE.sheetWriteUrl, {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'include',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type:'syncEntries', from: sendFrom, to: sendTo,
        header: SHEET_HEADER, rows: rows })
    }).then(function(){
      STATE.sheetWriteStatus = 'ok'; STATE.sheetWriteError = null;
      STATE.sheetWriteLastSentAt = new Date().toISOString();
      return safeSetJSON(K.sheetWrite, {url: STATE.sheetWriteUrl, lastSentAt: STATE.sheetWriteLastSentAt});
    }).then(function(){ render(); })
    .catch(function(){
      STATE.sheetWriteStatus = 'error';
      STATE.sheetWriteError = 'Could not reach the script at all. Double-check the Web App URL, and that this tablet is signed into a lankosystems.com Google account.';
      render();
    });
  }
  function onAdminSavePin(){
    var p1 = document.getElementById('newAdminPin1').value.trim();
    var p2 = document.getElementById('newAdminPin2').value.trim();
    if(!/^\d{4}$/.test(p1)){ STATE.settingsError='PIN must be 4 digits.'; render(); return; }
    if(p1!==p2){ STATE.settingsError="PINs don't match."; render(); return; }
    STATE.adminPin = p1;
    safeSetJSON(K.adminPin, p1).then(function(){ STATE.settingsError=null; render(); });
  }

  /* ---------------- dispatcher ---------------- */
  function onBodyClick(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    STATE.lastInteractionAt = Date.now();

    switch(action){
      case 'open-employee': STATE.selectedEmployeeId=id; STATE.pinBuffer=''; STATE.pinError=false; STATE.pinAttempts=0; STATE.view='pin'; render(); break;
      case 'open-gear': STATE.adminPinBuffer=''; STATE.adminPinError=false; STATE.view='adminpin'; render(); break;
      case 'dismiss-late-alert': dismissLateAlert(); break;
      case 'toggle-late-alert':
        STATE.lateAlertEnabled = !STATE.lateAlertEnabled;
        safeSetJSON(K.lateAlert, STATE.lateAlertEnabled); render();
        break;

      case 'pin-digit': onPinDigit(id); break;
      case 'pin-back': STATE.pinBuffer=STATE.pinBuffer.slice(0,-1); STATE.pinError=false; render(); break;
      case 'pin-cancel': resetToRack(); break;

      case 'newpin-digit': onNewPinDigit(id); break;
      case 'newpin-back': STATE.newPinBuffer=STATE.newPinBuffer.slice(0,-1); render(); break;

      case 'action-cancel': resetToRack(); break;
      case 'select-job-clockin': doClockIn(id); break;
      case 'show-transfer': openTaskSelect({type:'transfer'}); break;
      case 'back-to-status': STATE.actionMode=null; STATE.pendingTaskNames=null; render(); break;
      case 'select-job-transfer': doTransfer(id, STATE.pendingTaskNames); break;
      case 'do-clockout': openTaskSelect({type:'clockout'}); break;

      case 'open-manual-entry': STATE.view='manualentry'; STATE.manualEntryError=null; STATE.manualEntrySavedName=null; render(); break;

      case 'open-history':
        STATE.view='myhistory'; STATE.historyFlagOpenId=null; STATE.historyFlagError=null;
        STATE.historyEmailFormOpen=false; STATE.historyEmailStatus='idle'; STATE.historyEmailError=null;
        render(); break;
      case 'history-range': STATE.historyRangeDays = parseInt(id,10)||14; render(); break;
      case 'history-flag-open': STATE.historyFlagOpenId=id; STATE.historyFlagError=null; render(); break;
      case 'history-flag-cancel': STATE.historyFlagOpenId=null; STATE.historyFlagError=null; render(); break;
      case 'history-flag-submit': onHistoryFlagSubmit(id); break;
      case 'history-flag-withdraw': onHistoryFlagWithdraw(id); break;
      case 'open-timeoff': STATE.view='timeoff'; STATE.timeOffFormError=null; STATE.timeOffSavedMsg=null; render(); break;
      case 'timeoff-cancel': STATE.view='action'; render(); break;
      case 'timeoff-submit': onTimeOffSubmit(); break;
      case 'timeoff-accept-counter':
        employeeRespondToCounter(id, true).then(function(){ STATE.timeOffSavedMsg='Dates confirmed.'; render(); });
        break;
      case 'timeoff-decline-counter':
        employeeRespondToCounter(id, false).then(function(){ STATE.timeOffSavedMsg='Counter-offer declined.'; render(); });
        break;
      case 'timeoff-set-actor': STATE.timeOffActor = id; render(); break;
      case 'timeoff-cal-prev': STATE.timeOffCalMonth = addMonths(timeOffCalMonthDate(), -1); render(); break;
      case 'timeoff-cal-next': STATE.timeOffCalMonth = addMonths(timeOffCalMonthDate(), 1); render(); break;
      case 'timeoff-admin-approve':
        if(!requireTimeOffActor()) break;
        decideTimeOff(id, {status:'approved', decidedBy:STATE.timeOffActor, adminNote:null}).then(render);
        break;
      case 'timeoff-admin-reject': onTimeOffAdminReject(id); break;
      case 'timeoff-admin-counter-open':
        if(!requireTimeOffActor()) break;
        STATE.timeOffCounterOpenId = id; STATE.timeOffCounterError=null; render();
        break;
      case 'timeoff-admin-counter-cancel': STATE.timeOffCounterOpenId=null; STATE.timeOffCounterError=null; render(); break;
      case 'timeoff-admin-counter-submit': onTimeOffAdminCounterSubmit(id); break;
      case 'history-email-open': STATE.historyEmailFormOpen=true; STATE.historyEmailStatus='idle'; STATE.historyEmailError=null; render(); break;
      case 'history-email-cancel': STATE.historyEmailFormOpen=false; STATE.historyEmailError=null; render(); break;
      case 'history-email-send': onEmailHistory(); break;
      case 'manualentry-back': STATE.view='action'; STATE.manualEntryError=null; STATE.manualEntrySavedName=null; render(); break;
      case 'manualentry-save': onManualEntrySave(); break;

      case 'task-toggle': onTaskToggle(id); break;
      case 'tasks-cancel': onTasksCancel(); break;
      case 'tasks-confirm': onTasksConfirm(); break;

      case 'adminpin-digit': onAdminPinDigit(id); break;
      case 'adminpin-back': STATE.adminPinBuffer=STATE.adminPinBuffer.slice(0,-1); STATE.adminPinError=false; render(); break;
      case 'adminpin-cancel': STATE.view='rack'; render(); break;

      case 'exit-admin': resetToRack(); break;
      case 'admin-tab': STATE.adminTab=id; STATE.employeeFormOpen=false; STATE.jobFormOpen=false; STATE.taskFormOpen=false; STATE.editingEntryId=null; STATE.rolloffMsg=null; STATE.timeOffCounterOpenId=null; STATE.timeOffCounterError=null; render(); break;
      case 'admin-run-rolloff':
      case 'admin-run-rolloff-anyway':
        if(STATE.rolloffBusy) break;
        STATE.rolloffBusy = true; STATE.rolloffMsg = null; render();
        runEntryRolloff().then(function(r){
          STATE.rolloffBusy = false;
          STATE.rolloffMsg = r.moved
            ? { ok:true, text: r.moved + ' entr' + (r.moved===1?'y':'ies') + ' moved to the archive. ' + r.kept + ' still live.' }
            : { ok:true, text: 'Nothing was old enough to move.' };
          render();
        }).catch(function(e){
          console.error('roll-off failed', e);
          STATE.rolloffBusy = false;
          STATE.rolloffMsg = { ok:false, text: (e && e.message) ? e.message : 'The roll-off did not finish. Nothing was removed from the live entries.' };
          render();
        });
        break;

      case 'admin-emp-new': STATE.employeeFormOpen=true; STATE.editingEmployeeId=null; STATE.employeeFormError=null; render(); break;
      case 'admin-emp-edit': STATE.employeeFormOpen=true; STATE.editingEmployeeId=id; STATE.employeeFormError=null; render(); break;
      case 'admin-emp-cancel-form': STATE.employeeFormOpen=false; STATE.editingEmployeeId=null; STATE.employeeFormError=null; render(); break;
      case 'admin-emp-save': onAdminEmpSave(id||null); break;
      case 'admin-emp-toggle-active': onAdminEmpToggle(id); break;
      case 'admin-emp-toggle-manual': onAdminEmpToggleManual(id); break;
      case 'admin-emp-delete': onAdminEmpDelete(id); break;

      case 'admin-job-new': STATE.jobFormOpen=true; STATE.editingJobId=null; STATE.jobFormError=null; render(); break;
      case 'admin-job-edit': STATE.jobFormOpen=true; STATE.editingJobId=id; STATE.jobFormError=null; render(); break;
      case 'admin-job-cancel-form': STATE.jobFormOpen=false; STATE.editingJobId=null; STATE.jobFormError=null; render(); break;
      case 'admin-job-save': onAdminJobSave(id||null); break;
      case 'admin-job-toggle-active': onAdminJobToggle(id); break;
      case 'admin-job-delete': onAdminJobDelete(id); break;
      case 'admin-merge-duplicate-jobs': onAdminMergeDuplicateJobs(); break;

      case 'admin-task-new': STATE.taskFormOpen=true; STATE.editingTaskId=null; STATE.taskFormError=null; render(); break;
      case 'admin-task-edit': STATE.taskFormOpen=true; STATE.editingTaskId=id; STATE.taskFormError=null; render(); break;
      case 'admin-task-cancel-form': STATE.taskFormOpen=false; STATE.editingTaskId=null; STATE.taskFormError=null; render(); break;
      case 'admin-task-save': onAdminTaskSave(id||null); break;
      case 'admin-task-toggle-active': onAdminTaskToggle(id); break;
      case 'admin-task-delete': onAdminTaskDelete(id); break;

      case 'jobsource-setup-open': STATE.jobSourceFormOpen=true; STATE.jobSourceError=null; render(); break;
      case 'jobsource-setup-cancel': STATE.jobSourceFormOpen=false; STATE.jobSourceError=null; render(); break;
      case 'jobsource-save': onJobSourceSave(); break;
      case 'jobsource-sync-now': syncJobsFromSheet(true); break;
      case 'jobsource-disconnect': onJobSourceDisconnect(); break;


      case 'empsource-setup-open': STATE.employeeSourceFormOpen=true; STATE.employeeSourceError=null; render(); break;
      case 'empsource-setup-cancel': STATE.employeeSourceFormOpen=false; STATE.employeeSourceError=null; render(); break;
      case 'empsource-save': onEmployeeSourceSave(); break;
      case 'empsource-sync-now': syncEmployeesFromSheet(true); break;
      case 'empsource-disconnect': onEmployeeSourceDisconnect(); break;

      case 'tasksource-setup-open': STATE.taskSourceFormOpen=true; STATE.taskSourceError=null; render(); break;
      case 'tasksource-setup-cancel': STATE.taskSourceFormOpen=false; STATE.taskSourceError=null; render(); break;
      case 'tasksource-save': onTaskSourceSave(); break;
      case 'tasksource-sync-now': syncTasksFromSheet(true); break;
      case 'tasksource-disconnect': onTaskSourceDisconnect(); break;

      case 'log-run':
        STATE.logFrom = document.getElementById('logFromInput').value || STATE.logFrom;
        STATE.logTo = document.getElementById('logToInput').value || STATE.logTo;
        render();
        break;
      case 'log-export': onLogExport(); break;
      case 'sheetwrite-setup-open': STATE.sheetWriteFormOpen=true; STATE.sheetWriteError=null; render(); break;
      case 'sheetwrite-cancel-form': STATE.sheetWriteFormOpen=false; STATE.sheetWriteError=null; render(); break;
      case 'sheetwrite-save': onSheetWriteSave(); break;
      case 'sheetwrite-send': onSendToSheet(); break;
      case 'sheetwrite-disconnect': onSheetWriteDisconnect(); break;
      case 'log-edit': STATE.editingEntryId=id; STATE.logEditError=null; render(); break;
      case 'log-cancel-edit': STATE.editingEntryId=null; render(); break;
      case 'log-save-edit': onLogSaveEdit(id); break;
      case 'log-delete': onLogDelete(id); break;
      case 'log-resolve-flag': onLogResolveFlag(id); break;

      case 'admin-save-pin': onAdminSavePin(); break;

      case 'setup-pin-digit': onSetupDigit(id); break;
      case 'setup-pin-back': STATE.setupPinBuffer=STATE.setupPinBuffer.slice(0,-1); render(); break;
    }
  }

  /* ---------------- clock / polling / idle ---------------- */
  function updateHeaderClock(){
    var now = new Date();
    var t = document.getElementById('hcTime'), d = document.getElementById('hcDate');
    if(t) t.textContent = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12:true});
    if(d) d.textContent = now.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}).toUpperCase();
  }
  function startClock(){ updateHeaderClock(); setInterval(updateHeaderClock, 1000); }
  // Real-time cross-tablet sync: whenever employees/jobs/entries/tasks change in
  // Firestore - whether from this tablet or the other one - update STATE and re-render.
  // This replaces the old fixed-interval poll with near-instant updates (e.g. tablet B
  // sees tablet A's clock-in within a second or two). maybeRenderAfterBackgroundSync
  // avoids clobbering an open admin form or an in-progress task selection, the same
  // guard the Google Sheet sync callbacks already use.
  function startSharedDataListeners(){
    fsDoc(K.adminPin).onSnapshot(function(snap){
      var pin = (snap.exists && snap.data().value) ? snap.data().value : null;
      if(pin && pin!==STATE.adminPin){
        STATE.adminPin = pin;
        // If this tablet was mid first-run setup when the other tablet finished its own,
        // defer to the PIN that's now shared rather than risk creating a second, different
        // one - whichever tablet gets there first "wins" and both end up using it.
        if(STATE.view==='setup'){ STATE.view='rack'; STATE.setupPinBuffer=''; STATE.setupPin1=null; STATE.setupStage='enter'; }
        maybeRenderAfterBackgroundSync(false);
      }
    }, function(e){ console.error('adminPin listener error', e); });
    fsDoc(K.employees).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.employees = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('employees listener error', e); });
    fsDoc(K.jobs).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.jobs = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('jobs listener error', e); });
    fsDoc(K.entries).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.entries = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('entries listener error', e); });
    fsDoc(K.tasks).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.tasks = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('tasks listener error', e); });
  }
  function startIdleWatch(){
    setInterval(function(){
      var idleMs = Date.now() - (STATE.lastInteractionAt||Date.now());
      if((STATE.view==='pin' || STATE.view==='action' || STATE.view==='adminpin' || STATE.view==='newpin') && idleMs>20000){ resetToRack(); }
      else if(STATE.view==='tasks' && idleMs>30000){ resetToRack(); }
      else if(STATE.view==='manualentry' && idleMs>60000){ resetToRack(); }
      else if(STATE.view==='myhistory' && idleMs>60000){ resetToRack(); }
      else if(STATE.view==='admin' && idleMs>180000){ resetToRack(); }
    }, 4000);
  }
  function startJobSourceSync(){
    setInterval(function(){
      if(STATE.jobSource) syncJobsFromSheet(false);
    }, 120000); // every 2 minutes - the sheet is described as updated frequently
  }
  function startOfficeJobSourceSync(){
    setInterval(function(){
    }, 120000);
  }
  function startEmployeeSourceSync(){
    setInterval(function(){
      if(STATE.employeeSource) syncEmployeesFromSheet(false);
    }, 120000);
  }
  function startTaskSourceSync(){
    setInterval(function(){
      if(STATE.taskSource) syncTasksFromSheet(false);
    }, 120000);
  }

  /* ---------------- hourly auto-refresh ----------------
     A full reload is the one guaranteed way to clear out anything a tablet has had
     sitting stale in memory since boot - the job list, the employee roster, all of it.
     But firing on a blind timer would occasionally land mid-PIN-entry or halfway through
     a time-off form, which is worse than the staleness it's fixing. So this checks rather
     than forces: every 30s, if an hour has passed AND the tablet is sitting idle on the
     rack screen with no overlay showing and no save in flight, reload. If someone's
     mid-task when the hour ticks over, it just waits and checks again - it will still
     catch the next idle moment, usually within seconds on a shop floor. */
  var REFRESH_INTERVAL_MS = 60 * 60 * 1000;
  var pageLoadedAt = Date.now();
  function isSafeToAutoRefresh(){
    return STATE.view === 'rack' && !STATE.stamp && !STATE.lateAlert && !STATE.busy;
  }
  function startHourlyAutoRefresh(){
    setInterval(function(){
      if(Date.now() - pageLoadedAt < REFRESH_INTERVAL_MS) return;
      if(!isSafeToAutoRefresh()) return;
      location.reload();
    }, 30000);
  }

  /* ---------------- new-build watch ----------------
     The hourly refresh above handles data going stale. This handles CODE going stale -
     a tablet left open from before an upload keeps running the old JavaScript
     indefinitely, including whatever sync logic that old build had (or didn't have).
     There is no one driving out to every tablet after every upload, so the tablet has to
     notice on its own.

     BUILD_ID is a hash of the file's own contents, injected as the last step of packaging
     a build - not a version number I have to remember to bump by hand, which is exactly
     the kind of manual step that gets skipped under time pressure. Any change anywhere in
     the file changes the hash automatically.

     Every 5 minutes, fetch the live page fresh (cache-busted so a browser or CDN cache
     can't hand back yesterday's copy) and compare its embedded BUILD_ID to this tablet's
     own. A mismatch means a new version has been uploaded since this tablet last loaded -
     reload, but only once it's actually safe to, using the exact same idle check as the
     hourly refresh. A failed fetch (offline, tablet Wi-Fi hiccup) just skips that round
     and tries again in 5 minutes; it never treats "couldn't check" as "must reload." */
  var BUILD_ID = 'sha256-b332aa5abed8535a'; // replaced with a real content hash when packaged
  function checkForNewBuild(){
    var bustUrl = location.href.split('#')[0].split('?')[0] + '?_v=' + Date.now();
    fetch(bustUrl, { cache:'no-store' })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(html){
        if(!html) return;
        var m = html.match(/var BUILD_ID = '([^']+)'/);
        if(m && m[1] && m[1] !== BUILD_ID && isSafeToAutoRefresh()) location.reload();
      })
      .catch(function(){ /* offline or blocked this round - try again next interval */ });
  }
  function startBuildUpdateWatch(){
    setInterval(checkForNewBuild, 5 * 60 * 1000);
  }

  function boot(){
    STATE.lastInteractionAt = Date.now();
    document.body.addEventListener('click', onBodyClick);
    document.body.addEventListener('pointerdown', function(){ STATE.lastInteractionAt=Date.now(); });
    document.body.addEventListener('input', function(){ STATE.lastInteractionAt=Date.now(); });
    document.body.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){
        var el = document.activeElement;
        if(el && el.dataset && el.dataset.action){ e.preventDefault(); el.click(); }
      }
    });
    startClock();
    render();
    firebaseAuthReady.then(function(){
      return loadAll();
    }).then(function(){
      STATE.view = STATE.adminPin ? 'rack' : 'setup';
      render();
      startSharedDataListeners();
      startMinervaScheduleListener();
      startIdleWatch();
      startJobSourceSync();
      startOfficeJobSourceSync();
      startEmployeeSourceSync();
      startTaskSourceSync();
      startHourlyAutoRefresh();
      startBuildUpdateWatch();
      if(STATE.jobSource) syncJobsFromSheet(false);
      if(STATE.employeeSource) syncEmployeesFromSheet(false);
      if(STATE.taskSource) syncTasksFromSheet(false);
      // One sweep at boot catches anything the tablet failed to push while it was asleep
      // or offline, then a slow repeating one keeps the window honest through the day.
      sweepToSheet();
      setInterval(function(){ sweepToSheet(); }, SWEEP_INTERVAL_MS);
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
