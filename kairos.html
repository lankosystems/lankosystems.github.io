        if(STATE.setupStage==='enter'){
          STATE.setupPin1 = STATE.setupPinBuffer; STATE.setupPinBuffer=''; STATE.setupStage='confirm'; render();

          if(STATE.setupPinBuffer===STATE.setupPin1){

      '<button class="iconbtn" data-action="tasksource-sync-now">Sync now</button>'+
      '<button class="iconbtn" data-action="tasksource-setup-open">Edit</button>'+
      '<button class="iconbtn danger" data-action="tasksource-disconnect">Disconnect</button></div>';
  }

  function renderTasksTab(){
    var list = STATE.tasks.slice().sort(function(a,b){ return (b.active-a.active) || a.name.localeCompare(b.name); });
    var formOpen = STATE.taskFormOpen;
    var editing = STATE.editingTaskId ? STATE.tasks.find(function(t){ return t.id===STATE.editingTaskId; }) : null;

    var formHtml = '';
    if(formOpen){
      formHtml = '<div class="inlineform">'+
        '<div class="field '+(STATE.taskFormError?'err':'')+'"><label>Task name</label>'+
        '<input id="taskNameInput" type="text" value="'+(editing?esc(editing.name):'')+'" placeholder="e.g. Cleaned up site"></div>'+
        (STATE.taskFormError?'<div class="formerr">'+esc(STATE.taskFormError)+'</div>':'')+
        '<div class="formbtns"><button class="save" data-action="admin-task-save" data-id="'+(editing?editing.id:'')+'">Save</button>'+
        '<button class="cancel" data-action="admin-task-cancel-form">Cancel</button></div></div>';
    }

    var rows = list.map(function(task){
      var fromSheet = task.source==='sheet';
      return '<tr class="'+(task.active?'':'inactive')+'"><td>'+esc(task.name)+'</td>'+
        '<td><span class="badge" style="background:'+(fromSheet?'var(--olive-dim)':'#eee')+';color:'+(fromSheet?'var(--olive)':'#999')+';">'+(fromSheet?'Sheet':'Manual')+'</span></td>'+
        '<td><span class="badge '+(task.active?'active':'inactive')+'">'+(task.active?'Active':'Inactive')+'</span></td>'+
        '<td><button class="iconbtn" data-action="admin-task-edit" data-id="'+task.id+'">Edit</button>'+
        '<button class="iconbtn" data-action="admin-task-toggle-active" data-id="'+task.id+'">'+(task.active?'Deactivate':'Reactivate')+'</button>'+
        '<button class="iconbtn danger" data-action="admin-task-delete" data-id="'+task.id+'">Delete</button></td></tr>';
    }).join('');

    return '<div class="admin-section-head"><h2>Tasks</h2>'+(!formOpen?'<button class="addbtn" data-action="admin-task-new">+ Add task</button>':'')+'</div>'+
      '<p class="settingsnote" style="margin-bottom:16px;">This is the checklist employees pick from when they clock out or transfer, to describe the work they completed.</p>'+
      renderTaskSourcePanel()+
      formHtml+
      (list.length===0?'<div class="empty-state"><b>No tasks yet</b>Add the common tasks your team completes on a job.</div>':
        '<table class="datatable"><thead><tr><th>Task name</th><th>Source</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table>');
  }

  function getFilteredEntries(){
    var from = STATE.logFrom || todayStr();
    var to = STATE.logTo || todayStr();
    var fromTime = new Date(from+'T00:00:00').getTime();
    var toTime = new Date(to+'T23:59:59').getTime();
    return STATE.entries.filter(function(en){
      var t = new Date(en.clockIn).getTime();
      return t>=fromTime && t<=toTime;
    }).sort(function(a,b){ return new Date(b.clockIn)-new Date(a.clockIn); });
  }

  function renderSheetWritePanel(){
    if(STATE.sheetWriteFormOpen){
      return '<div class="inlineform">'+
        '<div class="field" style="min-width:320px;flex:1;"><label>Apps Script Web App URL</label>'+
        '<input id="sheetWriteUrlInput" type="text" value="'+(STATE.sheetWriteUrl?esc(STATE.sheetWriteUrl):'')+'" placeholder="https://script.google.com/macros/s/.../exec"></div>'+
        (STATE.sheetWriteError?'<div class="formerr">'+esc(STATE.sheetWriteError)+'</div>':'')+
        '<div class="formbtns"><button class="save" data-action="sheetwrite-save">Save</button>'+
        '<button class="cancel" data-action="sheetwrite-cancel-form">Cancel</button></div></div>';
    }
    if(!STATE.sheetWriteUrl){
      return '<div class="inlineform" style="align-items:center;">'+
        '<div style="flex:1;font-size:13px;color:#8a7f68;min-width:220px;">Send this same data straight into a Google Sheet instead of (or in addition to) downloading a CSV.</div>'+
        '<button class="addbtn" style="background:var(--card);color:var(--oxblood);border:1px solid var(--line);" data-action="sheetwrite-setup-open">Connect a Google Sheet</button></div>';
    }
    var statusText = STATE.sheetWriteStatus==='sending' ? 'Sending&hellip;' :
      STATE.sheetWriteStatus==='error' ? ('&#9888; '+esc(STATE.sheetWriteError||'Send error')) :
      (STATE.sheetWriteLastSentAt ? ('&#10003; Last sent '+fmtTime(STATE.sheetWriteLastSentAt)+' on '+fmtDateShort(STATE.sheetWriteLastSentAt)) : 'Not sent yet');
    return '<div class="inlineform" style="align-items:center;">'+
      '<div style="flex:1;min-width:220px;">'+
      '<div style="font-family:var(--display-text);font-weight:700;font-size:13px;color:var(--oxblood);">Send to Google Sheet</div>'+
      '<div style="font-size:12px;color:'+(STATE.sheetWriteStatus==='error'?'var(--rust)':'#8a7f68')+';margin-top:2px;">'+statusText+'</div></div>'+
      '<button class="addbtn" data-action="sheetwrite-send">Send this range</button>'+
      '<button class="iconbtn" data-action="sheetwrite-setup-open">Edit</button>'+
      '<button class="iconbtn danger" data-action="sheetwrite-disconnect">Disconnect</button></div>';
  }

  function renderLogTab(){
    if(!STATE.logFrom) STATE.logFrom = todayStr();
    if(!STATE.logTo) STATE.logTo = todayStr();
    var rows = getFilteredEntries();
    var payable = computePayableMap();

    // Flagged entries matter regardless of whatever date range happens to be selected, so
    // this scans the full entry list (not just `rows`) and always surfaces every open flag.
    var flaggedEntries = STATE.entries.filter(function(en){ return en.flagged; })
      .sort(function(a,b){ return new Date(b.flaggedAt||0)-new Date(a.flaggedAt||0); });
    var flaggedBanner = '';
    if(flaggedEntries.length){
      flaggedBanner = '<div style="background:#fff3e0;border:1px solid #f0c987;border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
        '<div style="font-weight:700;color:var(--rust);margin-bottom:8px;">&#9873; '+flaggedEntries.length+' entr'+(flaggedEntries.length===1?'y':'ies')+' flagged for review</div>'+
        flaggedEntries.map(function(en){
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #f0c987;">'+
            '<div style="font-size:13px;"><b>'+esc(en.employeeName)+'</b> — '+fmtDateShort(en.clockIn)+', '+esc(en.jobName)+
            '<div style="color:#8a7f68;margin-top:2px;">"'+esc(en.flagNote||'')+'"</div></div>'+
            '<div style="white-space:nowrap;"><button class="iconbtn" data-action="log-edit" data-id="'+en.id+'">Edit entry</button>'+
            '<button class="iconbtn" data-action="log-resolve-flag" data-id="'+en.id+'">Resolve</button></div></div>';
        }).join('')+
        '</div>';
    }

    // Same reasoning as the flagged banner above - pending after-hours time matters no
    // matter what date range happens to be showing, so this scans every entry rather than
    // just `rows`.
    var pendingEntries = STATE.entries.filter(function(en){ return (payable[en.id]||{}).pendingMs > 0; })
      .sort(function(a,b){ return new Date(b.clockIn)-new Date(a.clockIn); });
    var pendingBanner = '';
    if(pendingEntries.length){
      pendingBanner = '<div style="background:var(--olive-dim);border:1px solid var(--olive);border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
        '<div style="font-weight:700;color:var(--olive);margin-bottom:8px;">&#9203; '+pendingEntries.length+' entr'+(pendingEntries.length===1?'y':'ies')+' with time outside the 7am\u20135:30/3:30 window awaiting approval</div>'+
        pendingEntries.map(function(en){
          var p = payable[en.id];
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--olive);">'+
            '<div style="font-size:13px;"><b>'+esc(en.employeeName)+'</b> — '+fmtDateShort(en.clockIn)+', '+esc(en.jobName)+' — '+
            fmtTime(en.clockIn)+'\u2013'+(en.clockOut?fmtTime(en.clockOut):'active')+
            '<div style="color:#8a7f68;margin-top:2px;">'+msToHoursStr(p.pendingMs)+'h outside the window</div></div>'+
            '<div style="white-space:nowrap;"><button class="iconbtn" data-action="log-edit" data-id="'+en.id+'">Edit entry</button>'+
            '<button class="iconbtn" data-action="log-approve-afterhours" data-id="'+en.id+'">Approve</button>'+
            '<button class="iconbtn" data-action="log-ignore-afterhours" data-id="'+en.id+'">Ignore</button></div></div>';
        }).join('')+
        '</div>';
    }

    // Employees' "Request admin printout" taps land here regardless of date range, same
    // reasoning as the banners above.
    var printRequests = (STATE.printRequests||[]).slice()
      .sort(function(a,b){ return new Date(b.requestedAt||0)-new Date(a.requestedAt||0); });
    var printBanner = '';
    if(printRequests.length){
      printBanner = '<div style="background:#e9edf2;border:1px solid var(--steel);border-radius:10px;padding:12px 16px;margin-bottom:16px;">'+
        '<div style="font-weight:700;color:var(--steel);margin-bottom:8px;">&#128424; '+printRequests.length+' printout request'+(printRequests.length===1?'':'s')+'</div>'+
        printRequests.map(function(r){
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--steel);">'+
            '<div style="font-size:13px;"><b>'+esc(r.employeeName)+'</b> — '+esc(r.from)+' to '+esc(r.to)+
            '<div style="color:#8a7f68;margin-top:2px;">Requested '+fmtTime(r.requestedAt)+' on '+fmtDateShort(r.requestedAt)+'</div></div>'+
            '<button class="iconbtn" data-action="printreq-print" data-id="'+esc(r.id)+'">Print</button>'+
            '<button class="iconbtn" data-action="printreq-resolve" data-id="'+esc(r.id)+'">Mark printed</button></div>';
        }).join('')+
        '</div>';
    }

    var totalsByEmp = {};
    rows.forEach(function(en){
      var p = payable[en.id] || {hoursMs:0, quoteMs:0, pendingMs:0};
      var t = totalsByEmp[en.employeeName] = totalsByEmp[en.employeeName] || {hoursMs:0, quoteMs:0, pendingMs:0};
      t.hoursMs += p.hoursMs; t.quoteMs += (p.quoteMs||0); t.pendingMs += (p.pendingMs||0);
    });
    var totalsHtml = Object.keys(totalsByEmp).sort().map(function(name){
      var t = totalsByEmp[name];
      var qt = t.quoteMs>0 ? ' <span style="font-size:12px;color:var(--gold-dim);font-weight:600;">('+msToHoursStr(t.quoteMs)+'h quotes)</span>' : '';
      var pd = t.pendingMs>0 ? ' <span style="font-size:12px;color:var(--olive);font-weight:600;">(+'+msToHoursStr(t.pendingMs)+'h pending)</span>' : '';
      var selected = STATE.logEmpFilter===name;
      return '<div class="summary-card clickable'+(selected?' selected':'')+'" data-action="log-emp-filter" data-id="'+esc(name)+'"><div class="n">'+msToHoursStr(t.hoursMs)+'h'+qt+pd+'</div><div class="l">'+esc(name)+'</div></div>';
    }).join('') || '<div class="empty-state" style="padding:14px;">No entries in this range.</div>';

    // Clicking a summary card above drills the table below down to just that
    // employee's entries for the selected date range; STATE.logEmpFilter never
    // touches getFilteredEntries() itself, so the summary cards always keep
    // showing every employee (with the active one highlighted) and it's a
    // one-click toggle to get back to everyone.
    var displayRows = STATE.logEmpFilter ? rows.filter(function(en){ return en.employeeName===STATE.logEmpFilter; }) : rows;
    var tableRows = displayRows.map(function(en){
      if(STATE.editingEntryId===en.id){
        return '<tr><td colspan="8"><div class="inlineform" style="margin:0;">'+
          '<div class="field"><label>Job</label><select id="logJobSelect">'+
          jobsWithKuberaQuotes().map(function(j){ return '<option value="'+j.id+'" '+(j.id===en.jobId?'selected':'')+'>'+esc(j.name)+'</option>'; }).join('')+
          '</select></div>'+
          '<div class="field"><label>Clock in</label><input id="logInInput" type="datetime-local" value="'+toLocalInputVal(en.clockIn)+'"></div>'+
          '<div class="field"><label>Clock out</label><input id="logOutInput" type="datetime-local" value="'+(en.clockOut?toLocalInputVal(en.clockOut):'')+'"></div>'+
          (STATE.logEditError?'<div class="formerr">'+esc(STATE.logEditError)+'</div>':'')+
          '<div class="formbtns"><button class="save" data-action="log-save-edit" data-id="'+en.id+'">Save</button>'+
          '<button class="cancel" data-action="log-cancel-edit">Cancel</button></div></div></td></tr>';
      }
      var p = payable[en.id] || {hoursMs:0, quoteMs:0, pendingMs:0};
      var hrsStr = en.clockOut ? fmtDuration(p.hoursMs) : 'active';
      if(p.quoteMs>0) hrsStr += ' <span style="color:var(--gold-dim);font-weight:600;">(quote)</span>';
      var pendingStr = '';
      if(p.pendingMs>0){
        pendingStr = '<div style="font-size:11px;color:var(--olive);font-weight:600;margin-top:2px;">&#9203; +'+msToHoursStr(p.pendingMs)+'h outside window, pending</div>';
      } else if(en.afterHoursApproved){
        pendingStr = '<div style="font-size:11px;color:var(--olive);font-weight:600;margin-top:2px;">&#10003; after-hours approved</div>';
      } else if(en.afterHoursIgnored){
        pendingStr = '<div style="font-size:11px;color:#8a7f68;font-weight:600;margin-top:2px;">&#10005; outside-window time ignored, not paid</div>';
      }
      var taskStr = (en.completedTasks && en.completedTasks.length) ? esc(en.completedTasks.join(', ')) : '<span style="color:#c4bba5;">—</span>';
      var enteredByStr = en.enteredBy ? '<div style="font-size:11px;color:#8a7f68;margin-top:2px;">via '+esc(en.enteredBy)+'</div>' : '';
      var flagStr = en.flagged ? '<div style="font-size:11px;color:var(--rust);font-weight:600;margin-top:2px;">&#9873; '+esc(en.flagNote||'Flagged')+'</div>' : '';
      return '<tr'+(en.flagged?' style="background:#fff8ec;"':'')+'><td>'+fmtDateShort(en.clockIn)+'</td><td>'+esc(en.employeeName)+enteredByStr+'</td><td>'+esc(en.jobName)+'</td>'+
        '<td>'+fmtTime(en.clockIn)+'</td><td>'+(en.clockOut?fmtTime(en.clockOut):'— active')+'</td><td>'+hrsStr+pendingStr+'</td>'+
        '<td style="max-width:220px;">'+taskStr+flagStr+'</td>'+
        '<td><button class="iconbtn" data-action="log-edit" data-id="'+en.id+'">Edit</button>'+
        (p.pendingMs>0?'<button class="iconbtn" data-action="log-approve-afterhours" data-id="'+en.id+'">Approve</button>'+
          '<button class="iconbtn" data-action="log-ignore-afterhours" data-id="'+en.id+'">Ignore</button>':'')+
        (en.afterHoursApproved && p.pendingMs===0?'<button class="iconbtn" data-action="log-approve-afterhours" data-id="'+en.id+'">Un-approve</button>':'')+
        (en.afterHoursIgnored && p.pendingMs===0?'<button class="iconbtn" data-action="log-ignore-afterhours" data-id="'+en.id+'">Un-ignore</button>':'')+
        (en.flagged?'<button class="iconbtn" data-action="log-resolve-flag" data-id="'+en.id+'">Resolve</button>':'')+
        '<button class="iconbtn danger" data-action="log-delete" data-id="'+en.id+'">Delete</button></td></tr>';
    }).join('');

    return '<div class="admin-section-head"><h2>Daily Log</h2></div>'+
      flaggedBanner+
      pendingBanner+
      printBanner+
      '<div class="logfilters">'+
      '<div class="field"><label>From</label><input id="logFromInput" type="date" value="'+STATE.logFrom+'"></div>'+
      '<div class="field"><label>To</label><input id="logToInput" type="date" value="'+STATE.logTo+'"></div>'+
      '<button class="addbtn" data-action="log-run">Update</button>'+
      '<button class="addbtn" style="background:var(--card);color:var(--oxblood);border:1px solid var(--line);" data-action="log-export">Export CSV</button>'+
      '</div>'+
      renderSheetWritePanel()+
      '<div class="subhead">Hours by employee — click a name to see just their entries</div>'+
      '<div class="summary-cards">'+totalsHtml+'</div>'+
      '<div class="subhead">'+(STATE.logEmpFilter?
        'Entries — showing '+esc(STATE.logEmpFilter)+' only <button class="iconbtn" data-action="log-emp-filter" data-id="'+esc(STATE.logEmpFilter)+'" style="margin-left:6px;">Show everyone</button>' :
        'Entries — paid time is 7am\u20135:30pm (Mon\u2013Thu) / 7am\u20133:30pm (Fri), rounded to the nearest 15 minutes; anything outside that needs approval above')+'</div>'+
      (displayRows.length===0?'<div class="empty-state">No time entries'+(STATE.logEmpFilter?' for '+esc(STATE.logEmpFilter):'')+' in this range.</div>':
        '<table class="datatable"><thead><tr><th>Date</th><th>Employee</th><th>Job</th><th>In</th><th>Out</th><th>Hours</th><th>Tasks completed</th><th>Actions</th></tr></thead><tbody>'+tableRows+'</tbody></table>');
  }

  function renderSettingsTab(){
    return '<div class="admin-section-head"><h2>Settings</h2></div>'+
      '<div class="inlineform">'+
      '<div class="field"><label>New admin PIN</label><input id="newAdminPin1" type="text" inputmode="numeric" maxlength="4" placeholder="4 digits"></div>'+
      '<div class="field"><label>Confirm PIN</label><input id="newAdminPin2" type="text" inputmode="numeric" maxlength="4" placeholder="4 digits"></div>'+
      (STATE.settingsError?'<div class="formerr">'+esc(STATE.settingsError)+'</div>':'')+
      '<div class="formbtns"><button class="save" data-action="admin-save-pin">Save PIN</button></div></div>'+
      '<p class="settingsnote">This PIN protects the Employees, Jobs and Daily Log screens. Employee PINs are separate and are set per person on the Employees tab.</p>';
  }

  /* ---------------- admin actions ---------------- */
  function onAdminEmpSave(editId){
    var name = document.getElementById('empNameInput').value.trim();
    var pin = document.getElementById('empPinInput').value.trim();
    var email = document.getElementById('empEmailInput').value.trim();
    var employeeType = document.getElementById('empTypeInput').value === 'office' ? 'office' : 'shop';
    var canManualEntry = document.getElementById('empManualEntryInput').checked;
    var presenceOnly = document.getElementById('empPresenceOnlyInput').checked;
    if(!name){ STATE.employeeFormError='Enter a name.'; render(); return; }
    if(!/^\d{4}$/.test(pin)){ STATE.employeeFormError='PIN must be exactly 4 digits.'; render(); return; }
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ STATE.employeeFormError='That email address doesn\'t look right.'; render(); return; }
    if(pin !== DEFAULT_EMPLOYEE_PIN){
      var dup = STATE.employees.find(function(e){ return e.pin===pin && e.active && e.id!==editId; });
      if(dup){ STATE.employeeFormError = 'That PIN is already used by '+dup.name+'.'; render(); return; }
    }
    var needsPinSetup = (pin === DEFAULT_EMPLOYEE_PIN);
    mutateLocal(K.employees, STATE.employees, function(list){
      if(editId) return list.map(function(e){ return e.id===editId ? Object.assign({}, e, {name:name, pin:pin, email:email, needsPinSetup:needsPinSetup, employeeType:employeeType, canManualEntry:canManualEntry, presenceOnly:presenceOnly, officeStatus:e.officeStatus||'out'}) : e; });
      return list.concat([{id:uid('emp'), name:name, pin:pin, email:email, active:true, source:'manual', needsPinSetup:needsPinSetup, employeeType:employeeType, canManualEntry:canManualEntry, presenceOnly:presenceOnly, officeStatus:'out'}]);
    }).then(function(updated){
      STATE.employees = updated; STATE.employeeFormOpen=false; STATE.editingEmployeeId=null; STATE.employeeFormError=null; render();
    });
  }
  function onAdminEmpToggle(id){
    mutateLocal(K.employees, STATE.employees, function(list){ return list.map(function(e){ return e.id===id?Object.assign({}, e, {active: !e.active}):e; }); })
      .then(function(updated){ STATE.employees = updated; render(); });
  }
  function onAdminEmpToggleManual(id){
    mutateLocal(K.employees, STATE.employees, function(list){ return list.map(function(e){ return e.id===id?Object.assign({}, e, {canManualEntry: !e.canManualEntry}):e; }); })
      .then(function(updated){ STATE.employees = updated; render(); });
  }
  function onAdminEmpDelete(id){
    var hasEntries = STATE.entries.some(function(en){ return en.employeeId===id; });
    if(hasEntries){ alert('This person has time records. Deactivate them instead of deleting.'); return; }
    if(!confirm('Delete this employee? This cannot be undone.')) return;
    mutateLocal(K.employees, STATE.employees, function(list){ return list.filter(function(e){ return e.id!==id; }); })
      .then(function(updated){ STATE.employees = updated; render(); });
  }

  function onEmployeeSourceSave(){
    var url = document.getElementById('empSourceUrlInput').value.trim();
    var nameColRaw = document.getElementById('empSourceNameColInput').value.trim();
    var pinColRaw = document.getElementById('empSourcePinColInput').value.trim();
    var hasHeader = document.getElementById('empSourceHeaderCheckbox').checked;
    var parsed = parseSheetInput(url);
    if(!parsed){ STATE.employeeSourceError = "That doesn't look like a Google Sheets link."; render(); return; }
    var nameCol = parseInt(nameColRaw, 10);
    if(!nameCol || nameCol<1) nameCol = 1;
    var pinCol = parseInt(pinColRaw, 10);
    if(!pinCol || pinCol<1) pinCol = 0;
    STATE.employeeSource = Object.assign({ inputUrl:url, nameColumnIndex:nameCol, pinColumnIndex:pinCol, hasHeader:hasHeader, lastSyncAt:null }, parsed);
    STATE.employeeSourceError = null;
    STATE.employeeSourceFormOpen = false;
    safeSetJSON(K.employeeSource, STATE.employeeSource).then(function(){
      render();
      syncEmployeesFromSheet(true);
    });
  }
  function onEmployeeSourceDisconnect(){
    if(!confirm('Stop syncing employees from this Google Sheet? People already on the list will stay as they are.')) return;
    STATE.employeeSource = null; STATE.empSyncStatus='idle'; STATE.empSyncError=null;
    safeSetJSON(K.employeeSource, null).then(render);
  }

  function onTaskSourceSave(){
    var url = document.getElementById('taskSourceUrlInput').value.trim();
    var colRaw = document.getElementById('taskSourceColInput').value.trim();
    var hasHeader = document.getElementById('taskSourceHeaderCheckbox').checked;
    var parsed = parseSheetInput(url);
    if(!parsed){ STATE.taskSourceError = "That doesn't look like a Google Sheets link."; render(); return; }
    var col = parseInt(colRaw, 10);
    if(!col || col<1) col = 1;
    STATE.taskSource = Object.assign({ inputUrl:url, columnIndex:col, hasHeader:hasHeader, lastSyncAt:null }, parsed);
    STATE.taskSourceError = null;
    STATE.taskSourceFormOpen = false;
    safeSetJSON(K.taskSource, STATE.taskSource).then(function(){
      render();
      syncTasksFromSheet(true);
    });
  }
  function onTaskSourceDisconnect(){
    if(!confirm('Stop syncing tasks from this Google Sheet? Tasks already on the list will stay as they are.')) return;
    STATE.taskSource = null; STATE.taskSyncStatus='idle'; STATE.taskSyncError=null;
    safeSetJSON(K.taskSource, null).then(render);
  }

  function onAdminJobSave(editId){
    var name = document.getElementById('jobNameInput').value.trim();
    var description = document.getElementById('jobDescInput').value.trim();
    var audience = document.getElementById('jobAudienceInput').value === 'office' ? 'office' : 'shop';
    var isQuote = document.getElementById('jobIsQuoteInput').checked;
    if(!name){ STATE.jobFormError='Enter a job name.'; render(); return; }

  var EXPORT_HEADER = ['Date','Employee','Job','Clock In','Clock Out','Hours','Quote Hours','Entered By','Tasks Completed'];
  function buildExportRows(){
    var payable = computePayableMap();
    return getFilteredEntries().map(function(en){
      var p = payable[en.id] || {hoursMs:0, quoteMs:0};
      return [fmtDateShort(en.clockIn), en.employeeName, en.jobName, fmtTime(en.clockIn), en.clockOut?fmtTime(en.clockOut):'active',
        en.clockOut ? msToHoursStr(p.hoursMs) : '',
        p.quoteMs>0?msToHoursStr(p.quoteMs):'0.00', en.enteredBy||'', (en.completedTasks||[]).join('; ')];
    });
  }
  // Row shape for the lanko-sheet-bridge Apps Script (not the human-readable CSV
  // export): [entryId, clockInISO, employee, job, inTime, outTime, regHrs, ahHrs,
  // quoteHrs, enteredBy, tasks, flagged]. This 12-column shape (and the meaning of each
  // position) is kept EXACTLY as before, even though the regular/after-hours split was
  // retired in the app - the TimeEntries sheet, Payroll tab, and Time by Job tab all
  // still read column G as "hours" and column H positionally, and Payroll's formulas
  // sum G+H per day. ahHrs is hardcoded to 0 here on purpose so those sheet formulas
  // keep working untouched - regHrs alone now carries the full worked (rounded) hours.
  // Dates must stay real ISO strings - the script's toDate() keys off the
  // 'YYYY-MM-DD' prefix - rather than the display-formatted strings buildExportRows
  // produces for the CSV.
  function buildSheetSyncRows(){
    var payable = computePayableMap();
    return getFilteredEntries().map(function(en){
      var p = payable[en.id] || {hoursMs:0, quoteMs:0};
      return [en.id, en.clockIn, en.employeeName, en.jobName, fmtTime(en.clockIn), en.clockOut?fmtTime(en.clockOut):'',
        en.clockOut ? (p.hoursMs/3600000) : 0, 0, p.quoteMs/3600000,
        en.enteredBy||'', (en.completedTasks||[]).join('; '), !!en.flagged];
    });
  }
  function onLogExport(){
    var csvRows = buildExportRows();
    function csvEscape(v){ var s=String(v); return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
    var csv = [EXPORT_HEADER].concat(csvRows).map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'lanko-timeclock_'+STATE.logFrom+'_to_'+STATE.logTo+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function onSheetWriteSave(){

    if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+\/s|macros\/s)\/.+\/exec\/?$/.test(url)){
      STATE.sheetWriteError = "That doesn't look like a deployed Apps Script Web App URL (should look like https://script.google.com/macros/s/.../exec or, for a Workspace account, https://script.google.com/a/macros/yourdomain.com/s/.../exec).";
      render(); return;
    }
    STATE.sheetWriteUrl = url;

  function onSendToSheet(){
    if(!STATE.sheetWriteUrl) return;
    var rows = buildSheetSyncRows();
    if(rows.length===0){ alert('No entries in the selected date range to send.'); return; }
    if(typeof fetch === 'undefined'){
      STATE.sheetWriteStatus='error'; STATE.sheetWriteError="This tablet's browser doesn't support sending data."; render(); return;
    }
    STATE.sheetWriteStatus = 'sending'; STATE.sheetWriteError = null; render();
    // Two things matter here, worked out by testing directly against a Workspace-restricted
    // Apps Script deployment (script.google.com won't offer a plain "Anyone" access level on
    // a Workspace domain - only "Only myself" / "Anyone within the domain" / "Anyone with a
    // Google account"):
    //  - credentials:'include' is required so the tablet's signed-in Google Workspace session
    //    (cookies for script.google.com) rides along on this cross-origin request - without it
    //    the request never authenticates and silently never reaches doPost.
    //  - mode:'no-cors' is required because script.google.com doesn't return the
    //    Access-Control-Allow-* headers a normal cross-origin fetch needs to let us read the
    //    response - without it the browser throws "Failed to fetch" even though the request
    //    (and the sheet write) already succeeded server-side.
    // The tradeoff: a no-cors response is always "opaque" (status 0, ok:false) by browser
    // design, so we can't tell success from failure from the response itself - only whether the
    // request round-tripped without a network-level throw. Since the server-side write happens
    // before the browser ever blocks reading the response, treating "didn't throw" as success
    // is accurate in practice.
    fetch(STATE.sheetWriteUrl, {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'include',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type: 'syncEntries', from: STATE.logFrom, to: STATE.logTo, rows: rows })
    }).then(function(){
      STATE.sheetWriteStatus = 'ok'; STATE.sheetWriteError = null;
      STATE.sheetWriteLastSentAt = new Date().toISOString();
      return safeSetJSON(K.sheetWrite, {url: STATE.sheetWriteUrl, lastSentAt: STATE.sheetWriteLastSentAt});
    }).then(function(){ render(); })
    .catch(function(){
      STATE.sheetWriteStatus = 'error';
      STATE.sheetWriteError = 'Could not reach the script at all. Double-check the Web App URL, and that this tablet is signed into a lankosystems.com Google account.';
      render();
    });
  }

  // Real-time cross-tablet sync: whenever employees/jobs/entries/tasks change in
  // Firestore - whether from this tablet or the other one - update STATE and re-render.
  // This replaces the old fixed-interval poll with near-instant updates (e.g. tablet B
  // sees tablet A's clock-in within a second or two). maybeRenderAfterBackgroundSync
  // avoids clobbering an open admin form or an in-progress task selection, the same
  // guard the Google Sheet sync callbacks already use.
  function startSharedDataListeners(){
    fsDoc(K.adminPin).onSnapshot(function(snap){
      var pin = (snap.exists && snap.data().value) ? snap.data().value : null;
      if(pin && pin!==STATE.adminPin){
        STATE.adminPin = pin;
        // If this tablet was mid first-run setup when the other tablet finished its own,
        // defer to the PIN that's now shared rather than risk creating a second, different
        // one - whichever tablet gets there first "wins" and both end up using it.
        if(STATE.view==='setup'){ STATE.view='rack'; STATE.setupPinBuffer=''; STATE.setupPin1=null; STATE.setupStage='enter'; }
        maybeRenderAfterBackgroundSync(false);
      }
    }, function(e){ console.error('adminPin listener error', e); });
    fsDoc(K.employees).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.employees = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('employees listener error', e); });
    fsDoc(K.jobs).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.jobs = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('jobs listener error', e); });
    fsDoc(K.entries).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.entries = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('entries listener error', e); });
    fsDoc(K.tasks).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.tasks = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('tasks listener error', e); });
    fsDoc(K.printRequests).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.printRequests = snap.data().value;
      maybeRenderAfterBackgroundSync(false);
    }, function(e){ console.error('printRequests listener error', e); });
  }
  var currentPageETag = null;
  var pendingVersionUpdate = false;
  function captureCurrentETag(){
    fetch('kairos.html', {method:'HEAD', cache:'no-store'}).then(function(res){
      currentPageETag = res.headers.get('etag') || res.headers.get('last-modified');
    }).catch(function(){});
  }
  function checkForUpdate(){
    if(!currentPageETag) return;
    fetch('kairos.html', {method:'HEAD', cache:'no-store'}).then(function(res){
      var tag = res.headers.get('etag') || res.headers.get('last-modified');
      if(tag && tag!==currentPageETag) pendingVersionUpdate = true;
    }).catch(function(){});
  }
  function startAutoUpdateWatch(){
    captureCurrentETag();
    setInterval(checkForUpdate, 3*60*1000); // every 3 minutes -- cheap HEAD request, no body
  }
  function startIdleWatch(){
    setInterval(function(){
      if(pendingVersionUpdate && STATE.view==='rack'){ window.location.href = window.location.pathname + '?v=' + Date.now(); return; }
      var idleMs = Date.now() - (STATE.lastInteractionAt||Date.now());
      if((STATE.view==='pin' || STATE.view==='action' || STATE.view==='adminpin' || STATE.view==='newpin') && idleMs>60000){ resetToRack(); }
      else if(STATE.view==='tasks' && idleMs>90000){ resetToRack(); }
      else if(STATE.view==='manualentry' && idleMs>180000){ resetToRack(); }
      else if(STATE.view==='myhistory' && idleMs>150000){ resetToRack(); }
      else if(STATE.view==='admin' && idleMs>300000){ resetToRack(); }
      if(!STATE.screensaverActive && STATE.view==='rack' && idleMs>SCREENSAVER_IDLE_MS) activateScreensaver();
    }, 4000);
  }
  function startJobSourceSync(){
    setInterval(function(){
      if(STATE.jobSource) syncJobsFromSheet(false);
    }, 300000); // every 5 minutes -- was 2; reduced background churn while crew are on the tablet
  }
  function startOfficeJobSourceSync(){
    setInterval(function(){
      if(STATE.officeJobSource) syncOfficeJobsFromSheet(false);
    }, 300000);
  }
  function startEmployeeSourceSync(){
    setInterval(function(){
      if(STATE.employeeSource) syncEmployeesFromSheet(false);
    }, 300000);
  }
  function startTaskSourceSync(){
    setInterval(function(){
      if(STATE.taskSource) syncTasksFromSheet(false);
    }, 300000);
  }

  function boot(){
    STATE.lastInteractionAt = Date.now();
    document.body.addEventListener('click', onBodyClick);
    document.body.addEventListener('pointerdown', function(){ STATE.lastInteractionAt=Date.now(); });
    document.body.addEventListener('input', function(){ STATE.lastInteractionAt=Date.now(); });
    document.body.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){
        var el = document.activeElement;
        if(el && el.dataset && el.dataset.action){ e.preventDefault(); el.click(); }
      }
    });
    startClock();
    render();
    firebaseAuthReady.then(function(){
      return loadAll();
    }).then(function(){
      STATE.view = STATE.adminPin ? 'rack' : 'setup';
      render();
      startSharedDataListeners();
      startMinervaScheduleListener();
      startKuberaQuoteListener();
      startOdinConstraintsListener();
      startIdleWatch();
      startAutoUpdateWatch();
      startJobSourceSync();
      startOfficeJobSourceSync();
      startEmployeeSourceSync();
      startTaskSourceSync();
      if(STATE.jobSource) syncJobsFromSheet(false);
      if(STATE.officeJobSource) syncOfficeJobsFromSheet(false);
      if(STATE.employeeSource) syncEmployeesFromSheet(false);
      if(STATE.taskSource) syncTasksFromSheet(false);
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
