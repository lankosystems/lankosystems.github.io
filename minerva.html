<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lanko Minerva Planner 26.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=Big+Shoulders+Text:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Design tokens carried over from Kairos (the shop timeclock) so both apps share one
     visual language. Same palette/fonts, same card-and-rack idiom. */
  :root{
    --oxblood:      #6D1708;
    --oxblood-dark: #4E1005;
    --oxblood-deep: #320A03;
    --gold:         #DEA509;
    --gold-light:   #E9C45F;
    --gold-dim:     #AD8007;
    --gold-muted:   #C7A15E;
    --ink:          #241811;
    --paper:        #F4EEE1;
    --paper-dim:    #E6DCC5;
    --card:         #FBF7EC;
    --olive:        #5B6B3F;
    --olive-dim:    #EEF1E4;
    --rust:         #A23B1E;
    --rust-dim:     #F7E6DE;
    --steel:        #3B5169;
    --steel-dim:    #E4EAF0;
    --line: rgba(36,24,17,0.14);

    --display: "Big Shoulders", sans-serif;
    --display-text: "Big Shoulders Text", sans-serif;
    --body: "IBM Plex Sans", sans-serif;
    --mono: "IBM Plex Mono", monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; touch-action:manipulation; overscroll-behavior:none; }
  body{
    background: var(--paper);
    font-family: var(--body);
    color: var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }
  button{ font:inherit; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  #app{ height:100vh; height:100dvh; height:var(--app-vh, 100dvh); width:100vw; display:flex; flex-direction:column; }
  #stage{ flex:1; display:flex; flex-direction:column; min-height:0; }

  /* ---------- header ---------- */
  header.topbar{
    background: var(--oxblood);
    background-image: linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-dark) 100%);
    color: var(--gold);
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 28px;
    box-shadow: 0 3px 0 var(--oxblood-deep), 0 6px 14px rgba(0,0,0,0.25);
    flex-shrink:0; position:relative; z-index:5;
  }
  .wordmark{ display:flex; align-items:center; gap:14px; line-height:1; }
  .wordmark .logo-img{ height:34px; width:auto; display:block; filter: drop-shadow(0 2px 0 var(--oxblood-deep)); }
  .wordmark .divider{ width:1.5px; height:26px; background: rgba(217,161,37,0.35); }
  .wordmark small{
    font-family: var(--display-text); font-weight:600; font-size:13px; color: var(--paper-dim);
    letter-spacing:2.5px; text-transform:uppercase; opacity:0.85;
  }
  .topbar-right{ display:flex; align-items:center; gap:16px; }
  .weeknav{ display:flex; align-items:center; gap:10px; }
  .weeknav button{
    width:34px; height:34px; border-radius:8px; border:1.5px solid rgba(217,161,37,0.4);
    background: rgba(0,0,0,0.15); color: var(--gold-muted); font-size:16px; cursor:pointer;
  }
  .weeknav .wk{ font-family:var(--mono); color:var(--paper); font-size:13px; text-align:center; min-width:150px; }
  .weeknav .wk b{ color:var(--gold-light); font-size:14px; }
  .gearbtn{
    height:40px; padding:0 16px; border-radius:10px; border: 1.5px solid rgba(217,161,37,0.4);
    background: rgba(0,0,0,0.15); color: var(--gold-muted); display:flex; align-items:center;
    gap:8px; justify-content:center; font-size:14px; font-family:var(--display-text); font-weight:700;
    letter-spacing:0.4px; text-transform:uppercase; cursor:pointer;
  }
  .gearbtn .gearicon{ font-size:17px; }

  /* ---------- board (main week view) ---------- */
  main.board{
    flex:1; padding: 24px 28px 20px; overflow-y:auto;
    background: radial-gradient(ellipse at top, rgba(110,36,18,0.06), transparent 60%), var(--paper);
  }
  .board-heading{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .board-heading h1{
    font-family:var(--display); font-size:19px; font-weight:700; letter-spacing:1.5px;
    text-transform:uppercase; color: var(--oxblood); margin:0;
  }
  .board-heading span{ font-family:var(--mono); font-size:13px; color:#7a6f5c; }

  .joblegend{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .joblegend .jchip{
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 11px;
    font-family:var(--mono); font-size:11.5px; color:var(--ink); display:flex; align-items:center; gap:7px;
    box-shadow:0 4px 8px -4px rgba(36,24,17,0.18);
  }
  .joblegend .jchip b{ color:var(--oxblood); font-family:var(--display-text); }
  .joblegend .jchip .hold{ color:var(--rust); font-weight:600; }

  .pool-block{ margin-bottom:22px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--card); box-shadow:0 10px 18px -10px rgba(36,24,17,0.22); }
  .pool-block .pool-head{ padding:9px 16px; font-family:var(--display-text); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.6px; color:#fff; }
  .pool-table{ width:100%; border-collapse:collapse; }
  .pool-table th{ text-align:left; font-family:var(--display-text); font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:#8a7f68; padding:8px 12px; background:var(--paper-dim); border-bottom:1px solid var(--line); white-space:nowrap; }
  .pool-table td{ padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:12.5px; }
  .pool-table tr:last-child td{ border-bottom:none; }
  .pool-table .empname{ font-family:var(--display-text); font-weight:700; color:var(--ink); white-space:nowrap; }
  .pool-table .total{ text-align:center; font-family:var(--mono); font-weight:700; color:var(--oxblood); }
  .daycell-entry{ font-family:var(--mono); font-size:11.5px; line-height:1.5; }
  .daycell-entry b{ color:var(--gold-dim); }
  .daycell-empty{ color:#b9ae95; font-style:italic; font-size:11.5px; }
  .notstarted{ color:#b9ae95; font-size:11px; font-style:italic; }
  .notstarted .beg{ display:block; font-size:10px; }

  .empty-state{ text-align:center; padding:50px 20px; color:#9a8f78; font-family:var(--body); font-size:14px; }
  .empty-state b{ display:block; font-family:var(--display); font-size:18px; color:var(--oxblood); margin-bottom:6px; }

  /* ---------- pin / center-stage ---------- */
  .center-stage{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
    background: radial-gradient(ellipse at top, rgba(110,36,18,0.06), transparent 60%), var(--paper);
  }
  .authcard{
    background: var(--card); border-radius:14px; border:1px solid var(--line);
    box-shadow: 0 18px 40px -14px rgba(36,24,17,0.32), 0 2px 4px rgba(36,24,17,0.1);
    padding:32px 36px 30px; width:100%; max-width:400px; text-align:center; position:relative;
  }
  .authcard h2{ font-family:var(--display); font-size:26px; font-weight:700; margin:6px 0 2px; color:var(--oxblood); }
  .authcard p.sub{ font-size:13px; color:#7a6f5c; margin:0 0 22px; }
  .backlink{ position:absolute; top:16px; left:16px; font-family:var(--display-text); font-weight:700; font-size:13px; color:#9a8f78; cursor:pointer; letter-spacing:0.3px; }
  .dots{ display:flex; gap:14px; justify-content:center; margin-bottom:22px; }
  .dots .dot-slot{ width:16px;height:16px;border-radius:50%; border:2px solid var(--gold-dim); background:transparent; transition: background .1s; }
  .dots .dot-slot.filled{ background:var(--gold-dim); }
  .dots.shake{ animation: shakeX .35s; }
  .dots.error .dot-slot{ border-color:var(--rust); }
  .dots.error .dot-slot.filled{ background:var(--rust); }
  @keyframes shakeX{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(7px); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(4px); } }
  .pinerr-msg{ min-height:18px; font-size:12px; color:var(--rust); margin:-14px 0 12px; font-weight:600; }
  .keypad{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .keypad button{
    font-family:var(--display); font-size:24px; font-weight:700; padding:16px 0; border-radius:10px;
    border:1px solid var(--line); background: var(--paper); color: var(--ink);
    box-shadow: 0 2px 0 rgba(36,24,17,0.08), 0 3px 6px rgba(36,24,17,0.08); cursor:pointer;
  }
  .keypad button:active{ transform: translateY(1px); box-shadow:none; background:var(--paper-dim); }
  .keypad button.wide{ font-size:16px; font-family:var(--display-text); font-weight:700; color:#8a7f68; }
  .keypad button.zero{ grid-column: 2; }

  /* ---------- admin ---------- */
  .admin-view{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .admin-topbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 22px; background:var(--paper-dim); border-bottom:1px solid var(--line); flex-shrink:0; flex-wrap:wrap; gap:10px; }
  .admin-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .admin-tabs button{
    font-family:var(--display-text); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.4px;
    padding:9px 15px; border-radius:8px; border:none; background:transparent; color:#7a6f5c; cursor:pointer;
  }
  .admin-tabs button.active{ background:var(--oxblood); color:var(--gold-light); }
  .admin-exit{ font-family:var(--display-text); font-weight:700; font-size:13px; background:var(--gold); color:var(--oxblood-deep); border:none; padding:9px 15px; border-radius:8px; cursor:pointer; }
  .admin-body{ flex:1; overflow-y:auto; padding:20px 26px 40px; }
  .admin-section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .admin-section-head h2{ font-family:var(--display); font-size:20px; color:var(--oxblood); margin:0; }
  .addbtn{ font-family:var(--display-text); font-weight:700; font-size:13px; background:var(--gold); color:var(--oxblood-deep); border:none; padding:10px 16px; border-radius:8px; cursor:pointer; }
  .datatable{ width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; box-shadow:0 1px 0 var(--line); margin-top:4px; }
  .datatable th{ text-align:left; font-family:var(--display-text); font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:#8a7f68; padding:10px 14px; background:var(--paper-dim); border-bottom:1px solid var(--line); }
  .datatable td{ padding:10px 14px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .datatable tr.inactive td{ color:#a89e8a; }
  .badge{ display:inline-block; font-family:var(--display-text); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; padding:3px 9px; border-radius:20px; }
  .badge.active{ background:var(--olive-dim); color:var(--olive); }
  .badge.inactive{ background:#eee; color:#999; }
  .badge.hold{ background:var(--rust-dim); color:var(--rust); }
  .chip{ display:inline-block; font-family:var(--display-text); font-weight:600; font-size:11.5px; padding:4px 10px; border-radius:20px; border:1.5px solid var(--line); color:#7a6f5c; cursor:pointer; margin:2px; background:var(--paper); }
  .chip.on{ background:var(--gold); border-color:var(--gold); color:var(--oxblood-deep); }
  .iconbtn{ border:none; background:transparent; cursor:pointer; font-size:13px; color:#8a7f68; font-family:var(--display-text); font-weight:700; text-decoration:underline; padding:2px 6px; }
  .iconbtn.danger{ color:var(--rust); }
  .inlineform{ background:var(--paper-dim); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:5px; min-width:120px; }
  .field label{ font-family:var(--display-text); font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:#8a7f68; font-weight:700; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=email], .field select{
    font-family:var(--mono); font-size:13px; padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  .field.err input{ border-color:var(--rust); }
  .formerr{ font-size:12px; color:var(--rust); font-weight:600; width:100%; }
  .formbtns{ display:flex; gap:8px; }
  .formbtns .save{ font-family:var(--display-text); font-weight:700; font-size:13px; background:var(--oxblood); color:var(--gold-light); border:none; padding:9px 16px; border-radius:7px; cursor:pointer; }
  .formbtns .cancel{ font-family:var(--display-text); font-weight:700; font-size:13px; background:transparent; color:#8a7f68; border:1.5px solid var(--line); padding:9px 16px; border-radius:7px; cursor:pointer; }
  .subhead{ font-family:var(--display-text); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--oxblood); margin:22px 0 8px; }
  .settingcard{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .hint{ font-size:12px; color:#8a7f68; line-height:1.5; }
  .statusline{ font-size:12px; color:#8a7f68; margin-top:4px; }
  .statusline.err{ color:var(--rust); }
  .jobrow-detail{ background:var(--paper-dim); border-top:1px dashed var(--line); padding:14px 16px; }

  /* ---------- manual override editing ---------- */
  .manual-badge{ display:inline-block; background:var(--steel); color:#fff; font-size:9px; font-weight:800; border-radius:3px; padding:0 4px; margin-left:3px; vertical-align:middle; }
  td.editable-cell{ position:relative; cursor:pointer; }
  td.editable-cell:hover{ background:var(--steel-dim); }
  td.editable-cell .editpencil{ position:absolute; top:4px; right:6px; font-size:11px; color:#b9ae95; opacity:0; }
  td.editable-cell:hover .editpencil{ opacity:1; }
  .celleditor{ background:var(--card); border:2px solid var(--steel); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
  .celleditor h3{ font-family:var(--display); font-size:18px; color:var(--steel); margin:0 0 10px; }
  .editorline{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .editorline select, .editorline input[type=number]{ font-family:var(--mono); font-size:12.5px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); }

  /* ---------- print ---------- */
  .print-only{ display:none; }
  @media print{
    body{ overflow:visible; }
    .no-print{ display:none !important; }
    #app{ height:auto; }
    main.board{ overflow:visible; padding:0; }
    .print-only{ display:block; }
    .print-emp-page{ page-break-after:always; padding:18px; }
    .print-emp-page:last-child{ page-break-after:auto; }
    .print-emp-page h2{ font-family:var(--display); font-size:26px; color:var(--oxblood); margin:0 0 2px; }
    .print-emp-page .print-sub{ font-family:var(--mono); font-size:12px; color:#666; margin-bottom:14px; }
    .print-emp-page table{ width:100%; border-collapse:collapse; }
    .print-emp-page th{ text-align:left; font-family:var(--display-text); font-size:11px; text-transform:uppercase; border-bottom:2px solid var(--ink); padding:6px 8px; }
    .print-emp-page td{ padding:8px; border-bottom:1px solid #ccc; vertical-align:top; font-size:13px; }
    .print-emp-page .print-total{ font-weight:800; }
  }
</style>
</head>

<!-- ============================================================================
     FIREBASE - reuses the same shop Firebase project as Kairos (the timeclock),
     since Firebase client config values aren't secret (access is controlled by
     Firestore rules + auth, not by hiding these). Lanko Minerva writes to its own
     collection ("minerva_state") so its data never collides with Kairos's
     ("kairos_state") in the same project. If you'd rather keep them fully
     separate, create a second Firebase project and swap FIREBASE_CONFIG below.
     ============================================================================ -->
<style>
  /* ---------- office sign-in gate ----------
     Full-cover overlay rather than an inline form, so no part of the app renders
     before there is a real account behind it. Uses the same tokens as everything
     else. Hidden from print. */
  #authgate{ position:fixed; inset:0; z-index:9999; background:var(--oxblood-deep);
    display:flex; align-items:center; justify-content:center; padding:24px; }
  #authgate[hidden]{ display:none; }
  #authgate .box{ background:var(--card); border:1px solid var(--gold-dim); border-radius:6px;
    padding:26px 28px 22px; width:100%; max-width:390px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.6); }
  #authgate .eyebrow{ font-family:var(--mono); font-size:10px; font-weight:600;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px; }
  #authgate h1{ font-family:var(--display); font-weight:800; font-size:27px; line-height:1;
    margin:0 0 6px; text-transform:uppercase; letter-spacing:0.01em; color:var(--oxblood); }
  #authgate p.sub{ font-family:var(--body); font-size:13px; color:#8a7f68;
    margin:0 0 18px; line-height:1.5; }
  #authgate label{ display:block; font-family:var(--display-text); font-weight:700; font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.07em; color:#7a6f5c; margin:0 0 5px; }
  #authgate input{ width:100%; font-family:var(--body); font-size:15px; padding:10px 12px;
    border:1.5px solid var(--line); border-radius:4px; background:var(--paper);
    color:var(--ink); margin-bottom:14px; }
  #authgate input:focus{ outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold-dim); }
  #authgate button.go{ width:100%; font-family:var(--display-text); font-weight:700; font-size:15px;
    text-transform:uppercase; letter-spacing:0.06em; padding:12px; border:none; border-radius:4px;
    background:var(--oxblood); color:var(--gold-light); cursor:pointer; }
  #authgate button.go:disabled{ opacity:0.6; cursor:default; }
  #authgate .err{ font-family:var(--body); font-size:13px; color:var(--rust);
    background:var(--rust-dim); border-radius:4px; padding:9px 11px; margin-bottom:12px;
    line-height:1.45; }
  #authgate .err[hidden]{ display:none; }

  /* who is signed in, plus the way out. Free-standing because Minerva rebuilds its
     header markup on every render. */
  #whoami{ position:fixed; left:12px; bottom:12px; z-index:900;
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.04em;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; color:#8a7f68; display:flex; gap:9px; align-items:center;
    box-shadow:0 2px 8px rgba(36,24,17,0.08); }
  #whoami[hidden]{ display:none; }
  #whoami button{ font-family:var(--display-text); font-weight:700; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.06em; background:none; border:none;
    color:var(--oxblood); cursor:pointer; padding:0; }
  #whoami button:hover{ text-decoration:underline; }
  @media print{ #whoami, #authgate{ display:none !important; } }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAJ4bTrYJKD0cEXu2JkiQbtsrCbiMYu8zg",
    authDomain: "lanko-kairos-cbbcd.firebaseapp.com",
    projectId: "lanko-kairos-cbbcd",
    storageBucket: "lanko-kairos-cbbcd.firebasestorage.app",
    messagingSenderId: "40770664322",
    appId: "1:40770664322:web:71b865076a1f8b6f15419b"
  };
  firebase.initializeApp(FIREBASE_CONFIG);
  var firebaseDb = firebase.firestore();
  firebaseDb.enablePersistence({ synchronizeTabs: false }).catch(function(e){
    console.warn('Firestore offline persistence not enabled:', e.code);
  });

  /* ---------- office sign-in ----------
     These apps are static files on a public URL, so the only real boundary around
     the shop's data is the Firestore rules, and those rules distinguish a real
     account from an anonymous session. This is where that account is obtained.

     Kairos is deliberately NOT gated: shop tablets have no keyboard, and the
     rules keep kairos_state open to anonymous sessions for exactly that reason. */
  function authFriendlyError(code){
    switch(code){
      case 'auth/invalid-email':        return 'That does not look like an email address.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':   return 'Email or password not recognised.';
      case 'auth/user-disabled':        return 'That account has been disabled in Firebase.';
      case 'auth/too-many-requests':    return 'Too many attempts. Wait a few minutes and try again.';
      case 'auth/network-request-failed': return 'No connection. Check the internet and try again.';
      case 'auth/operation-not-allowed': return 'Email sign-in is not switched on for this Firebase project yet.';

    }
  }

  function buildAuthGate(appName, subtitle){
    var g = document.createElement('div');
    g.id = 'authgate';
    g.hidden = true;
    g.innerHTML =
      '<div class="box">' +
        '<div class="eyebrow">Lanko</div>' +
        '<h1>' + appName + '</h1>' +
        '<p class="sub">' + subtitle + '</p>' +
        '<div class="err" id="agErr" hidden></div>' +
        '<label for="agEmail">Email</label>' +
        '<input type="email" id="agEmail" autocomplete="username" autocapitalize="off" spellcheck="false">' +
        '<label for="agPass">Password</label>' +
        '<input type="password" id="agPass" autocomplete="current-password">' +
        '<button class="go" id="agGo">Sign in</button>' +
      '</div>';
    document.body.appendChild(g);

    var err = g.querySelector('#agErr');
    var email = g.querySelector('#agEmail');
    var pass = g.querySelector('#agPass');
    var go = g.querySelector('#agGo');

    function fail(msg){
      err.textContent = msg; err.hidden = false;
      go.disabled = false; go.textContent = 'Sign in';
    }
    function submit(){
      var e = email.value.trim(), p = pass.value;
      if(!e || !p){ fail('Enter both an email and a password.'); return; }
      err.hidden = true;
      go.disabled = true; go.textContent = 'Signing in...';
      firebase.auth().signInWithEmailAndPassword(e, p).catch(function(ex){
        fail(authFriendlyError(ex.code || 'unknown'));
        pass.value = '';
        pass.focus();
      });
    }
    go.onclick = submit;
    [email, pass].forEach(function(el){
      el.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') submit(); });
    });
    return g;
  }

  function buildWhoami(){
    var w = document.createElement('div');
    w.id = 'whoami';
    w.hidden = true;
    w.innerHTML = '<span id="waWho"></span><button id="waOut">Sign out</button>';
    document.body.appendChild(w);
    w.querySelector('#waOut').onclick = function(){
      firebase.auth().signOut();
    };
    return w;
  }

  var firebaseAuthReady = (function(){
    var resolveReady, resolved = false;
    var ready = new Promise(function(res){ resolveReady = res; });

    var gate = buildAuthGate('Minerva', 'The planner is office-only. Sign in with your Lanko account.');
    var who = buildWhoami();

    firebase.auth().onAuthStateChanged(function(user){
      var real = user && !user.isAnonymous;
      gate.hidden = !!real;
      who.hidden = !real;
      if(real){
        who.querySelector('#waWho').textContent = user.email || 'signed in';
        // Resolve once. A later sign-out leaves the app loaded behind the overlay
        // rather than tearing it down, and signing back in simply lifts the cover.
        if(!resolved){ resolved = true; resolveReady(user); }
      } else {
        var f = gate.querySelector('#agEmail');
        if(f) f.focus();
      }
    });
    return ready;
  })();

  function priorityComparator(a,b){

        remaining[jobId+'|'+skill] -= hours;

      // day IS their day, in full -- not blended with the algorithm, and not subject to

          var favored = (favoredFor[job.id]||[]).filter(function(id){ return canWork(id) && stickyHere.indexOf(id)===-1; });
          var pool = employees.map(function(e){return e.id;}).filter(function(id){
            return canWork(id) && stickyHere.indexOf(id)===-1 && favored.indexOf(id)===-1;
          });
          stickyHere.concat(favored, pool).forEach(function(empId){
            if(need <= 0.001) return;
            if(freeCapacity[empId] <= 0.001) return;
            var take = Math.min(freeCapacity[empId], need);
            if(take > 0.001){
              logAssign(empId, job.id, skill, take);
              need -= take;
              sticky[empId] = { jobId: job.id, skill: skill };
            }
          });
        });
      });
    });

    return { schedule: schedule, remaining: remaining };
  }

  /* ---------------- storage (Firestore) ----------------
     Same pattern as Kairos: each K key maps to one document in the "minerva_state"
     collection, holding {value, updatedAt}. Real-time listeners push changes between any
     devices open on this page (e.g. a shop-floor monitor and the office computer). */
  var FS_COLLECTION = 'minerva_state';
  function fsDoc(key){ return firebaseDb.collection(FS_COLLECTION).doc(key); }
  function safeGetJSON(key, fallback){
    return fsDoc(key).get().then(function(snap){
      if(!snap.exists || snap.data().value===undefined) return fallback;
      return snap.data().value;
    }).catch(function(e){ console.error('firestore get failed', key, e); return fallback; });
  }
  function safeSetJSON(key, value){
    return fsDoc(key).set({ value: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(function(){ return true; })
      .catch(function(e){ console.error('firestore set failed', key, e); return false; });
  }
  function mutateLocal(key, currentList, mutatorFn){
    var updated = mutatorFn(currentList);
    return safeSetJSON(key, updated).then(function(){ return updated; });
  }

  /* ---------------- Google Sheet sync (jobs + employees) ----------------
     Same JSONP-via-gviz technique as Kairos: a <script> tag pointed at Google's
     visualization-query endpoint isn't subject to CORS (it's a script load, not fetch),
     which is what makes reading a "Anyone with the link can view" sheet possible with no
     backend at all. Falls back to plain fetch() only for a directly-supplied CSV/
     "Publish to web" URL. */
  function parseCSV(text){
    var rows=[], row=[], field='', inQuotes=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQuotes){
        if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
        else { field+=c; }
      } else {
        if(c==='"'){ inQuotes=true; }
        else if(c===','){ row.push(field); field=''; }
        else if(c==='\r'){ }
        else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else { field+=c; }
      }
    }
    if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    return rows;
  }
  function parseSheetInput(input){
    input=(input||'').trim();
    if(/output=csv/.test(input) || /\.csv(\?|$)/.test(input)){ return {directUrl:input}; }
    var idMatch = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    var gidMatch = input.match(/gid=(\d+)/);
    if(!idMatch) return null;
    return { sheetId:idMatch[1], gid: gidMatch?gidMatch[1]:'0', directUrl:null };
  }
  var jsonpSeq = 0;
  function fetchGvizJSONP(sheetId, gid){
    return new Promise(function(resolve, reject){
      var cbName = '__lbJSONP_'+(jsonpSeq++)+'_'+Date.now();
      var settled=false, scriptEl=null;
      var timeoutId = setTimeout(function(){ finish(false, new Error('timeout')); }, 12000);
      function cleanup(){
        try{ window[cbName]=undefined; delete window[cbName]; }catch(e){}
        if(scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
      }
      function finish(success, value){
        if(settled) return; settled=true; clearTimeout(timeoutId); cleanup();
        if(success) resolve(value); else reject(value);
      }
      window[cbName] = function(data){ finish(true, data); };
      scriptEl = document.createElement('script');
      scriptEl.src = 'https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?gid='+(gid||'0')+
        '&tqx=responseHandler:'+cbName+'&_ts='+Date.now();
      scriptEl.onerror = function(){ finish(false, new Error('script load error')); };
      document.head.appendChild(scriptEl);
    });
  }
  function visualizationTableToRows(data){
    if(!data || !data.table || !Array.isArray(data.table.rows)) return [];
    return data.table.rows.map(function(r){
      return (r.c||[]).map(function(cell){
        if(cell==null) return '';
        var v = (cell.f!=null) ? cell.f : cell.v;
        return (v==null) ? '' : String(v);
      });
    });
  }
  function fetchSheetRows(src){
    if(src.directUrl){
      if(typeof fetch==='undefined') return Promise.resolve({error:"This browser doesn't support fetching sheets."});
      var url = src.directUrl + (src.directUrl.indexOf('?')===-1?'?':'&') + '_ts=' + Date.now();
      return fetch(url, {cache:'no-store'})
        .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); })
        .then(function(text){ return { rows: parseCSV(text) }; })
        .catch(function(){ return { error: "Could not reach that CSV link. Double check it's still valid and publicly accessible." }; });
    }
    return fetchGvizJSONP(src.sheetId, src.gid)
      .then(function(data){
        if(!data || data.status!=='ok') return { error: 'Google reported an error reading this sheet/tab. Double-check the link and that sharing is set to "Anyone with the link can view."' };
        return { rows: visualizationTableToRows(data) };
      })
      .catch(function(){ return { error: 'Could not reach the sheet. Make sure sharing is "Anyone with the link can view," and that this device has internet access.' }; });
  }

  // Jobs sheet: expects columns for job#, description, due date (configurable indices).
  // Matches existing sheet-sourced jobs by job# (stable id for re-syncing), adds new ones,
  // deactivates ones no longer present. Manually-added jobs (source !== 'sheet') untouched.
  function reconcileJobsFromSheet(list, rows, src){
    var jobNumCol = Math.max(0,(src.jobNumColumnIndex||1)-1);
    var descCol = src.descColumnIndex>0 ? src.descColumnIndex-1 : null;
    var dueCol = src.dueDateColumnIndex>0 ? src.dueDateColumnIndex-1 : null;
    var dataRows = src.hasHeader!==false ? rows.slice(1) : rows;
    var out = list.map(function(j){ return Object.assign({}, j); });
    var outByNum = {};
    out.forEach(function(j){ outByNum[j.jobNum] = j; });
    var seen = {};
    dataRows.forEach(function(r){
      var jobNum = (r[jobNumCol]||'').trim();
      if(!jobNum) return;
      seen[jobNum] = true;
      var desc = descCol!=null ? (r[descCol]||'').trim() : '';
      var due = dueCol!=null ? (r[dueCol]||'').trim() : '';
      var dueISO = due ? normalizeDateStr(due) : null;
      var existing = outByNum[jobNum];
      if(existing){
        existing.active = true; existing.source = 'sheet';
        if(desc) existing.desc = desc;
        if(dueISO) existing.dueDate = dueISO;
      } else {
        var job = { id: uid('job'), jobNum: jobNum, desc: desc||jobNum, dueDate: dueISO,
          hours: blankHours(), remaining: blankHours(), materialsHold: null, priorityOverride: null,
          active: true, source: 'sheet' };
        out.push(job); outByNum[jobNum] = job;
      }
    });
    out.forEach(function(j){ if(j.source==='sheet' && !seen[j.jobNum]) j.active = false; });
    return out;
  }
  function normalizeDateStr(s){
    var d = new Date(s);
    if(isNaN(d.getTime())) return null;
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function syncJobsFromSheet(manualTrigger){
    if(!STATE.jobSource) return Promise.resolve();
    var js = STATE.jobSource;
    if(!js.directUrl && !js.sheetId) return Promise.resolve();
    STATE.jobSyncStatus = 'syncing';
    if(manualTrigger) render();
    return fetchSheetRows(js).then(function(result){
      if(result.error){
        STATE.jobSyncStatus='error'; STATE.jobSyncError=result.error;
        if(manualTrigger) render();
        return;
      }
      return mutateLocal(K.jobs, STATE.jobs, function(list){ return reconcileJobsFromSheet(list, result.rows, js); })
        .then(function(updated){
          STATE.jobs = updated;
          STATE.jobSyncStatus='ok'; STATE.jobSyncError=null;
          STATE.jobSource = Object.assign({}, STATE.jobSource, {lastSyncAt: new Date().toISOString()});
          return safeSetJSON(K.jobSource, STATE.jobSource);
        }).then(function(){ if(manualTrigger) render(); });
    });
  }
  // Employees sheet: name, pool (fab/assembly/draftorder), skills (comma-separated).
  function reconcileEmployeesFromSheet(list, rows, src){
    var nameCol = Math.max(0,(src.nameColumnIndex||1)-1);
    var poolCol = src.poolColumnIndex>0 ? src.poolColumnIndex-1 : null;
    var skillsCol = src.skillsColumnIndex>0 ? src.skillsColumnIndex-1 : null;
    var dataRows = src.hasHeader!==false ? rows.slice(1) : rows;
    var out = list.map(function(e){ return Object.assign({}, e); });
    var outByName = {};
    out.forEach(function(e){ outByName[e.name.toLowerCase()] = e; });
    var seen = {};
    dataRows.forEach(function(r){
      var name = (r[nameCol]||'').trim();
      if(!name) return;
      var key = name.toLowerCase();
      seen[key] = true;
      var pool = poolCol!=null ? (r[poolCol]||'').trim().toLowerCase() : '';
      if(['fab','assembly','draftorder'].indexOf(pool)===-1) pool = 'fab';
      var skills = skillsCol!=null ? (r[skillsCol]||'').split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean) : [];
      var existing = outByName[key];
      if(existing){
        existing.active = true; existing.source = 'sheet';
        if(pool) existing.pool = pool;
        if(skills.length) existing.skills = skills;
      } else {
        var emp = { id: uid('emp'), name:name, pool: pool||'fab', skills: skills.length?skills:['fitting','welding'],
          otPolicy: pool==='fab'?'flex':'limited', active:true, startDate:null, source:'sheet' };
        out.push(emp); outByName[key]=emp;
      }
    });
    out.forEach(function(e){ if(e.source==='sheet' && !seen[e.name.toLowerCase()]) e.active = false; });
    return out;
  }
  function syncEmployeesFromSheet(manualTrigger){
    if(!STATE.employeeSource) return Promise.resolve();
    var es = STATE.employeeSource;
    if(!es.directUrl && !es.sheetId) return Promise.resolve();
    STATE.empSyncStatus = 'syncing';
    if(manualTrigger) render();
    return fetchSheetRows(es).then(function(result){
      if(result.error){
        STATE.empSyncStatus='error'; STATE.empSyncError=result.error;
        if(manualTrigger) render();
        return;
      }
      return mutateLocal(K.employees, STATE.employees, function(list){ return reconcileEmployeesFromSheet(list, result.rows, es); })
        .then(function(updated){
          STATE.employees = updated;
          STATE.empSyncStatus='ok'; STATE.empSyncError=null;
          STATE.employeeSource = Object.assign({}, STATE.employeeSource, {lastSyncAt: new Date().toISOString()});
          return safeSetJSON(K.employeeSource, STATE.employeeSource);
        }).then(function(){ if(manualTrigger) render(); });
    });
  }

  /* ---------------- output: local CSV, Apps Script sheet-write, Apps Script email ----------------
     Same design as Kairos: a deployed Google Apps Script Web App URL is the one piece of
     "backend" this static page needs for anything beyond local download. The client POSTs
     JSON to it; a doPost(e) function on the Apps Script side (see the companion .gs file)
     branches on a "type" field to either append rows to a sheet or send an email. no-cors +
     credentials:'include' is required for the same reason noted in Kairos: a Workspace-
     restricted deployment needs the signed-in Google session's cookies to authenticate, and
     script.google.com doesn't return CORS headers for a normal cross-origin fetch to read
     the response either way -- so success here means "didn't throw," not a read response. */
  var EXPORT_HEADER = ['Job #','Description','Due Date','Employee','Day','Skill','Hours'];
  function buildScheduleExportRows(weekDates, employees, results){
    var rows = [];
    ['fab','assembly','draftorder'].forEach(function(poolKey){
      var res = results[poolKey];
      employees.filter(function(e){ return e.pool===poolKey; }).forEach(function(emp){
        weekDates.forEach(function(d){
          (res.schedule[emp.id][d]||[]).forEach(function(entry){
            var job = STATE.jobs.filter(function(j){ return j.id===entry.jobId; })[0] || {};
            rows.push([entry.jobNum, job.desc||'', job.dueDate?fmtDate(job.dueDate):'backlog', emp.name, weekdayShort(d), SKILL_LABEL[entry.skill]||entry.skill, entry.hours]);
          });
        });
      });
    });
    return rows;
  }
  function onCSVExport(weekDates, employees, results){
    var rows = buildScheduleExportRows(weekDates, employees, results);
    function csvEscape(v){ var s=String(v); return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
    var csv = [EXPORT_HEADER].concat(rows).map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'lanko-minerva_week_'+weekDates[0]+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  /* ---------------- publish schedule for Kairos ----------------
     Kairos (the timeclock) and Minerva share the same Firebase project. This writes a
     simplified "who's on what, which day" map -- keyed by employee NAME, since that's the
     one thing guaranteed to line up between two apps with otherwise independent employee
     records -- to a doc Kairos can read on its own, without needing Minerva's scheduling
     engine. Kairos uses it to suggest a job when someone clocks in. Publishing is a manual
     action (like the other outputs here) so it's predictable when Kairos's suggestions
     actually update. */
  function publishScheduleForKairos(weekDates, employees, results){
    var byName = {};
    employees.forEach(function(emp){
      var res = results[emp.pool];
      var byDate = {};
      weekDates.forEach(function(d){
        var entries = res.schedule[emp.id][d] || [];
        if(entries.length===0) return;
        byDate[d] = entries.map(function(en){
          var job = STATE.jobs.filter(function(j){ return j.id===en.jobId; })[0] || {};
          return { jobNum: en.jobNum, jobDesc: job.desc||'', skill: en.skill, hours: en.hours };
        });
      });
      if(Object.keys(byDate).length) byName[emp.name] = byDate;
    });
    var payload = { weekStart: STATE.weekStart, updatedAt: new Date().toISOString(), byName: byName };
    STATE.publishStatus = 'sending'; render();
    safeSetJSON(K.publishedSchedule, payload).then(function(ok){
      STATE.publishStatus = ok ? 'ok' : 'error';
      STATE.publishedAt = ok ? payload.updatedAt : STATE.publishedAt;
      render();
    });
  }

  function onSendScheduleToSheet(weekDates, employees, results){
    if(!STATE.sheetWriteUrl) return;
    var rows = buildScheduleExportRows(weekDates, employees, results);
    if(rows.length===0){ alert('Nothing scheduled this week to send.'); return; }
    if(typeof fetch==='undefined'){ STATE.sheetWriteStatus='error'; STATE.sheetWriteError="This browser doesn't support sending data."; render(); return; }
    STATE.sheetWriteStatus='sending'; STATE.sheetWriteError=null; render();
    fetch(STATE.sheetWriteUrl, {
      method:'POST', mode:'no-cors', credentials:'include',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ type:'appendRows', sheetName:'Lanko Minerva Schedule', header: EXPORT_HEADER, rows: rows })
    }).then(function(){
      STATE.sheetWriteStatus='ok'; STATE.sheetWriteError=null;
      STATE.sheetWriteLastSentAt = new Date().toISOString();
      return safeSetJSON(K.sheetWrite, {url: STATE.sheetWriteUrl, lastSentAt: STATE.sheetWriteLastSentAt});
    }).then(function(){ render(); }).catch(function(){
      STATE.sheetWriteStatus='error';
      STATE.sheetWriteError='Could not reach the script at all. Double-check the Web App URL and that this device is signed into the right Google account.';
      render();
    });
  }
  function onEmailSchedule(weekDates, employees, results){
    if(!STATE.sheetWriteUrl) return;
    var email = (STATE.emailInput||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ STATE.emailError='Enter a valid email address.'; render(); return; }
    var lines = [];
    ['fab','assembly','draftorder'].forEach(function(poolKey){
      lines.push('', POOL_LABEL[poolKey].toUpperCase());
      var res = results[poolKey];
      employees.filter(function(e){ return e.pool===poolKey; }).forEach(function(emp){
        var total = 0;
        var dayLines = weekDates.map(function(d){
          var entries = res.schedule[emp.id][d]||[];
          total += entries.reduce(function(s,en){ return s+en.hours; }, 0);
          if(entries.length===0) return weekdayShort(d)+': -';
          return weekdayShort(d)+': '+entries.map(function(en){ return en.jobNum+' '+SKILL_LABEL[en.skill]+' ('+en.hours+'h)'; }).join(', ');
        });
        lines.push(emp.name+' -- '+total+'h total');
        dayLines.forEach(function(l){ lines.push('  '+l); });
      });
    });
    var body = 'Lanko Minerva schedule for week of '+fmtDate(weekDates[0])+'\n'+lines.join('\n');
    STATE.emailStatus='sending'; STATE.emailError=null; render();
    fetch(STATE.sheetWriteUrl, {
      method:'POST', mode:'no-cors', credentials:'include',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ type:'sendEmail', to: email, subject: 'Lanko Minerva schedule - week of '+fmtDate(weekDates[0]), body: body })
    }).then(function(){
      STATE.emailStatus='ok'; STATE.emailError=null; STATE.emailFormOpen=false; render();
    }).catch(function(){
      STATE.emailStatus='error'; STATE.emailError='Could not reach the script. Check the Google Sheet / Apps Script setup in Settings.'; render();
    });
  }

  /* ---------------- computed results (recomputed whenever anything relevant changes) ---------------- */
  function computeResults(){
    var weekDates = businessDatesOfWeek(STATE.weekStart);
    var activeEmployees = STATE.employees.filter(function(e){ return e.active !== false; });
    var activeJobs = STATE.jobs.filter(function(j){ return j.active !== false; });
    var weekOverrides = STATE.manualOverrides[STATE.weekStart] || {};
    var out = {};
    ['fab','assembly','draftorder'].forEach(function(poolKey){
      var poolEmployees = activeEmployees.filter(function(e){ return e.pool===poolKey; });
      out[poolKey] = scheduleWeek({ weekDates:weekDates, employees:poolEmployees, jobs:activeJobs,
        preferences:STATE.preferences, pins:STATE.pins, restrictions:STATE.restrictions, calendar:STATE.calendar,
        manualOverrides:weekOverrides });
    });
    return { weekDates: weekDates, results: out, employees: activeEmployees };
  }

  /* ---------------- render dispatch ---------------- */
  function render(){
    var stage = document.getElementById('stage');
    var topbarRight = document.getElementById('topbarRight');
    switch(STATE.view){
      case 'setup': stage.innerHTML = renderSetup(); topbarRight.innerHTML=''; break;
      case 'board': stage.innerHTML = renderBoard(); topbarRight.innerHTML = renderTopbarRight(); break;
      case 'adminpin': stage.innerHTML = renderAdminPin(); topbarRight.innerHTML=''; break;
      case 'admin': stage.innerHTML = renderAdmin(); topbarRight.innerHTML=''; break;
      default: stage.innerHTML = '<div class="center-stage"><div style="text-align:center;color:#8a7f68;font-family:var(--display-text);font-weight:700;">Loading&hellip;</div></div>'; topbarRight.innerHTML='';
    }
  }

      '<button data-action="week-prev">&#8592;</button>'+

      '<button data-action="week-next">&#8594;</button>'+
      '</div>'+
      '<button class="gearbtn" data-action="open-gear" aria-label="Admin"><span class="gearicon">&#9881;</span>Admin</button>';
  }

  /* ---------------- first-run admin PIN setup ---------------- */
  function renderSetup(){

    return '<div class="center-stage"><div class="authcard">'+
      '<h2>Welcome to Lanko Minerva</h2>'+

      '<div class="dots '+(STATE.setupError?'error shake':'')+'">'+dots+'</div>'+
      '<div class="pinerr-msg">'+(STATE.setupError?"PINs didn't match &mdash; try again.":'')+'</div>'+
      '<div class="keypad">'+
        [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-action="setup-digit" data-id="'+n+'">'+n+'</button>'; }).join('')+
        '<button class="wide" data-action="setup-back">&#9003;</button>'+

  function onSetupDigit(d){

  /* ---------------- admin PIN gate ---------------- */
  function renderAdminPin(){

    return '<div class="center-stage"><div class="authcard">'+
      '<span class="backlink" data-action="adminpin-cancel">&larr; Back</span>'+

      '<div class="pinerr-msg">'+(STATE.adminPinError?'Wrong PIN &mdash; try again.':'')+'</div>'+
      '<div class="keypad">'+
        [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-action="adminpin-digit" data-id="'+n+'">'+n+'</button>'; }).join('')+
        '<button class="wide" data-action="adminpin-back">&#9003;</button>'+

  }
  function onAdminPinDigit(d){
    if(STATE.adminPinBuffer.length>=4) return;
    STATE.adminPinBuffer += d; STATE.adminPinError=false; render();
    if(STATE.adminPinBuffer.length===4) setTimeout(checkAdminPin, 180);

  function checkAdminPin(){
    if(STATE.adminPinBuffer === STATE.adminPin){
      STATE.adminPinBuffer=''; STATE.adminPinError=false; STATE.view='admin'; STATE.adminTab='roster'; render();
    } else {
      STATE.adminPinError=true; STATE.adminPinBuffer=''; render();
    }
  }
  function jobLegendForWeek(weekDates, employees, results){
    var ids = {};
    ['fab','assembly','draftorder'].forEach(function(poolKey){
      var res = results[poolKey];
      employees.filter(function(e){ return e.pool===poolKey; }).forEach(function(emp){
        weekDates.forEach(function(d){ (res.schedule[emp.id][d]||[]).forEach(function(en){ ids[en.jobId]=true; }); });
      });
    });
    return STATE.jobs.filter(function(j){ return ids[j.id]; }).sort(priorityComparator);
  }
  function dayCellHTML(entries){
    if(!entries || entries.length===0) return '<span class="daycell-empty">&mdash;</span>';

        (en.manual?' <span class="manual-badge" title="Manually set">M</span>':'')+'</div>';
    }).join('');

  function poolTableHTML(poolKey, weekDates, results, allEmployees, editable){
    var employees = allEmployees.filter(function(e){ return e.pool===poolKey; });
    var res = results[poolKey];
    var head = '<tr><th>Employee</th>'+weekDates.map(function(d){ return '<th>'+weekdayShort(d)+'</th>'; }).join('')+'<th>Total</th></tr>';
    var rows = employees.map(function(emp){
      var startsLater = emp.startDate && weekDates[0] < emp.startDate;
      var total = 0;
      weekDates.forEach(function(d){ (res.schedule[emp.id][d]||[]).forEach(function(en){ total += en.hours; }); });
      var cells = weekDates.map(function(d){
        if(startsLater && d < emp.startDate){
          return '<td><span class="notstarted">Not yet started<span class="beg">begins '+fmtDate(emp.startDate)+'</span></span></td>';
        }
        if(editable){
          return '<td class="editable-cell" data-action="edit-cell" data-id="'+emp.id+'" data-date="'+d+'">'+dayCellHTML(res.schedule[emp.id][d])+'<span class="editpencil">&#9998;</span></td>';
        }
        return '<td>'+dayCellHTML(res.schedule[emp.id][d])+'</td>';
      }).join('');
      return '<tr><td class="empname">'+esc(emp.name)+'</td>'+cells+'<td class="total">'+(Math.round(total*10)/10||0)+'</td></tr>';
    }).join('');
    if(employees.length===0) return '';
    return '<div class="pool-block"><div class="pool-head" style="background:'+POOL_HEX[poolKey]+';">'+esc(POOL_LABEL[poolKey])+'</div>'+
      '<table class="pool-table">'+head+rows+'</table></div>';
  }

      return '<div class="jchip"><b>'+esc(j.jobNum)+'</b> '+esc(j.desc)+' &middot; '+

      '<button class="addbtn" data-action="board-print">&#128424; Print Schedules</button>'+
      '<button class="addbtn" data-action="board-publish-kairos">'+(STATE.publishStatus==='sending'?'Publishing&hellip;':'Publish to Kairos')+'</button>'+
      (STATE.sheetWriteUrl ? '<button class="addbtn" data-action="board-send-sheet">'+

    } else if(STATE.publishStatus==='error'){

        '<button class="cancel" data-action="board-email-cancel">Cancel</button></div></div>';
    } else if(STATE.emailStatus==='ok'){
      emailForm = '<div class="hint" style="margin-bottom:14px;color:var(--olive);font-weight:600;">&#10003; Sent! Check the inbox in a minute.</div>';
    } else if(STATE.emailStatus==='error'){
      emailForm = '<div class="hint" style="margin-bottom:14px;color:var(--rust);font-weight:600;">&#9888; '+esc(STATE.emailError||'')+'</div>';
    }
    var sheetStatus = '';
    if(STATE.sheetWriteStatus==='ok' && STATE.sheetWriteLastSentAt){
      sheetStatus = '<div class="hint" style="margin-bottom:14px;color:var(--olive);font-weight:600;">&#10003; Last sent to sheet: '+fmtDateTime(STATE.sheetWriteLastSentAt)+'</div>';
    } else if(STATE.sheetWriteStatus==='error'){
      sheetStatus = '<div class="hint" style="margin-bottom:14px;color:var(--rust);font-weight:600;">&#9888; '+esc(STATE.sheetWriteError||'')+'</div>';
    }

      ? '<div class="empty-state"><b>No crew yet</b>Tap the gear icon above to add your team and job list.</div>'
      : poolTableHTML('fab', weekDates, results, activeEmployees)+poolTableHTML('assembly', weekDates, results, activeEmployees)+poolTableHTML('draftorder', weekDates, results, activeEmployees);
    return '<main class="board no-print">'+
      '<div class="board-heading"><h1>Week Schedule</h1><span>Generated live from current priorities, materials holds &amp; remaining hours</span></div>'+
      (legendHTML?'<div class="joblegend">'+legendHTML+'</div>':'')+
      outputBar+publishStatus+emailForm+sheetStatus+
      body+
      '</main>'+
      '<div class="print-only">'+buildPrintHTML(weekDates, activeEmployees, results)+'</div>';

  function buildPrintHTML(weekDates, employees, results){
    return employees.map(function(emp){
      var res = results[emp.pool];
      var total = 0;
      var rows = weekDates.map(function(d){
        var entries = res.schedule[emp.id][d] || [];
        total += entries.reduce(function(s,en){ return s+en.hours; }, 0);
        var desc = entries.length ? entries.map(function(en){
          return en.jobNum+' &mdash; '+esc(SKILL_LABEL[en.skill])+' ('+en.hours+'h)';
        }).join('<br>') : (emp.startDate && weekDates[0] < emp.startDate ? 'Not yet started' : 'No work scheduled');
        return '<tr><td>'+weekdayShort(d)+'</td><td>'+desc+'</td></tr>';
      }).join('');
      return '<div class="print-emp-page">'+
        '<h2>'+esc(emp.name)+'</h2>'+
        '<div class="print-sub">'+esc(POOL_LABEL[emp.pool])+' &middot; Week of '+fmtDate(weekDates[0])+'</div>'+
        '<table><thead><tr><th>Day</th><th>Assignment</th></tr></thead><tbody>'+rows+
        '<tr><td><b>Total</b></td><td class="print-total">'+(Math.round(total*10)/10)+'h</td></tr>'+
        '</tbody></table></div>';
    }).join('');
  }

  var pendingSkills = null; // while the employee form is open, tracks the in-progress skill chip selection
  function onAdminEmpNew(){ STATE.employeeFormOpen=true; STATE.editingEmployeeId=null; STATE.employeeFormError=null; pendingSkills=['fitting','welding']; render(); }
  function onAdminEmpEdit(id){
    STATE.employeeFormOpen=true; STATE.editingEmployeeId=id; STATE.employeeFormError=null;
    var emp = STATE.employees.filter(function(e){return e.id===id;})[0];
    pendingSkills = emp ? emp.skills.slice() : [];
    render();
  }
  function onEmpFormToggleSkill(sk){
    if(!pendingSkills) pendingSkills = [];
    var idx = pendingSkills.indexOf(sk);
    if(idx===-1) pendingSkills.push(sk); else pendingSkills.splice(idx,1);
    // re-render just the chip states without losing typed field values: read current inputs first
    var nameVal = document.getElementById('empNameInput') ? document.getElementById('empNameInput').value : '';
    var poolVal = document.getElementById('empPoolInput') ? document.getElementById('empPoolInput').value : 'fab';
    var startVal = document.getElementById('empStartInput') ? document.getElementById('empStartInput').value : '';
    render();
    var n = document.getElementById('empNameInput'); if(n) n.value = nameVal;
    var p = document.getElementById('empPoolInput'); if(p) p.value = poolVal;
    var s = document.getElementById('empStartInput'); if(s) s.value = startVal;

  function onAdminEmpSave(id){
    var name = document.getElementById('empNameInput').value.trim();
    var pool = document.getElementById('empPoolInput').value;
    var startDate = document.getElementById('empStartInput').value || null;
    if(!name){ STATE.employeeFormError='Name is required.'; render(); return; }
    var skills = (pendingSkills&&pendingSkills.length) ? pendingSkills.slice() : ['fitting','welding'];
    var otPolicy = pool==='fab' ? 'flex' : 'limited';
    mutateLocal(K.employees, STATE.employees, function(list){
      if(id){
        return list.map(function(e){ return e.id===id ? Object.assign({}, e, {name:name, pool:pool, skills:skills, startDate:startDate, otPolicy:otPolicy}) : e; });
      }
      return list.concat([{ id:uid('emp'), name:name, pool:pool, skills:skills, otPolicy:otPolicy, active:true, startDate:startDate, source:'manual' }]);
    }).then(function(updated){
      STATE.employees = updated; STATE.employeeFormOpen=false; STATE.editingEmployeeId=null; STATE.employeeFormError=null; pendingSkills=null; render();
    });
  }
  function onAdminEmpToggle(id){
    mutateLocal(K.employees, STATE.employees, function(list){
      return list.map(function(e){ return e.id===id ? Object.assign({}, e, {active: !e.active}) : e; });
    }).then(function(updated){ STATE.employees = updated; render(); });
  }
  function onAdminEmpDelete(id){
    if(!confirm('Remove this person from the roster?')) return;
    mutateLocal(K.employees, STATE.employees, function(list){ return list.filter(function(e){ return e.id!==id; }); })
      .then(function(updated){ STATE.employees = updated; render(); });
    mutateLocal(K.pins, STATE.pins, function(list){ return list.filter(function(p){ return p.employeeId!==id; }); })

  function onAdminJobDelete(id){

      .then(function(updated){ STATE.jobs = updated; if(STATE.expandedJobId===id) STATE.expandedJobId=null; render(); });
  }
  function onAdminJobReactivate(id){
    mutateLocal(K.jobs, STATE.jobs, function(list){

  function onJobToggleFavored(jobId, empId){
    mutateLocal(K.preferences, STATE.preferences, function(list){
      var existing = list.filter(function(p){ return p.jobId===jobId; })[0];
      var cur = existing ? existing.favoredEmployeeIds : [];
      var next = cur.indexOf(empId)!==-1 ? cur.filter(function(x){return x!==empId;}) : cur.concat([empId]);
      var rest = list.filter(function(p){ return p.jobId!==jobId; });
      return next.length ? rest.concat([{jobId:jobId, favoredEmployeeIds:next}]) : rest;
    }).then(function(updated){ STATE.preferences = updated; render(); });
  }
  function onJobToggleRestricted(jobId, empId){
    mutateLocal(K.restrictions, STATE.restrictions, function(map){
      var cur = map[jobId] || [];
      var next = cur.indexOf(empId)!==-1 ? cur.filter(function(x){return x!==empId;}) : cur.concat([empId]);
      var out = Object.assign({}, map);
      if(next.length) out[jobId] = next; else delete out[jobId];
      return out;
    }).then(function(updated){ STATE.restrictions = updated; render(); });
  }

  /* ---------------- event handlers: sync sources ---------------- */
  function onSourceSave(kind){
    var isJob = kind==='job';
    var prefix = isJob ? 'jobsource' : 'empsource';
    var urlRaw = document.getElementById(prefix+'UrlInput').value.trim();
    var parsed = parseSheetInput(urlRaw);
    if(!parsed){
      if(isJob) STATE.jobSourceError = "That doesn't look like a Google Sheets link."; else STATE.employeeSourceError = "That doesn't look like a Google Sheets link.";
      render(); return;
    }
    var col1 = parseInt(document.getElementById(prefix+'Col1').value,10)||1;
    var col2raw = document.getElementById(prefix+'Col2').value.trim();
    var col3raw = document.getElementById(prefix+'Col3').value.trim();
    var hasHeader = document.getElementById(prefix+'HeaderCheckbox').checked;
    var src = isJob ?
      Object.assign({}, parsed, { inputUrl:urlRaw, jobNumColumnIndex:col1, descColumnIndex: col2raw?parseInt(col2raw,10):0, dueDateColumnIndex: col3raw?parseInt(col3raw,10):0, hasHeader:hasHeader, lastSyncAt:null }) :
      Object.assign({}, parsed, { inputUrl:urlRaw, nameColumnIndex:col1, poolColumnIndex: col2raw?parseInt(col2raw,10):0, skillsColumnIndex: col3raw?parseInt(col3raw,10):0, hasHeader:hasHeader, lastSyncAt:null });
    if(isJob){ STATE.jobSource = src; STATE.jobSourceFormOpen=false; STATE.jobSourceError=null; }
    else { STATE.employeeSource = src; STATE.employeeSourceFormOpen=false; STATE.employeeSourceError=null; }
    safeSetJSON(isJob?K.jobSource:K.employeeSource, src).then(function(){
      render();
      if(isJob) syncJobsFromSheet(true); else syncEmployeesFromSheet(true);
    });
  }
  function onSourceDisconnect(kind){
    var isJob = kind==='job';
    if(!confirm('Stop syncing '+(isJob?'jobs':'employees')+' from this sheet?')) return;
    if(isJob){ STATE.jobSource=null; STATE.jobSyncStatus='idle'; } else { STATE.employeeSource=null; STATE.empSyncStatus='idle'; }
    safeSetJSON(isJob?K.jobSource:K.employeeSource, null).then(render);
  }

  function resetToBoard(){ STATE.view='board'; render(); }

  /* ---------------- event handlers: manual schedule overrides ---------------- */
  function onEditCellOpen(employeeId, dateISO){
    STATE.editingCell = { employeeId: employeeId, dateISO: dateISO };
    var comp = computeResults();
    var emp = STATE.employees.filter(function(e){ return e.id===employeeId; })[0];
    var res = comp.results[emp.pool];
    var current = (res.schedule[employeeId][dateISO] || []).map(function(en){
      return { jobId: en.jobId, skill: en.skill, hours: en.hours };
    });
    STATE.editingCellDraft = current;
    render();
  }
  function onCellEditorAddLine(){
    var emp = STATE.employees.filter(function(e){ return e.id===STATE.editingCell.employeeId; })[0];
    var firstJob = STATE.jobs.filter(function(j){ return j.active!==false; }).sort(priorityComparator)[0];
    STATE.editingCellDraft.push({ jobId: firstJob?firstJob.id:'', skill: emp.skills[0], hours: 8 });
    render();
  }
  function onCellEditorRemoveLine(idx){
    STATE.editingCellDraft.splice(idx, 1);
    render();
  }
  function onCellEditorFieldChange(idx, field, value){
    if(!STATE.editingCellDraft[idx]) return;
    STATE.editingCellDraft[idx][field] = field==='hours' ? (parseFloat(value)||0) : value;
  }
  function onCellEditorSave(){
    var cell = STATE.editingCell;
    var weekOverrides = Object.assign({}, STATE.manualOverrides);
    var forWeek = Object.assign({}, weekOverrides[STATE.weekStart] || {});
    var forEmp = Object.assign({}, forWeek[cell.employeeId] || {});
    forEmp[cell.dateISO] = STATE.editingCellDraft.filter(function(l){ return l.jobId; }).map(function(l){
      return { jobId:l.jobId, skill:l.skill, hours:l.hours };
    });
    forWeek[cell.employeeId] = forEmp;
    weekOverrides[STATE.weekStart] = forWeek;
    STATE.manualOverrides = weekOverrides;
    STATE.editingCell = null; STATE.editingCellDraft = null;
    safeSetJSON(K.manualOverrides, STATE.manualOverrides).then(render);
  }
  function onCellEditorRevert(){
    var cell = STATE.editingCell;
    var weekOverrides = Object.assign({}, STATE.manualOverrides);
    if(weekOverrides[STATE.weekStart] && weekOverrides[STATE.weekStart][cell.employeeId]){
      var forEmp = Object.assign({}, weekOverrides[STATE.weekStart][cell.employeeId]);
      delete forEmp[cell.dateISO];
      var forWeek = Object.assign({}, weekOverrides[STATE.weekStart]);
      forWeek[cell.employeeId] = forEmp;
      weekOverrides[STATE.weekStart] = forWeek;
    }
    STATE.manualOverrides = weekOverrides;
    STATE.editingCell = null; STATE.editingCellDraft = null;
    safeSetJSON(K.manualOverrides, STATE.manualOverrides).then(render);
  }

  /* ---------------- main event dispatch ---------------- */
  function onBodyClick(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    STATE.lastInteractionAt = Date.now();
    switch(action){
      case 'setup-digit': onSetupDigit(id); break;
      case 'setup-back': STATE.setupPinBuffer = STATE.setupPinBuffer.slice(0,-1); render(); break;

      case 'open-gear': STATE.view = STATE.adminPin ? 'adminpin' : 'setup'; STATE.adminPinBuffer=''; STATE.adminPinError=false; render(); break;
      case 'adminpin-digit': onAdminPinDigit(id); break;
      case 'adminpin-back': STATE.adminPinBuffer = STATE.adminPinBuffer.slice(0,-1); STATE.adminPinError=false; render(); break;
      case 'adminpin-cancel': resetToBoard(); break;
      case 'exit-admin': resetToBoard(); break;
      case 'admin-tab': STATE.adminTab=id; STATE.employeeFormOpen=false; STATE.expandedJobId=null; STATE.editingCell=null; STATE.editingCellDraft=null; render(); break;

      case 'edit-cell': onEditCellOpen(id, el.dataset.date); break;
      case 'celleditor-add-line': onCellEditorAddLine(); break;
      case 'celleditor-remove-line': onCellEditorRemoveLine(parseInt(id,10)); break;
      case 'celleditor-save': onCellEditorSave(); break;
      case 'celleditor-revert': onCellEditorRevert(); break;
      case 'celleditor-cancel': STATE.editingCell=null; STATE.editingCellDraft=null; render(); break;

      case 'week-prev': STATE.weekStart = addDays(STATE.weekStart, -7); safeSetJSON(K.weekStart, STATE.weekStart); render(); break;
      case 'week-next': STATE.weekStart = addDays(STATE.weekStart, 7); safeSetJSON(K.weekStart, STATE.weekStart); render(); break;

      case 'board-export-csv': { var c=computeResults(); onCSVExport(c.weekDates, c.employees, c.results); break; }
      case 'board-print': window.print(); break;
      case 'board-publish-kairos': { var c4=computeResults(); publishScheduleForKairos(c4.weekDates, c4.employees, c4.results); break; }
      case 'board-send-sheet': { var c2=computeResults(); onSendScheduleToSheet(c2.weekDates, c2.employees, c2.results); break; }
      case 'board-email-open': STATE.emailFormOpen=true; STATE.emailStatus='idle'; STATE.emailError=null; render(); break;
      case 'board-email-cancel': STATE.emailFormOpen=false; render(); break;
      case 'board-email-send': {
        var inputEl = document.getElementById('boardEmailInput');
        STATE.emailInput = inputEl ? inputEl.value : '';
        var c3=computeResults(); onEmailSchedule(c3.weekDates, c3.employees, c3.results); break;
      }

      case 'admin-emp-new': onAdminEmpNew(); break;
      case 'admin-emp-edit': onAdminEmpEdit(id); break;
      case 'admin-emp-cancel-form': STATE.employeeFormOpen=false; STATE.editingEmployeeId=null; STATE.employeeFormError=null; pendingSkills=null; render(); break;
      case 'admin-emp-save': onAdminEmpSave(id||null); break;
      case 'admin-emp-toggle-active': onAdminEmpToggle(id); break;
      case 'admin-emp-delete': onAdminEmpDelete(id); break;
      case 'empform-toggle-skill': onEmpFormToggleSkill(id); break;

      case 'admin-job-new': onAdminJobNew(); break;
      case 'job-row-toggle': onJobRowToggle(id); break;
      case 'admin-job-save-fields': onAdminJobSaveFields(id); break;
      case 'admin-job-delete': onAdminJobDelete(id); break;
      case 'admin-job-reactivate': onAdminJobReactivate(id); break;
      case 'job-toggle-favored': onJobToggleFavored(el.dataset.jobid, id); break;
      case 'job-toggle-restricted': onJobToggleRestricted(el.dataset.jobid, id); break;

      case 'jobsource-setup-open': STATE.jobSourceFormOpen=true; STATE.jobSourceError=null; render(); break;
      case 'jobsource-cancel': STATE.jobSourceFormOpen=false; STATE.jobSourceError=null; render(); break;
      case 'jobsource-save': onSourceSave('job'); break;
      case 'jobsource-sync-now': syncJobsFromSheet(true); break;
      case 'jobsource-disconnect': onSourceDisconnect('job'); break;

      case 'empsource-setup-open': STATE.employeeSourceFormOpen=true; STATE.employeeSourceError=null; render(); break;
      case 'empsource-cancel': STATE.employeeSourceFormOpen=false; STATE.employeeSourceError=null; render(); break;
      case 'empsource-save': onSourceSave('employee'); break;
      case 'empsource-sync-now': syncEmployeesFromSheet(true); break;
      case 'empsource-disconnect': onSourceDisconnect('employee'); break;

      case 'sheetwrite-setup-open': STATE.sheetWriteFormOpen=true; STATE.sheetWriteError=null; render(); break;
      case 'sheetwrite-cancel': STATE.sheetWriteFormOpen=false; STATE.sheetWriteError=null; render(); break;
      case 'sheetwrite-save': onSheetWriteSave(); break;
      case 'sheetwrite-disconnect': onSheetWriteDisconnect(); break;

      case 'settings-save-calendar': onSettingsSaveCalendar(); break;
      case 'settings-add-holiday': onSettingsAddHoliday(); break;
      case 'settings-remove-holiday': onSettingsRemoveHoliday(id); break;
      case 'admin-save-pin': onAdminSavePin(); break;
    }
  }

  /* ---------------- shared data listeners ---------------- */
  function startSharedDataListeners(){
    fsDoc(K.adminPin).onSnapshot(function(snap){
      var pin = (snap.exists && snap.data().value) ? snap.data().value : null;
      if(pin && pin!==STATE.adminPin){
        STATE.adminPin = pin;
        if(STATE.view==='setup'){ STATE.view='board'; }
        if(STATE.view!=='admin' && STATE.view!=='adminpin') render();
      }
    }, function(e){ console.error('adminPin listener error', e); });
    fsDoc(K.employees).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.employees = snap.data().value;
      if(STATE.view==='board') render();
    }, function(e){ console.error('employees listener error', e); });
    fsDoc(K.jobs).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.jobs = snap.data().value;
      if(STATE.view==='board') render();
    }, function(e){ console.error('jobs listener error', e); });
    fsDoc(K.preferences).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.preferences = snap.data().value;
      if(STATE.view==='board') render();
    }, function(e){ console.error('preferences listener error', e); });
    fsDoc(K.pins).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.pins = snap.data().value;
      if(STATE.view==='board') render();
    }, function(e){ console.error('pins listener error', e); });
    fsDoc(K.restrictions).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.restrictions = snap.data().value;
      if(STATE.view==='board') render();
    }, function(e){ console.error('restrictions listener error', e); });
    fsDoc(K.calendar).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.calendar = snap.data().value;
      if(STATE.view==='board') render();
    }, function(e){ console.error('calendar listener error', e); });
    fsDoc(K.manualOverrides).onSnapshot(function(snap){
      if(snap.exists && snap.data().value) STATE.manualOverrides = snap.data().value;
      if(STATE.view==='board') render();
    }, function(e){ console.error('manualOverrides listener error', e); });
  }
  function startJobSourceSync(){ setInterval(function(){ if(STATE.jobSource) syncJobsFromSheet(false); }, 120000); }
  function startEmployeeSourceSync(){ setInterval(function(){ if(STATE.employeeSource) syncEmployeesFromSheet(false); }, 120000); }

  function loadAll(){
    return Promise.all([
      safeGetJSON(K.employees, DEFAULT_EMPLOYEES),
      safeGetJSON(K.jobs, DEFAULT_JOBS),
      safeGetJSON(K.preferences, DEFAULT_PREFERENCES),
      safeGetJSON(K.pins, DEFAULT_PINS),
      safeGetJSON(K.restrictions, DEFAULT_RESTRICTIONS),
      safeGetJSON(K.calendar, DEFAULT_CALENDAR),
      safeGetJSON(K.weekStart, null),
      safeGetJSON(K.adminPin, null),
      safeGetJSON(K.jobSource, null),
      safeGetJSON(K.employeeSource, null),
      safeGetJSON(K.sheetWrite, null),
      safeGetJSON(K.manualOverrides, {}),
      safeGetJSON(K.publishedSchedule, null)
    ]).then(function(res){
      STATE.employees=res[0]; STATE.jobs=res[1]; STATE.preferences=res[2]; STATE.pins=res[3];
      STATE.restrictions=res[4]; STATE.calendar=res[5];
      STATE.weekStart = res[6] || mondayOnOrAfter(todayISO());
      STATE.adminPin = res[7];
      STATE.jobSource = res[8]; STATE.employeeSource = res[9];
      if(res[10]){ STATE.sheetWriteUrl = res[10].url; STATE.sheetWriteLastSentAt = res[10].lastSentAt; }
      STATE.manualOverrides = res[11] || {};
      if(res[12]){ STATE.publishStatus = 'ok'; STATE.publishedAt = res[12].updatedAt; }
    });

  }

  function boot(){
    setAppViewportHeight();
    window.addEventListener('resize', setAppViewportHeight);
    window.addEventListener('orientationchange', function(){ setTimeout(setAppViewportHeight, 150); });
    document.body.addEventListener('click', onBodyClick);
    document.body.addEventListener('change', function(e){
      var el = e.target;
      if(el.dataset && el.dataset.editline!=null){
        onCellEditorFieldChange(parseInt(el.dataset.editline,10), el.dataset.field, el.value);
      }
    });
    render();
    firebaseAuthReady.then(function(){
      return loadAll();
    }).then(function(){
      STATE.view = STATE.adminPin ? 'board' : 'setup';
      render();
      startSharedDataListeners();
      startJobSourceSync();
      startEmployeeSourceSync();
      if(STATE.jobSource) syncJobsFromSheet(false);
      if(STATE.employeeSource) syncEmployeesFromSheet(false);
    }).catch(function(e){
      console.error('boot failed', e);
      STATE.view = 'board'; // fall back to local defaults so the page is still usable offline
      render();
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
