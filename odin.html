<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanko Odin Projects 26.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=Big+Shoulders+Text:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Design tokens shared with Kairos, Minerva, Kubera and Aengus so the whole
     suite reads as one system. Odin runs the job after Kubera wins it:
     initiation, the hours budget, procurement, and purchase orders. */
  :root{
    --oxblood:      #6D1708;
    --oxblood-dark: #4E1005;
    --oxblood-deep: #320A03;
    --gold:         #DEA509;
    --gold-light:   #E9C45F;
    --gold-dim:     #AD8007;
    --ink:          #241811;
    --paper:        #F4EEE1;
    --paper-dim:    #E6DCC5;
    --card:         #FBF7EC;
    --olive:        #5B6B3F;
    --olive-dim:    #EEF1E4;
    --rust:         #A23B1E;
    --rust-dim:     #F7E6DE;
    --steel:        #3B5169;
    --steel-dim:    #E4E9EF;
    --line:         #D8CCB2;
    --display:      "Big Shoulders", sans-serif;
    --display-text: "Big Shoulders Text", sans-serif;
    --body:         "IBM Plex Sans", sans-serif;
    --mono:         "IBM Plex Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); font-size:14px; }
  .wrap{ max-width:1280px; margin:0 auto; padding:0 18px; }

  /* ---------- chrome ---------- */
  .topbar{ background:var(--oxblood-deep); color:#EBDFC6; padding:10px 18px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .wordmark{ display:flex; align-items:center; gap:12px; }
  .wordmark .logo-img{ height:30px; width:auto; display:block; }
  .wordmark .appname{ font-family:var(--display); font-weight:800; font-size:21px;
    letter-spacing:1.6px; text-transform:uppercase; color:var(--gold-light); }
  .wordmark .ver{ font-family:var(--mono); font-size:10.5px; color:#9c8f77; }
  nav{ display:flex; gap:4px; flex-wrap:wrap; }
  nav button{ background:none; border:1px solid transparent; color:#CBBFA5;
    font-family:var(--display-text); font-weight:700; font-size:13px; letter-spacing:0.8px;
    text-transform:uppercase; padding:7px 13px; border-radius:5px; cursor:pointer; }
  nav button:hover{ color:var(--gold-light); }
  nav button.on{ color:var(--gold-light); border-color:var(--gold-dim); background:rgba(222,165,9,0.08); }
  .spacer{ flex:1; }
  #lamp{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; color:#9c8f77; }
  #lamp .dot{ width:9px; height:9px; border-radius:50%; background:#666; }
  #lamp.on .dot{ background:#7DB25A; } #lamp.saving .dot{ background:var(--gold); }
  #lamp.off .dot{ background:var(--rust); }
  #whoami{ font-family:var(--mono); font-size:11px; color:#9c8f77; display:flex; gap:10px; align-items:center; }
  #whoami button{ background:none; border:1px solid #5a4a3a; color:#CBBFA5; border-radius:4px;
    padding:3px 9px; cursor:pointer; font-family:var(--mono); font-size:10.5px; }

  main{ padding:22px 0 60px; }
  .section-head{ display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .section-head h1{ font-family:var(--display); font-weight:800; font-size:30px;
    letter-spacing:1.2px; text-transform:uppercase; margin:0; color:var(--oxblood); }
  .section-head .sub{ font-size:12.5px; color:#8a7f68; margin-top:4px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:16px; }
  .card h2{ font-family:var(--display-text); font-weight:700; font-size:13px;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--oxblood); margin:0 0 14px; }
  .hint{ font-size:11.5px; color:#9a8f78; }
  .grid{ display:grid; gap:12px; }
  .g2{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .g3{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  .g4{ grid-template-columns:repeat(4, minmax(0,1fr)); }
  @media (max-width:860px){ .g2,.g3,.g4{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .field label{ font-family:var(--display-text); font-size:10.5px; text-transform:uppercase;
    letter-spacing:1px; font-weight:700; color:#7a6f5c; }
  .field input, .field select, .field textarea{
    font-family:var(--body); font-size:13.5px; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; background:#fff; color:var(--ink); width:100%; }
  .field input.mono{ font-family:var(--mono); font-size:13px; }
  .field textarea{ resize:vertical; min-height:64px; line-height:1.5; }

  .btn{ font-family:var(--display-text); font-weight:700; font-size:12.5px; letter-spacing:0.8px;
    text-transform:uppercase; padding:9px 16px; border-radius:6px; border:1px solid var(--gold-dim);
    background:var(--gold); color:var(--oxblood-deep); cursor:pointer; }
  .btn:hover{ background:var(--gold-light); }
  .btn.ghost{ background:none; color:var(--oxblood); border-color:var(--line); }
  .btn.dark{ background:var(--oxblood); color:var(--gold-light); border-color:var(--oxblood-dark); }
  .btn.danger{ background:none; color:var(--rust); border-color:var(--rust); }
  .btn.sm{ padding:6px 11px; font-size:11.5px; }
  .btn[disabled]{ opacity:0.5; cursor:default; }

  table.rows{ width:100%; border-collapse:collapse; }
  table.rows th{ text-align:left; font-family:var(--display-text); font-size:10.5px;
    text-transform:uppercase; letter-spacing:1px; color:#7a6f5c; padding:6px 8px;
    border-bottom:2px solid var(--line); }
  table.rows td{ padding:9px 8px; border-bottom:1px solid rgba(36,24,17,0.08); vertical-align:middle; }
  table.rows tr.click{ cursor:pointer; }
  table.rows tr.click:hover td{ background:rgba(222,165,9,0.07); }
  .mono{ font-family:var(--mono); font-size:12.5px; }
  .right{ text-align:right; }

  .pill{ display:inline-block; font-family:var(--display-text); font-weight:700; font-size:10px;
    letter-spacing:0.8px; text-transform:uppercase; padding:3px 8px; border-radius:20px; }
  .pill.awaiting{ background:var(--rust-dim); color:var(--rust); }
  .pill.initiated,.pill.procurement{ background:var(--steel-dim); color:var(--steel); }
  .pill.ready,.pill.production{ background:var(--olive-dim); color:var(--olive); }
  .pill.ship,.pill.shipped{ background:#F3E7C6; color:var(--gold-dim); }
  .pill.closed{ background:var(--paper-dim); color:#7a6f5c; }
  .pill.warn{ background:var(--rust-dim); color:var(--rust); }
  .pill.ok{ background:var(--olive-dim); color:var(--olive); }

  /* Odin's signature: the stage rail. Eight rivets on an oxblood bar, filled
     with gold as far as the project has travelled. Reads at a glance from
     across the office, like a level gauge on a tank. */
  .rail{ display:flex; align-items:center; gap:0; min-width:150px; }
  .rail .seg{ flex:1; height:3px; background:var(--paper-dim); }
  .rail .seg.done{ background:var(--gold); }
  .rail .riv{ width:9px; height:9px; border-radius:50%; background:var(--paper-dim);
    border:1.5px solid #c9bda3; flex:0 0 auto; }
  .rail .riv.done{ background:var(--gold); border-color:var(--gold-dim); }
  .rail .riv.here{ background:var(--oxblood); border-color:var(--oxblood-dark);
    box-shadow:0 0 0 2.5px rgba(222,165,9,0.45); }

  /* items tables (editor) */
  table.items{ width:100%; border-collapse:collapse; }
  table.items th{ text-align:left; font-family:var(--display-text); font-size:10.5px;
    text-transform:uppercase; letter-spacing:1px; color:#7a6f5c; padding:5px 6px;
    border-bottom:2px solid var(--line); }
  table.items td{ padding:5px 6px; vertical-align:top; border-bottom:1px solid rgba(36,24,17,0.07); }
  table.items input, table.items select, table.items textarea{
    font-family:var(--body); font-size:13px; padding:6px 8px; border:1px solid var(--line);
    border-radius:5px; background:#fff; width:100%; }
  table.items textarea{ resize:vertical; min-height:32px; line-height:1.4; }
  .c-qty{ width:64px; } .c-unit{ width:64px; } .c-part{ width:118px; }
  .c-price{ width:96px; } .c-date{ width:132px; } .c-sel{ width:128px; }
  .c-del{ width:32px; text-align:center; }
  .iconbtn{ border:1px solid var(--line); background:#fff; border-radius:5px; padding:4px 8px;
    cursor:pointer; font-family:var(--mono); font-size:11px; color:#7a6f5c; }
  .iconbtn.danger{ color:var(--rust); border-color:var(--rust-dim); }

  /* operation chips */
  .ops{ display:flex; flex-wrap:wrap; gap:4px; }
  .op{ font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:4px;
    border:1px solid var(--line); background:#fff; color:#7a6f5c; cursor:pointer; user-select:none; }
  .op.on{ background:var(--oxblood); color:var(--gold-light); border-color:var(--oxblood-dark); }
  .op.ro{ cursor:default; }
  .op.ro.on{ background:var(--steel); border-color:var(--steel); color:#fff; }

  /* budget grid */
  .budget{ display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:10px; }
  .budget .b{ background:#fff; border:1px solid var(--line); border-radius:7px; padding:8px 10px; }
  .budget .b label{ display:block; font-family:var(--mono); font-size:10.5px; color:#7a6f5c; margin-bottom:4px; }
  .budget .b input{ width:100%; border:none; font-family:var(--mono); font-size:15px; color:var(--ink);
    padding:0; background:none; }
  .budget .b input:focus{ outline:none; }

  .recv{ font-size:11.5px; color:var(--olive); font-family:var(--mono); }
  .recv.flag{ color:var(--rust); }

  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--oxblood-deep); color:#EBDFC6; font-size:13px; padding:10px 18px;
    border-radius:7px; border:1px solid var(--gold-dim); display:none; z-index:999; max-width:80vw; }

  .modal-back{ position:fixed; inset:0; background:rgba(30,15,8,0.55); z-index:900;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:var(--card); border:1px solid var(--gold-dim); border-radius:8px;
    padding:22px 24px; max-width:460px; width:100%; }
  .modal h3{ font-family:var(--display-text); font-weight:700; letter-spacing:1px;
    text-transform:uppercase; font-size:14px; color:var(--oxblood); margin:0 0 10px; }
  .modal p{ font-size:13.5px; line-height:1.6; margin:0 0 18px; color:#5f5546; }
  .modal .row{ display:flex; gap:10px; justify-content:flex-end; }

  /* ---------- auth gate ---------- */
  #authgate{ position:fixed; inset:0; z-index:9999; background:var(--oxblood-deep);
    display:flex; align-items:center; justify-content:center; padding:20px; }
  #authgate[hidden]{ display:none; }
  #authgate .box{ background:var(--card); border:1px solid var(--gold-dim); border-radius:6px;
    padding:26px 28px 22px; width:100%; max-width:390px; }
  #authgate .eyebrow{ font-family:var(--mono); font-size:10px; font-weight:600;
    letter-spacing:2px; text-transform:uppercase; color:var(--gold-dim); }
  #authgate h1{ font-family:var(--display); font-weight:800; font-size:27px; line-height:1;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--oxblood); margin:6px 0 4px; }
  #authgate p.sub{ font-size:13px; color:#8a7f68; margin:0 0 18px; }
  #authgate label{ display:block; font-family:var(--display-text); font-weight:700; font-size:11.5px;
    letter-spacing:1px; text-transform:uppercase; color:#7a6f5c; margin:12px 0 5px; }
  #authgate input{ width:100%; font-family:var(--body); font-size:14px; padding:9px 11px;
    border:1px solid var(--line); border-radius:6px; }
  #authgate .err{ color:var(--rust); font-size:12.5px; margin-top:10px; min-height:16px; }
  #authgate button{ margin-top:16px; width:100%; }

  /* ==========================================================================
     DOCUMENT SHEET - the PO that becomes the PDF. Same dress as Kubera's
     quotes so a Lanko document is a Lanko document: maroon frame, letterhead,
     boxed meta strip, black-ruled items table, italic totals labels.
     ========================================================================== */
  .docviewer{ background:#6f665a; padding:26px 20px 40px; border-radius:10px; overflow-x:auto;
    box-shadow:inset 0 2px 10px rgba(0,0,0,0.3); }
  .docbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .docbar .spacer{ flex:1; }
  .docbar .fname{ font-family:var(--mono); font-size:12px; color:#cfc5b0; }
  .sheet{ width:8.5in; min-height:11in; margin:0 auto; background:#fff; color:#1a1a1a;
    padding:0.42in; position:relative; box-shadow:0 14px 34px -10px rgba(0,0,0,0.55);
    font-family:"IBM Plex Sans", sans-serif; font-size:9.6pt; line-height:1.45; }
  .frame{ border:2.5pt solid #6D1708; padding:0.24in 0.26in; min-height:9.55in;
    display:flex; flex-direction:column; }
  .frame > .growth{ flex:1; }
  .lh{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; }
  .lh-logo img{ height:0.52in; width:auto; display:block; }
  .lh-strip{ display:flex; gap:24px; margin-top:8px; font-size:8.6pt; line-height:1.4; color:#1a1a1a; }
  .lh-strip .col{ flex:1; }
  .lh-strip .col.a{ flex:0 0 2.1in; }
  .lh-strip .col.a b{ font-weight:600; }
  .doctitle{ font-family:"IBM Plex Sans",sans-serif; font-size:11pt; font-weight:700;
    letter-spacing:0.2px; color:#1a1a1a; margin:18px 0 8px; }
  .doctitle .sub{ font-size:9pt; font-weight:400; color:#4a4238; display:block; margin-top:2px; }
  .parties{ display:flex; gap:22px; margin-bottom:15px; }
  .parties .pblock{ flex:1; min-width:0; }
  .pblock .plabel{ font-family:"Big Shoulders Text",sans-serif; font-weight:700; font-size:8.6pt;
    letter-spacing:0.3px; color:#1a1a1a; padding:0 0 3px; display:block; }
  .pblock .pbody{ font-size:9pt; line-height:1.45; min-height:0.7in; }
  .pblock .pbody b{ font-weight:600; }
  table.metabox{ border-collapse:collapse; margin:0 0 14px; }
  table.metabox th{ background:#fff; color:#1a1a1a; font-family:"Big Shoulders Text",sans-serif;
    font-weight:700; font-size:8.4pt; letter-spacing:0.4px; text-align:left;
    padding:3px 9px; border:1px solid #1a1a1a; white-space:nowrap; }
  table.metabox td{ font-size:8.8pt; padding:3px 9px; border:1px solid #1a1a1a;
    font-family:"IBM Plex Mono",monospace; white-space:nowrap; }
  table.doctable{ width:100%; border-collapse:collapse; margin-bottom:2px; }
  table.doctable thead th{ background:#fff; color:#1a1a1a; font-family:"Big Shoulders Text",sans-serif;
    font-weight:700; font-size:8.4pt; letter-spacing:0.3px; padding:4px 6px; text-align:left;
    border:1px solid #1a1a1a; }
  table.doctable tbody td{ padding:5px 6px; font-size:8.8pt; vertical-align:top; border:1px solid #1a1a1a; }
  table.doctable td.c{ text-align:center; }
  table.doctable td.r{ text-align:right; font-family:"IBM Plex Mono",monospace; white-space:nowrap; }
  table.doctable td.m{ font-family:"IBM Plex Mono",monospace; }
  table.doctable td .idesc{ white-space:pre-wrap; }
  table.doctable td.tlabel{ text-align:right; border:none; font-size:9pt; padding:4px 8px; font-style:italic; }
  table.doctable td.tval{ text-align:right; font-family:"IBM Plex Mono",monospace; font-size:9pt; white-space:nowrap; }
  table.doctable tr.tgrand td{ font-weight:700; }
  table.doctable tr.blank td{ height:0.22in; }
  .col-n{ width:0.34in; } .col-qty{ width:0.52in; } .col-unit{ width:0.5in; }
  .col-part{ width:1.25in; } .col-price{ width:0.95in; } .col-amt{ width:1.05in; }
  .docnote{ margin-top:16px; font-size:9pt; line-height:1.5; white-space:pre-wrap; }
  @page{ size: letter; margin: 0; }
  @media print{
    html,body{ background:#fff !important; }
    .app-chrome, .docbar, #toast, .modal-back{ display:none !important; }
    .docviewer{ background:#fff !important; padding:0 !important; box-shadow:none !important; overflow:visible !important; }
    .sheet{ box-shadow:none !important; margin:0 !important; width:8.5in !important; }
    table.doctable tbody tr{ page-break-inside:avoid; break-inside:avoid; }
    #authgate{ display:none !important; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="authgate" hidden>
  <div class="box">
    <span class="eyebrow">Lanko Systems</span>
    <h1>Odin Projects</h1>
    <p class="sub">Project management. Sign in with your Lanko account.</p>
    <label>Email</label><input id="authEmail" type="email" autocomplete="username">
    <label>Password</label><input id="authPass" type="password" autocomplete="current-password">
    <div class="err" id="authErr"></div>
    <button class="btn dark" id="authGo">Sign in</button>
  </div>
</div>

<div id="app">
  <div class="app-chrome">

             'FIT','WELD','REPAIR','CHECK','PAINT','ASSEM','PACK','TRANSP','OTHER'];
  var STATUS = [

    ['shipped','Shipped'], ['closed','Closed'] ];
  var PSTAT = [['needed','Needed'],['quoted','Quoted'],['ordered','Ordered'],

  /* ---------------- state ---------------- */

  /* ---------------- helpers ---------------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function money(v, cur){
    var n = num(v);
    return '$' + n.toLocaleString('en-CA',{minimumFractionDigits:2, maximumFractionDigits:2}) +
      (cur==='USD' ? ' USD' : '');
  }
  function fmtDate(d){ return d ? String(d) : ''; }
  function toast(msg, isErr){
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    t.style.borderColor = isErr ? 'var(--rust)' : 'var(--gold-dim)';
    clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display='none'; }, 4200);
  }
  function lamp(cls, txt){
    var l = document.getElementById('lamp');
    l.className = cls; document.getElementById('lampTxt').textContent = txt;
  }
  function confirmModal(title, body, okLabel, onOk, danger){
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal"><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p>' +
      '<div class="row"><button class="btn ghost" id="mCancel">Cancel</button>' +
      '<button class="btn '+(danger?'danger':'dark')+'" id="mOk">'+esc(okLabel)+'</button></div></div>';
    document.body.appendChild(back);
    back.querySelector('#mCancel').onclick = function(){ back.remove(); };
    back.querySelector('#mOk').onclick = function(){ back.remove(); onOk(); };
  }

  /* ---------------- persistence ---------------- */
  function fsDoc(key){ return db.collection('odin_state').doc(key); }
  function safeSet(key, value){
    lamp('saving','Saving');
    return fsDoc(key).set({ value:value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(function(){ lamp('on','Synced'); return true; })
      .catch(function(e){
        console.error('firestore set failed', key, e);
        lamp('off','Not saved');
        toast('Could not save to the shop database. The change is still on screen - check the connection and try again.', true);
        return false;
      });
  }
  function saveProjects(list){
    state.projects = list;
    return safeSet('projects', list).then(function(ok){
      if(ok) publishConstraints();
      return ok;
    });
  }
  function saveVendors(list){ state.vendors = list; return safeSet('vendors', list); }
  function savePOs(list){ state.pos = list; return safeSet('pos', list); }
  function saveSettings(s){ state.settings = s; return safeSet('settings', s); }
  function upsert(list, rec){
    var out = list.slice(); var hit = false;
    for(var i=0;i<out.length;i++){ if(out[i].id===rec.id){ out[i]=rec; hit=true; break; } }
    if(!hit) out.push(rec);
    return out;
  }

  /* ---------------- listeners ---------------- */
  function listen(){
    ['projects','vendors','pos','counters','settings'].forEach(function(k){
      fsDoc(k).onSnapshot(function(snap){
        loaded[k] = true;
        var v = snap.exists ? snap.data().value : null;
        if(k==='projects') state.projects = Array.isArray(v) ? v : [];
        if(k==='vendors')  state.vendors  = Array.isArray(v) ? v : [];
        if(k==='pos')      state.pos      = Array.isArray(v) ? v : [];
        if(k==='counters') state.counters = v || null;
        if(k==='settings') state.settings = v || null;
        lamp('on','Synced'); render();
      }, function(e){
        console.error('listen failed', k, e); loaded[k] = true;
        lamp('off','Read failed'); render();
      });
    });
    db.collection('iris_state').doc('receipts').onSnapshot(function(snap){
      var v = snap.exists ? snap.data().value : null;
      state.receipts = Array.isArray(v) ? v : [];
      render();
    }, function(e){ console.error('iris receipts read failed', e); });
  }

  /* ---------------- receipts join ---------------- */
  function receiptsForLine(lineId){
    return state.receipts.filter(function(r){ return r.kind!=='ship' && r.lineId === lineId; });
  }
  function receivedQty(lineId){
    return receiptsForLine(lineId).reduce(function(a,r){ return a + num(r.qty); }, 0);
  }
  function shipConfirmations(projectId){
    return state.receipts.filter(function(r){ return r.kind==='ship' && r.projectId === projectId; });
  }

  /* ---------------- constraints feed for Minerva ----------------
     One doc, odin_state/constraints, keyed by job number. An operation is
     blocked while any procurement line naming it has not been fully received.
     Readers learn this format before Minerva's rebuild starts writing
     schedules against it (expand before contract). */
  function lineOutstanding(l){
    if(l.status === 'received') return false;
    return receivedQty(l.id) < num(l.qty || 1);
  }
  function publishConstraints(){
    var jobs = {};
    state.projects.forEach(function(p){
      if(p.status==='closed' || p.status==='shipped') return;
      var job = p.jobRef || p.quoteNum; if(!job) return;
      var blocked = {}; var latest = '';
      (p.procurement||[]).forEach(function(l){
        if(!lineOutstanding(l)) return;
        (l.blocks||[]).forEach(function(op){ blocked[op] = true; });
        if(l.eta && l.eta > latest) latest = l.eta;
      });
      jobs[job] = {
        projectId: p.id, status: p.status, dueDate: p.dueDate || '',
        budget: p.budget || {},
        blockedOps: Object.keys(blocked),
        materialsEta: latest
      };
    });
    return safeSet('constraints', { jobs: jobs, publishedAt: Date.now() });
  }

        state.vendors.map(function(v){ return '<option value="'+v.id+'"'+(v.id===po.vendorId?' selected':'')+'>'+esc(v.name)+'</option>'; }).join('') + '</select>') +
      field('Job / project', '<select data-f="projectId"><option value="">&mdash;</option>' +
        state.projects.map(function(p){ return '<option value="'+p.id+'"'+(p.id===po.projectId?' selected':'')+'>'+
          esc((p.jobRef||p.quoteNum||'')+' '+(p.title||''))+'</option>'; }).join('') + '</select>') +
      field('Date', '<input type="date" data-f="date" value="'+esc(po.date)+'">') +
      field('Required by', '<input type="date" data-f="requiredBy" value="'+esc(po.requiredBy)+'">',
        'Feeds the procurement ETA conversation - Minerva plans around arrival, not this date.') +
      '</div><div class="grid g3" style="margin-top:12px">' +
      field('Ship via', '<input data-f="shipVia" value="'+esc(po.shipVia)+'">') +
      field('Payment terms', '<input data-f="paymentTerms" value="'+esc(po.paymentTerms)+'">') +
      field('Currency', '<select data-f="currency">'+['CAD','USD'].map(function(c){
        return '<option'+(po.currency===c?' selected':'')+'>'+c+'</option>'; }).join('')+'</select>') +
      '</div></div>';
    h += '<div class="card"><h2>Line items</h2>' +
      '<table class="items"><thead><tr><th class="c-qty">Qty</th><th class="c-unit">Unit</th>' +
      '<th class="c-part">Part no.</th><th>Description</th><th class="c-price">Unit price</th><th class="c-del"></th></tr></thead><tbody>';
    po.items.forEach(function(it, i){
      h += '<tr>' +
        '<td><input class="c-qty" data-ii="'+i+'" data-if="qty" value="'+esc(it.qty)+'"></td>' +
        '<td><input class="c-unit" data-ii="'+i+'" data-if="unit" value="'+esc(it.unit||'EA')+'"></td>' +
        '<td><input class="c-part" data-ii="'+i+'" data-if="partNo" value="'+esc(it.partNo||'')+'"></td>' +
        '<td><textarea data-ii="'+i+'" data-if="desc" rows="1">'+esc(it.desc||'')+'</textarea></td>' +
        '<td><input class="c-price" data-ii="'+i+'" data-if="unitPrice" value="'+esc(it.unitPrice)+'"></td>' +
        '<td class="c-del"><button class="iconbtn danger" data-idel="'+i+'">x</button></td></tr>';
    });
    h += '</tbody></table><div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">' +
      '<button class="btn sm ghost" id="poAddItem">Add line</button>' +
      '<div class="mono">Total ' + money(poTotal(po), po.currency) + '</div></div></div>';
    h += '<div class="card"><h2>Notes to the vendor</h2><div class="grid">' +
      field('', '<textarea data-f="notes" placeholder="Certs required, tolerances, delivery instructions">'+esc(po.notes)+'</textarea>') +
      '</div></div>';
    return h;
  }
  function savePOForm(thenDoc){
    var po = view.dirty;
    if(!po.vendorId){ toast('Pick a vendor before saving.', true); return; }
    if(!po.num) po.num = nextPoNum();
    savePOs(upsert(state.pos, JSON.parse(JSON.stringify(po))))
      .then(function(ok){ if(ok){ toast('Saved '+po.num); go(thenDoc?'podoc':'pos', thenDoc?po.id:null); } });
  }
  function wirePOEditor(){
    var po = view.dirty;
    document.getElementById('poBack').onclick = function(){ go('pos'); };
    document.getElementById('poSave').onclick = function(){ savePOForm(false); };
    document.getElementById('poSavePdf').onclick = function(){ savePOForm(true); };
    var del = document.getElementById('poDelete');
    if(del) del.onclick = function(){
      confirmModal('Delete this purchase order','This removes '+po.num+' from the list.','Delete it', function(){
        savePOs(state.pos.filter(function(x){ return x.id!==po.id; })).then(function(ok){ if(ok) go('pos'); });
      }, true);
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function(el){
      el.oninput = el.onchange = function(){ po[el.getAttribute('data-f')] = el.value; };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ii]'), function(el){
      el.oninput = function(){
        po.items[parseInt(el.getAttribute('data-ii'),10)][el.getAttribute('data-if')] = el.value; };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-idel]'), function(el){
      el.onclick = function(){ po.items.splice(parseInt(el.getAttribute('data-idel'),10),1);
        if(!po.items.length) po.items.push({ id:uid('i'), qty:1, unit:'EA', partNo:'', desc:'', unitPrice:0 });
        render(); };
    });
    document.getElementById('poAddItem').onclick = function(){
      po.items.push({ id:uid('i'), qty:1, unit:'EA', partNo:'', desc:'', unitPrice:0 }); render(); };
  }

    var hasPart = (po.items||[]).some(function(it){ return String(it.partNo||'').trim(); });
    (po.items||[]).forEach(function(it){
      if(!String(it.desc||'').trim() && !num(it.unitPrice)) return;
      if(!num(it.qty) && !String(it.partNo||'').trim() && !num(it.unitPrice)){
        rows += '<tr><td class="c"></td><td></td><td></td>'+(hasPart?'<td></td>':'')+
          '<td><span class="idesc">'+esc(it.desc)+'</span></td><td></td><td></td></tr>';
        return;
      }
      n++;
      rows += '<tr><td class="c">'+n+'</td><td class="c m">'+esc(it.qty)+'</td>' +
        '<td class="c">'+esc(it.unit||'')+'</td>' +
        (hasPart?'<td class="m">'+esc(it.partNo||'')+'</td>':'') +
        '<td><span class="idesc">'+esc(it.desc||'')+'</span></td>' +
        '<td class="r">'+money(it.unitPrice, po.currency)+'</td>' +
        '<td class="r">'+money(num(it.qty)*num(it.unitPrice), po.currency)+'</td></tr>';
    });
    var cols = 5 + (hasPart?1:0);
    rows += '<tr class="blank"><td colspan="'+(cols+1)+'"></td></tr>';
    var pre = cols - 1;
    rows += '<tr class="tgrand"><td colspan="'+pre+'" style="border:none"></td>' +
      '<td class="tlabel">PO Total'+(po.currency==='USD'?' (USD)':'')+'</td>' +
      '<td class="tval">'+money(poTotal(po), po.currency)+'</td></tr>';

    var vAddr = [v.addr1, [v.city,v.prov].filter(Boolean).join(', '), v.postal].filter(Boolean).map(esc).join('<br>');
    var shipAddr = [co.addr1, [co.city,co.prov].filter(Boolean).join(', '), co.postal].filter(Boolean).map(esc).join('<br>');

    var sheet = '<div class="sheet"><div class="frame">' + letterhead() +
      '<div class="doctitle">Purchase Order' +
        (pj ? '<span class="sub">Job '+esc(pj.jobRef||pj.quoteNum||'')+(pj.title?' &middot; '+esc(pj.title):'')+'</span>' : '') + '</div>' +
      '<div class="parties">' +
        '<div class="pblock"><span class="plabel">Vendor:</span><div class="pbody"><b>'+esc(v.name)+'</b>' +
          (vAddr?'<br>'+vAddr:'')+(v.contact?'<br>Attn: '+esc(v.contact):'')+(v.email?'<br>'+esc(v.email):'')+'</div></div>' +
        '<div class="pblock"><span class="plabel">Ship To:</span><div class="pbody"><b>'+esc(co.name)+'</b><br>'+shipAddr+'</div></div>' +
      '</div>' + meta +
      '<table class="doctable"><thead><tr>' +
        '<th class="col-n">Item</th><th class="col-qty">Qty</th><th class="col-unit">U/M</th>' +
        (hasPart?'<th class="col-part">Part #</th>':'') +
        '<th>Description</th><th class="col-price" style="text-align:right">Unit Price</th>' +
        '<th class="col-amt" style="text-align:right">Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      (po.notes ? '<div class="docnote"><b>Notes:</b>\n'+esc(po.notes)+'</div>' : '') +
      '<div class="growth"></div></div></div>';

    return '<div class="docbar">' +
        '<button class="btn ghost" id="docBack">Back</button>' +
        '<button class="btn ghost" id="docEdit">Edit</button>' +
        '<span class="spacer"></span><span class="fname">'+esc(name)+'</span>' +
        '<button class="btn dark" id="docPrint">Print / Save as PDF</button>' +
      '</div><div class="docviewer">' + sheet + '</div>';
  }
  function wirePODoc(){
    document.getElementById('docBack').onclick = function(){ go('pos'); };
    document.getElementById('docEdit').onclick = function(){ go('poedit', view.id); };
    document.getElementById('docPrint').onclick = function(){ window.print(); };
  }

  /* ==========================================================================
     VENDORS
     ========================================================================== */
  function renderVendors(){
    var h = '<div class="section-head"><div><h1>Vendors</h1>' +
      '<div class="sub">Suppliers for steel, outsourced machining, laser, forming, hardware</div></div>' +
      '<button class="btn" id="vNew">Add vendor</button></div>';
    if(!state.vendors.length) return h + '<div class="card"><b>No vendors yet.</b></div>';
    h += state.vendors.map(function(v, i){
      return '<div class="card"><div class="grid g4">' +
        field('Name', '<input data-vi="'+i+'" data-vf="name" value="'+esc(v.name)+'">') +
        field('Contact', '<input data-vi="'+i+'" data-vf="contact" value="'+esc(v.contact||'')+'">') +
        field('Email', '<input data-vi="'+i+'" data-vf="email" value="'+esc(v.email||'')+'">') +
        field('Phone', '<input data-vi="'+i+'" data-vf="phone" value="'+esc(v.phone||'')+'">') +
        '</div><div class="grid g4" style="margin-top:12px">' +
        field('Address', '<input data-vi="'+i+'" data-vf="addr1" value="'+esc(v.addr1||'')+'">') +
        field('City', '<input data-vi="'+i+'" data-vf="city" value="'+esc(v.city||'')+'">') +
        field('Prov', '<input data-vi="'+i+'" data-vf="prov" value="'+esc(v.prov||'')+'">') +
        field('Postal', '<input data-vi="'+i+'" data-vf="postal" value="'+esc(v.postal||'')+'">') +
        '</div><div style="margin-top:12px;display:flex;justify-content:space-between">' +
        '<span class="hint">Typical lead time: <input style="width:130px;border:1px solid var(--line);border-radius:5px;padding:4px 8px" data-vi="'+i+'" data-vf="lead" value="'+esc(v.lead||'')+'"></span>' +
        '<button class="btn sm danger" data-vdel="'+i+'">Remove</button></div></div>';
    }).join('');
    h += '<div style="margin-top:4px"><button class="btn dark" id="vSave">Save vendors</button></div>';
    return h;
  }
  function wireVendors(){
    var nb = document.getElementById('vNew');
    if(nb) nb.onclick = function(){
      state.vendors.push({ id:uid('v'), name:'', contact:'', email:'', phone:'',
        addr1:'', city:'', prov:'', postal:'', lead:'' });
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-vi]'), function(el){
      el.oninput = function(){
        state.vendors[parseInt(el.getAttribute('data-vi'),10)][el.getAttribute('data-vf')] = el.value; };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-vdel]'), function(el){
      el.onclick = function(){ state.vendors.splice(parseInt(el.getAttribute('data-vdel'),10),1); render(); };
    });
    var sv = document.getElementById('vSave');
    if(sv) sv.onclick = function(){
      saveVendors(state.vendors.filter(function(v){ return String(v.name).trim(); }))
        .then(function(ok){ if(ok) toast('Vendors saved.'); });
    };
  }

  /* ==========================================================================
     SETTINGS
     ========================================================================== */
  function renderSettings(){
    var s = state.settings || JSON.parse(JSON.stringify(SEED_SETTINGS));
    view.dirty = s; state.settings = s;
    var h = '<div class="section-head"><div><h1>Settings</h1></div>' +
      '<button class="btn dark" id="sSave">Save settings</button></div>';
    h += '<div class="card"><h2>Company &mdash; printed on purchase orders</h2><div class="grid g3">' +
      field('Name', '<input data-s="name" value="'+esc(s.name)+'">') +
      field('Address', '<input data-s="addr1" value="'+esc(s.addr1)+'">') +
      field('City', '<input data-s="city" value="'+esc(s.city)+'">') +
      field('Prov', '<input data-s="prov" value="'+esc(s.prov)+'">') +
      field('Postal', '<input data-s="postal" value="'+esc(s.postal)+'">') +
      field('Phone', '<input data-s="phone" value="'+esc(s.phone)+'">') +
      field('Email', '<input data-s="email" value="'+esc(s.email)+'">') +
      field('Website', '<input data-s="web" value="'+esc(s.web)+'">') +
      field('Default PO terms', '<input data-s="poTerms" value="'+esc(s.poTerms)+'">') +
      '</div></div>';
    h += '<div class="card"><h2>MTR filing bridge</h2>' +
      '<div class="hint" style="margin-bottom:10px">Iris scans mill certs on the yard tablet and posts them to ' +
      'this Apps Script endpoint, which files them in Drive under MTR/&lt;job number&gt;. Deploy ' +
      'lanko-mtr-bridge.gs as a web app (execute as you, anyone with the link) and paste the URL here.</div>' +
      '<div class="grid g2">' +
      field('Web app URL', '<input class="mono" data-s="mtrUrl" value="'+esc(s.mtrUrl||'')+'" placeholder="https://script.google.com/macros/s/.../exec">') +
      field('Shared token', '<input class="mono" data-s="mtrToken" value="'+esc(s.mtrToken||'')+'">',
        'Any long random string; the bridge rejects posts without it.') +
      '</div></div>';
    return h;
  }
  function wireSettings(){
    var s = view.dirty;
    Array.prototype.forEach.call(document.querySelectorAll('[data-s]'), function(el){
      el.oninput = function(){ s[el.getAttribute('data-s')] = el.value; };
    });
    document.getElementById('sSave').onclick = function(){
      saveSettings(s).then(function(ok){ if(ok) toast('Settings saved.'); });
    };
  }

  /* ---------------- render root ---------------- */
  function render(){
    renderNav();
    var el = document.getElementById('view');
    switch(view.page){
      case 'projects': el.innerHTML = renderProjects(); wireProjects(); break;
      case 'project':  el.innerHTML = renderProject();  wireProject();  break;
      case 'pos':      el.innerHTML = renderPOs();      wirePOs();      break;
      case 'poedit':   el.innerHTML = renderPOEditor(); wirePOEditor(); break;
      case 'podoc':    el.innerHTML = renderPODoc();    wirePODoc();    break;
      case 'vendors':  el.innerHTML = renderVendors();  wireVendors();  break;
      case 'settings': el.innerHTML = renderSettings(); wireSettings(); break;
      default: go('projects');
    }
  }

  /* ---------------- auth ---------------- */
  var gate = document.getElementById('authgate');
  document.getElementById('authGo').onclick = doSignIn;
  document.getElementById('authPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doSignIn(); });
  function doSignIn(){
    var em = document.getElementById('authEmail').value.trim();
    var pw = document.getElementById('authPass').value;
    document.getElementById('authErr').textContent = '';
    firebase.auth().signInWithEmailAndPassword(em, pw).catch(function(e){
      document.getElementById('authErr').textContent =
        'Could not sign in. Check the email and password.';
      console.error(e);
    });
  }
  document.getElementById('signOut').onclick = function(){ firebase.auth().signOut(); };
  firebase.auth().onAuthStateChanged(function(u){
    if(u && !u.isAnonymous){
      gate.hidden = true;
      document.getElementById('whoTxt').textContent = u.email || '';
      listen();
    } else {
      gate.hidden = false;
      document.getElementById('whoTxt').textContent = '';
    }
  });

  render();
})();
</script>
</body>
</html>
