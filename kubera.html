  /* ==========================================================================
     PRICE HISTORY
     Every line you have ever quoted, searchable, so a repeat enquiry starts from
     what you charged last time instead of from scratch. Matching is deliberately
     conservative: an exact part number is treated as the same item, otherwise
     wording has to be genuinely similar. Numbers in a description are never
     ignored, because a 60.3" tip radius and a 61.6" tip radius are not the same
     part however alike the sentences look.
     ========================================================================== */
  var STOP = { 'the':1,'a':1,'an':1,'and':1,'or':1,'for':1,'of':1,'to':1,'with':1,'per':1,
    'new':1,'dwg':1,'drawing':1,'assy':1,'assembly':1,'ea':1,'lot':1 };

  function normText(s){
    return String(s||'').toLowerCase()
      .replace(/[\u2018\u2019\u201c\u201d]/g,'"')
      .replace(/[^a-z0-9."/-]+/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  /* Only the first line of a description identifies the item. The bullets under it
     are specification detail, and including them buries the signal. */
  function headline(s){
    return String(s||'').split('\n')[0];
  }
  function tokens(s){
    return normText(headline(s)).split(' ').filter(function(t){ return t && !STOP[t] && t.length>1; });
  }
  function bigrams(list){
    var out = {};
    for(var i=0;i<list.length;i++){
      out[list[i]] = true;
      if(i+1<list.length) out[list[i]+'~'+list[i+1]] = true;
    }
    return out;
  }
  /* Dice coefficient over tokens and adjacent token pairs */
  function similarity(a, b){
    var A = bigrams(tokens(a)), B = bigrams(tokens(b));
    var ka = Object.keys(A), kb = Object.keys(B);
    if(!ka.length || !kb.length) return 0;
    var hit = 0;
    ka.forEach(function(k){ if(B[k]) hit++; });
    return (2*hit) / (ka.length + kb.length);
  }
  /* For searching, symmetric similarity is the wrong tool: a five word enquiry will
     never look "similar" to a twenty word description even when it plainly refers to
     it. What matters is how much of the query the description accounts for. */
  function coverage(query, text){
    var qt = tokens(query);
    if(!qt.length) return 0;
    var have = {};
    tokens(text).forEach(function(t){ have[t] = true; });
    var hit = 0;
    qt.forEach(function(t){
      if(have[t]) { hit++; return; }
      /* allow a numeric or model token to match inside a longer one, so 390F
         still finds "cat390f" and 15ft finds 15 */
      for(var k in have){ if(k.indexOf(t) >= 0 || t.indexOf(k) >= 0){ hit += 0.75; return; } }
    });
    return Math.min(1, hit / qt.length);
  }

  function partKey(p){
    var k = String(p||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    return k.length >= 4 ? k : '';
  }
  function monthsSince(iso){
    if(!iso) return null;
    var then = new Date(iso + 'T12:00:00');
    if(isNaN(then)) return null;
    return Math.round((Date.now() - then.getTime()) / (1000*60*60*24*30.44));
  }
  function ago(iso){
    var m = monthsSince(iso);
    if(m===null) return '';
    if(m < 1) return 'this month';
    if(m === 1) return 'last month';
    if(m < 24) return m + ' months ago';
    return Math.floor(m/12) + ' years ago';
  }

  /* ---------------- build the index ---------------- */
  function occurrences(){
    var out = [];
    state.quotes.forEach(function(q){
      (q.items||[]).forEach(function(it){
        var desc = String(it.desc||'').trim();
        if(!desc && !String(it.partNo||'').trim()) return;
        if(!num(it.unitPrice)) return;
        out.push({
          quoteId:q.id, num:q.num, rev:num(q.rev), date:q.date, status:q.status,
          customerId:q.customerId, customer:custName(q.customerId),
          partNo:String(it.partNo||'').trim(), desc:desc,
          qty:num(it.qty), unit:it.unit||'', unitPrice:num(it.unitPrice),
          currency:q.currency||'CAD'
        });
      });
    });
    /* archived Drive quotes that have been read in full count as history too */
    (state.archive||[]).forEach(function(a){
      if(!a.extracted) return;
      (a.items||[]).forEach(function(it){
        if(!num(it.unitPrice)) return;
        var desc = String(it.desc||'').trim();
        if(!desc && !String(it.partNo||'').trim()) return;
        out.push({
          quoteId:'archive:'+a.id, num:a.num, rev:num(a.rev), date:a.date, status:'sent',
          customerId:a.customerId||'', customer: a.customerId ? custName(a.customerId) : (a.customer||'Unmatched'),
          partNo:String(it.partNo||'').trim(), desc:desc,
          qty:num(it.qty), unit:it.unit||'', unitPrice:num(it.unitPrice),
          currency:a.currency||'CAD', fromArchive:true
        });
      });
    });
    return out.sort(function(a,b){ return (a.date<b.date?1:a.date>b.date?-1:0); });
  }

  /* Groups occurrences into items. Exact part numbers bind first and hardest;
     everything left over clusters on wording similarity. */
  function groupOccurrences(occ, threshold){
    threshold = threshold || 0.62;
    var groups = [], byPart = {};
    occ.forEach(function(o){
      var pk = partKey(o.partNo);
      if(pk){
        if(!byPart[pk]){ byPart[pk] = { key:'part:'+pk, partNo:o.partNo, desc:o.desc, occ:[], exact:true }; groups.push(byPart[pk]); }
        byPart[pk].occ.push(o);
        return;
      }
      var best = null, bestScore = 0;
      for(var i=0;i<groups.length;i++){
        if(groups[i].exact) continue;
        var sc = similarity(o.desc, groups[i].desc);
        if(sc > bestScore){ bestScore = sc; best = groups[i]; }
      }
      if(best && bestScore >= threshold){
        best.occ.push(o);
        if(bestScore < 0.95) best.fuzzy = true;
      } else {
        groups.push({ key:'desc:'+groups.length, partNo:'', desc:o.desc, occ:[o], exact:false });
      }
    });
    groups.forEach(function(g){
      g.occ.sort(function(a,b){ return (a.date<b.date?1:a.date>b.date?-1:0); });
      var prices = g.occ.map(function(o){ return o.unitPrice; });
      g.last = g.occ[0];
      g.first = g.occ[g.occ.length-1];
      g.min = Math.min.apply(null, prices);
      g.max = Math.max.apply(null, prices);
      g.avg = prices.reduce(function(a,b){ return a+b; },0) / prices.length;
      g.times = g.occ.length;
      g.customers = g.occ.map(function(o){ return o.customer; })
        .filter(function(v,i,a){ return a.indexOf(v)===i; });
      g.won = g.occ.filter(function(o){ return o.status==='won'; }).length;
      g.lost = g.occ.filter(function(o){ return o.status==='lost'; }).length;
      g.drift = g.first.unitPrice ? (g.last.unitPrice - g.first.unitPrice) / g.first.unitPrice * 100 : 0;
      g.staleMonths = monthsSince(g.last.date);
      /* same item, same period, different price to different customers */
      var byCust = {};
      g.occ.forEach(function(o){ byCust[o.customer] = byCust[o.customer] || []; byCust[o.customer].push(o.unitPrice); });
      g.spread = (g.max && g.min && g.customers.length > 1) ? (g.max - g.min) / g.max * 100 : 0;
    });
    return groups.sort(function(a,b){ return b.times - a.times || (a.last.date < b.last.date ? 1 : -1); });
  }

  /* ---------------- best previous match for one line ---------------- */
  function findPrevious(desc, partNo, excludeQuoteId){
    var occ = occurrences().filter(function(o){ return o.quoteId !== excludeQuoteId; });
    if(!occ.length) return null;
    var pk = partKey(partNo);
    if(pk){
      var exact = occ.filter(function(o){ return partKey(o.partNo) === pk; });
      if(exact.length) return { score:1, exact:true, occ:exact };
    }
    if(tokens(desc).length < 2) return null;
    var scored = occ.map(function(o){ return { o:o, s:similarity(desc, o.desc) }; })
      .filter(function(x){ return x.s >= 0.62; })
      .sort(function(a,b){ return b.s - a.s; });
    if(!scored.length) return null;
    var top = scored[0].s;
    var keep = scored.filter(function(x){ return x.s >= Math.max(0.62, top - 0.08); });
    return { score:top, exact:false, occ:keep.map(function(x){ return x.o; }) };
  }

  /* ---------------- history tab ---------------- */
  function renderHistory(){
    var occ = occurrences();
    var groups = groupOccurrences(occ);
    var term = view.search;
    var shown = groups;
    if(term){
      var t = term.toLowerCase();
      shown = groups.map(function(g){
        var direct = g.desc.toLowerCase().indexOf(t) >= 0 ||
                     String(g.partNo).toLowerCase().indexOf(t) >= 0 ||
                     g.customers.join(' ').toLowerCase().indexOf(t) >= 0;
        /* score against every wording this item has been quoted under, not just the latest */
        var best = g.occ.reduce(function(m,o){ return Math.max(m, coverage(term, o.desc)); }, 0);
        return { g:g, score: direct ? 1 : best };
      }).filter(function(x){ return x.score >= 0.6; })
        .sort(function(a,b){ return b.score - a.score || b.g.times - a.g.times; })
        .map(function(x){ return x.g; });
    }
    var repeats = groups.filter(function(g){ return g.times > 1; });
    var stale = repeats.filter(function(g){ return g.staleMonths !== null && g.staleMonths >= 12; });
    var uneven = repeats.filter(function(g){ return g.spread >= 15; });

    var h = '<div class="wrap">' +
      '<div class="section-head"><h1>What we have quoted before</h1>' +
        '<div class="sub">' + occ.length + ' priced lines across ' + state.quotes.length + ' quotes</div></div>';

    if(!occ.length){
      h += '<div class="empty-state"><b>Nothing to compare yet</b>' +
        'Once a few quotes are saved, every line you have priced shows up here. ' +
        'If you want your back catalogue in straight away, use Import past quotes on the Letterhead tab.</div></div>';
      document.getElementById('stage').innerHTML = h;
      return;
    }

    h += '<div class="insights">' +
        '<div class="ins"><div class="n">'+repeats.length+'</div><div class="l">Repeat items</div>' +
          '<div class="d">Quoted more than once. These are the ones worth pricing from history.</div></div>' +
        '<div class="ins'+(stale.length?' warn':'')+'"><div class="n">'+stale.length+'</div><div class="l">Prices over a year old</div>' +
          '<div class="d">Last quoted 12 months ago or more. Check material cost before reusing.</div></div>' +
        '<div class="ins'+(uneven.length?' warn':'')+'"><div class="n">'+uneven.length+'</div><div class="l">Priced unevenly</div>' +
          '<div class="d">Same item, 15% or more between the cheapest and dearest customer.</div></div>' +
      '</div>' +
      '<div class="toolbar">' +
        '<input class="searchbox" id="hSearch" placeholder="Describe the item, or paste the line from their enquiry" value="'+esc(term)+'">' +
      '</div>';

    if(!shown.length){
      h += '<div class="empty-state"><b>Nothing like that yet</b>' +
        'No previously quoted line resembles that wording. Worth pricing from first principles.</div>';
    }

    shown.slice(0, 60).forEach(function(g){
      var cur = g.last.currency;
      var driftTxt = g.times > 1
        ? (g.drift >= 0 ? '+' : '') + g.drift.toFixed(1) + '%'
        : 'first time';
      h += '<div class="hgroup">' +
        '<div class="htop"><div>' +
          '<div class="hdesc">'+esc(g.desc)+'</div>' +
          (g.partNo ? '<span class="hpart">'+esc(g.partNo)+'</span>' : '') +
          (g.fuzzy ? ' <span class="badge draft">grouped by wording</span>' : '') +
        '</div>' +
        '<button class="btn sm ghost" data-huse="'+esc(g.key)+'">Quote this again</button>' +
        '</div>' +
        '<div class="hstats">' +
          '<div class="hstat"><div class="v">'+money(g.last.unitPrice,cur)+'</div><div class="k">Last price, '+esc(ago(g.last.date))+'</div></div>' +
          '<div class="hstat"><div class="v">'+g.times+'</div><div class="k">Times quoted</div></div>' +
          (g.times>1 ? '<div class="hstat"><div class="v '+(g.drift>0?'up':g.drift<0?'down':'')+'">'+driftTxt+'</div><div class="k">Since first quote</div></div>' : '') +
          (g.times>1 ? '<div class="hstat"><div class="v">'+money(g.min,cur)+' to '+money(g.max,cur)+'</div><div class="k">Range</div></div>' : '') +
          '<div class="hstat"><div class="v">'+g.won+' / '+g.times+'</div><div class="k">Won</div></div>' +
        '</div>';

      if(g.staleMonths !== null && g.staleMonths >= 12){
        h += '<div class="hflag mild">Last priced '+esc(ago(g.last.date))+'. Re-check steel and machining cost before quoting this figure again.</div>';
      }
      if(g.spread >= 15){
        h += '<div class="hflag">Priced from '+money(g.min,cur)+' to '+money(g.max,cur)+
             ' across '+g.customers.length+' customers. Worth knowing which figure they have seen before you send this.</div>';
      }
      if(g.lost >= 2 && g.won === 0){
        h += '<div class="hflag">Quoted '+g.times+' times, never won. The price may be off the market.</div>';
      }

      h += '<table class="hocc"><thead><tr>' +
          '<th>Date</th><th>Quote</th><th>Customer</th><th>Qty</th><th style="text-align:right">Unit price</th><th>Outcome</th>' +
          '</tr></thead><tbody>' +
        g.occ.slice(0,8).map(function(o){
          return '<tr><td class="m">'+esc(fmtDate(o.date))+'</td>' +
            '<td class="m">'+esc(o.num)+(o.rev?' R'+o.rev:'')+'</td>' +
            '<td>'+esc(o.customer)+'</td>' +
            '<td class="m">'+esc(o.qty)+' '+esc(o.unit)+'</td>' +
            '<td class="m" style="text-align:right">'+money(o.unitPrice,o.currency)+'</td>' +
            '<td><span class="badge '+esc(o.status)+'">'+esc(o.status)+'</span></td></tr>';
        }).join('') +
        (g.occ.length>8 ? '<tr><td colspan="6" class="hint">and '+(g.occ.length-8)+' more</td></tr>' : '') +
        '</tbody></table>' +
      '</div>';
    });

    h += '</div>';
    document.getElementById('stage').innerHTML = h;

    var sb = document.getElementById('hSearch');
    if(sb){
      sb.oninput = function(){ view.search = sb.value; renderHistory(); };
      if(term){ sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-huse]'), function(el){
      el.onclick = function(){
        var key = el.getAttribute('data-huse');
        var g = groups.filter(function(x){ return x.key === key; })[0];
        if(!g) return;
        var q = blankQuote();
        q.items = [ { id:uid('i'), qty:g.last.qty || 1, unit:g.last.unit || 'EA',
          partNo:g.last.partNo, desc:g.last.desc, unitPrice:g.last.unitPrice, note:'', noCharge:false } ];
        view.dirty = q;
        go('quotes','edit', q.id);
        toast('Started from your last price of ' + money(g.last.unitPrice, g.last.currency));
      };
    });
  }

  /* ==========================================================================
     IMPORTING PAST QUOTES
     The price history is only as good as what is in it, so there is a way to load
     the back catalogue in bulk rather than retyping it. Paste rows copied from a
     spreadsheet (tab separated) or a CSV.
     ========================================================================== */
  function parseDelimited(text){
    text = String(text||'').replace(/\r\n?/g,'\n').trim();
    if(!text) return [];
    var delim = (text.split('\n')[0].indexOf('\t') >= 0) ? '\t' : ',';
    var rows = [], row = [], field = '', q = false, atFieldStart = true;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(q){
        if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
        else field += c;
      } else {
        /* a double quote only opens a quoted field at the very start of that field.
           Anywhere else it is an inch mark - 60.3" Tip Radius - and must stay literal,
           otherwise one measurement swallows the rest of the file. */
        if(c === '"' && atFieldStart){ q = true; atFieldStart = false; }
        else if(c === delim){ row.push(field); field = ''; atFieldStart = true; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; atFieldStart = true; }
        else { field += c; atFieldStart = false; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
  }

  var COLMAP = [
    ['num',      /^(quote|quote ?no|quote ?number|proposal|proposal ?#|number|no)$/i],
    ['rev',      /^(rev|revision)$/i],
    ['date',     /^(date|quoted|quote ?date)$/i],
    ['customer', /^(customer|client|company|bill ?to)$/i],
    ['partNo',   /^(part|part ?no|part ?number|dwg|drawing)$/i],
    ['desc',     /^(desc|description|item|line|details)$/i],
    ['qty',      /^(qty|quantity)$/i],
    ['unit',     /^(unit|u\/m|um|uom)$/i],
    ['unitPrice',/^(price|unit ?price|rate|each)$/i],
    ['total',    /^(total|amount|ext|extended)$/i],
    ['status',   /^(status|outcome|result)$/i]
  ];
  function mapHeader(cells){
    var map = {}, seen = 0;
    cells.forEach(function(h, i){
      var name = String(h||'').trim();
      for(var j=0;j<COLMAP.length;j++){
        if(COLMAP[j][1].test(name)){ map[COLMAP[j][0]] = i; seen++; break; }
      }
    });
    return seen >= 3 ? map : null;
  }

  function importRows(text){
    var rows = parseDelimited(text);
    if(!rows.length) return { error:'Nothing to read. Paste the rows including a header line.' };
    var map = mapHeader(rows[0]);
    if(!map) return { error:'Could not work out the columns. A header row is needed, with at least a quote number, a description and a price.' };
    if(map.desc === undefined || map.unitPrice === undefined || map.num === undefined){
      return { error:'Needs at least three columns: quote number, description and unit price.' };
    }
    var body = rows.slice(1);
    var cell = function(r, k){ return map[k] === undefined ? '' : String(r[map[k]]||'').trim(); };
    var cleanMoney = function(v){ return num(String(v).replace(/[^0-9.\-]/g,'')); };

    var custByName = {};
    state.customers.forEach(function(c){ custByName[c.name.toLowerCase()] = c; });
    var newCustomers = [], grouped = {}, skipped = 0;

    body.forEach(function(r){
      var qnum = cell(r,'num'), desc = cell(r,'desc');
      if(!qnum || (!desc && !cell(r,'partNo'))){ skipped++; return; }
      var cname = cell(r,'customer') || 'Unknown customer';
      var c = custByName[cname.toLowerCase()];
      if(!c){
        c = { id:uid('c'), name:cname, code:'', active:true, contact:'', title:'', email:'', phone:'',
              addr1:'', addr2:'', city:'', prov:'', postal:'', country:'', shipSame:true,
              shipName:'', shipAddr1:'', shipAddr2:'', shipCity:'', shipProv:'', shipPostal:'',
              shipCountry:'', terms:'', notes:'Created by an import of past quotes.' };
        custByName[cname.toLowerCase()] = c;
        newCustomers.push(c);
      }
      var rev = num(cell(r,'rev'));
      var key = qnum + '|' + rev;
      if(!grouped[key]){
        grouped[key] = {
          id:uid('q'), num:qnum, rev:rev, customerId:c.id, contact:'', contactEmail:'',
          date: cell(r,'date') || '', validDays:0, jobRef:'', rfqRef:'', title:'', scope:'',
          items:[], currency:'CAD', taxLabel:(state.settings||SEED_SETTINGS).taxLabel,
          taxRate:0, freight:0, freightLabel:'Freight', leadTime:'', incoterms:'',
          paymentTerms:'', paymentNote:'', notes:'', terms:'', closing:'',
          status: (cell(r,'status')||'sent').toLowerCase(), imported:true, createdAt:Date.now()
        };
        if(['draft','sent','won','lost'].indexOf(grouped[key].status) < 0) grouped[key].status = 'sent';
      }
      grouped[key].items.push({
        id:uid('i'), qty:num(cell(r,'qty')) || 1, unit:cell(r,'unit') || 'EA',
        partNo:cell(r,'partNo'), desc:desc, unitPrice:cleanMoney(cell(r,'unitPrice')),
        note:'', noCharge:false
      });
    });

    var incoming = Object.keys(grouped).map(function(k){ return grouped[k]; });
    if(!incoming.length) return { error:'No usable rows found. Check that the quote number column is filled in.' };
    var existing = {};
    state.quotes.forEach(function(q){ existing[q.num + '|' + num(q.rev)] = true; });
    var fresh = incoming.filter(function(q){ return !existing[q.num + '|' + num(q.rev)]; });
    var dupes = incoming.length - fresh.length;

    return {
      quotes: fresh, customers: newCustomers, skipped: skipped, dupes: dupes,
      lines: fresh.reduce(function(a,q){ return a + q.items.length; }, 0)
    };
  }

  /* ==========================================================================
     ARCHIVE
     A browsable index of the quotes that live in Drive as Publisher and PDF files,
     sitting alongside the quotes raised in Kubera. An entry can be index only,
     which is just a name, number, customer and a link to the original, or fully
     read, in which case the line items are here and it prints and searches like
     any other quote.
     ========================================================================== */
  function driveUrl(a){
    if(a.url) return a.url;
    if(a.driveId) return 'https://drive.google.com/file/d/' + a.driveId + '/view';
    return '';
  }

  /* "Quote 26145 Rev 1 - Flodraulics.pdf" -> number, revision, customer, kind */
  function parseArchiveName(line){
    var raw = String(line||'').trim();
    if(!raw) return null;
    var parts = raw.split('\t');
    var fileName = parts[0].trim();
    var idish = (parts[1]||'').trim();
    var driveId = '';
    var m = idish.match(/\/file\/d\/([A-Za-z0-9_-]{20,60})/) || idish.match(/^([A-Za-z0-9_-]{20,60})$/);
    if(m) driveId = m[1];

    var kind = /pack\s*list|packing\s*slip/i.test(fileName) ? 'packlist'
             : /invoice/i.test(fileName) ? 'invoice' : 'quote';
    var mm = fileName.match(/^\s*(?:Quote|Pack list|Packing slip|Invoice)\s+([0-9]{4,5})(.*?)-\s*(.+?)\.(pdf|pub)\s*$/i);
    if(!mm) return { fileName:fileName, driveId:driveId, kind:kind, num:'', rev:0, customer:'', unparsed:true };
    var rev = 0;
    var rm = (mm[2]||'').match(/rev\s*_?\s*([0-9]+)/i);
    if(rm) rev = parseInt(rm[1],10);
    return {
      fileName: fileName, driveId: driveId, kind: kind,
      num: mm[1], rev: rev,
      customer: mm[3].trim().replace(/\s+/g,' '),
      ext: mm[4].toLowerCase()
    };
  }

  function importArchiveNames(text){
    var lines = String(text||'').replace(/\r\n?/g,'\n').split('\n')
      .map(function(l){ return l.trim(); }).filter(Boolean);
    if(!lines.length) return { error:'Paste one file name per line, as they appear in Drive.' };

    var have = {};
    (state.archive||[]).forEach(function(a){ have[a.fileName.toLowerCase()] = a; });
    var custByName = {};
    state.customers.forEach(function(c){ custByName[c.name.toLowerCase()] = c; });

    var fresh = [], updated = 0, skipped = 0, unknownCust = {};
    lines.forEach(function(l){
      var p = parseArchiveName(l);
      if(!p){ skipped++; return; }
      if(p.unparsed){ skipped++; return; }
      /* prefer the pdf: it is what got sent and the only one we can read */
      var key = p.fileName.toLowerCase();
      var existing = have[key];
      if(existing){
        if(p.driveId && !existing.driveId){ existing.driveId = p.driveId; updated++; }
        return;
      }
      var c = custByName[p.customer.toLowerCase()] || matchCustomer(p.customer);
      if(!c) unknownCust[p.customer] = (unknownCust[p.customer]||0) + 1;
      var rec = {
        id: uid('a'), fileName:p.fileName, driveId:p.driveId, kind:p.kind,
        num:p.num, rev:p.rev, customer:p.customer, customerId: c ? c.id : '',
        date:'', title:'', items:[], billTo:[], shipTo:[],
        paymentTerms:'', incoterms:'', total:0, currency:'CAD',
        extracted:false, source:'drive-index', addedAt: Date.now()
      };
      have[key] = rec;
      fresh.push(rec);
    });
    return {
      entries: fresh, updated: updated, skipped: skipped,
      pdfs: fresh.filter(function(r){ return /\.pdf$/i.test(r.fileName); }).length,
      newCustomerNames: Object.keys(unknownCust)
    };
  }

  /* A Firestore document caps at 1 MB and the extracted back catalogue is about
     620 KB of JSON, so the archive is written across numbered chunk documents
     rather than one. mc_archive holds the manifest; mc_archive_0, _1 ... hold the
     entries. */
  var ARCHIVE_CHUNK = 100;

  function saveArchive(list){
    state.archive = list;
    var chunks = [];
    for(var i=0;i<list.length;i+=ARCHIVE_CHUNK) chunks.push(list.slice(i, i+ARCHIVE_CHUNK));
    if(!chunks.length) chunks = [[]];
    var writes = chunks.map(function(c, i){ return safeSet(K.archive + '_' + i, c); });
    writes.push(safeSet(K.archive, { chunks: chunks.length, count: list.length, v: 2 }));
    return Promise.all(writes).then(function(rs){
      var ok = rs.every(Boolean);
      if(ok) lamp('on','Synced');
      return ok;
    });
  }

  function loadArchive(manifest){
    /* v1 stored a plain array in the manifest document; keep reading it */
    if(Array.isArray(manifest)) return Promise.resolve(manifest);
    if(!manifest || !manifest.chunks) return Promise.resolve([]);
    var gets = [];
    for(var i=0;i<manifest.chunks;i++){
      gets.push(fsDoc(K.archive + '_' + i).get().then(function(snap){
        var v = (snap.exists && snap.data().value) ? snap.data().value : [];
        return Array.isArray(v) ? v : [];
      }).catch(function(){ return []; }));
    }
    return Promise.all(gets).then(function(parts){
      return parts.reduce(function(a,b){ return a.concat(b); }, []);
    });
  }

  /* ---------------- archive list ---------------- */
  function archiveRows(){
    var rows = [];
    /* An archive entry that has been moved into the pipeline is represented by its
       live quote instead, otherwise the same number shows up twice in this list. The
       Drive link rides along on the quote so the original PDF stays one click away. */
    var promotedFrom = {};
    state.quotes.forEach(function(q){ if(q.fromArchive) promotedFrom[q.fromArchive] = q; });

    (state.archive||[]).forEach(function(a){
      if(promotedFrom[a.id]) return;
      rows.push({
        key:'a:'+a.id, archiveId:a.id, kind:a.kind, num:a.num, rev:num(a.rev),
        customer: a.customerId ? custName(a.customerId) : (a.customer || 'Unmatched'),
        date:a.date, title:a.title, source:'Drive',
        extracted:!!a.extracted, lines:(a.items||[]).length,
        total:num(a.total), url:driveUrl(a), rec:a
      });
    });
    state.quotes.forEach(function(q){
      rows.push({
        key:'q:'+q.id, kind:'quote', num:q.num, rev:num(q.rev),
        customer: custName(q.customerId), date:q.date, title:q.title,
        source: q.fromArchive ? 'Live from archive' : q.imported ? 'Imported' : 'Kubera',
        extracted:true, lines:(q.items||[]).length,
        total:quoteTotal(q), url: q.driveId ? driveUrl(q) : '',
        rec:q, isQuote:true, status:q.status
      });
    });
    return rows.sort(function(a,b){
      if(a.num !== b.num) return a.num < b.num ? 1 : -1;
      return b.rev - a.rev;
    });
  }

  /* ==========================================================================
     STILL-LIVE PROMOTION

     Most of the archive is history. Some of it isn't: a quote sent last month may
     still be sitting on a customer's desk. Promoting brings that record into the
     live pipeline AS ITSELF -- same number, same revision, same date -- which is
     what separates this from "Quote this again", where a fresh number is the whole
     point. Change the number and you have broken the thread with whatever the
     customer is holding.

     The archive record is kept. It is the evidence of what was actually sent, with
     its link to the original PDF; the pipeline copy is the working document from
     here on. They are joined by quote.fromArchive.
     ========================================================================== */

  function promotionPlan(ids){
    var s = state.settings || SEED_SETTINGS;
    var existing = {};
    state.quotes.forEach(function(q){ existing[String(q.num)+'|'+num(q.rev)] = q; });

    var plan = [], skipped = [];
    ids.forEach(function(id){
      var a = (state.archive||[]).filter(function(x){ return x.id === id; })[0];
      if(!a) return;
      var sig = String(a.num)+'|'+num(a.rev);
      if(existing[sig]){ skipped.push({ a:a, why:'already in the pipeline' }); return; }

      var items = (a.items||[]).map(function(it){
        return { id:uid('i'), qty:num(it.qty)||1, unit:it.unit||'EA', partNo:it.partNo||'',
                 desc:it.desc||'', note:it.note||'', unitPrice:num(it.unitPrice),
                 leadTime:it.leadTime||'', noCharge:false };
      });
      if(!items.length) items = [ blankItem() ];

      var q = blankQuote();
      // Identity is carried over verbatim -- this is the same document, still live.
      q.num = String(a.num||'');
      q.rev = num(a.rev);
      q.date = a.date || today();
      q.customerId = a.customerId || '';
      q.title = a.title || '';
      q.items = items;
      q.currency = a.currency || s.currency || 'CAD';
      q.incoterms = a.incoterms || s.incoterms || '';
      q.paymentTerms = a.paymentTerms || s.paymentTerms || '';
      // Tax comes from today's settings rather than the PDF, because from now on the
      // app computes the total instead of reprinting a stored one.
      q.taxLabel = s.taxLabel || 'GST';
      q.taxRate = num(s.taxRate);
      q.fromArchive = a.id;
      q.imported = true;
      if(a.driveId) q.driveId = a.driveId;
      if(a.url) q.url = a.url;

      // Quote numbers repeat across revisions, so ticking rev 0 when rev 2 is on
      // file would drag a superseded document into the pipeline. Flag it.
      var newerRev = 0;
      (state.archive||[]).forEach(function(x){
        if(String(x.num) === String(a.num) && num(x.rev) > num(a.rev)) {
          newerRev = Math.max(newerRev, num(x.rev));
        }
      });

      plan.push({ a:a, q:q, printed:num(a.total), computed:quoteTotal(q),
                  noLines:!(a.items||[]).length, noCustomer:!a.customerId,
                  unreconciled: a.reconciled === false,
                  supersededBy: newerRev || null });
      existing[sig] = q;
    });
    return { plan:plan, skipped:skipped };
  }

  function applyPromotion(plan, status){
    var quotes = state.quotes.slice();
    var archive = (state.archive||[]).slice();
    var maxSeq = 0;
    var yr = parseInt(String(new Date().getFullYear()).slice(2), 10);

    plan.forEach(function(p){
      p.q.status = status;
      quotes = upsert(quotes, JSON.parse(JSON.stringify(p.q)));
      archive = archive.map(function(x){
        return x.id === p.a.id ? Object.assign({}, x, { promotedTo: p.q.id }) : x;
      });
      // A promoted number at or above the counter would collide with the next new
      // quote, so nudge the counter past it.
      var m = /^(\d{2})(\d{3})$/.exec(String(p.q.num));
      if(m && parseInt(m[1],10) === yr) maxSeq = Math.max(maxSeq, parseInt(m[2],10));
    });

    var c = state.counters || SEED_COUNTERS;
    var chain = Promise.resolve(true);
    if(maxSeq && c.quoteYear === yr && num(c.quoteSeq) < maxSeq){
      chain = saveCounters({ quoteYear: yr, quoteSeq: maxSeq });
    }
    return chain
      .then(function(){ return saveQuotes(quotes); })
      .then(function(ok){ return ok ? saveArchive(archive) : false; });
  }

  function renderArchive(){
    var rows = archiveRows();
    var sel = view.archSel || (view.archSel = {});
    var f = view.archFilter || 'all';
    var term = view.search;
    var shown = rows.filter(function(r){
      if(f==='drive' && r.source!=='Drive') return false;
      if(f==='kubera' && r.source==='Drive') return false;
      if(f==='unread' && r.extracted) return false;
      if(!term) return true;
      var t = term.toLowerCase();
      return [r.num, r.customer, r.title, r.rec.fileName||''].join(' ').toLowerCase().indexOf(t) >= 0;
    });

    var driveCount = rows.filter(function(r){ return r.source==='Drive'; }).length;
    var readCount = rows.filter(function(r){ return r.source==='Drive' && r.extracted; }).length;
    var years = {};
    rows.forEach(function(r){ var y = String(r.num).slice(0,2); if(y) years[y] = (years[y]||0)+1; });

    var h = '<div class="wrap">' +
      '<div class="section-head"><h1>Archive</h1>' +
        '<div class="sub">' + rows.length + ' documents' +
        (driveCount ? ' &middot; ' + readCount + ' of ' + driveCount + ' Drive files read in full' : '') +
        '</div></div>';

    if(!rows.length){
      h += '<div class="empty-state"><b>Nothing indexed yet</b>' +
        'Paste the file names from your Drive quotes folder below and they become a browsable index, ' +
        'each one linking back to the original.</div>';
    } else {
      h += '<div class="insights">' +
        '<div class="ins"><div class="n">'+rows.length+'</div><div class="l">Documents on file</div>' +
          '<div class="d">' + Object.keys(years).sort().reverse().map(function(y){
            return '20'+y+': '+years[y]; }).join(' &middot; ') + '</div></div>' +
        '<div class="ins"><div class="n">'+readCount+'</div><div class="l">Read in full</div>' +
          '<div class="d">These carry their line items, so they print and feed the price history.</div></div>' +
        '<div class="ins'+((driveCount-readCount)>0?' warn':'')+'"><div class="n">'+(driveCount-readCount)+'</div>' +
          '<div class="l">Index only</div>' +
          '<div class="d">Number, customer and a link to the original, but no line items yet.</div></div>' +
      '</div>';
    }

    h += '<div class="toolbar">' +
        '<input class="searchbox" id="aSearch" placeholder="Search by number, customer or title" value="'+esc(term)+'">' +
        [['all','Everything'],['drive','Drive files'],['kubera','Raised here'],['unread','Index only']]
          .map(function(x){ return '<button class="chip'+(f===x[0]?' on':'')+'" data-af="'+x[0]+'">'+x[1]+'</button>'; }).join('') +
      '</div>';

    if(rows.length && !shown.length){
      h += '<div class="empty-state"><b>Nothing matches</b>Try a shorter search, or a different filter.</div>';
    } else if(shown.length){

  /* Takes the records produced from the PDF and turns them into archive entries,
     matching each to a customer already on file where the name agrees. */
  /* Drive file names use short forms - AMS, AME, B2Gold - while the customer
     records carry the full legal names read off the quotes. Match on the initials
     of the significant words, or on one name being the start of the other, so
     "Quote 26206 - B2Gold.pdf" finds B2Gold Back River Corp. Ambiguity is left
     unmatched rather than filed against the wrong company. */
  function acronym(n){
    var words = normName(n).split(' ').filter(Boolean);
    if(words.length < 2) return '';
    return words.map(function(w){ return w.charAt(0); }).join('');
  }
  function matchCustomer(name){
    var q = normName(name);
    if(!q) return null;
    var list = state.customers;
    var i, exact = [];
    for(i=0;i<list.length;i++){ if(normName(list[i].name) === q) exact.push(list[i]); }
    if(exact.length === 1) return exact[0];
    var byAlias = [];
    for(i=0;i<list.length;i++){
      var al = list[i].aliases || [];
      for(var j=0;j<al.length;j++){ if(normName(al[j]) === q){ byAlias.push(list[i]); break; } }
    }
    if(byAlias.length === 1) return byAlias[0];
    var byAcro = [];
    for(i=0;i<list.length;i++){ if(acronym(list[i].name) && acronym(list[i].name) === q) byAcro.push(list[i]); }
    if(byAcro.length === 1) return byAcro[0];
    if(q.length >= 4){
      var byPrefix = [];
      for(i=0;i<list.length;i++){
        var n = normName(list[i].name);
        if(n === q || n.indexOf(q + ' ') === 0 || q.indexOf(n + ' ') === 0 ||
           (Math.abs(n.length - q.length) <= 2 && (n.indexOf(q) === 0 || q.indexOf(n) === 0))){
          byPrefix.push(list[i]);
        }
      }
      if(byPrefix.length === 1) return byPrefix[0];
      if(byPrefix.length > 1){
        /* prefer the company with the most history on file */
        var counts = {};
        state.quotes.forEach(function(x){ counts[x.customerId] = (counts[x.customerId]||0)+1; });
        (state.archive||[]).forEach(function(x){ counts[x.customerId] = (counts[x.customerId]||0)+1; });
        byPrefix.sort(function(a,b){ return (counts[b.id]||0) - (counts[a.id]||0); });
        if((counts[byPrefix[0].id]||0) > (counts[byPrefix[1].id]||0)) return byPrefix[0];
      }
    }
    return null;
  }

  function normName(n){
    return String(n||'').toLowerCase()
      .replace(/\b(inc|ltd|limited|corp|corporation|co|company|llc|lp|ulc)\b\.?/g,'')
      .replace(/[^a-z0-9& ]/g,'').replace(/\s+/g,' ').trim();
  }
  function adoptExtracted(rows){
    var byName = {};
    state.customers.forEach(function(c){ byName[normName(c.name)] = c; });
    var newCustomers = [], matched = 0, lines = 0, entries = [];

    rows.forEach(function(r){
      var cname = String(r.customer||'').trim();
      var c = byName[normName(cname)] || matchCustomer(cname);
      if(!c && cname){
        c = { id:uid('c'), name:cname, code:'', active:true, contact:r.contact||'', title:'',
              email:'', phone:'', addr1:'', addr2:'', city:'', prov:'', postal:'', country:'',
              shipSame:true, shipName:'', shipAddr1:'', shipAddr2:'', shipCity:'', shipProv:'',
              shipPostal:'', shipCountry:'', terms:'',
              notes:'Added when the back catalogue was loaded.' };
        byName[normName(cname)] = c;
        newCustomers.push(c);
      } else if(c){ matched++; }
      var items = (r.items||[]).map(function(it){
        return { id:uid('i'), qty:num(it.qty)||1, unit:it.unit||'EA', partNo:it.partNo||'',
                 desc:it.desc||'', note:it.note||'', unitPrice:num(it.unitPrice),
                 leadTime:it.leadTime||'' };
      });
      lines += items.length;
      entries.push({
        id: uid('a'),
        fileName: (r.form==='long' ? 'Proposal ' : 'Quote ') + r.num + (num(r.rev) ? ' Rev ' + r.rev : ''),
        driveId:'', kind:'quote', num:String(r.num||''), rev:num(r.rev),
        customer:cname, customerId: c ? c.id : '',
        date:r.date||'', title:r.title||'', items:items,
        billTo:[], shipTo:[],
        paymentTerms:r.paymentTerms||'', incoterms:r.incoterms||'', valid:r.valid||'',
        currency:r.currency||'CAD',
        subtotal:num(r.subtotal), gst:num(r.gst), total:num(r.total) || num(r.subtotal),
        reconciled: r.reconciled !== false, form: r.form || 'short',
        pdfPage: num(r.page), pages: r.pages || 1,
        extracted: items.length > 0, source:'pdf-extract', addedAt: Date.now()
      });
    });

    /* replace any earlier load of the same document rather than stacking duplicates */
    var incoming = {};
    entries.forEach(function(e){ incoming[e.num + '|' + e.rev] = true; });
    var kept = (state.archive||[]).filter(function(a){
      if(a.source === 'pdf-extract' && incoming[a.num + '|' + num(a.rev)]) return false;
      return true;
    });
    return { entries: entries, merged: kept.concat(entries), lines: lines,
             matched: matched, newCustomers: newCustomers };
  }

  /* ==========================================================================
     FORMULA ENTRY
     Any figure box in the estimate accepts a calculation the way a spreadsheet
     cell does: =(6*9)+(12*9). The expression is kept as typed so it can be
     edited later, and evaluated with a small shunting-yard parser rather than
     eval, which would run arbitrary code from a saved quote.
     ========================================================================== */
  function isFormula(v){ return String(v||'').trim().charAt(0) === '='; }

  function tokenizeExpr(src){
    var out = [], i = 0, s = String(src);
    while(i < s.length){
      var c = s.charAt(i);
      if(c === ' ' || c === '\t' || c === ',' || c === '_'){ i++; continue; }
      if(/[0-9.]/.test(c)){
        var j = i;
        while(j < s.length && /[0-9.]/.test(s.charAt(j))) j++;
        var lit = s.slice(i, j);
        if((lit.match(/\./g) || []).length > 1) return null;
        var val = parseFloat(lit);
        if(!isFinite(val)) return null;
        if(s.charAt(j) === '%'){ val = val / 100; j++; }
        out.push({ t:'n', v:val });
        i = j;
        continue;
      }
      if('+-*/^'.indexOf(c) >= 0){ out.push({ t:'o', v:c }); i++; continue; }
      if(c === '(' || c === ')'){ out.push({ t:c }); i++; continue; }
      return null;   /* anything else is not arithmetic */
    }
    return out;
  }

  var PREC = { '+':1, '-':1, '*':2, '/':2, '^':3 };

  function evalExpr(src){
    /* 1,200 is one number, not 1 next to 200 */
    var cleaned = String(src).replace(/(\d),(?=\d{3}(\D|$))/g, '$1');
    while(/(\d),(?=\d{3}(\D|$))/.test(cleaned)) cleaned = cleaned.replace(/(\d),(?=\d{3}(\D|$))/g, '$1');
    var toks = tokenizeExpr(cleaned);
    if(!toks || !toks.length) return NaN;
    /* unary minus and plus: rewrite as 0 - x where it cannot be a binary operator */
    var norm = [], prev = null;
    for(var k=0;k<toks.length;k++){
      var tk = toks[k];
      if(tk.t === 'o' && (tk.v === '-' || tk.v === '+') &&
         (prev === null || prev.t === 'o' || prev.t === '(')){
        norm.push({ t:'n', v:0 });
        norm.push({ t:'o', v:tk.v });
      } else {
        norm.push(tk);
      }
      prev = tk;
    }
    var outQ = [], ops = [];
    for(var m=0;m<norm.length;m++){
      var t = norm[m];
      if(t.t === 'n'){ outQ.push(t.v); continue; }
      if(t.t === 'o'){
        while(ops.length){
          var top = ops[ops.length-1];
          if(top !== '(' && (PREC[top] > PREC[t.v] ||
             (PREC[top] === PREC[t.v] && t.v !== '^'))){ outQ.push(ops.pop()); }
          else break;
        }
        ops.push(t.v);
        continue;
      }
      if(t.t === '('){ ops.push('('); continue; }
      if(t.t === ')'){
        var found = false;
        while(ops.length){
          var o = ops.pop();
          if(o === '('){ found = true; break; }
          outQ.push(o);
        }
        if(!found) return NaN;
      }
    }
    while(ops.length){
      var last = ops.pop();
      if(last === '(') return NaN;
      outQ.push(last);
    }
    var st = [];
    for(var q=0;q<outQ.length;q++){
      var x = outQ[q];
      if(typeof x === 'number'){ st.push(x); continue; }
      if(st.length < 2) return NaN;
      var b = st.pop(), a = st.pop();
      if(x === '+') st.push(a + b);
      else if(x === '-') st.push(a - b);
      else if(x === '*') st.push(a * b);
      else if(x === '/') st.push(b === 0 ? NaN : a / b);
      else if(x === '^') st.push(Math.pow(a, b));
      else return NaN;
    }
    if(st.length !== 1) return NaN;
    return isFinite(st[0]) ? st[0] : NaN;
  }

  /* The value of a box: a plain number, or the result of its formula. */
  function cellValue(raw){
    var s = String(raw==null ? '' : raw).trim();
    if(!s) return 0;
    if(isFormula(s)) return evalExpr(s.slice(1));
    var n = parseFloat(s.replace(/[$,\s]/g,''));
    return isFinite(n) ? n : NaN;
  }
  function cellIsBad(raw){
    var s = String(raw==null ? '' : raw).trim();
    return s !== '' && isNaN(cellValue(s));
  }
  function showCell(raw, dp){
    var v = cellValue(raw);
    if(isNaN(v)) return 'error';
    var d = (dp === undefined) ? 2 : dp;
    return (Math.round(v * Math.pow(10,d)) / Math.pow(10,d)).toLocaleString('en-CA',
      { minimumFractionDigits:0, maximumFractionDigits:d });
  }

  /* ==========================================================================
     THE ESTIMATE
     Purchases and materials are costed then marked up by category. Labour is
     charged at an hourly rate per activity. The two together give the price the
     quote goes out at.
     ========================================================================== */
  function estCategories(){
    var s = state.settings || SEED_SETTINGS;
    return (s.estCategories && s.estCategories.length) ? s.estCategories : SEED_SETTINGS.estCategories;
  }
  function estActivities(){
    var s = state.settings || SEED_SETTINGS;
    return (s.estActivities && s.estActivities.length) ? s.estActivities : SEED_SETTINGS.estActivities;
  }
  function categoryMarkup(name){
    var list = estCategories();
    for(var i=0;i<list.length;i++){ if(list[i].name === name) return num(list[i].markup); }
    return num((state.settings||SEED_SETTINGS).defaultMarkup);
  }
  function activityRate(name){
    var list = estActivities();
    for(var i=0;i<list.length;i++){ if(list[i].name === name) return num(list[i].rate); }
    return num((state.settings||SEED_SETTINGS).defaultLabourRate);
  }

  function blankBuy(cat){
    var c = cat || estCategories()[0].name;
    return { id:uid('b'), category:c, desc:'', supplier:'', supplierQuote:'',
             qty:'1', unit:'lb', unitCost:'', markup:String(categoryMarkup(c)) };
  }
  function blankLab(act){
    var a = act || estActivities()[0].name;
    return { id:uid('l'), activity:a, desc:'', hours:'', rate:String(activityRate(a)) };
  }
  function blankEstimate(){
    return { buys:[ blankBuy() ], labour:[ blankLab() ], contingency:'', notes:'' };
  }

  function buyCost(b){
    var q = cellValue(b.qty), u = cellValue(b.unitCost);
    if(isNaN(q) || isNaN(u)) return NaN;
    return q * u;
  }
  function buyPrice(b){
    var c = buyCost(b);
    if(isNaN(c)) return NaN;
    var m = cellValue(b.markup);
    if(isNaN(m)) m = 0;
    return c * (1 + m/100);
  }
  function labHours(l){ return cellValue(l.hours); }
  function labValue(l){
    var h = labHours(l), r = cellValue(l.rate);
    if(isNaN(h) || isNaN(r)) return NaN;
    return h * r;
  }
  function safeSum(list, fn){
    var t = 0;
    list.forEach(function(x){ var v = fn(x); if(!isNaN(v)) t += v; });
    return t;
  }

  function estimateTotals(e){
    if(!e) return null;
    var buys = e.buys || [], labour = e.labour || [];
    var buyC = safeSum(buys, buyCost);
    var buyP = safeSum(buys, buyPrice);
    var hours = safeSum(labour, labHours);
    var labP = safeSum(labour, labValue);
    var cont = cellValue(e.contingency);
    if(isNaN(cont)) cont = 0;
    var beforeCont = buyP + labP;
    var contAmt = beforeCont * cont / 100;
    var price = beforeCont + contAmt;
    var byCat = {};
    buys.forEach(function(b){
      var k = b.category || 'Uncategorised';
      byCat[k] = byCat[k] || { cost:0, price:0, lines:0 };
      var c = buyCost(b), p = buyPrice(b);
      if(!isNaN(c)) byCat[k].cost += c;
      if(!isNaN(p)) byCat[k].price += p;
      byCat[k].lines++;
    });
    var byAct = {};
    labour.forEach(function(l){
      var k = l.activity || 'Other';
      byAct[k] = byAct[k] || { hours:0, value:0 };
      var h = labHours(l), v = labValue(l);
      if(!isNaN(h)) byAct[k].hours += h;
      if(!isNaN(v)) byAct[k].value += v;
    });
    return {
      buyCost:buyC, buyPrice:buyP, buyMargin: buyP ? (buyP - buyC) / buyP * 100 : 0,
      hours:hours, labourPrice:labP,
      contingencyPct:cont, contingency:contAmt,
      price:price, byCat:byCat, byAct:byAct,
      errors: buys.filter(function(b){ return isNaN(buyCost(b)) || cellIsBad(b.markup); }).length +
              labour.filter(function(l){ return isNaN(labValue(l)); }).length
    };
  }

    '</div>';

    document.getElementById('ePush').onclick = function(){ pushToQuote(); };
    document.getElementById('eAddBuy').onclick = function(){ e.buys.push(blankBuy()); renderBuys(); renderSum(); };

      var v = this.value; if(!v) return;
      e.buys.push(blankBuy(v)); this.value = ''; renderBuys(); renderSum();
    };

    function calcHint(raw, suffix){
      if(!isFormula(raw)) return '';
      var bad = isNaN(cellValue(raw));
      return '<div class="calchint'+(bad?' bad':'')+'">' +
        (bad ? 'cannot read that' : showCell(raw, 3) + (suffix||'')) + '</div>';
    }

    function renderBuys(){
      var t = '<table class="items esttable"><thead><tr>' +
        '<th class="c-cat">Category</th><th>Description</th>' +
        '<th class="c-sup">Supplier</th><th class="c-sup">Their quote #</th>' +

        '<th class="c-money">Cost</th><th class="c-mk">Mark up %</th><th class="c-money">Price</th><th></th>' +
        '</tr></thead><tbody>';

        var cost = buyCost(b), price = buyPrice(b);
        t += '<tr>' +
          '<td><select class="c-cat" data-bi="'+i+'" data-bf="category">'+catOpts(b.category)+'</select></td>' +

          '<td><input class="c-price'+(cellIsBad(b.unitCost)?' badcell':'')+'" data-bi="'+i+'" data-bf="unitCost" value="'+esc(b.unitCost)+'">' +
            calcHint(b.unitCost) + '</td>' +
          '<td class="c-money">'+(isNaN(cost)?'<span class="cellerr">error</span>':money(cost))+'</td>' +
          '<td><input class="c-mk" data-bi="'+i+'" data-bf="markup" value="'+esc(b.markup)+'"></td>' +
          '<td class="c-money"><b>'+(isNaN(price)?'<span class="cellerr">error</span>':money(price))+'</b></td>' +
          '<td class="c-del"><button class="iconbtn danger" data-bdel="'+i+'">x</button></td>' +
          '</tr>';
      });
      t += '</tbody></table>' +
        '<datalist id="unitList"><option>lb</option><option>kg</option><option>ft</option>' +
        '<option>m</option><option>in</option><option>L</option><option>ea</option>' +
        '<option>sheet</option><option>LOT</option><option>hr</option></datalist>';
      document.getElementById('buysHost').innerHTML = t;

      Array.prototype.forEach.call(document.querySelectorAll('[data-bf]'), function(el){
        var i = parseInt(el.getAttribute('data-bi'),10), f = el.getAttribute('data-bf');
        var handler = function(){
          e.buys[i][f] = el.value;
          if(f === 'category'){ e.buys[i].markup = String(categoryMarkup(el.value)); renderBuys(); }
          else if(f === 'qty' || f === 'unitCost' || f === 'markup'){ refreshBuyRow(i); }
          renderSum();
        };
        if(el.tagName === 'SELECT') el.onchange = handler; else el.oninput = handler;
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-bdel]'), function(el){
        el.onclick = function(){
          e.buys.splice(parseInt(el.getAttribute('data-bdel'),10),1);
          if(!e.buys.length) e.buys.push(blankBuy());
          renderBuys(); renderSum();
        };
      });
    }

    /* update one row's computed cells without rebuilding the table, so the cursor
       stays where it is while a formula is being typed */
    function refreshBuyRow(i){
      var host = document.getElementById('buysHost');
      var row = host.querySelectorAll('tbody tr')[i];
      if(!row) return;
      var b = e.buys[i], cost = buyCost(b), price = buyPrice(b);
      var cells = row.querySelectorAll('td');
      cells[7].innerHTML = isNaN(cost) ? '<span class="cellerr">error</span>' : money(cost);
      cells[9].innerHTML = '<b>' + (isNaN(price) ? '<span class="cellerr">error</span>' : money(price)) + '</b>';
      ['qty','unitCost'].forEach(function(f, idx){
        var td = cells[idx === 0 ? 4 : 6];
        var inp = td.querySelector('input');
        var old = td.querySelector('.calchint');
        if(old) old.remove();
        inp.classList.toggle('badcell', cellIsBad(b[f]));
        if(isFormula(b[f])){
          var d = document.createElement('div');
          var bad = isNaN(cellValue(b[f]));
          d.className = 'calchint' + (bad ? ' bad' : '');
          d.textContent = bad ? 'cannot read that' : showCell(b[f], 3);
          td.appendChild(d);
        }
      });
    }

    function renderLab(){
      var t = '<table class="items esttable"><thead><tr>' +
        '<th class="c-cat">Activity</th><th>What is being done</th>' +
        '<th class="c-qty">Hours</th><th class="c-price">Rate</th><th class="c-money">Value</th><th></th>' +
        '</tr></thead><tbody>';
      e.labour.forEach(function(l,i){
        var v = labValue(l);
        t += '<tr>' +
          '<td><select class="c-cat" data-li="'+i+'" data-lf="activity">'+actOpts(l.activity)+'</select></td>' +
          '<td><textarea data-li="'+i+'" data-lf="desc" rows="1">'+esc(l.desc)+'</textarea></td>' +
          '<td><input class="c-qty'+(cellIsBad(l.hours)?' badcell':'')+'" data-li="'+i+'" data-lf="hours" value="'+esc(l.hours)+'">' +
            calcHint(l.hours, ' h') + '</td>' +

          '<td class="c-money"><b>'+(isNaN(v)?'<span class="cellerr">error</span>':money(v))+'</b></td>' +
          '<td class="c-del"><button class="iconbtn danger" data-ldel="'+i+'">x</button></td>' +
          '</tr>';
      });
      t += '</tbody></table>';
      document.getElementById('labHost').innerHTML = t;

      Array.prototype.forEach.call(document.querySelectorAll('[data-lf]'), function(el){
        var i = parseInt(el.getAttribute('data-li'),10), f = el.getAttribute('data-lf');
        var handler = function(){
          e.labour[i][f] = el.value;
          if(f === 'activity'){ e.labour[i].rate = String(activityRate(el.value)); renderLab(); }
          else if(f === 'hours' || f === 'rate') refreshLabRow(i);
          renderSum();

      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-ldel]'), function(el){

          if(!e.labour.length) e.labour.push(blankLab());
          renderLab(); renderSum();
        };

    function refreshLabRow(i){
