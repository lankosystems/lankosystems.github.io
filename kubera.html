<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanko Kubera Quote Builder 26.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=Big+Shoulders+Text:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Design tokens shared with Kairos (timeclock) and Minerva (load board) so all
     three shop apps read as one system. Kubera handles quoting + pack lists. */
  :root{
    --oxblood:      #6D1708;
    --oxblood-dark: #4E1005;
    --oxblood-deep: #320A03;
    --gold:         #DEA509;
    --gold-light:   #E9C45F;
    --gold-dim:     #AD8007;
    --gold-muted:   #C7A15E;
    --ink:          #241811;
    --paper:        #F4EEE1;
    --paper-dim:    #E6DCC5;
    --card:         #FBF7EC;
    --olive:        #5B6B3F;
    --olive-dim:    #EEF1E4;
    --rust:         #A23B1E;
    --rust-dim:     #F7E6DE;
    --steel:        #3B5169;
    --steel-dim:    #E4EAF0;
    --line: rgba(36,24,17,0.14);

    --display: "Big Shoulders", sans-serif;
    --display-text: "Big Shoulders Text", sans-serif;
    --body: "IBM Plex Sans", sans-serif;
    --mono: "IBM Plex Mono", monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    background: var(--paper);
    font-family: var(--body);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  header.topbar{
    background: var(--oxblood);
    background-image: linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-dark) 100%);
    color: var(--gold);
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 28px; gap:16px; flex-wrap:wrap;
    box-shadow: 0 3px 0 var(--oxblood-deep), 0 6px 14px rgba(0,0,0,0.25);
    flex-shrink:0; position:relative; z-index:5;
  }
  .wordmark{ display:flex; align-items:center; gap:14px; line-height:1; }
  .wordmark .logo-img{ height:34px; width:auto; display:block; filter: drop-shadow(0 2px 0 var(--oxblood-deep)); }
  .wordmark .divider{ width:1.5px; height:26px; background: rgba(217,161,37,0.35); }
  .wordmark small{
    font-family: var(--display-text); font-weight:600; font-size:13px; color: var(--paper-dim);
    letter-spacing:2.5px; text-transform:uppercase; opacity:0.85;
  }
  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .synclamp{ font-family:var(--mono); font-size:11.5px; color:var(--gold-muted); display:flex; align-items:center; gap:7px; }
  .synclamp .bulb{ width:8px; height:8px; border-radius:50%; background:var(--gold-dim); }
  .synclamp.off .bulb{ background:var(--rust); }
  .synclamp.saving .bulb{ background:var(--gold-light); }

  /* ---------- tabs ---------- */
  nav.tabs{
    display:flex; gap:6px; flex-wrap:wrap; padding:10px 26px;
    background:var(--paper-dim); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  nav.tabs button{
    font-family:var(--display-text); font-weight:700; font-size:13px; text-transform:uppercase;
    letter-spacing:0.4px; padding:9px 16px; border-radius:8px; border:none;
    background:transparent; color:#7a6f5c; cursor:pointer;
  }
  nav.tabs button.active{ background:var(--oxblood); color:var(--gold-light); }
  nav.tabs button:hover:not(.active){ background:rgba(109,23,8,0.08); }

  main{
    flex:1; padding:22px 26px 56px;
    background: radial-gradient(ellipse at top, rgba(110,36,18,0.06), transparent 60%), var(--paper);
  }
  .wrap{ max-width:1180px; margin:0 auto; }
  /* Editors that carry a line-item table get more room, so Description
     stops paying for every fixed column beside it. */
  .wrap.wide{ max-width:1400px; }

  .section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .section-head h1{ font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--oxblood); margin:0; }
  .section-head .sub{ font-family:var(--mono); font-size:12.5px; color:#7a6f5c; }

  .btn{
    font-family:var(--display-text); font-weight:700; font-size:13px; letter-spacing:0.3px;
    border:none; padding:10px 16px; border-radius:8px; cursor:pointer;
    background:var(--gold); color:var(--oxblood-deep);
  }
  .btn.dark{ background:var(--oxblood); color:var(--gold-light); }
  .btn.ghost{ background:transparent; color:#7a6f5c; border:1.5px solid var(--line); }
  .btn.danger{ background:var(--rust-dim); color:var(--rust); }
  .btn.sm{ padding:6px 11px; font-size:12px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .searchbox{ flex:1; min-width:180px; font-family:var(--body); font-size:13.5px; padding:9px 12px;
    border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); }

  .datatable{ width:100%; border-collapse:collapse; background:var(--card); border-radius:10px;
    overflow:hidden; box-shadow:0 1px 0 var(--line), 0 10px 18px -14px rgba(36,24,17,0.22); }
  .datatable th{ text-align:left; font-family:var(--display-text); font-size:11px; text-transform:uppercase;
    letter-spacing:0.6px; color:#8a7f68; padding:10px 14px; background:var(--paper-dim);
    border-bottom:1px solid var(--line); white-space:nowrap; }
  .datatable td{ padding:10px 14px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .datatable tr:last-child td{ border-bottom:none; }
  .datatable tr.clickable{ cursor:pointer; }
  .datatable tr.clickable:hover td{ background:rgba(222,165,9,0.09); }
  .datatable td.num{ font-family:var(--mono); white-space:nowrap; }
  .datatable td.right{ text-align:right; font-family:var(--mono); white-space:nowrap; }
  .datatable td.acts{ text-align:right; white-space:nowrap; }

  .badge{ display:inline-block; font-family:var(--display-text); font-weight:700; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.4px; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.draft{ background:#ece7da; color:#8a7f68; }
  .badge.sent{ background:var(--steel-dim); color:var(--steel); }
  .badge.won{ background:var(--olive-dim); color:var(--olive); }
  .badge.lost{ background:var(--rust-dim); color:var(--rust); }
  .badge.rev{ background:var(--gold-light); color:var(--oxblood-deep); }
  .badge.active{ background:var(--olive-dim); color:var(--olive); }
  .badge.inactive{ background:#eee; color:#999; }
  .badge.live{ background:var(--gold-light); color:var(--oxblood-deep); }

  .iconbtn{ border:none; background:transparent; cursor:pointer; font-size:12.5px; color:#8a7f68;
    font-family:var(--display-text); font-weight:700; text-decoration:underline; padding:2px 6px; }
  .iconbtn.danger{ color:var(--rust); }

  .empty-state{ text-align:center; padding:46px 20px; color:#9a8f78; font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px; }
  .empty-state b{ display:block; font-family:var(--display); font-size:19px; color:var(--oxblood);
    margin-bottom:6px; letter-spacing:0.6px; }

  /* ---------- forms ---------- */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .card > h2{ font-family:var(--display); font-size:17px; letter-spacing:0.8px; text-transform:uppercase;
    color:var(--oxblood); margin:0 0 14px; }
  .grid{ display:grid; gap:12px; }
  .g2{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .g3{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  .g4{ grid-template-columns:repeat(4, minmax(0,1fr)); }
  @media (max-width:820px){ .g2,.g3,.g4{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .field label{ font-family:var(--display-text); font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:#8a7f68; font-weight:700; }
  .field input, .field select, .field textarea{
    font-family:var(--body); font-size:13.5px; padding:8px 10px; border-radius:7px;
    border:1px solid var(--line); background:#fff; color:var(--ink); width:100%; }
  .field input.mono, .field textarea.mono{ font-family:var(--mono); font-size:13px; }
  .field textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  .field .hint{ font-size:11.5px; color:#9a8f78; }
  .field.wide{ grid-column:1/-1; }
  .formrow{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:4px; }
  .formerr{ font-size:12.5px; color:var(--rust); font-weight:600; }
  .hint{ font-size:12px; color:#8a7f68; line-height:1.55; }
  .subhead{ font-family:var(--display-text); font-weight:700; font-size:12.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--oxblood); margin:20px 0 8px; }

  /* ---------- line items ---------- */
  .items{ width:100%; border-collapse:collapse; }
  .items th{ text-align:left; font-family:var(--display-text); font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:#8a7f68; padding:6px 8px; border-bottom:1px solid var(--line); }
  .items td{ padding:5px 6px; vertical-align:top; border-bottom:1px solid rgba(36,24,17,0.07); }
  .items input, .items textarea, .items select{
    font-family:var(--mono); font-size:12.5px; padding:7px 8px; border-radius:6px;
    border:1px solid var(--line); background:#fff; color:var(--ink); width:100%; }
  .items textarea{ font-family:var(--body); resize:vertical; min-height:34px; line-height:1.45; }
  .items .c-qty{ width:74px; }
  .items .c-unit{ width:86px; }
  .items .c-part{ width:150px; }
  .items .c-price{ width:112px; }
  .items .c-ext{ width:110px; text-align:right; font-family:var(--mono); font-size:12.5px; padding-top:14px; white-space:nowrap; }
  .items .c-del{ width:34px; text-align:center; }
  .items .drag{ width:26px; color:#c0b7a2; cursor:grab; text-align:center; padding-top:13px; font-size:14px; }
  .items tr.dragging{ opacity:0.4; }
  .items tr.dragover td{ border-top:2px solid var(--gold); }
  /* Roomy variant for the quote and pack list editors only: the narrow
     columns give back what they never needed, and with .wrap.wide the
     Description column ends up close to twice its old width. Shared
     tables elsewhere (goods, estimator, settings) keep the stock sizes. */
  .items.roomy .c-qty{ width:58px; }
  .items.roomy .c-unit{ width:62px; }
  .items.roomy .c-part{ width:118px; }
  .items.roomy .c-price{ width:96px; }
  .items.roomy .c-ext{ width:96px; }
  .totals{ margin-top:14px; margin-left:auto; width:320px; max-width:100%; }
  .totals .trow{ display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px; }
  .totals .trow span:last-child{ font-family:var(--mono); }
  .totals .trow.grand{ border-top:2px solid var(--oxblood); margin-top:6px; padding-top:9px;
    font-family:var(--display); font-size:19px; letter-spacing:0.6px; color:var(--oxblood); }
  .totals .trow.grand span:last-child{ font-family:var(--display); }
  .totals .trow input{ width:92px; font-family:var(--mono); font-size:12.5px; padding:5px 7px;
    border-radius:6px; border:1px solid var(--line); text-align:right; }

  /* ---------- price history ---------- */
  .insights{ display:grid; gap:12px; grid-template-columns:repeat(3, minmax(0,1fr)); margin-bottom:18px; }
  @media (max-width:820px){ .insights{ grid-template-columns:1fr; } }
  .ins{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .ins .n{ font-family:var(--display); font-size:30px; line-height:1; color:var(--oxblood); }
  .ins .l{ font-family:var(--display-text); font-weight:700; font-size:11px; text-transform:uppercase;
    letter-spacing:0.6px; color:#8a7f68; margin-top:6px; }
  .ins .d{ font-size:12px; color:#7a6f5c; margin-top:6px; line-height:1.5; }
  .ins.warn{ border-color:var(--gold-dim); background:#FBF3DC; }
  .ins.warn .n{ color:var(--rust); }

  .hgroup{ background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:15px 17px; margin-bottom:13px; }
  .hgroup .htop{ display:flex; justify-content:space-between; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .hgroup .hdesc{ font-size:14px; font-weight:600; line-height:1.45; flex:1; min-width:220px; }
  .hgroup .hpart{ font-family:var(--mono); font-size:11.5px; color:var(--oxblood);
    background:var(--paper-dim); border-radius:5px; padding:2px 7px; display:inline-block; margin-top:5px; }
  .hstats{ display:flex; gap:22px; flex-wrap:wrap; margin:12px 0 4px; }
  .hstat .v{ font-family:var(--mono); font-size:15px; font-weight:600; color:var(--ink); }
  .hstat .v.up{ color:var(--rust); } .hstat .v.down{ color:var(--olive); }
  .hstat .k{ font-family:var(--display-text); font-weight:700; font-size:10px; text-transform:uppercase;
    letter-spacing:0.5px; color:#8a7f68; }
  .hocc{ width:100%; border-collapse:collapse; margin-top:10px; }
  .hocc th{ text-align:left; font-family:var(--display-text); font-size:10px; text-transform:uppercase;
    letter-spacing:0.5px; color:#8a7f68; padding:5px 8px; border-bottom:1px solid var(--line); }
  .hocc td{ padding:5px 8px; font-size:12.5px; border-bottom:1px solid rgba(36,24,17,0.06); }
  .hocc td.m{ font-family:var(--mono); white-space:nowrap; }
  .hocc tr:last-child td{ border-bottom:none; }
  .hflag{ font-size:12px; color:var(--rust); background:var(--rust-dim); border-radius:6px;
    padding:6px 9px; margin-top:10px; line-height:1.5; }
  .hflag.mild{ color:#7a5c12; background:#FBF3DC; }

  .prevhint{ font-size:12px; color:#5f5546; background:var(--olive-dim); border-left:3px solid var(--olive);
    padding:6px 9px; margin-top:5px; border-radius:0 6px 6px 0; line-height:1.5; }
  .prevhint b{ font-family:var(--mono); }
  .prevhint button{ border:none; background:transparent; color:var(--oxblood); font-family:var(--display-text);
    font-weight:700; font-size:11.5px; text-decoration:underline; cursor:pointer; padding:0 4px; }
  .prevhint.stale{ background:#FBF3DC; border-left-color:var(--gold-dim); }

  /* ---------- estimate ---------- */
  .esttable{ font-size:12.5px; }
  .esttable th{ white-space:nowrap; }
  .esttable .c-cat{ width:150px; }
  .esttable .c-sup{ width:104px; }
  .esttable .c-qty{ width:88px; }
  .esttable .c-um{ width:62px; }
  .esttable .c-price{ width:96px; }
  .esttable .c-mk{ width:74px; }
  .esttable td.c-money{ width:104px; text-align:right; font-family:var(--mono);
    font-size:12.5px; padding-top:13px; white-space:nowrap; }
  .esttable input, .esttable select, .esttable textarea{ font-size:12.5px; }
  .esttable input.badcell{ border-color:var(--rust); background:var(--rust-dim); }
  .calchint{ font-family:var(--mono); font-size:10.5px; color:var(--olive);
    margin-top:3px; text-align:right; }
  .calchint.bad{ color:var(--rust); }
  .cellerr{ color:var(--rust); font-family:var(--display-text); font-weight:700; font-size:11px; }
  .chip{ font-family:var(--display-text); font-weight:700; font-size:12px; padding:8px 13px;
    border-radius:8px; border:1.5px solid var(--line); background:transparent;
    color:#7a6f5c; cursor:pointer; }
  .chip.on{ background:var(--oxblood); color:var(--gold-light); border-color:var(--oxblood); }

  /* ---------- archive selection bar ----------
     Sticks to the bottom while you tick your way down a long archive list, so the
     count and the action stay reachable without scrolling back up. */
  .selbar{ position:sticky; bottom:0; z-index:6; margin-top:14px;
    background:var(--oxblood); color:var(--gold-light);
    border:1px solid var(--oxblood-deep); border-radius:10px;
    padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    box-shadow:0 -6px 20px -10px rgba(0,0,0,0.4); }
  .selbar .n{ font-family:var(--display); font-weight:800; font-size:26px; line-height:1; }
  .selbar .lbl{ font-family:var(--display-text); font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.06em; }
  .selbar select{ font-family:var(--body); font-size:13px; padding:7px 9px;
    border-radius:7px; border:1px solid var(--gold-dim); background:var(--card); color:var(--ink); }
  .selbar .spacer{ flex:1; }
  .selbar .note{ font-family:var(--mono); font-size:11px; color:var(--gold-muted);
    flex-basis:100%; line-height:1.6; }
  .selbar .btn.ghost{ border-color:var(--gold-dim); color:var(--gold-light); background:transparent; }
  td.pick, th.pick{ width:34px; text-align:center; }
  td.pick input, th.pick input{ width:17px; height:17px; cursor:pointer; }

  /* ---------- toast / modal ---------- */
  #toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--oxblood); color:var(--gold-light); font-family:var(--display-text); font-weight:700;
    font-size:14px; padding:12px 22px; border-radius:10px; box-shadow:0 10px 26px -8px rgba(0,0,0,0.45);
    opacity:0; transition:transform .22s, opacity .22s; z-index:80; pointer-events:none; }
  #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
  #toast.err{ background:var(--rust); color:#fff; }
  .modal-back{ position:fixed; inset:0; background:rgba(36,24,17,0.5); display:flex; align-items:center;
    justify-content:center; padding:24px; z-index:70; }
  .modal{ background:var(--card); border-radius:12px; border:1px solid var(--line); padding:24px 26px;
    max-width:440px; width:100%; box-shadow:0 22px 50px -16px rgba(0,0,0,0.5); }
  .modal h3{ font-family:var(--display); font-size:20px; color:var(--oxblood); margin:0 0 8px; letter-spacing:0.6px; }
  .modal p{ font-size:13.5px; line-height:1.6; margin:0 0 18px; color:#5f5546; }
</style>
<style>
  /* ==========================================================================
     DOCUMENT SHEET - this is what becomes the PDF. Laid out at real Letter size
     in inches, so what's on screen is what prints. The print block at the bottom
     strips away all app chrome, so the browser's "Save as PDF" produces a clean
     quote with selectable vector text and no browser headers.
     ========================================================================== */
  .docviewer{
    background:#6f665a; padding:26px 20px 40px; border-radius:10px; overflow-x:auto;
    box-shadow:inset 0 2px 10px rgba(0,0,0,0.3);
  }
  .docbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .docbar .spacer{ flex:1; }
  .docbar .fname{ font-family:var(--mono); font-size:12px; color:#7a6f5c; }

  .sheet{
    width:8.5in; min-height:11in; margin:0 auto; background:#fff; color:#1a1a1a;
    padding:0.42in; position:relative;
    box-shadow:0 14px 34px -10px rgba(0,0,0,0.55);
    font-family:"IBM Plex Sans", sans-serif; font-size:9.6pt; line-height:1.45;
  }
  .sheet + .sheet{ margin-top:22px; }

  /* Every document carries the maroon frame -- matched to Quote 26191 (Jul 2026),
     which is how the real proposals go out. "Formal" now differs only by content
     (terms, closing, signatures), not by dress. */
  .frame{ border:2.5pt solid #6D1708; padding:0.24in 0.26in; min-height:9.55in;
    display:flex; flex-direction:column; }
  .frame.formal{ }
  .frame > .growth{ flex:1; }

  /* letterhead */
  .lh{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; }
  .lh-logo img{ height:0.52in; width:auto; display:block; }
  .lh-strip{ display:flex; gap:24px; margin-top:8px; font-size:8.6pt; line-height:1.4; color:#1a1a1a; }
  .lh-strip .col.a b{ font-weight:600; }
  .lh-strip .col{ flex:1; }
  .lh-strip .col.a{ flex:0 0 2.1in; }
  /* The real documents run straight from the letterhead into the title with no
     rule -- the element stays for spacing only. */
  .lh-hr{ border-top:none; margin:9px 0 0; }
  /* the heading on the real documents is a modest bold line, not display type */
  .doctitle{ font-family:"IBM Plex Sans",sans-serif; font-size:11pt; font-weight:700;
    letter-spacing:0.2px; color:#1a1a1a; margin:18px 0 8px; }
  .doctitle .sub{ font-size:9pt; font-weight:400; color:#4a4238; display:block; margin-top:2px; }
  .doctitle.formal{ font-family:"Big Shoulders",sans-serif; font-size:20pt; font-weight:800;
    letter-spacing:1.6px; color:#6D1708; }

  /* totals sit inside the item grid on the current documents */
  table.doctable td.tlabel{ text-align:right; border:none; font-size:9pt; padding:4px 8px;
    font-style:italic; }
  table.doctable td.tval{ text-align:right; font-family:"IBM Plex Mono",monospace;
    font-size:9pt; white-space:nowrap; }
  table.doctable tr.tgrand td{ font-weight:700; }
  table.doctable tr.blank td{ height:0.22in; }

  /* boxed meta table, matching the Proposal # / Date / Terms strip */
  table.metabox{ border-collapse:collapse; margin:0 0 14px; }
  table.metabox th{ background:#fff; color:#1a1a1a; font-family:"Big Shoulders Text",sans-serif;
    font-weight:700; font-size:8.4pt; letter-spacing:0.4px; text-align:left;
    padding:3px 9px; border:1px solid #1a1a1a; white-space:nowrap; }
  table.metabox td{ font-size:8.8pt; padding:3px 9px; border:1px solid #1a1a1a;
    font-family:"IBM Plex Mono",monospace; white-space:nowrap; }
  .lh .mark img{ height:0.62in; width:auto; display:block; }
  .lh .mark .tagline{ font-family:"Big Shoulders Text",sans-serif; font-weight:700; font-size:7.4pt;
    letter-spacing:2.2px; text-transform:uppercase; color:#6D1708; margin-top:5px; }
  .lh .addr{ text-align:right; font-size:8.2pt; line-height:1.5; color:#3a332b; }
  .lh .addr b{ font-family:"Big Shoulders",sans-serif; font-size:12.5pt; letter-spacing:0.7px;
    color:#6D1708; display:block; text-transform:uppercase; }
  .lh-rule{ height:3px; background:#6D1708; margin:9px 0 0; }
  .lh-rule2{ height:1px; background:#DEA509; margin-bottom:16px; }

  /* title + meta */
  .dochead{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:14px; }
  .dochead h1{ font-family:"Big Shoulders",sans-serif; font-size:27pt; font-weight:800; letter-spacing:2.6px;
    text-transform:uppercase; color:#6D1708; margin:0; line-height:0.95; }
  .dochead .subtitle{ font-family:"Big Shoulders Text",sans-serif; font-weight:700; font-size:8.4pt;
    letter-spacing:1.6px; text-transform:uppercase; color:#8a7f68; margin-top:3px; }
  table.meta{ border-collapse:collapse; font-size:8.6pt; min-width:2.5in; }
  table.meta td{ padding:2.6px 0 2.6px 12px; text-align:right; white-space:nowrap; }
  table.meta td.k{ font-family:"Big Shoulders Text",sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:0.7px; color:#8a7f68; text-align:left; padding-left:0; }
  table.meta td.v{ font-family:"IBM Plex Mono",monospace; font-weight:600; color:#1a1a1a; }
  table.meta tr.hi td.v{ color:#6D1708; }

  /* party blocks */
  .parties{ display:flex; gap:22px; margin-bottom:15px; }
  .parties .pblock{ flex:1; min-width:0; }
  .pblock .plabel{ font-family:"Big Shoulders Text",sans-serif; font-weight:700; font-size:8.6pt;
    letter-spacing:0.3px; color:#1a1a1a; padding:0 0 3px; display:block; }
  .pblock .pbody{ padding:0; font-size:9pt; line-height:1.45; min-height:0.7in; }
  .pblock .pbody b{ font-weight:600; }
  .pblock .pbody .attn{ margin-top:4px; color:#4a4238; }

  .refline{ font-size:9.4pt; margin-bottom:13px; }
  .refline .rl{ font-family:"Big Shoulders Text",sans-serif; font-weight:700; font-size:7.8pt;
    letter-spacing:1.2px; text-transform:uppercase; color:#8a7f68; display:block; margin-bottom:2px; }
  .refline .rv{ line-height:1.5; }

  /* items */
  table.doctable{ width:100%; border-collapse:collapse; margin-bottom:2px; }
  table.doctable thead th{
    background:#fff; color:#1a1a1a; font-family:"Big Shoulders Text",sans-serif; font-weight:700;
    font-size:8.4pt; letter-spacing:0.3px; padding:4px 6px; text-align:left;
    border:1px solid #1a1a1a;
  }
  table.doctable tbody td{ padding:5px 6px; font-size:8.8pt; vertical-align:top;
    border:1px solid #1a1a1a; }
  table.doctable tbody tr.spacer td{ height:0.16in; }
  table.doctable td.c{ text-align:center; }
  table.doctable td.r{ text-align:right; font-family:"IBM Plex Mono",monospace; white-space:nowrap; }
  table.doctable td.m{ font-family:"IBM Plex Mono",monospace; }
  table.doctable td .idesc{ white-space:pre-wrap; }
  table.doctable td .inote{ display:block; font-size:8.2pt; color:#6a6155; margin-top:2px; }
  .col-n{ width:0.34in; } .col-qty{ width:0.52in; } .col-unit{ width:0.5in; }
  .col-part{ width:1.25in; } .col-price{ width:0.95in; } .col-amt{ width:1.05in; }
  .col-bo{ width:0.45in; } .col-pkg{ width:0.7in; }

  /* totals */
  .doctotals{ display:flex; justify-content:flex-end; margin-top:10px; }
  .doctotals table{ border-collapse:collapse; min-width:2.9in; }
  .doctotals td{ padding:3.4px 8px; font-size:9.2pt; }
  .doctotals td.k{ text-align:right; color:#4a4238; }
  .doctotals td.v{ text-align:right; font-family:"IBM Plex Mono",monospace; white-space:nowrap; width:1.15in; }
  .doctotals tr.grand td{ border-top:2px solid #6D1708; padding-top:6px;
    font-family:"Big Shoulders",sans-serif; font-size:14pt; letter-spacing:0.8px; color:#6D1708; }
  .doctotals tr.grand td.v{ font-family:"Big Shoulders",sans-serif; }
  .doctotals .cur{ font-size:8pt; color:#8a7f68; letter-spacing:0.6px; }

  /* product render, matching the image + caption on the July 2026 proposals */
  .docimg{ margin-top:20px; text-align:center; }
  .docimg img{ max-width:5.6in; max-height:3.6in; }
  .docimg .cap{ font-size:9pt; margin-top:6px; color:#1a1a1a; }

  /* notes + terms */
  .docnote{ margin-top:16px; font-size:9pt; line-height:1.5; white-space:pre-wrap; }
  .docnote .nlabel, .terms .nlabel{ font-family:"Big Shoulders Text",sans-serif; font-weight:700;
    font-size:7.8pt; letter-spacing:1.3px; text-transform:uppercase; color:#6D1708;
    border-bottom:1px solid #DEA509; padding-bottom:2px; margin-bottom:6px; display:block; }
  .terms{ margin-top:18px; }
  .terms ol{ margin:0; padding-left:16px; font-size:8.2pt; line-height:1.55; color:#3a332b; }
  .terms ol li{ margin-bottom:2.5px; }
  .terms .flat{ font-size:8.2pt; line-height:1.55; white-space:pre-wrap; color:#3a332b; }

  /* signature strip */
  .sigs{ display:flex; gap:26px; margin-top:26px; }
  .sigs .sig{ flex:1; }
  .sigs .sline{ border-bottom:1px solid #8a7f68; height:0.34in; }
  .sigs .slabel{ font-family:"Big Shoulders Text",sans-serif; font-weight:700; font-size:7.4pt;
    letter-spacing:1.1px; text-transform:uppercase; color:#8a7f68; margin-top:4px; display:block; }
  .closing{ margin-top:22px; font-size:9.2pt; line-height:1.55; }
  .closing .who{ font-family:"Big Shoulders",sans-serif; font-size:13pt; letter-spacing:0.7px;
    color:#6D1708; margin-top:14px; }
  .closing .role{ font-size:8.4pt; color:#6a6155; }

  /* sheet footer */
  .sheetfoot{ margin-top:30px; border-top:1px solid #DEA509; padding-top:5px;
    display:flex; justify-content:space-between; gap:14px;
    font-size:7.6pt; color:#8a7f68; letter-spacing:0.4px; }
  .sheetfoot .fr{ font-family:"IBM Plex Mono",monospace; }

  .stamp{ position:absolute; top:0.5in; right:0.62in; font-family:"Big Shoulders",sans-serif;
    font-size:22pt; letter-spacing:3px; color:rgba(162,59,30,0.16); transform:rotate(-11deg);
    text-transform:uppercase; pointer-events:none; }

  /* ---------- print ---------- */
  @page{ size: letter; margin: 0; }
  @media print{
    html,body{ background:#fff !important; }
    .app-chrome{ display:none !important; }
    .docviewer{ background:#fff !important; padding:0 !important; box-shadow:none !important; overflow:visible !important; }
    .docbar{ display:none !important; }
    #toast, .modal-back{ display:none !important; }
    .sheet{ box-shadow:none !important; margin:0 !important; width:8.5in !important;
      page-break-after:always; break-after:page; }
    .sheet:last-child{ page-break-after:auto; break-after:auto; }
    table.doctable tbody tr{ page-break-inside:avoid; break-inside:avoid; }
    .terms, .sigs, .closing{ page-break-inside:avoid; break-inside:avoid; }
    table.doctable thead{ display:table-header-group; }
  }
</style>
</head>

<!-- ============================================================================
     FIREBASE - same shop project as Kairos (timeclock) and Minerva (load board).
     Client config values aren't secret; access is governed by Firestore rules and
     auth, not by hiding them. Kubera keeps its own collection so quotes and pack
     lists never collide with the other two apps' data.

     NAMING NOTE: this app was called Mercury until July 2026. The Firestore
     collection is still "mercury_state" and the doc keys still start "mc_", on
     purpose -- renaming them would orphan every quote, pack list and archive row
     already stored. They are plumbing the user never sees. If they are ever
     renamed to kubera_state / kb_, it has to be a deliberate copy-then-cut-over,
     not a find-and-replace in this file.
     ============================================================================ -->

<script>
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAJ4bTrYJKD0cEXu2JkiQbtsrCbiMYu8zg",
    authDomain: "lanko-kairos-cbbcd.firebaseapp.com",
    projectId: "lanko-kairos-cbbcd",
    storageBucket: "lanko-kairos-cbbcd.firebasestorage.app",
    messagingSenderId: "40770664322",
    appId: "1:40770664322:web:71b865076a1f8b6f15419b"
  };
  firebase.initializeApp(FIREBASE_CONFIG);
  var firebaseDb = firebase.firestore();
  firebaseDb.enablePersistence({ synchronizeTabs: true }).catch(function(e){
    console.warn('Firestore offline persistence not enabled:', e.code);
  });

  /* ---------- office sign-in ----------
     These apps are static files on a public URL, so the only real boundary around
     the shop's data is the Firestore rules, and those rules distinguish a real
     account from an anonymous session. This is where that account is obtained.

     Kairos is deliberately NOT gated: shop tablets have no keyboard, and the
     rules keep kairos_state open to anonymous sessions for exactly that reason. */
  function authFriendlyError(code){
    switch(code){
      case 'auth/invalid-email':        return 'That does not look like an email address.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':   return 'Email or password not recognised.';
      case 'auth/user-disabled':        return 'That account has been disabled in Firebase.';
      case 'auth/too-many-requests':    return 'Too many attempts. Wait a few minutes and try again.';
      case 'auth/network-request-failed': return 'No connection. Check the internet and try again.';
      case 'auth/operation-not-allowed': return 'Email sign-in is not switched on for this Firebase project yet.';
      default: return 'Could not sign in (' + code + ').';
    }
  }

  function buildAuthGate(appName, subtitle){
    var g = document.createElement('div');
    g.id = 'authgate';
    g.hidden = true;
    g.innerHTML =
      '<div class="box">' +
        '<div class="eyebrow">Lanko</div>' +
        '<h1>' + appName + '</h1>' +
        '<p class="sub">' + subtitle + '</p>' +
        '<div class="err" id="agErr" hidden></div>' +
        '<label for="agEmail">Email</label>' +
        '<input type="email" id="agEmail" autocomplete="username" autocapitalize="off" spellcheck="false">' +
        '<label for="agPass">Password</label>' +
        '<input type="password" id="agPass" autocomplete="current-password">' +
        '<button class="go" id="agGo">Sign in</button>' +
      '</div>';
    document.body.appendChild(g);

    var err = g.querySelector('#agErr');
    var email = g.querySelector('#agEmail');
    var pass = g.querySelector('#agPass');
    var go = g.querySelector('#agGo');

    function fail(msg){
      err.textContent = msg; err.hidden = false;
      go.disabled = false; go.textContent = 'Sign in';
    }
    function submit(){
      var e = email.value.trim(), p = pass.value;
      if(!e || !p){ fail('Enter both an email and a password.'); return; }
      err.hidden = true;
      go.disabled = true; go.textContent = 'Signing in...';
      firebase.auth().signInWithEmailAndPassword(e, p).catch(function(ex){
        fail(authFriendlyError(ex.code || 'unknown'));
        pass.value = '';
        pass.focus();
      });
    }
    go.onclick = submit;
    [email, pass].forEach(function(el){
      el.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') submit(); });
    });
    return g;
  }

  function buildWhoami(){
    var w = document.createElement('div');
    w.id = 'whoami';
    w.hidden = true;
    w.innerHTML = '<span id="waWho"></span><button id="waOut">Sign out</button>';
    document.body.appendChild(w);
    w.querySelector('#waOut').onclick = function(){
      firebase.auth().signOut();
    };
    return w;
  }

  var firebaseAuthReady = (function(){
    var resolveReady, resolved = false;
    var ready = new Promise(function(res){ resolveReady = res; });

    var gate = buildAuthGate('Kubera', 'Quotes and customer pricing. Sign in with your Lanko account.');
    var who = buildWhoami();

    firebase.auth().onAuthStateChanged(function(user){
      var real = user && !user.isAnonymous;
      gate.hidden = !!real;
      who.hidden = !real;
      if(real){
        who.querySelector('#waWho').textContent = user.email || 'signed in';
        // Resolve once. A later sign-out leaves the app loaded behind the overlay
        // rather than tearing it down, and signing back in simply lifts the cover.
        if(!resolved){ resolved = true; resolveReady(user); }
      } else {
        var f = gate.querySelector('#agEmail');
        if(f) f.focus();
      }
    });
    return ready;
  })();

</script>

<script>

  var lampEl, lampText;
  function lamp(kind, text){
    if(!lampEl){ lampEl = document.getElementById('synclamp'); lampText = document.getElementById('synctext'); }
    if(!lampEl) return;
    lampEl.className = 'synclamp' + (kind==='off' ? ' off' : kind==='saving' ? ' saving' : '');
    lampText.textContent = text;
  }

  var toastTimer=null;
  function toast(msg, isErr){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className=''; }, 2600);
  }

  /* ---------------- firestore read/write ----------------
     One doc per key holding {value, updatedAt}. onSnapshot keeps the office
     computer and any other open device in step without a refresh. */
  function safeSet(key, value){
    lamp('saving','Saving');
    return fsDoc(key).set({ value: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(function(){ lamp('on','Synced'); return true; })
      .catch(function(e){
        console.error('firestore set failed', key, e);
        lamp('off','Not saved');
        toast('Could not save to the shop database. Your change is still on screen - check the connection and try again.', true);
        return false;
      });
  }
  function watch(key, fallback, onValue){
    return fsDoc(key).onSnapshot(function(snap){
      var v = (snap.exists && snap.data().value !== undefined) ? snap.data().value : fallback;
      onValue(v);
      loaded[key] = true;
      lamp('on','Synced');
      if(allLoaded()) render();
    }, function(e){
      console.error('firestore listen failed', key, e);
      loaded[key] = true;
      onValue(fallback);
      lamp('off','Offline');
      if(allLoaded()) render();
    });
  }
  function allLoaded(){
    return loaded[K.company] && loaded[K.customers] && loaded[K.quotes] &&
           loaded[K.packs] && loaded[K.counters] && loaded[K.settings];
  }

  /* ---------------- helpers ---------------- */
  function uid(p){ return (p||'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function money(n, cur){
    var s = (Math.round(num(n)*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (cur==='USD' ? 'US$' : '$') + s;
  }
  function today(){
    var d = new Date(), p = function(x){ return (x<10?'0':'')+x; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(iso){
    if(!iso) return '';
    var p = String(iso).split('-');
    if(p.length!==3) return iso;
    return parseInt(p[2],10) + ' ' + MON[parseInt(p[1],10)-1] + ' ' + p[0];
  }
  function addDays(iso, days){
    if(!iso) return '';
    var d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() + num(days));
    var p = function(x){ return (x<10?'0':'')+x; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }
  function cust(id){
    for(var i=0;i<state.customers.length;i++){ if(state.customers[i].id===id) return state.customers[i]; }
    return null;
  }
  function custName(id){ var c = cust(id); return c ? c.name : 'No customer'; }
  function quoteById(id){
    for(var i=0;i<state.quotes.length;i++){ if(state.quotes[i].id===id) return state.quotes[i]; }
    return null;
  }
  function packById(id){
    for(var i=0;i<state.packs.length;i++){ if(state.packs[i].id===id) return state.packs[i]; }
    return null;
  }
  function quoteLabel(q){ return 'Quote ' + q.num + (num(q.rev)>0 ? ' Rev ' + q.rev : ''); }
  function quoteFile(q){ return quoteLabel(q) + ' - ' + custName(q.customerId); }
  function packLabel(p){ return 'Pack list ' + (p.jobNo || 'no job'); }
  function packFile(p){ return packLabel(p) + ' - ' + custName(p.customerId); }
  function addrLines(o, ship){
    if(!o) return [];
    var L = [];
    var a1 = ship ? (o.shipAddr1 || o.addr1) : o.addr1;
    var a2 = ship ? (o.shipAddr2 || o.addr2) : o.addr2;
    var city = ship ? (o.shipCity || o.city) : o.city;
    var prov = ship ? (o.shipProv || o.prov) : o.prov;
    var post = ship ? (o.shipPostal || o.postal) : o.postal;
    var ctry = ship ? (o.shipCountry || o.country) : o.country;
    if(a1) L.push(a1);
    if(a2) L.push(a2);
    var cl = [city, prov].filter(Boolean).join(', ');
    if(post) cl = cl ? cl + '  ' + post : post;
    if(cl) L.push(cl);
    if(ctry) L.push(ctry);
    return L;
  }
  /* quantities and prices may hold a calculation, so read them through the
     formula engine rather than parseFloat */
  function lineExt(it){
    var q = cellValue(it.qty), p = cellValue(it.unitPrice);
    if(isNaN(q) || isNaN(p)) return 0;
    return q * p;
  }
  function quoteSubtotal(q){
    var t = 0;
    (q.items||[]).forEach(function(it){ if(!it.noCharge) t += lineExt(it); });
    return t;
  }
  function quoteTax(q){ return (quoteSubtotal(q) + num(q.freight)) * num(q.taxRate) / 100; }
  function quoteTotal(q){ return quoteSubtotal(q) + num(q.freight) + quoteTax(q); }

  /* Accepts a full Drive URL or a bare file id and returns the id, so the doc
     sheet can embed the image through Drive's thumbnail endpoint. */
  function driveImgId(v){
    v = String(v||'').trim();
    if(!v) return '';
    var m = v.match(/\/d\/([A-Za-z0-9_-]{10,})/) || v.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
    if(m) return m[1];
    return /^[A-Za-z0-9_-]{10,}$/.test(v) ? v : '';
  }

  /* ---------------- Odin handoff ----------------
     "Award to Odin" appends a project stub to odin_state/projects. Kubera only
     ever appends here; Odin owns everything after the handoff. The quote keeps
     the project id in q.awarded so a second click cannot double-create, and the
     read-modify-write also skips any stub already carrying this quoteId. */
  function awardToOdin(q){
    var T = q.estimate ? estimateTotals(q.estimate) : null;
    var stub = {
      id: uid('pj'), quoteId: q.id, quoteNum: String(q.num), rev: num(q.rev),
      jobRef: q.jobRef || '', customerId: q.customerId || '',
      customerName: custName(q.customerId), title: q.title || '',
      currency: q.currency || 'CAD', value: quoteTotal(q),
      poNo:'', dueDate:'', status:'awaiting',
      items: (q.items||[]).filter(function(it){ return String(it.desc).trim() || String(it.partNo).trim(); })
        .map(function(it){ return { id:uid('i'), qty:num(it.qty), unit:it.unit||'EA',
          partNo:it.partNo||'', desc:it.desc||'', unitPrice:num(it.unitPrice) }; }),
      estimateHours: T ? Math.round(T.hours*10)/10 : 0,
      buys: (q.estimate && q.estimate.buys ? q.estimate.buys : []).map(function(b){
        return { desc:b.desc||'', category:b.category||'', qty:num(b.qty)||1 }; }),
      budget:{}, procurement:[],
      awardedAt: Date.now(),
      awardedBy: (firebase.auth().currentUser && firebase.auth().currentUser.email) || ''
    };
    var ref = firebaseDb.collection('odin_state').doc('projects');
    lamp('saving','Saving');
    return ref.get().then(function(snap){
      var list = (snap.exists && Array.isArray(snap.data().value)) ? snap.data().value : [];
      var dup = list.filter(function(p){ return p.quoteId === q.id; })[0];
      if(dup) return dup.id;
      list.push(stub);
      return ref.set({ value:list, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(function(){ return stub.id; });
    }).then(function(pid){
      lamp('on','Synced');
      q.awarded = pid;
      return saveQuotes(upsert(state.quotes, JSON.parse(JSON.stringify(q)))).then(function(){ return pid; });
    }).catch(function(e){
      console.error('award failed', e); lamp('off','Not saved');
      toast('Could not hand this off to Odin. Check the connection and try again.', true);
      return null;
    });
  }

  /* ==========================================================================
     FILLING IN ADDRESSES ON RECORDS THAT ALREADY EXIST
     The seed only writes on a first-ever load, so an install created before the
     addresses were extracted keeps its bare name-only records. This merges the
     extracted directory into whatever is already there: blank fields get filled,
     anything typed by hand is left exactly as it is, and short names matched by
     their initials are offered the full company name.
     ========================================================================== */
  var ADDR_FIELDS = ['contact','addr1','addr2','city','prov','postal','country'];
  var SHIP_FIELDS = ['shipName','shipAddr1','shipAddr2','shipCity','shipProv','shipPostal','shipCountry'];

  function blankish(v){ return v === undefined || v === null || String(v).trim() === ''; }

  function seedAcronym(name){
    var w = String(name||'').toLowerCase()
      .replace(/\b(inc|ltd|limited|corp|corporation|co|company|llc|lp|ulc)\b\.?/g,'')
      .replace(/[^a-z0-9& ]/g,'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
    return w.length >= 2 ? w.map(function(x){ return x.charAt(0); }).join('') : '';
  }
  function seedNorm(n){
    return String(n||'').toLowerCase()
      .replace(/\b(inc|ltd|limited|corp|corporation|co|company|llc|lp|ulc)\b\.?/g,'')
      .replace(/[^a-z0-9& ]/g,'').replace(/\s+/g,' ').trim();
  }

  /* Which existing record, if any, is this seed entry about? */
  function existingFor(seed, list, used){
    var cands = [seed.name].concat(ALIASES[seed.name] || []).map(seedNorm);
    var i, j;
    for(i=0;i<list.length;i++){
      if(used[list[i].id]) continue;
      if(cands.indexOf(seedNorm(list[i].name)) >= 0) return { rec:list[i], viaShortName:false };
    }
    var acro = seedAcronym(seed.name);
    if(acro){
      for(i=0;i<list.length;i++){
        if(used[list[i].id]) continue;
        if(seedNorm(list[i].name) === acro) return { rec:list[i], viaShortName:true };
      }
    }
    var target = seedNorm(seed.name), hits = [];
    for(i=0;i<list.length;i++){
      if(used[list[i].id]) continue;
      var n = seedNorm(list[i].name);
      if(n.length >= 4 && (target.indexOf(n + ' ') === 0 || target === n ||
          (Math.abs(n.length - target.length) <= 2 && target.indexOf(n) === 0))){
        hits.push(list[i]);
      }
    }
    if(hits.length === 1) return { rec:hits[0], viaShortName:seedNorm(hits[0].name) !== target };
    return null;
  }

  function planAddressFill(){
    var list = state.customers.slice();
    var used = {}, filled = 0, added = [], renamed = [], fieldCount = 0, ships = 0;
    var seeds = seedCustomers();  /* full records, ids and all */
    var out = list.map(function(c){ return JSON.parse(JSON.stringify(c)); });

    SEED_CUSTOMERS.forEach(function(seedRaw, idx){
      var seed = seeds[idx];
      var found = existingFor(seedRaw, out, used);
      if(!found){
        added.push(seed);
        return;
      }
      var rec = found.rec;
      used[rec.id] = true;
      var touched = false;
      ADDR_FIELDS.forEach(function(f){
        if(blankish(rec[f]) && !blankish(seed[f])){ rec[f] = seed[f]; fieldCount++; touched = true; }
      });
      if(blankish(rec.code) && !blankish(seed.code)) rec.code = seed.code;
      if(!rec.aliases || !rec.aliases.length) rec.aliases = seed.aliases || [];
      /* only take the seed's separate ship-to if nothing is set locally */
      if(seed.shipSame === false && rec.shipSame !== false &&
         SHIP_FIELDS.every(function(f){ return blankish(rec[f]); })){
        rec.shipSame = false;
        SHIP_FIELDS.forEach(function(f){ if(!blankish(seed[f])) rec[f] = seed[f]; });
        ships++; touched = true;
      }
      if(blankish(rec.notes) && !blankish(seed.notes)) rec.notes = seed.notes;
      if(found.viaShortName && seedNorm(rec.name) !== seedNorm(seed.name)){
        renamed.push({ from: rec.name, to: seed.name });
        rec.name = seed.name;
        touched = true;
      }
      if(touched) filled++;
    });

    return { list: out.concat(added), filled: filled, added: added, renamed: renamed,
             fieldCount: fieldCount, ships: ships };
  }

        field('Tax label', '<input data-f="taxLabel" value="'+esc(q.taxLabel)+'">') +

        field('ETA / lead time', '<input data-f="leadTime" value="'+esc(q.leadTime)+'" placeholder="Please allow 5-6 weeks for completion">') +

      '<div class="grid" style="margin-top:12px">' +

    document.getElementById('stage').innerHTML = h;
    renderItems();
    renderTotals();
    bindFields(q, function(f){
      if(f==='customerId'){

        var picked = cust(q.customerId);
        if(picked && String(picked.terms||'').trim()) q.paymentTerms = picked.terms;
        if(picked && !String(q.contact||'').trim()) q.contact = picked.contact || '';
        if(picked && !String(q.contactEmail||'').trim()) q.contactEmail = picked.email || '';
        renderQuoteEditor();
      }
      else if(f==='date') renderQuoteEditor();
      else if(f==='validDays'){
        var ex = document.getElementById('qExpiry');
        if(ex) ex.textContent = 'Expires ' + fmtDate(addDays(q.date, q.validDays));
      }
      else if(f==='taxRate' || f==='taxLabel' || f==='currency' || f==='freightLabel') renderTotals();
    });

    document.getElementById('qBack').onclick = function(){
      confirmModal('Leave without saving?','Any changes since your last save are dropped.','Leave', function(){
        view.dirty = null; go('quotes','list');
      });
    };
    var oe = document.getElementById('qOpenEst');
    if(oe) oe.onclick = function(){ go('quotes','estimate', q.id); };
    document.getElementById('qAddItem').onclick = function(){
      q.items.push(blankItem()); renderItems(); renderTotals();
    };
    document.getElementById('qEstimate').onclick = function(){
      if(!q.estimate) q.estimate = blankEstimate();
      go('quotes','estimate', q.id);
    };
    document.getElementById('qSave').onclick = function(){ saveQuoteForm(false); };
    document.getElementById('qSavePdf').onclick = function(){ saveQuoteForm(true); };
    var qaw = document.getElementById('qAward');
    if(qaw && !q.awarded) qaw.onclick = function(){
      confirmModal('Award to Odin',
        'This starts project management for this quote in Odin: the line items, estimate hours and purchase list go across as a new project awaiting initiation. Kubera keeps the quote as Won.',
        'Award it',
        function(){ awardToOdin(q).then(function(pid){
          if(pid){ toast('Handed to Odin. Open Odin to initiate the project.'); go('quotes','edit', q.id); }
        }); });
    };
    var del = document.getElementById('qDelete');
    if(del) del.onclick = function(){
      confirmModal('Delete this quote?', quoteLabel(q) + ' is removed for everyone. This cannot be undone.',
        'Delete', function(){
          saveQuotes(removeById(state.quotes, q.id)).then(function(){
            toast('Quote deleted'); view.dirty=null; go('quotes','list');
          });
        }, true);
    };

    function renderItems(){
      var t = '<table class="items roomy"><thead><tr>' +
        '<th></th><th class="c-qty">Qty</th><th class="c-unit">Unit</th><th class="c-part">Part no.</th>' +
        '<th>Description</th><th class="c-price">Unit price</th><th style="text-align:right">Amount</th><th></th>' +
        '</tr></thead><tbody>';
      q.items.forEach(function(it, i){
        t += '<tr draggable="true" data-row="'+i+'">' +
          '<td class="drag" title="Drag to reorder">=</td>' +
          '<td><input class="c-qty" inputmode="decimal" data-i="'+i+'" data-if="qty" value="'+esc(it.qty)+'" ' +
            'title="A calculation is fine here, e.g. =6*9"></td>' +
          '<td><input class="c-unit" data-i="'+i+'" data-if="unit" value="'+esc(it.unit)+'"></td>' +
          '<td><input class="c-part" data-i="'+i+'" data-if="partNo" value="'+esc(it.partNo)+'"></td>' +
          '<td><textarea data-i="'+i+'" data-if="desc" rows="1">'+esc(it.desc)+'</textarea>' +
            '<textarea data-i="'+i+'" data-if="note" rows="1" placeholder="Indented notes under this line, one per row" style="margin-top:4px;font-size:11.5px">'+esc(it.note||'')+'</textarea></td>' +
          '<td><input class="c-price" inputmode="decimal" data-i="'+i+'" data-if="unitPrice" value="'+esc(it.unitPrice)+'" ' +
            'title="A calculation is fine here, e.g. =(6*9)+120"></td>' +
          '<td class="c-ext" data-ext="'+i+'">'+money(lineExt(it), q.currency)+'</td>' +
          '<td class="c-del"><button class="iconbtn danger" data-del="'+i+'" title="Remove line">x</button></td>' +
          '</tr>';
        /* what did we charge for this last time? */
        var prev = findPrevious(it.desc, it.partNo, q.id);
        if(prev){
          var o = prev.occ[0];
          var months = monthsSince(o.date);
          var staleCls = (months !== null && months >= 12) ? ' stale' : '';
          var others = prev.occ.filter(function(x){ return x.customerId !== q.customerId; }).length;
          var sameCust = prev.occ.filter(function(x){ return x.customerId === q.customerId; })[0];
          var shownOcc = sameCust || o;
          t += '<tr><td></td><td colspan="7"><div class="prevhint'+staleCls+'">' +
            (prev.exact ? 'Same part number' : 'Looks like') + ' quoted ' + esc(ago(shownOcc.date)) +
            ' to <b>' + esc(shownOcc.customer) + '</b> at <b>' + money(shownOcc.unitPrice, shownOcc.currency) + '</b>' +
            ' (' + esc(shownOcc.qty) + ' ' + esc(shownOcc.unit) + ', ' + esc(shownOcc.status) + ')' +
            (sameCust ? ' - this customer has seen that figure.' : '') +
            (others > 1 ? ' Priced ' + prev.occ.length + ' times in total.' : '') +
            (staleCls ? ' Over a year old, worth re-checking cost.' : '') +
            ' <button data-useprev="'+i+'" data-price="'+shownOcc.unitPrice+'">Use this price</button>' +
            '<button data-seehist="'+i+'">See all</button>' +
            '</div></td></tr>';
        }
      });
      t += '</tbody></table>';
      document.getElementById('itemsHost').innerHTML = t;

      Array.prototype.forEach.call(document.querySelectorAll('[data-if]'), function(el){
        el.oninput = function(){
          var i = parseInt(el.getAttribute('data-i'),10);
          var f = el.getAttribute('data-if');
          q.items[i][f] = el.value;
          if(f === 'qty' || f === 'unitPrice') el.classList.toggle('badcell', cellIsBad(el.value));
          var cell = document.querySelector('[data-ext="'+i+'"]');
          if(cell) cell.textContent = money(lineExt(q.items[i]), q.currency);
          renderTotals();
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-if="desc"],[data-if="partNo"]'), function(el){
        el.onchange = function(){ renderItems(); renderTotals(); };
      });
      /* a calculation typed into a quantity or a price is worked out when you leave
         the box, the same as it would be in a spreadsheet */
      Array.prototype.forEach.call(document.querySelectorAll('[data-if="qty"],[data-if="unitPrice"]'), function(el){
        el.onblur = function(){
          if(!isFormula(el.value)) return;
          var v = cellValue(el.value);
          var i = parseInt(el.getAttribute('data-i'),10), f = el.getAttribute('data-if');
          if(isNaN(v)){ toast('That calculation cannot be read', true); return; }
          q.items[i][f] = String(Math.round(v*10000)/10000);
          renderItems(); renderTotals();
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-useprev]'), function(el){
        el.onclick = function(){
          var i = parseInt(el.getAttribute('data-useprev'),10);
          q.items[i].unitPrice = num(el.getAttribute('data-price'));
          renderItems(); renderTotals();
          toast('Price carried over from the earlier quote');
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-seehist]'), function(el){
        el.onclick = function(){
          var i = parseInt(el.getAttribute('data-seehist'),10);
          view.search = q.items[i].partNo || q.items[i].desc;
          go('history');
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(el){
        el.onclick = function(){
          var i = parseInt(el.getAttribute('data-del'),10);
          q.items.splice(i,1);
          if(!q.items.length) q.items.push(blankItem());
          renderItems(); renderTotals();
        };
      });
      wireRowDrag();
    }

    function wireRowDrag(){
      var from = null;
      Array.prototype.forEach.call(document.querySelectorAll('tr[data-row]'), function(tr){
        tr.ondragstart = function(){ from = parseInt(tr.getAttribute('data-row'),10); tr.classList.add('dragging'); };
        tr.ondragend   = function(){ tr.classList.remove('dragging');
          Array.prototype.forEach.call(document.querySelectorAll('tr[data-row]'), function(x){ x.classList.remove('dragover'); }); };
        tr.ondragover  = function(e){ e.preventDefault(); tr.classList.add('dragover'); };
        tr.ondragleave = function(){ tr.classList.remove('dragover'); };
        tr.ondrop = function(e){
          e.preventDefault();
          var to = parseInt(tr.getAttribute('data-row'),10);
          if(from===null || from===to) return;
          var moved = q.items.splice(from,1)[0];
          q.items.splice(to,0,moved);
          from = null; renderItems(); renderTotals();
        };
      });
    }

    function renderTotals(){
      var sub = quoteSubtotal(q), tax = quoteTax(q);
      document.getElementById('totalsHost').innerHTML =
        '<div class="totals">' +
          '<div class="trow"><span>Subtotal</span><span>'+money(sub,q.currency)+'</span></div>' +
          '<div class="trow"><span>'+esc(q.freightLabel||'Freight')+'</span>' +
            '<span><input class="mono" inputmode="decimal" id="qFreight" value="'+esc(q.freight)+'"></span></div>' +
          '<div class="trow"><span>'+esc(q.taxLabel)+' at '+esc(q.taxRate)+'%</span><span>'+money(tax,q.currency)+'</span></div>' +
          '<div class="trow grand"><span>Total '+esc(q.currency)+'</span><span>'+money(sub+num(q.freight)+tax,q.currency)+'</span></div>' +
        '</div>';
      var fr = document.getElementById('qFreight');
      fr.oninput = function(){ q.freight = fr.value; renderTotals(); document.getElementById('qFreight').focus(); };
    }

    function saveQuoteForm(thenDoc){
      if(!q.customerId){ view.err = 'Pick a customer before saving - the letterhead block needs somewhere to go.'; return renderQuoteEditor(); }
      var hasLine = q.items.some(function(it){ return String(it.desc).trim() || num(it.unitPrice) || String(it.partNo).trim(); });
      if(!hasLine){ view.err = 'Add at least one line item with a description or a price.'; return renderQuoteEditor(); }

      var chain = Promise.resolve();
      if(!q.num){
        var n = nextQuoteNumber();
        q.num = n.num;
        chain = saveCounters(n.counters);
      }
      chain.then(function(){
        return saveQuotes(upsert(state.quotes, JSON.parse(JSON.stringify(q))));
      }).then(function(ok){
        if(!ok) return;
        toast('Saved ' + quoteLabel(q));
        view.err = '';
        if(thenDoc){ view.dirty = null; go('quotes','doc', q.id); }
        else renderQuoteEditor();
      });
    }
  }

  function field(label, control, hint){
    return '<div class="field"><label>'+esc(label)+'</label>' + control +
      (hint ? '<span class="hint">'+esc(hint)+'</span>' : '') + '</div>';
  }
  function bindFields(obj, onChange){
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function(el){
      var f = el.getAttribute('data-f');
      var handler = function(){
        obj[f] = (el.type==='checkbox') ? el.checked : el.value;
        if(onChange) onChange(f);
      };
      if(el.tagName==='SELECT' || el.type==='date' || el.type==='checkbox') el.onchange = handler;
      else el.oninput = handler;
    });
  }

  /* ==========================================================================
     PACK LISTS
     ========================================================================== */
  function sortedPacks(){
    return state.packs.slice().sort(function(a,b){
      var x = String(a.jobNo||''), y = String(b.jobNo||'');
      if(x !== y) return x < y ? 1 : -1;
      return num(b.createdAt) - num(a.createdAt);
    });
  }

  function packFromQuote(quoteId){
    var q = quoteById(quoteId);
    if(!q) return;
    var p = blankPack();
    p.quoteId = q.id;
    p.customerId = q.customerId;
    p.jobNo = q.jobRef || '';
    p.poNo = q.rfqRef || '';
    p.title = q.title || '';
    p.items = (q.items||[]).filter(function(it){ return String(it.desc).trim() || String(it.partNo).trim(); })
      .map(function(it){
        return { id:uid('p'), qty:num(it.qty), shipped:num(it.qty), unit:it.unit||'EA',
                 partNo:it.partNo, desc:it.desc, pkg:'', bo:false };
      });
    if(!p.items.length) p.items = [ blankPackItem() ];
    view.dirty = p;
    go('packs','edit', p.id);
    toast('Pack list started from ' + quoteLabel(q));
  }

  function renderPacksList(){
    var term = view.search;
    var list = sortedPacks().filter(function(p){
      if(!term) return true;
      var hay = [p.jobNo, p.poNo, p.title, custName(p.customerId), p.waybill].join(' ').toLowerCase();
      return hay.indexOf(term.toLowerCase()) >= 0;
    });
    var h = '<div class="wrap">' +
      '<div class="section-head"><h1>Pack lists</h1><div class="sub">' + state.packs.length + ' on file</div></div>' +
      '<div class="toolbar">' +
        '<input class="searchbox" id="pSearch" placeholder="Search by job number, customer, PO or waybill" value="'+esc(term)+'">' +
        '<button class="btn" id="pNew">New pack list</button>' +
      '</div>';

    if(!list.length){
      h += '<div class="empty-state"><b>' + (term ? 'Nothing matches that search' : 'No pack lists yet') + '</b>' +
        (term ? 'Try a shorter search term.'
              : 'Start one from scratch, or open a quote and use its Pack list button to carry the line items across.') +
        '</div>';
    } else {
      h += '<table class="datatable"><thead><tr>' +
        '<th>Job</th><th>Customer</th><th>Title</th><th>Date</th><th>Pieces</th><th>Crates</th><th></th>' +
        '</tr></thead><tbody>';
      list.forEach(function(p){
        var pieces = (p.items||[]).reduce(function(a,it){ return a + num(it.shipped); }, 0);
        var bo = (p.items||[]).some(function(it){ return it.bo || num(it.shipped) < num(it.qty); });
        h += '<tr class="clickable" data-popen="'+p.id+'">' +
          '<td class="num"><b>'+esc(p.jobNo||'-')+'</b>' + (bo ? ' <span class="badge lost">B/O</span>' : '') + '</td>' +
          '<td>'+esc(custName(p.customerId))+'</td>' +

          '<td class="num">'+esc(fmtDate(p.date))+'</td>' +

          '<td class="acts"><button class="iconbtn" data-ppdf="'+p.id+'">PDF</button></td>' +

      '</div><div class="grid" style="margin-top:12px">' +

      '</div></div>' +
    '</div>';

    document.getElementById('stage').innerHTML = h;
    renderPackItems();
    renderPkgs();
    renderPackSummary();
    bindFields(p, function(f){
      if(f==='customerId' || f==='quoteId') renderPackEditor();
    });

    document.getElementById('pBack').onclick = function(){
      confirmModal('Leave without saving?','Any changes since your last save are dropped.','Leave', function(){
        view.dirty=null; go('packs','list');
      });
    };
    document.getElementById('pAddItem').onclick = function(){ p.items.push(blankPackItem()); renderPackItems(); renderPackSummary(); };
    document.getElementById('pAddPkg').onclick = function(){
      p.packages = p.packages || [];
      p.packages.push({ id:uid('g'), label:'Crate ' + (p.packages.length+1), type:'Crate', dims:'', weight:'' });
      renderPkgs(); renderPackItems();
    };
    var pull = document.getElementById('pPullQuote');
    if(pull) pull.onclick = function(){
      var q = quoteById(p.quoteId);
      if(!q) return;
      confirmModal('Replace the item list?','The lines from ' + quoteLabel(q) + ' overwrite what is here now.','Replace', function(){
        p.items = (q.items||[]).filter(function(it){ return String(it.desc).trim() || String(it.partNo).trim(); })
          .map(function(it){ return { id:uid('p'), qty:num(it.qty), shipped:num(it.qty),
                 unit:it.unit||'EA', partNo:it.partNo, desc:it.desc, pkg:'', bo:false }; });
        if(!p.items.length) p.items = [ blankPackItem() ];
        renderPackItems(); renderPackSummary();
      });
    };
    document.getElementById('pSave').onclick = function(){ savePackForm(false); };
    document.getElementById('pSavePdf').onclick = function(){ savePackForm(true); };
    var del = document.getElementById('pDelete');
    if(del) del.onclick = function(){
      confirmModal('Delete this pack list?', packLabel(p) + ' is removed for everyone.', 'Delete', function(){
        savePacks(removeById(state.packs, p.id)).then(function(){
          toast('Pack list deleted'); view.dirty=null; go('packs','list');
        });
      }, true);
    };

    function pkgOptions(sel){
      var opts = '<option value=""></option>';
      (p.packages||[]).forEach(function(g){
        opts += '<option value="'+esc(g.label)+'"'+(g.label===sel?' selected':'')+'>'+esc(g.label)+'</option>';
      });
      if(sel && !(p.packages||[]).some(function(g){ return g.label===sel; })){
        opts += '<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';
      }
      return opts;
    }

    function renderPackItems(){
      var t = '<table class="items roomy"><thead><tr>' +
        '<th></th><th class="c-qty">Ordered</th><th class="c-qty">Shipped</th><th class="c-unit">U/M</th><th class="c-part">Part no.</th>' +
        '<th>Description</th><th class="c-unit">Package</th><th class="c-del">B/O</th><th></th>' +
        '</tr></thead><tbody>';
      p.items.forEach(function(it,i){
        var short = num(it.shipped) < num(it.qty);
        t += '<tr draggable="true" data-prow="'+i+'">' +
          '<td class="drag">=</td>' +
          '<td><input class="c-qty" type="number" step="any" data-pi="'+i+'" data-pif="qty" value="'+esc(it.qty)+'"></td>' +
          '<td><input class="c-qty" type="number" step="any" data-pi="'+i+'" data-pif="shipped" value="'+esc(it.shipped)+'"' +
            (short ? ' style="border-color:var(--rust);background:var(--rust-dim)"' : '') + '></td>' +
          '<td><input class="c-unit" data-pi="'+i+'" data-pif="unit" value="'+esc(it.unit||'EA')+'"></td>' +
          '<td><input class="c-part" data-pi="'+i+'" data-pif="partNo" value="'+esc(it.partNo)+'"></td>' +
          '<td><textarea data-pi="'+i+'" data-pif="desc" rows="1">'+esc(it.desc)+'</textarea></td>' +
          '<td><select class="c-unit" data-pi="'+i+'" data-pif="pkg">'+pkgOptions(it.pkg)+'</select></td>' +
          '<td class="c-del"><input type="checkbox" data-pi="'+i+'" data-pif="bo"'+(it.bo?' checked':'')+'></td>' +
          '<td class="c-del"><button class="iconbtn danger" data-pdel="'+i+'">x</button></td>' +
          '</tr>';
      });
      t += '</tbody></table>';
      document.getElementById('pItemsHost').innerHTML = t;

      Array.prototype.forEach.call(document.querySelectorAll('[data-pif]'), function(el){
        var i = parseInt(el.getAttribute('data-pi'),10), f = el.getAttribute('data-pif');
        var handler = function(){
          p.items[i][f] = (el.type==='checkbox') ? el.checked : el.value;
          if(f==='shipped' || f==='qty'){
            /* flag a short ship in place rather than rebuilding the table, which
               would pull the cursor out of the box mid-number */
            var box = document.querySelector('[data-pi="'+i+'"][data-pif="shipped"]');
            var short = num(p.items[i].shipped) < num(p.items[i].qty);
            if(box){
              box.style.borderColor = short ? 'var(--rust)' : '';
              box.style.background  = short ? 'var(--rust-dim)' : '';
            }
            renderPackSummary();
          }
          else if(f==='bo') renderPackSummary();
        };
        if(el.tagName==='SELECT' || el.type==='checkbox') el.onchange = handler; else el.oninput = handler;
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-pdel]'), function(el){
        el.onclick = function(){
          var i = parseInt(el.getAttribute('data-pdel'),10);
          p.items.splice(i,1);
          if(!p.items.length) p.items.push(blankPackItem());
          renderPackItems(); renderPackSummary();
        };
      });
      var from = null;
      Array.prototype.forEach.call(document.querySelectorAll('tr[data-prow]'), function(tr){
        tr.ondragstart = function(){ from = parseInt(tr.getAttribute('data-prow'),10); tr.classList.add('dragging'); };
        tr.ondragend = function(){ tr.classList.remove('dragging'); };
        tr.ondragover = function(e){ e.preventDefault(); tr.classList.add('dragover'); };
        tr.ondragleave = function(){ tr.classList.remove('dragover'); };
        tr.ondrop = function(e){
          e.preventDefault();
          var to = parseInt(tr.getAttribute('data-prow'),10);
          if(from===null||from===to) return;
          var m = p.items.splice(from,1)[0]; p.items.splice(to,0,m);
          from=null; renderPackItems(); renderPackSummary();
        };
      });
    }

    function renderPkgs(){
      var g = p.packages || [];
      if(!g.length){
        document.getElementById('pPkgHost').innerHTML =
          '<div class="hint">No packages listed. That is fine for a single loose item.</div>';
        return;
      }
      var t = '<table class="items"><thead><tr>' +
        '<th class="c-part">Label</th><th class="c-unit">Type</th><th class="c-part">Dimensions</th>' +
        '<th class="c-price">Weight</th><th></th></tr></thead><tbody>';
      g.forEach(function(x,i){
        t += '<tr>' +
          '<td><input class="c-part" data-gi="'+i+'" data-gf="label" value="'+esc(x.label)+'"></td>' +
          '<td><input class="c-unit" data-gi="'+i+'" data-gf="type" value="'+esc(x.type)+'"></td>' +
          '<td><input class="c-part" data-gi="'+i+'" data-gf="dims" value="'+esc(x.dims)+'" placeholder="L x W x H"></td>' +
          '<td><input class="c-price" data-gi="'+i+'" data-gf="weight" value="'+esc(x.weight)+'" placeholder="lb"></td>' +
          '<td class="c-del"><button class="iconbtn danger" data-gdel="'+i+'">x</button></td>' +
          '</tr>';
      });
      t += '</tbody></table>';
      document.getElementById('pPkgHost').innerHTML = t;

      Array.prototype.forEach.call(document.querySelectorAll('[data-gf]'), function(el){
        el.oninput = function(){
          var i = parseInt(el.getAttribute('data-gi'),10);
          p.packages[i][el.getAttribute('data-gf')] = el.value;
          if(el.getAttribute('data-gf')==='label') renderPackItems();
          renderPackSummary();
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-gdel]'), function(el){
        el.onclick = function(){
          p.packages.splice(parseInt(el.getAttribute('data-gdel'),10),1);
          renderPkgs(); renderPackItems(); renderPackSummary();
        };
      });
    }

    function renderPackSummary(){
      var pieces = p.items.reduce(function(a,it){ return a + num(it.shipped); }, 0);
      var short = p.items.filter(function(it){ return it.bo || num(it.shipped) < num(it.qty); }).length;
      var wt = (p.packages||[]).reduce(function(a,g){ return a + num(g.weight); }, 0);
      document.getElementById('pSummaryHost').innerHTML =
        '<div class="totals">' +
          '<div class="trow"><span>Pieces shipped</span><span>'+pieces+'</span></div>' +
          '<div class="trow"><span>Packages</span><span>'+((p.packages||[]).length)+'</span></div>' +
          (wt ? '<div class="trow"><span>Total weight</span><span>'+wt+' lb</span></div>' : '') +
          (short ? '<div class="trow" style="color:var(--rust);font-weight:600"><span>Lines on back order</span><span>'+short+'</span></div>' : '') +
        '</div>';
    }

    function savePackForm(thenDoc){
      if(!p.customerId){ view.err = 'Pick a customer so the slip has a ship-to address.'; return renderPackEditor(); }
      if(!String(p.jobNo).trim()){ view.err = 'Enter the job number - it is how the slip gets filed and named.'; return renderPackEditor(); }
      savePacks(upsert(state.packs, JSON.parse(JSON.stringify(p)))).then(function(ok){
        if(!ok) return;
        toast('Saved ' + packLabel(p));
        view.err = '';
        if(thenDoc){ view.dirty=null; go('packs','doc', p.id); }
        else renderPackEditor();
      });
    }
  }

     CUSTOMERS

  function renderCustomersList(){
    var term = view.search;
    var list = state.customers.slice().sort(function(a,b){ return a.name.localeCompare(b.name); })
      .filter(function(c){
        if(!term) return true;
        return [c.name,c.code,c.contact,c.city].join(' ').toLowerCase().indexOf(term.toLowerCase()) >= 0;
      });
    var counts = {};
    state.quotes.forEach(function(q){ counts[q.customerId] = (counts[q.customerId]||0) + 1; });

    var h = '<div class="wrap">' +
      '<div class="section-head"><h1>Customers</h1><div class="sub">' + state.customers.length + ' on file</div></div>' +
      '<div class="toolbar">' +
        '<input class="searchbox" id="cSearch" placeholder="Search customers" value="'+esc(term)+'">' +
        '<button class="btn" id="cNew">Add customer</button>' +
      '</div>';

    var missing = missingAddressCount();
    if(missing >= 3 && seedHasAddresses()){
      h += '<div class="card" style="border-color:var(--gold-dim);background:#FBF3DC">' +
        '<div style="font-family:var(--display-text);font-weight:700;color:var(--oxblood);margin-bottom:4px">' +
          missing + ' customers have no address on file</div>' +
        '<div class="hint" style="margin-bottom:10px">The addresses were read out of your quote PDFs. ' +
          'Filling them in only touches empty fields, so anything you have typed yourself stays as it is.</div>' +
        '<button class="btn sm dark" id="cFillAddr">Fill in the addresses</button>' +
      '</div>';
    }

    if(!list.length){
      h += '<div class="empty-state"><b>No customers yet</b>Add one and it becomes available on every quote and pack list.</div>';
    } else {
      h += '<table class="datatable"><thead><tr>' +
        '<th>Name</th><th>Code</th><th>Attention</th><th>City</th><th>Quotes</th><th></th><th></th>' +
        '</tr></thead><tbody>';
      list.forEach(function(c){
        var thin = !c.addr1 || !c.city;
        h += '<tr class="clickable" data-copen="'+c.id+'">' +
          '<td><b>'+esc(c.name)+'</b>' + (thin ? ' <span class="badge draft">address needed</span>' : '') + '</td>' +
          '<td class="num">'+esc(c.code||'')+'</td>' +
          '<td>'+esc(c.contact||'')+'</td>' +
          '<td>'+esc(c.city||'')+'</td>' +
          '<td class="num">'+(counts[c.id]||0)+'</td>' +
          '<td>' + (c.active===false ? '<span class="badge inactive">Inactive</span>' : '<span class="badge active">Active</span>') + '</td>' +
          '<td class="acts"><button class="iconbtn" data-cquote="'+c.id+'">New quote</button></td>' +
          '</tr>';
      });
      h += '</tbody></table>';
    }
    h += '</div>';
    document.getElementById('stage').innerHTML = h;

    var sb = document.getElementById('cSearch');
    if(sb){
      sb.oninput = function(){ view.search = sb.value; renderCustomersList(); };
      if(term){ sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
    }
    var fill = document.getElementById('cFillAddr');
    if(fill) fill.onclick = function(){ offerAddressFill(); };

    document.getElementById('cNew').onclick = function(){
      view.dirty = { id:uid('c'), name:'', code:'', active:true, contact:'', title:'', email:'', phone:'',
        addr1:'', addr2:'', city:'', prov:'', postal:'', country:'Canada', shipSame:true,
        shipName:'', shipAddr1:'', shipAddr2:'', shipCity:'', shipProv:'', shipPostal:'', shipCountry:'',
        terms:'', notes:'' };
      go('customers','edit', view.dirty.id);
    };
    wireDataButtons('copen', function(id){ view.dirty=null; go('customers','edit', id); });
    wireDataButtons('cquote', function(id){
      var q = blankQuote(); q.customerId = id;
      var c = cust(id);
      if(c){ q.contact = c.contact || ''; q.contactEmail = c.email || ''; }
      view.dirty = q; go('quotes','edit', q.id);
    });
  }

  function renderCustomerEditor(){
    var c = view.dirty || JSON.parse(JSON.stringify(cust(view.id) || {}));
    view.dirty = c;
    var isNew = !cust(c.id);

    var h = '<div class="wrap">' +
      '<div class="section-head"><h1>' + (isNew ? 'New customer' : esc(c.name)) + '</h1>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn ghost" id="cBack">Back to list</button>' +
          (isNew ? '' : '<button class="btn danger" id="cDelete">Delete</button>') +

        '</div></div>' +
      (view.err ? '<div class="card" style="border-color:var(--rust);background:var(--rust-dim)"><div class="formerr">'+esc(view.err)+'</div></div>' : '') +

      '<div class="card"><h2>Company</h2><div class="grid g3">' +
        field('Name', '<input data-f="name" value="'+esc(c.name)+'">') +

          '<input type="checkbox" data-f="shipSame"'+(c.shipSame!==false?' checked':'')+' style="width:auto">' +
          'Ships to the billing address</label></div>' +
        (c.shipSame===false ?
          '<div class="grid g2">' +
            field('Site / receiver name', '<input data-f="shipName" value="'+esc(c.shipName)+'">') +
            field('Address line 1', '<input data-f="shipAddr1" value="'+esc(c.shipAddr1)+'">') +
          '</div><div class="grid g4" style="margin-top:12px">' +
            field('City', '<input data-f="shipCity" value="'+esc(c.shipCity)+'">') +
            field('Province / state', '<input data-f="shipProv" value="'+esc(c.shipProv)+'">') +
            field('Postal / zip', '<input class="mono" data-f="shipPostal" value="'+esc(c.shipPostal)+'">') +
            field('Country', '<input data-f="shipCountry" value="'+esc(c.shipCountry)+'">') +
          '</div>' : '') +
      '</div>' +

      '<div class="card"><h2>Notes</h2><div class="grid">' +
        field('Payment terms for this customer', '<input data-f="terms" value="'+esc(c.terms)+'" placeholder="Overrides the default on new quotes">') +
        field('Internal notes (never printed)', '<textarea data-f="notes">'+esc(c.notes)+'</textarea>') +
      '</div></div>' +
    '</div>';

    document.getElementById('stage').innerHTML = h;
    bindFields(c, function(f){
      if(f==='shipSame'){ c.shipSame = !!c.shipSame; renderCustomerEditor(); }
      if(f==='activeSel'){ c.active = (c.activeSel === '1'); }
    });

    document.getElementById('cBack').onclick = function(){ view.dirty=null; go('customers','list'); };
    document.getElementById('cSave').onclick = function(){
      if(!String(c.name).trim()){ view.err = 'A customer needs a name.'; return renderCustomerEditor(); }
      if(c.activeSel !== undefined) c.active = (c.activeSel === '1');
      delete c.activeSel;
      saveCustomers(upsert(state.customers, JSON.parse(JSON.stringify(c)))).then(function(ok){
        if(ok){ toast('Saved ' + c.name); view.dirty=null; go('customers','list'); }
      });
    };
    var del = document.getElementById('cDelete');
    if(del) del.onclick = function(){
      var used = state.quotes.filter(function(q){ return q.customerId===c.id; }).length +
                 state.packs.filter(function(p){ return p.customerId===c.id; }).length;
      if(used){
        confirmModal('Mark as inactive instead?',
          c.name + ' is on ' + used + ' saved document' + (used>1?'s':'') + ', so deleting would leave those without an address. Marking inactive hides it from new quotes and keeps the history intact.',
          'Mark inactive', function(){
            c.active = false;
            saveCustomers(upsert(state.customers, JSON.parse(JSON.stringify(c)))).then(function(){
              toast(c.name + ' marked inactive'); view.dirty=null; go('customers','list');
            });
          });
      } else {
        confirmModal('Delete this customer?', c.name + ' is removed for everyone.', 'Delete', function(){
          saveCustomers(removeById(state.customers, c.id)).then(function(){
            toast('Customer deleted'); view.dirty=null; go('customers','list');
          });
        }, true);
      }
    };
  }
