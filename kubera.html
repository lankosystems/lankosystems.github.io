      var row = host.querySelectorAll('tbody tr')[i];
      if(!row) return;
      var l = e.labour[i], v = labValue(l), cells = row.querySelectorAll('td');
      cells[4].innerHTML = '<b>' + (isNaN(v) ? '<span class="cellerr">error</span>' : money(v)) + '</b>';
      var td = cells[2], inp = td.querySelector('input'), old = td.querySelector('.calchint');
      if(old) old.remove();
      inp.classList.toggle('badcell', cellIsBad(l.hours));
      if(isFormula(l.hours)){
        var d = document.createElement('div');
        var bad = isNaN(cellValue(l.hours));
        d.className = 'calchint' + (bad ? ' bad' : '');
        d.textContent = bad ? 'cannot read that' : showCell(l.hours, 3) + ' h';
        td.appendChild(d);
      }
    }

    function renderSum(){
      var T = estimateTotals(e);
      var cats = Object.keys(T.byCat).filter(function(k){ return T.byCat[k].lines; });
      var acts = Object.keys(T.byAct).filter(function(k){ return T.byAct[k].hours; });
      var s = '';
      if(T.errors){
        s += '<div class="hflag">' + T.errors + ' line' + (T.errors>1?'s':'') +
          ' cannot be read and are left out of the totals. Check the boxes marked in red.</div>';
      }
      s += '<div class="insights" style="margin-bottom:14px">' +
        '<div class="ins"><div class="n">'+money(T.buyCost)+'</div><div class="l">What it costs us to buy</div>' +
          '<div class="d">Sells for '+money(T.buyPrice)+', a margin of '+T.buyMargin.toFixed(1)+'%.</div></div>' +
        '<div class="ins"><div class="n">'+(Math.round(T.hours*10)/10)+' h</div><div class="l">Labour</div>' +
          '<div class="d">Worth '+money(T.labourPrice)+' at the rates set for each activity.</div></div>' +
        '<div class="ins"><div class="n">'+money(T.price)+'</div><div class="l">Quoted price</div>' +
          '<div class="d">' + (T.contingency ? 'Includes '+money(T.contingency)+' contingency at '+T.contingencyPct+'%.' :
            'Purchases plus labour.') + '</div></div>' +
      '</div>';

      if(cats.length){
        s += '<div class="subhead">By category</div><table class="hocc"><thead><tr>' +
          '<th>Category</th><th style="text-align:right">Cost</th><th style="text-align:right">Mark up</th>' +
          '<th style="text-align:right">Price</th><th style="text-align:right">Share of the job</th>' +
          '</tr></thead><tbody>' +
          cats.map(function(k){
            var r = T.byCat[k];
            var mk = r.cost ? (r.price - r.cost) / r.cost * 100 : 0;
            return '<tr><td>'+esc(k)+'</td>' +
              '<td class="m" style="text-align:right">'+money(r.cost)+'</td>' +
              '<td class="m" style="text-align:right">'+mk.toFixed(1)+'%</td>' +
              '<td class="m" style="text-align:right">'+money(r.price)+'</td>' +
              '<td class="m" style="text-align:right">'+(T.price ? (r.price/T.price*100).toFixed(1) : '0')+'%</td></tr>';
          }).join('') + '</tbody></table>';
      }
      if(acts.length){
        s += '<div class="subhead">By activity</div><table class="hocc"><thead><tr>' +
          '<th>Activity</th><th style="text-align:right">Hours</th><th style="text-align:right">Rate</th>' +
          '<th style="text-align:right">Value</th></tr></thead><tbody>' +
          acts.map(function(k){
            var r = T.byAct[k];
            return '<tr><td>'+esc(k)+'</td>' +
              '<td class="m" style="text-align:right">'+(Math.round(r.hours*10)/10)+'</td>' +
              '<td class="m" style="text-align:right">'+money(r.hours ? r.value/r.hours : 0)+'</td>' +
              '<td class="m" style="text-align:right">'+money(r.value)+'</td></tr>';
          }).join('') + '</tbody></table>';
      }
      document.getElementById('sumHost').innerHTML = s;
    }

    function saveEstimate(quiet){
      var chain = Promise.resolve();
      if(!q.num){
        var nx = nextQuoteNumber();
        q.num = nx.num;
        chain = saveCounters(nx.counters);
      }
      return chain.then(function(){
        return saveQuotes(upsert(state.quotes, JSON.parse(JSON.stringify(q))));
      }).then(function(ok){
        if(ok && !quiet) toast('Estimate saved');
        return ok;
      });
    }

    function pushToQuote(){
      var T = estimateTotals(e);
      if(!T.price){ toast('Nothing priced yet', true); return; }
      var cats = Object.keys(T.byCat).filter(function(k){ return T.byCat[k].price; });
      var root = document.getElementById('modalroot');
      root.innerHTML =
        '<div class="modal-back"><div class="modal">' +
          '<h3>Put the price on the quote</h3>' +
          '<p>The estimate comes to <b>'+money(T.price)+'</b>. How should it appear to the customer?</p>' +
          '<div class="formrow" style="flex-direction:column;align-items:stretch;gap:8px">' +
            '<button class="btn dark" id="pOne">One line for the whole job</button>' +
            '<button class="btn ghost" id="pCat">A line for each category, '+cats.length+' lines</button>' +
            '<button class="btn ghost" id="pLab">Materials as one line, labour as another</button>' +
            '<button class="btn ghost" id="pCancel">Cancel</button>' +
          '</div>' +
        '</div></div>';
      var close = function(){ root.innerHTML = ''; };
      document.getElementById('pCancel').onclick = close;
      var apply = function(items){
        q.items = items;
        close();
        saveEstimate(true).then(function(){ go('quotes','edit', q.id); toast('Price carried onto the quote'); });
      };
      document.getElementById('pOne').onclick = function(){
        apply([ { id:uid('i'), qty:1, unit:'LOT', partNo:'',
          desc: q.title || 'Supply and fabricate as described',
          note: cats.map(function(k){ return '-' + k; }).join('\n'),
          unitPrice: Math.round(T.price*100)/100, noCharge:false } ]);
      };
      document.getElementById('pCat').onclick = function(){
        var items = cats.map(function(k){
          return { id:uid('i'), qty:1, unit:'LOT', partNo:'', desc:k, note:'',
                   unitPrice: Math.round(T.byCat[k].price*100)/100, noCharge:false };
        });
        if(T.labourPrice) items.push({ id:uid('i'), qty:1, unit:'LOT', partNo:'', desc:'Shop labour',
          note:'', unitPrice: Math.round(T.labourPrice*100)/100, noCharge:false });
        if(T.contingency) items.push({ id:uid('i'), qty:1, unit:'LOT', partNo:'', desc:'Contingency',
          note:'', unitPrice: Math.round(T.contingency*100)/100, noCharge:false });
        apply(items);
      };
      document.getElementById('pLab').onclick = function(){
        var items = [];
        if(T.buyPrice) items.push({ id:uid('i'), qty:1, unit:'LOT', partNo:'',
          desc:'Materials, purchased items and outsourced work', note:'',
          unitPrice: Math.round((T.buyPrice + T.contingency)*100)/100, noCharge:false });
        if(T.labourPrice) items.push({ id:uid('i'), qty:1, unit:'LOT', partNo:'',
          desc:'Fabrication labour, ' + (Math.round(T.hours*10)/10) + ' hours', note:'',
          unitPrice: Math.round(T.labourPrice*100)/100, noCharge:false });
        apply(items);
      };
    }
  }

  /* ==========================================================================
     THE PRINTED DOCUMENT
     Rendered at real Letter size. "Save as PDF" in the browser print dialog is
     what produces the file for the customer, so the text stays selectable and
     the type stays sharp at any zoom.
     ========================================================================== */
  function letterhead(){
    var co = state.company || SEED_COMPANY;
    var cityLine = [co.city, co.prov].filter(Boolean).join(', ');
    var addr = [ co.addr1, co.addr2, cityLine, co.postal, co.country ]
      .filter(Boolean).map(esc).join('<br>');
    var contacts = (co.contacts && co.contacts.length) ? co.contacts : [];
    var phones = contacts.filter(function(x){ return x.phone; })
      .map(function(x){ return 'Phone: ' + esc(x.phone) + (x.name ? ' ' + esc(x.name) : ''); }).join('<br>');
    var emails = contacts.filter(function(x){ return x.email; })
      .map(function(x){ return 'Email: ' + esc(x.email); }).join('<br>');
    return '<div class="lh"><div class="lh-logo"><img src="'+LOGO+'" alt="Lanko"></div></div>' +
      '<div class="lh-strip">' +
        '<div class="col a"><b>'+esc(co.name)+'</b><br>'+addr+'</div>' +
        '<div class="col">'+phones+'</div>' +
        '<div class="col">'+emails+'</div>' +
      '</div><div class="lh-hr"></div>';
  }
  function sheetFoot(docName, page, pages){
    var co = state.company || SEED_COMPANY;
    var bits = [ esc(co.name) ];
    if(co.gst) bits.push('GST ' + esc(co.gst));
    return '<div class="sheetfoot">' +
        '<span>'+bits.join(' &nbsp;&middot;&nbsp; ')+'</span>' +
        '<span class="fr">'+esc(docName)+'</span>' +
      '</div>';
  }
  function partyBlock(label, name, lines, attn, extra){
    return '<div class="pblock"><span class="plabel">'+esc(label)+'</span><div class="pbody">' +
      '<b>'+esc(name)+'</b>' +
      (lines.length ? '<br>' + lines.map(esc).join('<br>') : '') +
      (attn ? '<div class="attn">'+esc(attn)+'</div>' : '') +
      (extra ? '<div class="attn">'+esc(extra)+'</div>' : '') +
      '</div></div>';
  }
  function termsBlock(terms){
    var lines = String(terms||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if(!lines.length) return '';
    return '<div class="terms"><span class="nlabel">Terms and conditions</span><ol>' +
      lines.map(function(l){ return '<li>'+esc(l)+'</li>'; }).join('') + '</ol></div>';
  }

  function quoteSheet(q, custOverride){
    var c = custOverride || cust(q.customerId) || { name:'No customer' };
    var co = state.company || SEED_COMPANY;
    var sub = quoteSubtotal(q), tax = quoteTax(q), tot = sub + num(q.freight) + tax;
    var name = quoteFile(q);
    var title = q.docTitle || (state.settings && state.settings.docTitle) || 'Proposal';
    /* "formal" adds the terms, closing and signature strip; the everyday form is
       the compact one that matches the quotes going out now */
    var formal = (q.style || (state.settings && state.settings.docStyle) || 'current') === 'formal';

    var meta = '<table class="metabox"><tr>' +
        '<th>' + esc(title) + ' #</th><th>Date</th><th>Payment Terms</th><th>Valid</th><th>Incoterms</th>' +
      '</tr><tr>' +
        '<td>' + esc(q.num) + (num(q.rev)>0 ? ' Rev ' + esc(q.rev) : '') + '</td>' +
        '<td>' + esc(q.date) + '</td>' +
        '<td>' + esc(q.paymentTerms || '') + '</td>' +
        '<td>' + esc(num(q.validDays) ? q.validDays + ' Days' : (q.valid || '')) + '</td>' +
        '<td>' + esc(q.incoterms || '') + '</td>' +
      '</tr></table>';

    var hasPart = (q.items||[]).some(function(it){ return String(it.partNo||'').trim(); });
    var cols = 5 + (hasPart ? 1 : 0);
    var rows = '', n = 0;
    (q.items||[]).forEach(function(it){
      if(!String(it.desc).trim() && !String(it.partNo).trim() && !num(it.unitPrice)) return;
      /* A line carrying only a description -- no qty, part or price -- prints as
         an unnumbered lead-in row, the way ***For Epiroc ST710*** sits above
         item 1 on the real documents. Clear the qty on the line to get this. */
      if(!num(it.qty) && !String(it.partNo||'').trim() && !num(it.unitPrice) && !it.noCharge){
        rows += '<tr><td class="c"></td><td></td><td></td>' + (hasPart ? '<td></td>' : '') +
          '<td><span class="idesc">'+esc(it.desc||'')+'</span></td>' +
          '<td></td><td></td></tr>';
        return;
      }
      n++;
      rows += '<tr>' +
        '<td class="c">'+n+'</td>' +
        '<td class="c m">'+esc(it.qty)+'</td>' +
        '<td class="c">'+esc(it.unit||'')+'</td>' +
        (hasPart ? '<td class="m">'+esc(it.partNo||'')+'</td>' : '') +
        '<td><span class="idesc">'+esc(it.desc||'')+'</span></td>' +
        '<td class="r">'+(it.noCharge ? '' : money(it.unitPrice, q.currency))+'</td>' +
        '<td class="r">'+(it.noCharge ? '' : money(lineExt(it), q.currency))+'</td>' +
        '</tr>';
      if(String(it.note||'').trim()){
        rows += '<tr><td></td><td></td><td></td>' + (hasPart ? '<td></td>' : '') +
          '<td colspan="3"><span class="idesc">' + esc(it.note) + '</span></td></tr>';
      }
    });
    var tail = [];
    if(q.leadTime) tail.push('Please allow ' + q.leadTime.replace(/^please allow\s*/i,''));
    if(q.paymentNote) tail.push(q.paymentNote);
    if(q.notes) tail.push(q.notes);
    if(tail.length){
      rows += '<tr><td></td><td></td><td></td>' + (hasPart ? '<td></td>' : '') +
        '<td colspan="3"><span class="idesc">Note:\n' + esc(tail.join('\n')) + '</span></td></tr>';
    }
    rows += '<tr class="blank"><td colspan="'+(cols+1)+'"></td></tr>';

    var gstLabel = esc(q.taxLabel || 'GST') + ' (' + esc(q.taxRate) + '%)' +
                   (co.gst ? ' ' + esc(co.gst) : '');
    var pre = cols - 1;
    var totalRows =
      '<tr><td colspan="'+pre+'" style="border:none"></td>' +
        '<td class="tlabel">Subtotal</td><td class="tval">'+money(sub,q.currency)+'</td></tr>' +
      (num(q.freight) ? '<tr><td colspan="'+pre+'" style="border:none"></td>' +
        '<td class="tlabel">'+esc(q.freightLabel||'Freight')+'</td><td class="tval">'+money(q.freight,q.currency)+'</td></tr>' : '') +
      (num(q.taxRate) ? '<tr><td colspan="'+pre+'" style="border:none"></td>' +
        '<td class="tlabel">'+gstLabel+'</td><td class="tval">'+money(tax,q.currency)+'</td></tr>' : '') +
      '<tr class="tgrand"><td colspan="'+pre+'" style="border:none"></td>' +
        '<td class="tlabel">Grand Total'+(q.currency==='USD' ? ' (USD)' : '')+'</td>' +
        '<td class="tval">'+money(tot,q.currency)+'</td></tr>';

    var body =
      '<div class="doctitle'+(formal?' formal':'')+'">'+esc(title) +
        (q.title ? '<span class="sub">'+esc(q.title)+'</span>' : '') + '</div>' +

      '<div class="parties">' +
        partyBlock('Bill To:', c.name, addrLines(c),
          q.contact ? 'Attn: ' + q.contact : '', '') +
        partyBlock('Ship To:', (c.shipSame===false && c.shipName) ? c.shipName : c.name,
          addrLines(c, c.shipSame===false), '', '') +
      '</div>' +

      meta +

      (q.scope ? '<div class="refline"><span class="rv">'+esc(q.scope)+'</span></div>' : '') +

      '<table class="doctable"><thead><tr>' +
        '<th class="col-n">Item</th><th class="col-qty">Qty</th><th class="col-unit">U/M</th>' +
        (hasPart ? '<th class="col-part">Part #</th>' : '') +
        '<th>Description</th>' +
        '<th class="col-price" style="text-align:right">Unit Price</th>' +
        '<th class="col-amt" style="text-align:right">Total</th>' +
      '</tr></thead><tbody>' + rows + totalRows + '</tbody></table>' +

      (driveImgId(q.imageId) ?
        '<div class="docimg"><img src="https://drive.google.com/thumbnail?id=' +
          esc(driveImgId(q.imageId)) + '&sz=w900" alt="">' +
          (q.imageCaption ? '<div class="cap">'+esc(q.imageCaption)+'</div>' : '') +
        '</div>' : '') +

      (formal ? termsBlock(q.terms) : '') +
      (formal && q.closing ? '<div class="closing">'+esc(q.closing) +
        (co.preparedBy ? '<div class="who">'+esc(co.preparedBy)+'</div>' +
          (co.preparedTitle ? '<div class="role">'+esc(co.preparedTitle)+', '+esc(co.name)+'</div>' : '') : '') +
        '</div>' : '') +
      (formal ?
        '<div class="sigs">' +
          '<div class="sig"><div class="sline"></div><span class="slabel">Accepted for '+esc(c.name)+'</span></div>' +
          '<div class="sig"><div class="sline"></div><span class="slabel">Purchase order no.</span></div>' +
          '<div class="sig"><div class="sline"></div><span class="slabel">Date</span></div>' +
        '</div>' : '');

    var stamp = (q.status==='lost') ? '<div class="stamp">Not awarded</div>' :
                (q.status==='draft') ? '<div class="stamp">Draft</div>' : '';

    return '<div class="sheet">' + stamp + '<div class="frame'+(formal?' formal':'')+'">' +
      letterhead() + body + '<div class="growth"></div>' +
      (formal ? sheetFoot(name, 1, 1) : '') + '</div></div>';
  }

  function packSheet(p){
    var c = cust(p.customerId) || { name:'No customer' };
    var name = packFile(p);
    var formal = (state.settings && state.settings.docStyle) === 'formal';
    var shipLines = p.shipToOverride
      ? String(p.shipToOverride).split('\n').map(function(s){ return s.trim(); }).filter(Boolean)
      : addrLines(c, c.shipSame===false);
    var shipName = p.shipToOverride ? c.name : ((c.shipSame===false && c.shipName) ? c.shipName : c.name);
    var hasPkgs = (p.packages||[]).length > 0;

    var meta = '<table class="metabox"><tr>' +
        '<th>Customer PO #</th><th>Date</th><th>Carrier</th><th>Waybill</th>' +
      '</tr><tr>' +
        '<td>'+esc(p.poNo || '')+'</td>' +
        '<td>'+esc(p.date || '')+'</td>' +
        '<td>'+esc(p.carrier || '')+'</td>' +
        '<td>'+esc(p.waybill || 'N/A')+'</td>' +
      '</tr></table>';

    var cols = 6 + (hasPkgs ? 1 : 0);
    var rows = '', n = 0, pieces = 0, anyBo = false;
    (p.items||[]).forEach(function(it){
      if(!String(it.desc).trim() && !String(it.partNo).trim()) return;
      n++;
      var shipped = num(it.shipped), ordered = num(it.qty);
      var bo = it.bo || shipped < ordered;
      if(bo) anyBo = true;
      pieces += shipped;
      var d = esc(it.desc||'');
      if(it.partNo) d += (d ? ' ' : '') + esc('(' + it.partNo + ')');
      rows += '<tr>' +
        '<td class="c">'+n+'</td>' +
        '<td class="c m">'+esc(it.qty)+'</td>' +
        '<td class="c">'+esc(it.unit || 'EA')+'</td>' +
        '<td><span class="idesc">'+d+'</span></td>' +
        (hasPkgs ? '<td class="c">'+esc(it.pkg||'')+'</td>' : '') +
        '<td class="c m">'+esc(it.shipped)+'</td>' +
        '<td class="c m">'+(bo ? String(Math.max(0, ordered - shipped)) : '0')+'</td>' +
        '</tr>';
    });
    /* the original leaves ruled blank rows for the dock to write on */
    for(var b = n; b < 5; b++){
      rows += '<tr><td>&nbsp;</td><td></td><td></td><td></td>' +
        (hasPkgs ? '<td></td>' : '') + '<td></td><td></td></tr>';
    }

    var pkgTable = '';
    if(hasPkgs){
      var wt = 0;
      pkgTable = '<div style="margin-top:14px"><span class="nlabel">Packages</span>' +
        '<table class="doctable"><thead><tr>' +
          '<th class="col-part">Label</th><th class="col-unit">Type</th>' +
          '<th>Dimensions</th><th class="col-price" style="text-align:right">Weight</th>' +
        '</tr></thead><tbody>' +
        p.packages.map(function(g){
          wt += num(g.weight);
          return '<tr><td class="m">'+esc(g.label)+'</td><td>'+esc(g.type||'')+'</td>' +
            '<td class="m">'+esc(g.dims||'')+'</td><td class="r">'+(g.weight ? esc(g.weight)+' lb' : '')+'</td></tr>';
        }).join('') +
        (wt ? '<tr><td colspan="3" class="tlabel">Total weight</td><td class="tval">'+wt+' lb</td></tr>' : '') +
        '</tbody></table></div>';
    }

    var body =
      '<div class="doctitle'+(formal?' formal':'')+'">Packing Slip: '+esc(p.jobNo||'') +
        (p.title ? '<span class="sub">'+esc(p.title)+'</span>' : '') + '</div>' +

      '<div class="parties">' +
        partyBlock('Bill To:', c.name, addrLines(c), c.contact ? 'Attn: ' + c.contact : '', '') +
        partyBlock('Ship To:', shipName, shipLines, '', p.shipVia ? 'Ship via: ' + p.shipVia : '') +
      '</div>' +

      meta +

      '<table class="doctable"><thead><tr>' +
        '<th class="col-n">Item</th><th class="col-qty">Qty<br>Ordered</th><th class="col-unit">U/M</th>' +
        '<th>Description</th>' +
        (hasPkgs ? '<th class="col-pkg">Package</th>' : '') +
        '<th class="col-bo">Delivered</th><th class="col-bo">B/O</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +

      pkgTable +

      (anyBo ? '<div class="docnote"><span class="nlabel">Back order</span>Lines showing a B/O quantity are short shipped. The balance follows under the same job number.</div>' : '') +
      (p.notes ? '<div class="docnote"><span class="nlabel">Note</span>'+esc(p.notes)+'</div>' : '') +

      (formal ?
        '<div class="sigs">' +
          '<div class="sig"><div class="sline"></div><span class="slabel">Packed by' + (p.packedBy ? ' - ' + p.packedBy : '') + '</span></div>' +
          '<div class="sig"><div class="sline"></div><span class="slabel">Checked by' + (p.checkedBy ? ' - ' + p.checkedBy : '') + '</span></div>' +
          '<div class="sig"><div class="sline"></div><span class="slabel">Received by and date</span></div>' +
        '</div>'
        : ((p.packedBy || p.checkedBy) ?
          '<div class="refline" style="margin-top:14px"><span class="rv">' +
          (p.packedBy ? 'Packed by: ' + esc(p.packedBy) : '') +
          (p.packedBy && p.checkedBy ? '  |  ' : '') +
          (p.checkedBy ? 'Checked by: ' + esc(p.checkedBy) : '') +
          '</span></div>' : ''));

    return '<div class="sheet"><div class="frame'+(formal?' formal':'')+'">' +
      letterhead() + body + '<div class="growth"></div>' +
      (formal ? sheetFoot(name, 1, 1) : '') + '</div></div>';
  }

  function renderDoc(){
    var isQuote = (view.tab === 'quotes');
    var rec = isQuote ? quoteById(view.id) : packById(view.id);
    if(!rec){ return go(view.tab, 'list'); }
    var fname = isQuote ? quoteFile(rec) : packFile(rec);
    var sheet = isQuote ? quoteSheet(rec) : packSheet(rec);

    document.getElementById('stage').innerHTML =
      '<div class="wrap">' +
        '<div class="docbar">' +
          '<button class="btn ghost" id="dBack">Back</button>' +
          '<button class="btn ghost" id="dEdit">Edit</button>' +
          '<span class="spacer"></span>' +
          '<span class="fname">Saves as: '+esc(fname)+'.pdf</span>' +
          '<button class="btn" id="dPrint">Save as PDF</button>' +
        '</div>' +
        '<div class="hint" style="margin:-6px 0 12px">In the print dialog choose <b>Save as PDF</b> as the destination, paper Letter, margins <b>None</b> and turn off headers and footers. The file name above is what the browser suggests.</div>' +
        '<div class="docviewer">' + sheet + '</div>' +
      '</div>';

    document.getElementById('dBack').onclick = function(){ go(view.tab, 'list'); };
    document.getElementById('dEdit').onclick = function(){ view.dirty = null; go(view.tab, 'edit', rec.id); };
    document.getElementById('dPrint').onclick = function(){ printDoc(fname); };
  }

  function printDoc(fname){
    var prev = document.title;
    document.title = fname;
    var restore = function(){ document.title = prev; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    setTimeout(function(){ window.print(); }, 60);
    setTimeout(restore, 12000);
  }

  /* ==========================================================================
     ROUTER
     ========================================================================== */
  function render(){
    renderTabs();
    if(view.tab==='quotes'){
      if(view.mode==='estimate') renderEstimate();
      else if(view.mode==='edit') renderQuoteEditor();
      else if(view.mode==='doc') renderDoc();
      else renderQuotesList();
    } else if(view.tab==='packs'){
      if(view.mode==='edit') renderPackEditor();
      else if(view.mode==='doc') renderDoc();
      else renderPacksList();
    } else if(view.tab==='history'){
      renderHistory();
    } else if(view.tab==='archive'){
      if(view.mode==='doc') renderArchiveDoc();
      else renderArchive();
    } else if(view.tab==='customers'){
      if(view.mode==='edit') renderCustomerEditor();
      else renderCustomersList();
    } else {
      renderSettings();
    }
  }

  /* ==========================================================================
     BOOT
     ========================================================================== */
  function ensure(key, seed){
    return fsDoc(key).get().then(function(snap){
      if(snap.exists && snap.data().value !== undefined) return;
      return fsDoc(key).set({ value: seed, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }).catch(function(e){ console.warn('could not seed', key, e.code || e); });
  }

  document.getElementById('stage').innerHTML =
    '<div class="wrap"><div class="empty-state"><b>Loading</b>Fetching quotes from the shop database.</div></div>';
  lamp('saving','Connecting');

  firebaseAuthReady.then(function(){
    return Promise.all([
      ensure(K.company, SEED_COMPANY),
      ensure(K.settings, SEED_SETTINGS),
      ensure(K.counters, SEED_COUNTERS),
      ensure(K.customers, seedCustomers()),
      ensure(K.quotes, []),
      ensure(K.packs, []),
      ensure(K.archive, { chunks:0, count:0, v:2 })
    ]);
  }).then(function(){
    watch(K.company,   SEED_COMPANY,   function(v){ state.company = v; });
    watch(K.settings,  SEED_SETTINGS,  function(v){ state.settings = v; });
    watch(K.counters,  SEED_COUNTERS,  function(v){ state.counters = v; });
    watch(K.customers, [],             function(v){ state.customers = Array.isArray(v) ? v : []; });
    watch(K.quotes,    [],             function(v){ state.quotes = Array.isArray(v) ? v : []; });
    watch(K.packs,     [],             function(v){ state.packs = Array.isArray(v) ? v : []; });
    /* the archive lives across chunk documents, so the manifest triggers a fetch */
    fsDoc(K.archive).onSnapshot(function(snap){
      var manifest = (snap.exists && snap.data().value !== undefined) ? snap.data().value : [];
      loadArchive(manifest).then(function(list){
        state.archive = list;
        loaded[K.archive] = true;
        if(allLoaded()) render();
      });
    }, function(e){
      console.error('archive listen failed', e);
      state.archive = []; loaded[K.archive] = true;
      if(allLoaded()) render();
    });
  }).catch(function(e){
    console.error('boot failed', e);
    lamp('off','Offline');
    document.getElementById('stage').innerHTML =
      '<div class="wrap"><div class="empty-state"><b>Cannot reach the shop database</b>' +
      'Check the internet connection, then reload this page. Nothing has been lost.</div></div>';
  });

  window.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key === 'p' && view.mode === 'doc'){
      e.preventDefault();
      var rec = view.tab==='quotes' ? quoteById(view.id) : packById(view.id);
      if(rec) printDoc(view.tab==='quotes' ? quoteFile(rec) : packFile(rec));
    }
  });
})();
</script>
</body>
</html>
